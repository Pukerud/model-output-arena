<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THRILLER — a Three.js dance scene</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05050a; }
  body { font-family: "Trebuchet MS", "Segoe UI", ui-sans-serif, system-ui, sans-serif; color: #f2e9dc; }
  #stage { display: block; width: 100vw; height: 100vh; }

  .overlay { position: fixed; z-index: 5; pointer-events: none; }

  #title { top: 26px; left: 32px; }
  #title h1 {
    margin: 0; font-size: clamp(30px, 6.4vw, 74px); letter-spacing: .22em; font-weight: 800;
    background: linear-gradient(#ff5b4a, #ffb347 55%, #ffe9a8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 42px rgba(255,90,60,.45);
  }
  #title p { margin: 6px 0 0; font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: #9c8fa8; }

  #hint { bottom: 22px; left: 32px; font-size: 11px; letter-spacing: .16em; color: #8d8298; line-height: 1.9; }
  #hint kbd {
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18);
    border-radius: 5px; padding: 1px 7px; font-family: inherit; color: #e6dced;
  }

  #panel { bottom: 22px; right: 26px; pointer-events: auto; display: flex; gap: 9px; }
  #panel button {
    pointer-events: auto; font-family: inherit; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: #efe4f5; background: rgba(20,14,28,.78); border: 1px solid rgba(255,140,110,.35);
    border-radius: 9px; padding: 10px 15px; cursor: pointer; transition: all .16s ease;
    backdrop-filter: blur(6px);
  }
  #panel button:hover { border-color: #ff8a5c; color: #fff; box-shadow: 0 0 22px rgba(255,110,70,.32); }
  #panel button.on { background: rgba(255,110,70,.24); border-color: #ff9d6b; color: #fff; }

  #beat {
    top: 30px; right: 32px; width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid rgba(255,120,90,.35); display: flex; align-items: center; justify-content: center;
    font-size: 10px; letter-spacing: .2em; color: #ffb08a; text-transform: uppercase;
    transition: box-shadow .1s ease, border-color .1s ease;
  }
  #beat.hit { box-shadow: 0 0 34px rgba(255,120,80,.75), inset 0 0 22px rgba(255,120,80,.4); border-color: #ffb08a; }

  #cameraLabel { top: 122px; right: 36px; font-size: 10px; letter-spacing: .26em; color: #8d8298; text-transform: uppercase; text-align: right; }

  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #05050a; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #7d7288;
    transition: opacity .6s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
  #err { position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
         padding: 40px; text-align: center; background: #0a0708; font-size: 14px; line-height: 1.8; color: #ffb9a0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="overlay" id="title">
  <h1>THRILLER</h1>
  <p>Michael Jackson · Pepe · Trump · Musk — a lovable parody</p>
</div>

<div class="overlay" id="beat">Beat</div>
<div class="overlay" id="cameraLabel">Camera: auto dolly</div>

<div id="hint" class="overlay">
  <div><kbd>Space</kbd> pause &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>S</kbd> slow-mo &nbsp; <kbd>R</kbd> restart dance</div>
</div>

<div id="panel" class="overlay">
  <button id="btnCam">Camera</button>
  <button id="btnSlow">Slow-mo</button>
  <button id="btnRestart">Restart</button>
</div>

<div id="loading">Loading the graveyard…</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
 * THRILLER — a Three.js dance scene.
 *
 * Everything is procedural: there are no model files. Each performer is a
 * primitive-built humanoid (spheres, cylinders, boxes) wired into a hierarchy
 * of groups — hips → torso → shoulders → elbows, hips → knees → ankles — which
 * is what makes real limb animation possible rather than a bobbing box.
 *
 * The routine is a keyframed timeline at 120 BPM: the iconic zombie shuffle,
 * the claw-raise, the moonwalk slide, the double-arm rise, a spin, the
 * shoulder-twitch groove and a held finale. Poses are interpolated per frame
 * and each dancer runs the same timeline with a small phase offset and its own
 * personality (MJ is crisp, Pepe is jittery, Trump does the double-point,
 * Musk is deadpan and slightly off-beat).
 *
 * Lighting is the other half of the look: a cold moon key from behind, two
 * saturated cross-lights, a warm followspot that tracks whichever performer is
 * being framed, ground fog, and hard shadows on a reflective stage.
 * ==========================================================================*/
(function () {
  "use strict";

  if (typeof THREE === "undefined") {
    document.getElementById("err").style.display = "flex";
    document.getElementById("err").innerHTML =
      "Three.js could not be loaded from the CDN.<br>Connect to the internet and reload.";
    document.getElementById("loading").classList.add("gone");
    return;
  }

  var TAU = Math.PI * 2;
  var BPM = 120;
  var BEAT = 60 / BPM;                 // 0.5s
  var ROUTINE = 24;                    // seconds per loop

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function ease(t) { return t * t * (3 - 2 * t); }

  // ---------------------------------------------------------------- renderer --
  var canvas = document.getElementById("stage");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if ("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060d);
  scene.fog = new THREE.FogExp2(0x07070f, 0.030);

  var camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
  camera.position.set(0, 3.0, 12.0);

  // ---------------------------------------------------------------- stage -----
  // Floor: dark, glossy, and lit by a hand-made radial gradient map so the
  // spotlight pools read without any external textures.
  function makeRadialTexture(inner, outer) {
    var c = document.createElement("canvas");
    c.width = c.height = 512;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(256, 256, 10, 256, 256, 254);
    grad.addColorStop(0, inner);
    grad.addColorStop(0.55, outer);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, 512, 512);
    var t = new THREE.CanvasTexture(c);
    return t;
  }

  var floorMat = new THREE.MeshStandardMaterial({
    color: 0x14131c,
    roughness: 0.34,
    metalness: 0.62,
    map: makeRadialTexture("rgba(255,255,255,0.10)", "rgba(120,110,160,0.045)")
  });
  var floor = new THREE.Mesh(new THREE.CircleGeometry(34, 72), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Stage trim ring — a thin emissive hoop that pulses on the beat.
  var ringMat = new THREE.MeshStandardMaterial({ color: 0x2a0d16, emissive: 0xff3a1e, emissiveIntensity: 0.55, roughness: 0.5 });
  var ring = new THREE.Mesh(new THREE.TorusGeometry(7.4, 0.045, 12, 128), ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.012;
  scene.add(ring);

  // Back wall: a very dark slab so silhouettes have something to bite into.
  var wall = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 26),
    new THREE.MeshStandardMaterial({ color: 0x0a0912, roughness: 1, metalness: 0 })
  );
  wall.position.set(0, 12, -13);
  scene.add(wall);

  // Moon disc + halo behind the action.
  var moon = new THREE.Mesh(
    new THREE.CircleGeometry(2.6, 48),
    new THREE.MeshBasicMaterial({ color: 0xfdf3d8, transparent: true, opacity: 0.95, fog: false })
  );
  moon.position.set(-6.5, 9.5, -12.4);
  scene.add(moon);
  var halo = new THREE.Mesh(
    new THREE.CircleGeometry(7.5, 48),
    new THREE.MeshBasicMaterial({ color: 0xbcd0ff, transparent: true, opacity: 0.10, fog: false })
  );
  halo.position.copy(moon.position);
  scene.add(halo);

  // ---------------------------------------------------------------- lights ----
  scene.add(new THREE.HemisphereLight(0x2b3560, 0x080610, 0.55));

  var moonKey = new THREE.DirectionalLight(0xa9c4ff, 1.05);
  moonKey.position.set(-7, 11, -9);
  moonKey.castShadow = true;
  moonKey.shadow.mapSize.set(2048, 2048);
  moonKey.shadow.camera.near = 1;
  moonKey.shadow.camera.far = 40;
  moonKey.shadow.camera.left = -14;
  moonKey.shadow.camera.right = 14;
  moonKey.shadow.camera.top = 14;
  moonKey.shadow.camera.bottom = -6;
  moonKey.shadow.bias = -0.0008;
  scene.add(moonKey);

  var crossL = new THREE.SpotLight(0xff2e6a, 3.2, 38, Math.PI / 6, 0.7, 1.3);
  crossL.position.set(-9, 8.5, 4.5);
  crossL.target.position.set(0, 1.4, 0);
  scene.add(crossL, crossL.target);

  var crossR = new THREE.SpotLight(0x27d7ff, 3.0, 38, Math.PI / 6, 0.7, 1.3);
  crossR.position.set(9, 8.0, 4.5);
  crossR.target.position.set(0.4, 1.4, 0);
  scene.add(crossR, crossR.target);

  // Warm followspot that tracks the framed performer.
  var follow = new THREE.SpotLight(0xffd9a0, 2.6, 30, Math.PI / 9, 0.42, 1.1);
  follow.position.set(0, 10.5, 6);
  follow.castShadow = true;
  follow.shadow.mapSize.set(1024, 1024);
  follow.shadow.bias = -0.0006;
  var followTarget = new THREE.Object3D();
  scene.add(follow, followTarget);
  follow.target = followTarget;

  // Low, moody uplight so legs do not disappear into the floor.
  var up = new THREE.PointLight(0xff6a3a, 1.5, 14, 2);
  up.position.set(0, 0.4, 3.2);
  scene.add(up);

  // Front fill: without this the dark suits read as holes in the frame.
  var fill = new THREE.DirectionalLight(0x9fb4ff, 0.30);
  fill.position.set(2.5, 4.5, 9);
  scene.add(fill);

  // ---------------------------------------------------------------- crowd -----
  // Background graves and a swaying horde of silhouette zombies for depth.
  var crowd = [];
  function buildCrowd() {
    var graveMat = new THREE.MeshStandardMaterial({ color: 0x1b1c24, roughness: 0.95 });
    for (var i = 0; i < 26; i++) {
      var a = (i / 26) * TAU + 0.4;
      var rad = 15 + (i % 4) * 1.7;
      var gh = 1.1 + (i % 5) * 0.28;
      var g = new THREE.Mesh(new THREE.BoxGeometry(0.9, gh, 0.24), graveMat);
      g.position.set(Math.cos(a) * rad, gh / 2, Math.sin(a) * rad - 2);
      g.rotation.y = -a + Math.PI / 2;
      g.rotation.z = ((i % 3) - 1) * 0.06;
      g.castShadow = true;
      scene.add(g);
      // Rounded headstone top.
      var top = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.24, 12, 1, false, 0, Math.PI), graveMat);
      top.rotation.set(Math.PI / 2, 0, 0);
      top.position.set(g.position.x, gh, g.position.z);
      top.rotation.y = g.rotation.y;
      scene.add(top);
    }

    // Two rows of zombie silhouettes, kept strictly BEHIND the performers.
    for (var r = 0; r < 2; r++) {
      var rowRad = 9.5 + r * 2.6;
      var count = 11 + r * 4;
      for (var c = 0; c < count; c++) {
        var ang = -Math.PI * 0.66 + (c / (count - 1)) * Math.PI * 1.32;
        // Depth is a function of the arc, never of the sine: everything in the
        // crowd lives at z <= -8 so it can never drift in front of the cast.
        var x = Math.cos(ang) * rowRad;
        var z = -8.5 - r * 2.4 - (1 - Math.abs(Math.cos(ang))) * 3.2;
        var body = new THREE.Group();
        var mat = new THREE.MeshStandardMaterial({
          color: 0x0d0f16, roughness: 0.94,
          emissive: 0x120810, emissiveIntensity: 0.5
        });
        var torso = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.24, 0.9, 8), mat);
        torso.position.y = 1.0; torso.castShadow = true; body.add(torso);
        var head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), mat);
        head.position.y = 1.62; head.castShadow = true; body.add(head);
        for (var s = 0; s < 2; s++) {
          var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.78, 6), mat);
          arm.position.set(s ? 0.26 : -0.26, 1.16, 0.16);
          arm.rotation.x = -1.05 + s * 0.06;
          arm.castShadow = true;
          body.add(arm);
        }
        body.position.set(x, 0, z);
        body.rotation.y = Math.PI + Math.cos(ang) * 0.3;
        body.scale.setScalar(0.94);
        scene.add(body);
        crowd.push({ g: body, phase: Math.random() * TAU, amp: 0.05 + Math.random() * 0.07, speed: 0.8 + Math.random() * 0.7 });
      }
    }
  }
  buildCrowd();

  // Ground fog: a few huge, very transparent planes that drift.
  var fogPlanes = [];
  for (var f = 0; f < 5; f++) {
    var fm = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 18),
      new THREE.MeshBasicMaterial({
        map: makeRadialTexture("rgba(190,205,255,0.16)", "rgba(140,150,220,0.05)"),
        transparent: true, depthWrite: false, opacity: 0.5
      })
    );
    fm.position.set(0, 0.5 + f * 0.55, -2 - f * 2.2);
    scene.add(fm);
    fogPlanes.push(fm);
  }

  // =============================================================== performers ==
  function std(color, opts) {
    opts = opts || {};
    return new THREE.MeshStandardMaterial({
      color: color,
      roughness: opts.roughness == null ? 0.55 : opts.roughness,
      metalness: opts.metalness == null ? 0.18 : opts.metalness,
      emissive: opts.emissive || 0x000000,
      emissiveIntensity: opts.emissiveIntensity || 0
    });
  }

  // A primitive humanoid with a real joint hierarchy:
  //   root > hips > torso > head / shoulders > elbows
  //                > hipL/R > knees > feet
  // All joint rotations are applied in radians; a limb hangs along -Y, so a
  // negative rotation.x swings it forward (toward the camera).
  function makeHumanoid(opts) {
    opts = opts || {};
    var skinM = std(opts.skin || 0xe3b48f, { roughness: 0.62, metalness: 0.05 });
    var suitM = std(opts.suit || 0x1a1a24, { roughness: 0.72, metalness: 0.10 });
    var shirtM = std(opts.shirt || 0xf2f2f2, { roughness: 0.78 });
    var hairM = std(opts.hair || 0x140f0c, { roughness: 0.9 });
    var shoeM = std(0x0d0c10, { roughness: 0.4, metalness: 0.35 });
    var accentM = std(opts.accent || 0xd23a2f, { roughness: 0.5, metalness: 0.2 });

    var root = new THREE.Group();
    var hips = new THREE.Group();
    hips.position.y = 0.94;
    root.add(hips);

    var pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.26, 0.30), suitM);
    pelvis.position.y = 0.0;
    pelvis.castShadow = true;
    hips.add(pelvis);

    var torso = new THREE.Group();
    torso.position.y = 0.12;
    hips.add(torso);

    var chest = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.60, 0.32), suitM);
    chest.position.y = 0.30;
    chest.castShadow = true;
    torso.add(chest);

    // Optional front panel (shirt / tee / tie).
    if (opts.front) {
      var panel = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.44, 0.04), opts.front.mat || shirtM);
      panel.position.set(0, 0.34, 0.17);
      torso.add(panel);
    }
    if (opts.tie) {
      var tie = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.34, 0.03), accentM);
      tie.position.set(0, 0.30, 0.20);
      torso.add(tie);
    }

    // Shoulders / arms.
    function arm(side) {
      var sh = new THREE.Group();
      sh.position.set(side * 0.30, 0.52, 0);
      torso.add(sh);
      var upper = new THREE.Mesh(new THREE.CylinderGeometry(0.078, 0.068, 0.30, 10), suitM);
      upper.position.y = -0.15;
      upper.castShadow = true;
      sh.add(upper);
      var el = new THREE.Group();
      el.position.y = -0.30;
      sh.add(el);
      var fore = new THREE.Mesh(new THREE.CylinderGeometry(0.066, 0.056, 0.29, 10), opts.bareArms ? skinM : suitM);
      fore.position.y = -0.145;
      fore.castShadow = true;
      el.add(fore);
      var hand = new THREE.Mesh(new THREE.SphereGeometry(0.072, 12, 10), (side > 0 && opts.glove) ? std(0xf5f5f5, { roughness: 0.4 }) : skinM);
      hand.position.y = -0.30;
      hand.castShadow = true;
      el.add(hand);
      return { sh: sh, el: el };
    }
    var armL = arm(-1), armR = arm(1);

    // Hips / legs.
    function leg(side) {
      var hp = new THREE.Group();
      hp.position.set(side * 0.135, -0.08, 0);
      hips.add(hp);
      var thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.09, 0.42, 10), suitM);
      thigh.position.y = -0.21;
      thigh.castShadow = true;
      hp.add(thigh);
      var kn = new THREE.Group();
      kn.position.y = -0.42;
      hp.add(kn);
      var shin = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.072, 0.44, 10), suitM);
      shin.position.y = -0.22;
      shin.castShadow = true;
      kn.add(shin);
      var foot = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.09, 0.30), shoeM);
      foot.position.set(0, -0.44, 0.06);
      foot.castShadow = true;
      kn.add(foot);
      return { hp: hp, kn: kn, foot: foot };
    }
    var legL = leg(-1), legR = leg(1);

    // Neck + head.
    var head = new THREE.Group();
    head.position.y = 0.70;
    torso.add(head);
    var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.072, 0.082, 0.10, 10), skinM);
    neck.position.y = -0.03;
    head.add(neck);
    var skull = new THREE.Mesh(new THREE.SphereGeometry(0.155, 20, 16), skinM);
    skull.scale.set(1, 1.08, 0.98);
    skull.position.y = 0.13;
    skull.castShadow = true;
    head.add(skull);

    var rig = {
      root: root, hips: hips, torso: torso, head: head,
      armL: armL.sh, elbL: armL.el, armR: armR.sh, elbR: armR.el,
      hipL: legL.hp, kneeL: legL.kn, footL: legL.foot,
      hipR: legR.hp, kneeR: legR.kn, footR: legR.foot,
      headMesh: head, skull: skull, baseHipY: 0.94,
      mats: { skin: skinM, suit: suitM, shirt: shirtM, hair: hairM, accent: accentM, shoe: shoeM }
    };
    if (opts.dress) opts.dress(rig, { skinM: skinM, suitM: suitM, hairM: hairM, accentM: accentM, shirtM: shirtM });
    return rig;
  }

  // --- costumes ---------------------------------------------------------------
  function fedora(rig, m, color) {
    var hat = new THREE.Group();
    var crown = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.155, 0.16, 18), m);
    crown.position.y = 0.30; crown.castShadow = true;
    var brim = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.018, 24), m);
    brim.position.y = 0.215; brim.castShadow = true;
    var band = new THREE.Mesh(new THREE.TorusGeometry(0.146, 0.016, 8, 24), std(0x0c0c0c, { roughness: 0.5 }));
    band.rotation.x = Math.PI / 2; band.position.y = 0.245;
    hat.add(crown, brim, band);
    rig.head.add(hat);
  }
  function curlyHair(rig, m) {
    for (var i = 0; i < 26; i++) {
      var a = (i / 26) * TAU;
      var r = 0.135 + (i % 3) * 0.012;
      var s = new THREE.Mesh(new THREE.SphereGeometry(0.041, 8, 6), m);
      s.position.set(Math.cos(a) * r, 0.13 + 0.075 + Math.sin(i * 2.1) * 0.028, Math.sin(a) * r * 0.95 - 0.01);
      s.castShadow = true;
      rig.head.add(s);
    }
  }
  function freshCut(rig, m, sweep) {
    var cap = new THREE.Mesh(new THREE.SphereGeometry(0.158, 18, 12, 0, TAU, 0, Math.PI * 0.58), m);
    cap.position.y = 0.135;
    cap.castShadow = true;
    rig.head.add(cap);
    if (sweep) {
      var swoop = new THREE.Mesh(new THREE.SphereGeometry(0.10, 14, 10), m);
      swoop.scale.set(1.25, 0.5, 1.0);
      swoop.position.set(0.02, 0.20, 0.055);
      rig.head.add(swoop);
    }
  }

  // Michael: black suit, red jacket panels, fedora, single white glove.
  var mj = makeHumanoid({
    skin: 0x8a5a3c, suit: 0x111116, shirt: 0xd23a2f, hair: 0x0a0806,
    accent: 0xd23a2f, glove: true, front: { mat: std(0xd23a2f, { roughness: 0.5, metalness: 0.22 }) },
    dress: function (rig, m) {
      // Red jacket sleeves and collar.
      rig.armL.children[0].material = std(0xd23a2f, { roughness: 0.45, metalness: 0.25 });
      rig.armR.children[0].material = std(0xd23a2f, { roughness: 0.45, metalness: 0.25 });
      var collar = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.028, 8, 18), m.accentM);
      collar.rotation.x = Math.PI / 2; collar.position.y = 0.62;
      rig.torso.add(collar);
      curlyHair(rig, m.hairM);
      fedora(rig, std(0x0e0e12, { roughness: 0.5 }));
      // White glove already applied to the right hand by makeHumanoid.
    }
  });

  // Pepe: green frog, bulging eyes, red lips, grey suit.
  var pepe = makeHumanoid({
    skin: 0x53a33a, suit: 0x2c2f38, shirt: 0xe8e8e8, hair: 0x2f7a24, bareArms: true,
    dress: function (rig, m) {
      var lip = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.026, 8, 18, Math.PI), std(0xc02a3a, { roughness: 0.45 }));
      lip.rotation.set(Math.PI / 2, 0, Math.PI);

  function basePose() {

    p.rotY = lerp(a.rotY, b.rotY, t);
    p.lean = lerp(a.lean, b.lean, t);
    p.twist = lerp(a.twist, b.twist, t);
    p.sway = lerp(a.sway, b.sway, t);
    p.slideZ = lerp(a.slideZ, b.slideZ, t);
    p.slideX = lerp(a.slideX, b.slideX, t);
    ["aL", "eL", "aR", "eR", "lL", "kL", "lR", "kR"].forEach(function (k) {

    // ── moon halo breathes ──
    halo.material.opacity = 0.08 + beatPulse * 0.05;

    renderer.render(scene, camera);
  }

  // =============================================================== boot =======
  // Everything is procedural, so there is nothing to wait for beyond the first
  // compiled frame — hide the loader once a frame has actually landed.
  renderer.compile(scene, camera);
  frame();
  requestAnimationFrame(function () {
    document.getElementById("loading").classList.add("gone");
  });
})();
</script>
</body>
</html>
