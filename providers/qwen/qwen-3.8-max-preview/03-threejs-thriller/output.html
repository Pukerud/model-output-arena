<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thriller — Cinematic Dance</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  #info {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    color: #b9a7d6; font-family: Georgia, serif; letter-spacing: 3px;
    text-shadow: 0 0 12px #4a2a6a; pointer-events: none; font-size: 14px;
  }
  #title {
    position: fixed; left: 0; right: 0; top: 18px; text-align: center;
    color: #e8ddff; font-family: Georgia, serif; letter-spacing: 10px;
    font-size: 30px; text-shadow: 0 0 20px #6a3aaa; pointer-events: none;
  }
</style>
</head>
<body>
<div id="title">T H R I L L E R</div>
<div id="info">Michael Jackson · Pepe · Trump · Elon</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ==================================================================
   THRILLER — MJ, Pepe, Trump & Elon perform the iconic choreography
   under a full moon.  Three.js (r128) + cinematic lighting & fog.
   ================================================================== */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070812);
scene.fog = new THREE.FogExp2(0x0a0a1e, 0.028);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* ---------------- lighting ---------------- */
scene.add(new THREE.HemisphereLight(0x334466, 0x0a0a12, 0.35));
scene.add(new THREE.AmbientLight(0x223355, 0.25));

// cool moon key light from behind/above
const moonLight = new THREE.DirectionalLight(0xbfd4ff, 1.1);
moonLight.position.set(-14, 22, -18);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 80;
moonLight.shadow.camera.left = -25; moonLight.shadow.camera.right = 25;
moonLight.shadow.camera.top = 25; moonLight.shadow.camera.bottom = -25;
moonLight.shadow.bias = -0.0004;
scene.add(moonLight);

// cinematic coloured spots from the front
const spotPurple = new THREE.SpotLight(0x9a4dff, 2.2, 60, Math.PI / 6, 0.4, 1);
spotPurple.position.set(14, 16, 16);
scene.add(spotPurple);
const spotGreen = new THREE.SpotLight(0x39ff9a, 1.6, 60, Math.PI / 6, 0.4, 1);
spotGreen.position.set(-14, 14, 16);
scene.add(spotGreen);

/* ---------------- moon + stars ---------------- */
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(4, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xf3f0d8 })
);
moon.position.set(-22, 26, -55);
scene.add(moon);
const moonGlow = new THREE.Mesh(
  new THREE.SphereGeometry(6.5, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xcdd6ff, transparent: true, opacity: 0.18 })
);
moonGlow.position.copy(moon.position);
scene.add(moonGlow);

(function stars() {
  const g = new THREE.BufferGeometry();
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 90 + Math.random() * 40;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.random() * Math.PI * 0.5;
    pos[i * 3] = Math.cos(th) * Math.sin(ph) * r;
    pos[i * 3 + 1] = Math.cos(ph) * r * 0.7 + 10;
    pos[i * 3 + 2] = Math.sin(th) * Math.sin(ph) * r - 30;
  }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaab4ff, size: 0.5 })));
})();

/* ---------------- ground ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x14161f, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// foggy graveyard dressing: gravestones + dead trees
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x4a4d55, roughness: 1 });
for (let i = 0; i < 14; i++) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.6 + Math.random(), 0.3), stoneMat);
  const a = Math.random() * Math.PI * 2, r = 16 + Math.random() * 22;
  s.position.set(Math.cos(a) * r, 0.8, Math.sin(a) * r - 6);
  s.rotation.z = (Math.random() - 0.5) * 0.3;
  s.castShadow = s.receiveShadow = true;
  scene.add(s);
}
function deadTree(x, z) {
  const m = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1 });
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.5, 7, 7), m);
  trunk.position.y = 3.5; trunk.castShadow = true; g.add(trunk);
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.16, 3, 5), m);
    b.position.set(0, 5 + Math.random() * 1.5, 0);
    b.rotation.set((Math.random() - 0.5) * 1.4, Math.random() * 6, (Math.random() - 0.5) * 1.4);
    b.castShadow = true; g.add(b);
  }
  g.position.set(x, 0, z); scene.add(g);
}
deadTree(-16, -8); deadTree(17, -10); deadTree(-20, 4);

/* ---------------- character builder ---------------- */
function limb(len, rad, mat) {
  // pivot at top; mesh hangs downward so rotation swings from the joint
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.8, rad, len, 12), mat);
  m.position.y = -len / 2;
  m.castShadow = true;
  g.add(m);
  g.userData.len = len;
  return g;
}

function buildDancer(cfg) {
  const root = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: cfg.skin, roughness: 0.6 });
  const outfit = new THREE.MeshStandardMaterial({ color: cfg.outfit, roughness: 0.55, metalness: 0.1 });
  const accent = new THREE.MeshStandardMaterial({ color: cfg.accent, roughness: 0.5 });

  const hips = new THREE.Group();
  hips.position.y = 2.0;
  root.add(hips);

  // pelvis
  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.55), outfit);
  pelvis.castShadow = true; hips.add(pelvis);

  // torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 1.3, 14), outfit);
  torso.position.y = 0.9; torso.castShadow = true; hips.add(torso);
  // chest accent (jacket stripe / tie)
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.1, 0.05), accent);
  stripe.position.set(0, 0.9, 0.42); hips.add(stripe);

  // head group
  const headG = new THREE.Group();
  headG.position.y = 1.7; hips.add(headG);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 24, 24), skin);
  head.castShadow = true; headG.add(head);
  // hair / hat
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.44, 24, 24, 0, Math.PI * 2, 0, Math.PI * 0.55),
    new THREE.MeshStandardMaterial({ color: cfg.hair, roughness: 0.7 }));
  hair.position.y = 0.06; headG.add(hair);
  // eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  for (const sx of [-0.15, 0.15]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), eyeMat);
    e.position.set(sx, 0.02, 0.38); headG.add(e);
  }
  // signature feature hook
  if (cfg.feature) cfg.feature(headG, skin);

  // arms (pivot at shoulder)
  const shL = new THREE.Group(); shL.position.set(-0.55, 1.45, 0); hips.add(shL);
  const shR = new THREE.Group(); shR.position.set(0.55, 1.45, 0); hips.add(shR);
  const armL = limb(1.2, 0.16, outfit); shL.add(armL);
  const armR = limb(1.2, 0.16, outfit); shR.add(armR);
  // hands
  const handL = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 12), skin);
  handL.position.y = -1.2; shL.add(handL);
  const handR = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 12), skin);
  handR.position.y = -1.2; shR.add(handR);

  // legs (pivot at hip)
  const hipL = new THREE.Group(); hipL.position.set(-0.24, -0.2, 0); hips.add(hipL);
  const hipR = new THREE.Group(); hipR.position.set(0.24, -0.2, 0); hips.add(hipR);
  const legL = limb(1.6, 0.2, new THREE.MeshStandardMaterial({ color: cfg.legs, roughness: 0.6 }));
  const legR = limb(1.6, 0.2, new THREE.MeshStandardMaterial({ color: cfg.legs, roughness: 0.6 }));
  hipL.add(legL); hipR.add(legR);
  // shoes
  const shoeMat = new THREE.MeshStandardMaterial({ color: cfg.shoes, roughness: 0.4 });
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.55), shoeMat);
  shoeL.position.set(0, -1.6, 0.1); hipL.add(shoeL);
  const shoeR = shoeL.clone(); hipR.add(shoeR);

  return { root, hips, headG, shL, shR, hipL, hipR };
}

/* ---------------- the four stars ---------------- */
const configs = [
  { // Michael Jackson — red jacket, black trousers, white glove, fedora
    skin: 0x8a5a3a, outfit: 0xb81f2d, accent: 0xf2f2f2, legs: 0x141414,
    shoes: 0x111111, hair: 0x111111,
    feature: (h) => {
      const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.06, 24),
        new THREE.MeshStandardMaterial({ color: 0x111111 }));
      brim.position.y = 0.34; h.add(brim);
      const top = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.42, 0.4, 24),
        new THREE.MeshStandardMaterial({ color: 0x111111 }));
      top.position.y = 0.55; h.add(top);
    }
  },
  { // Pepe the Frog — green, big eyes, wide mouth
    skin: 0x4fae3a, outfit: 0x2f7d24, accent: 0xe8e8d0, legs: 0x2f7d24,
    shoes: 0x1f5218, hair: 0x2f7d24,
    feature: (h, skin) => {
      for (const sx of [-0.2, 0.2]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), skin);
        eye.position.set(sx, 0.34, 0.28); h.add(eye);
        const pup = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0x111111 }));
        pup.position.set(sx, 0.36, 0.44); h.add(pup);
      }
      const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.1),
        new THREE.MeshStandardMaterial({ color: 0x1f5218 }));
      mouth.position.set(0, -0.18, 0.4); h.add(mouth);
    }
  },
  { // Donald Trump — orange tan, blonde sweep, navy suit, red tie
    skin: 0xe89a5a, outfit: 0x1f2a4a, accent: 0xc0202f, legs: 0x1f2a4a,
    shoes: 0x20140e, hair: 0xf2d16a,
    feature: (h) => {
      const swoop = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.22, 0.7),
        new THREE.MeshStandardMaterial({ color: 0xf2d16a, roughness: 0.6 }));
      swoop.position.set(0, 0.34, 0.06); swoop.rotation.x = -0.15; h.add(swoop);
    }
  },
  { // Elon Musk — dark suit, short dark hair
    skin: 0xd8a884, outfit: 0x22252c, accent: 0x3a3f4a, legs: 0x22252c,
    shoes: 0x111111, hair: 0x3a2e22,
    feature: () => {}
  },
];

const NAMES = ["MJ", "PEPE", "TRUMP", "ELON"];
const dancers = [];
const spacing = 3.2;
configs.forEach((cfg, i) => {
  const d = buildDancer(cfg);
  d.root.position.x = (i - 1.5) * spacing;
  d.phase = i * 0.35;          // slight stagger so the line ripples
  scene.add(d.root);
  dancers.push(d);
  scene.add(makeLabel(NAMES[i], d.root.position.x));
});

function makeLabel(text, x) {
  const cv2 = document.createElement("canvas");
  cv2.width = 256; cv2.height = 64;
  const g = cv2.getContext("2d");
  g.fillStyle = "rgba(10,8,20,0.55)";
  g.fillRect(0, 0, 256, 64);
  g.font = "bold 40px Georgia";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#e8ddff";
  g.shadowColor = "#7a4adf"; g.shadowBlur = 16;
  g.fillText(text, 128, 34);
  const tex = new THREE.CanvasTexture(cv2);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  spr.scale.set(2.4, 0.6, 1);
  spr.position.set(x, 5.2, 0);
  return spr;
}

/* ---------------- choreography ---------------- */
// A looping Thriller-style routine driven by one beat clock.
const BPM = 118;
function dance(d, t) {
  const beat = (t * BPM / 60) + d.phase;
  const bar = Math.floor(beat / 4) % 4;      // 4-bar phrase
  const b = beat * Math.PI;                   // half-beat phase
  const sway = Math.sin(beat * Math.PI / 2);  // slow side-to-side

  // side step + hip sway
  d.root.position.y = Math.abs(Math.sin(b)) * 0.12;
  d.hips.rotation.z = sway * 0.12;
  d.hips.rotation.y = Math.sin(beat * Math.PI / 2) * 0.25;

  // the signature "zombie claw" arms — alternate which arm lunges forward
  const lunge = Math.sin(b);                  // -1..1 each half beat
  // right arm forward/up on positive, left on negative
  d.shR.rotation.x = -1.4 - Math.max(0, lunge) * 0.9;
  d.shR.rotation.z = -0.3 - Math.max(0, lunge) * 0.3;
  d.shL.rotation.x = -1.4 - Math.max(0, -lunge) * 0.9;
  d.shL.rotation.z = 0.3 + Math.max(0, -lunge) * 0.3;
  // claw flick at the wrists (whole-arm roll)
  d.shR.rotation.y = Math.sin(b * 2) * 0.4;
  d.shL.rotation.y = -Math.sin(b * 2) * 0.4;

  // on every 4th bar, throw both arms up (the "Thriller" climax pose)
  if (bar === 3) {
    const up = (Math.sin(b) * 0.5 + 0.5);
    d.shR.rotation.x = -2.4 * up - 0.4;
    d.shL.rotation.x = -2.4 * up - 0.4;
    d.shR.rotation.z = -0.6; d.shL.rotation.z = 0.6;
  }

  // legs: weight-shift step
  d.hipL.rotation.x = Math.sin(b) * 0.35;
  d.hipR.rotation.x = -Math.sin(b) * 0.35;

  // head bop + tilt
  d.headG.rotation.z = sway * 0.2;
  d.headG.rotation.x = Math.sin(b) * 0.15;
  d.headG.rotation.y = Math.sin(beat * Math.PI / 2) * 0.3;
}

/* ---------------- camera + loop ---------------- */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const d of dancers) dance(d, t);

  // slow cinematic orbit with a gentle push-in/out
  const orbit = t * 0.12;
  const radius = 15 + Math.sin(t * 0.1) * 3;
  camera.position.set(Math.sin(orbit) * radius, 6 + Math.sin(t * 0.3) * 1.2, Math.cos(orbit) * radius);
  camera.lookAt(0, 3, 0);

  // pulse the coloured spots with the beat
  const beatPulse = Math.pow(Math.abs(Math.sin(t * BPM / 60 * Math.PI)), 4);
  spotPurple.intensity = 1.6 + beatPulse * 1.8;
  spotGreen.intensity = 1.2 + beatPulse * 1.4;
  spotPurple.position.x = Math.sin(t * 0.5) * 16;
  spotGreen.position.x = Math.cos(t * 0.5) * 16;

  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
