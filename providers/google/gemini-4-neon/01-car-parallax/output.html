<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Hour Grand Tour — Parallax Drive</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1018; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud {
    position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 999px; background: rgba(14, 18, 28, 0.56);
    border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, 0.9); font-size: 12px; user-select: none;
    transition: opacity 0.25s ease;
  }
  .hud button {
    border: 0; border-radius: 999px; padding: 5px 11px; cursor: pointer;
    background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.85);
    font: inherit; transition: background 0.2s, color 0.2s;
  }
  .hud button:hover { background: rgba(255, 255, 255, 0.18); }
  .hud button.active { background: rgba(255, 174, 96, 0.9); color: #16141a; font-weight: 600; }
  .hud label { display: inline-flex; align-items: center; gap: 6px; padding-left: 4px; color: rgba(255,255,255,0.75); }
  .hud input[type="range"] { width: 78px; accent-color: #ffae60; cursor: pointer; }
  .speed-readout { min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; color: #ffd4a3; font-weight: 600; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud" aria-label="Scene controls">
  <button data-mood="sunset" class="active">Sunset</button>
  <button data-mood="dusk">Dusk</button>
  <button data-mood="daylight">Daylight</button>
  <label>Speed <input id="speedRange" type="range" min="0.3" max="2.0" step="0.05" value="1.0"></label>
  <span class="speed-readout" id="speedText">96 km/h</span>
  <button id="pauseBtn" title="Pause / Resume">Pause</button>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const speedRange = document.getElementById('speedRange');
  const speedText = document.getElementById('speedText');
  const pauseBtn = document.getElementById('pauseBtn');
  const moodBtns = Array.from(document.querySelectorAll('.hud button[data-mood]'));

  let W = 1280, H = 720, DPR = 1;
  let paused = false;
  let speedMul = 1.0;
  let activeMood = 'sunset';

  const MOODS = {
    sunset: {
      sky: ['#1b1e3b', '#4d2c52', '#a84750', '#eb8352', '#ffd38a'],
      sunColor: '#fff3c9', sunGlow: 'rgba(255,168,84,0.48)', sunPos: [0.73, 0.37], sunRadius: 0.055,
      stars: 0.22,
      cloudTop: 'rgba(255,214,166,0.58)', cloudBot: 'rgba(130,62,88,0.45)',
      farMtn: '#3d2a49', farMtnRim: '#c96f63',
      midHill: '#2d243d', midMist: 'rgba(240,148,96,0.22)',
      nearHill: '#201e31',
      treeDark: '#171924', treeLite: '#3b2b38',
      pole: '#251e28', wire: 'rgba(30,22,32,0.55)',
      grassTop: '#2c2928', grassBot: '#191a20',
      roadTop: '#2c2930', roadBot: '#1b1a20', roadSheen: 'rgba(255,156,92,0.16)',
      lane: 'rgba(255,222,168,0.72)',
      carTop: '#d7503f', carMid: '#8f2428', carLow: '#3c1018', carSpec: 'rgba(255,224,176,0.82)',
      headlight: 0.42, ambientTint: 'rgba(255,130,68,0.08)'
    },
    dusk: {
      sky: ['#070b1a', '#131d3b', '#26305c', '#543c69', '#8a5068'],
      sunColor: '#ffbf94', sunGlow: 'rgba(218,116,120,0.28)', sunPos: [0.75, 0.48], sunRadius: 0.042,
      stars: 0.92,
      cloudTop: 'rgba(154,116,158,0.34)', cloudBot: 'rgba(28,30,58,0.52)',
      farMtn: '#161b33', farMtnRim: '#5a4a73',
      midHill: '#12182b', midMist: 'rgba(116,108,170,0.18)',
      nearHill: '#0d1322',
      treeDark: '#0a0f1a', treeLite: '#1c243b',
      pole: '#131826', wire: 'rgba(16,20,34,0.65)',
      grassTop: '#141c24', grassBot: '#0c1118',
      roadTop: '#1b1e29', roadBot: '#11131b', roadSheen: 'rgba(130,152,216,0.12)',
      lane: 'rgba(220,228,245,0.65)',
      carTop: '#5678a8', carMid: '#243a5e', carLow: '#0f1a2e', carSpec: 'rgba(195,220,255,0.72)',
      headlight: 0.88, ambientTint: 'rgba(60,96,180,0.09)'
    },
    daylight: {
      sky: ['#2a6eb8', '#4e96d6', '#84bfe8', '#bde0f5', '#e9f4fa'],
      sunColor: '#fffdf2', sunGlow: 'rgba(255,248,214,0.45)', sunPos: [0.74, 0.22], sunRadius: 0.045,
      stars: 0.0,
      cloudTop: 'rgba(255,255,255,0.88)', cloudBot: 'rgba(182,206,228,0.55)',
      farMtn: '#6f8eb0', farMtnRim: '#d7e7f5',
      midHill: '#4e7569', midMist: 'rgba(220,238,248,0.28)',
      nearHill: '#385c48',
      treeDark: '#23402f', treeLite: '#466f4b',
      pole: '#4c4138', wire: 'rgba(42,46,54,0.42)',
      grassTop: '#4e7340', grassBot: '#334d2c',
      roadTop: '#42464d', roadBot: '#2e3138', roadSheen: 'rgba(255,255,255,0.10)',
      lane: 'rgba(255,255,255,0.82)',
      carTop: '#e04f3d', carMid: '#a62324', carLow: '#4f1016', carSpec: 'rgba(255,255,255,0.85)',
      headlight: 0.08, ambientTint: 'rgba(255,250,230,0.03)'
    }
  };

  function hash(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return s - Math.floor(s);
  }

  // Precomputed stars, clouds, roadside trees, foreground grass, and dust particles
  const stars = Array.from({ length: 75 }, (_, i) => ({
    x: hash(i + 1), y: hash(i + 91) * 0.42, r: 0.6 + hash(i + 201) * 1.3, tw: hash(i + 311) * 6.28
  }));

  const clouds = Array.from({ length: 11 }, (_, i) => ({
    x: i / 11 + hash(i + 17) * 0.06,
    y: 0.08 + hash(i + 43) * 0.25,
    w: 110 + hash(i + 71) * 180,
    h: 22 + hash(i + 99) * 26,
    spd: 0.008 + hash(i + 123) * 0.012
  }));

  // Deterministic repeating tile lists for varied roadside scenery
  const TREE_SPAN = 3600;
  const trees = [];
  for (let i = 0; i < 42; i++) {
    const type = i % 3; // 0 pine, 1 cypress, 2 broadleaf
    trees.push({
      x: (i / 42) * TREE_SPAN + (hash(i + 5) - 0.5) * 62,
      scale: 0.65 + hash(i + 29) * 0.68,
      type,
      depth: hash(i + 61) > 0.45 ? 1 : 0 // 0 behind hill rim, 1 nearer roadside
    });
  }

  const FG_SPAN = 2200;
  const fgTufts = Array.from({ length: 34 }, (_, i) => ({
    x: (i / 34) * FG_SPAN + hash(i + 501) * 45,
    h: 16 + hash(i + 551) * 26,
    blades: 3 + Math.floor(hash(i + 601) * 4),
    isPost: i % 11 === 0
  }));

  const dust = Array.from({ length: 28 }, (_, i) => ({
    x: -hash(i + 701) * 260,
    y: (hash(i + 731) - 0.5) * 12,
    life: hash(i + 761),
    size: 2.5 + hash(i + 791) * 5.5,
    vy: -6 - hash(i + 821) * 14
  }));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  moodBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      activeMood = btn.dataset.mood;
      moodBtns.forEach(b => b.classList.toggle('active', b === btn));
    });
  });

  speedRange.addEventListener('input', () => {
    speedMul = parseFloat(speedRange.value);
    speedText.textContent = Math.round(speedMul * 96) + ' km/h';
  });

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Resume' : 'Pause';
    pauseBtn.classList.toggle('active', paused);
  });

  // Procedural ridge helper (continuous seamless periodic wave)
  function ridgeY(x, base, amp, f1, f2, f3, phase) {
    return base
      - Math.sin(x * f1 + phase) * amp
      - Math.sin(x * f2 + phase * 1.7) * (amp * 0.45)
      - Math.cos(x * f3 - phase * 0.6) * (amp * 0.22);
  }

  function drawSky(M, t, horizonY) {
    const g = ctx.createLinearGradient(0, 0, 0, horizonY + 20);
    const stops = [0, 0.28, 0.56, 0.80, 1];
    M.sky.forEach((c, i) => g.addColorStop(stops[i], c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY + 25);

    // Stars
    if (M.stars > 0.01) {
      ctx.save();
      for (const s of stars) {
        const a = M.stars * (0.45 + 0.55 * Math.sin(t * 1.4 + s.tw));
        ctx.fillStyle = `rgba(255,250,240,${a.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Sun & atmospheric halo
    const sx = M.sunPos[0] * W;
    const sy = M.sunPos[1] * H;
    const sr = M.sunRadius * Math.min(W, H);
    const halo = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 5.2);
    halo.addColorStop(0, M.sunGlow);
    halo.addColorStop(0.45, M.sunGlow.replace(/[\d.]+\)$/, '0.14)'));
    halo.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(sx, sy, sr * 5.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = M.sunColor;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();

    // Drifting clouds
    for (const c of clouds) {
      const cx = (((c.x * W - t * c.spd * 220 * (0.35 + speedMul * 0.25)) % (W + c.w * 2)) + (W + c.w * 2)) % (W + c.w * 2) - c.w;
      const cy = c.y * H;
      const cg = ctx.createLinearGradient(cx, cy - c.h, cx, cy + c.h * 0.6);
      cg.addColorStop(0, M.cloudTop);
      cg.addColorStop(1, M.cloudBot);
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(cx, cy, c.w * 0.5, c.h * 0.45, 0, 0, Math.PI * 2);
      ctx.ellipse(cx - c.w * 0.26, cy + c.h * 0.1, c.w * 0.32, c.h * 0.36, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + c.w * 0.28, cy + c.h * 0.12, c.w * 0.34, c.h * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawMountainLayer(dist, speed, base, amp, f1, f2, f3, phase, fill, rimColor, horizonY) {
    const off = dist * speed;
    const step = 12;
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 30);
    for (let x = 0; x <= W + step; x += step) {
      const y = ridgeY(x + off, base, amp, f1, f2, f3, phase);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + step, horizonY + 30);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();

    if (rimColor) {
      ctx.beginPath();
      for (let x = 0; x <= W + step; x += step) {
        const y = ridgeY(x + off, base, amp, f1, f2, f3, phase);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = rimColor;
      ctx.lineWidth = 1.6;
      ctx.globalAlpha = 0.45;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawWindTurbines(dist, horizonY, M) {
    const span = 1800;
    const off = dist * 0.11;
    for (let i = 0; i < 3; i++) {
      const wx = (((i * 600 + 240 - off) % span) + span) % span - 120;
      if (wx < -60 || wx > W + 60) continue;
      const base = ridgeY(wx + dist * 0.11, horizonY - H * 0.06, H * 0.055, 0.0022, 0.0051, 0.0095, 2.3) + 6;
      const h = H * 0.085;
      ctx.save();
      ctx.strokeStyle = M.midHill;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wx, base);
      ctx.lineTo(wx, base - h);
      ctx.stroke();
      ctx.translate(wx, base - h);
      const ang = dist * 0.008 + i * 1.9;
      ctx.lineWidth = 1.6;
      for (let b = 0; b < 3; b++) {
        const a = ang + b * (Math.PI * 2 / 3);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * h * 0.42, Math.sin(a) * h * 0.42);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawTree(x, groundY, s, type, M) {
    const h = H * 0.14 * s;
    ctx.save();
    ctx.translate(x, groundY);
    // Trunk
    ctx.fillStyle = M.pole;
    ctx.fillRect(-2.4 * s, -h * 0.34, 4.8 * s, h * 0.36);

    if (type === 0) {
      // Pine layers
      for (let i = 0; i < 4; i++) {
        const ty = -h * (0.28 + i * 0.19);
        const tw = h * (0.34 - i * 0.06);
        const th = h * 0.28;
        ctx.fillStyle = M.treeDark;
        ctx.beginPath();
        ctx.moveTo(0, ty - th);
        ctx.lineTo(-tw, ty);
        ctx.lineTo(tw, ty);
        ctx.closePath();
        ctx.fill();
        // Sun-side rim highlight
        ctx.fillStyle = M.treeLite;
        ctx.beginPath();
        ctx.moveTo(0, ty - th);
        ctx.lineTo(tw * 0.12, ty);
        ctx.lineTo(tw, ty);
        ctx.closePath();
        ctx.fill();
      }
    } else if (type === 1) {
      // Mediterranean cypress
      ctx.fillStyle = M.treeDark;
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.56, h * 0.14, h * 0.44, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = M.treeLite;
      ctx.beginPath();
      ctx.ellipse(h * 0.04, -h * 0.57, h * 0.07, h * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Broadleaf crown
      ctx.fillStyle = M.treeDark;
      ctx.beginPath();
      ctx.arc(-h * 0.14, -h * 0.48, h * 0.22, 0, Math.PI * 2);
      ctx.arc(h * 0.12, -h * 0.45, h * 0.20, 0, Math.PI * 2);
      ctx.arc(0, -h * 0.62, h * 0.24, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = M.treeLite;
      ctx.beginPath();
      ctx.arc(h * 0.09, -h * 0.62, h * 0.15, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawUtilityPoles(dist, vergeY, M) {
    const spacing = 460;
    const poleH = H * 0.25;
    const off = (dist * 0.62) % spacing;
    const poles = [];
    for (let x = -spacing - off; x <= W + spacing; x += spacing) {
      poles.push(x);
    }

    // Catenary power wires first
    ctx.strokeStyle = M.wire;
    ctx.lineWidth = 1.2;
    for (let i = 0; i < poles.length - 1; i++) {
      const x1 = poles[i], x2 = poles[i + 1];
      const yTop = vergeY - poleH + 12;
      for (let w = 0; w < 2; w++) {
        const yOff = w * 13;
        ctx.beginPath();
        ctx.moveTo(x1 + 10, yTop + yOff);
        ctx.quadraticCurveTo((x1 + x2) * 0.5, yTop + yOff + 24, x2 - 10, yTop + yOff);
        ctx.stroke();
      }
    }

    // Wooden poles & crossbars
    for (const x of poles) {
      ctx.fillStyle = M.pole;
      ctx.fillRect(x - 3.5, vergeY - poleH, 7, poleH + 6);
      ctx.fillRect(x - 16, vergeY - poleH + 10, 32, 4);
      ctx.fillRect(x - 12, vergeY - poleH + 23, 24, 3);
      // Insulators
      ctx.fillStyle = 'rgba(220,230,240,0.45)';
      ctx.fillRect(x - 14, vergeY - poleH + 7, 3, 4);
      ctx.fillRect(x + 11, vergeY - poleH + 7, 3, 4);
    }
  }

  function drawRoadAndGuardrail(dist, roadTop, roadBot, M) {
    // Verge / grass strip above road
    const vergeH = H * 0.055;
    const vg = ctx.createLinearGradient(0, roadTop - vergeH, 0, roadTop);
    vg.addColorStop(0, M.grassTop);
    vg.addColorStop(1, M.grassBot);
    ctx.fillStyle = vg;
    ctx.fillRect(0, roadTop - vergeH, W, vergeH + 2);

    // Guardrail behind road
    const railY = roadTop - 16;
    const postSpace = 86;
    const postOff = (dist * 0.86) % postSpace;
    ctx.fillStyle = 'rgba(40,44,54,0.95)';
    for (let x = -postOff; x < W + postSpace; x += postSpace) {
      ctx.fillRect(x - 2.5, railY - 2, 5, 22);
    }
    const rg = ctx.createLinearGradient(0, railY - 5, 0, railY + 5);
    rg.addColorStop(0, 'rgba(218,224,235,0.68)');
    rg.addColorStop(0.5, 'rgba(130,136,150,0.75)');
    rg.addColorStop(1, 'rgba(54,58,68,0.88)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, railY - 4, W, 8);

    // Reflective orange delineators on guardrail
    for (let x = -postOff; x < W + postSpace; x += postSpace * 2) {
      ctx.fillStyle = 'rgba(255,152,66,0.92)';
      ctx.fillRect(x - 2.5, railY - 2, 5, 4);
    }

    // Asphalt surface
    const ag = ctx.createLinearGradient(0, roadTop, 0, roadBot);
    ag.addColorStop(0, M.roadTop);
    ag.addColorStop(1, M.roadBot);
    ctx.fillStyle = ag;
    ctx.fillRect(0, roadTop, W, roadBot - roadTop);

    // Subtle specular sky sheen on asphalt
    const sheen = ctx.createLinearGradient(0, roadTop, 0, roadTop + (roadBot - roadTop) * 0.55);
    sheen.addColorStop(0, M.roadSheen);
    sheen.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(0, roadTop, W, (roadBot - roadTop) * 0.55);

    // Subtle moving asphalt grain streaks
    const grainSpace = 140;
    const gOff = (dist * 1.15) % grainSpace;
    ctx.fillStyle = 'rgba(255,255,255,0.035)';
    for (let row = 0; row < 5; row++) {
      const y = roadTop + 14 + row * ((roadBot - roadTop - 24) / 4);
      for (let x = -gOff - row * 37; x < W + grainSpace; x += grainSpace) {
        ctx.fillRect(x, y, 28 + (row % 2) * 16, 1.5);
      }
    }

    // Solid upper shoulder line
    ctx.fillStyle = 'rgba(255,255,255,0.36)';
    ctx.fillRect(0, roadTop + 8, W, 2.5);

    // Dashed center line
    const dashPeriod = 140;
    const dashLen = 68;
    const dOff = (dist * 1.25) % dashPeriod;
    const midY = roadTop + (roadBot - roadTop) * 0.47;
    ctx.fillStyle = M.lane;
    for (let x = -dOff - dashPeriod; x < W + dashPeriod; x += dashPeriod) {
      ctx.fillRect(x, midY, dashLen, 4.5);
    }

    // Lower curb / foreground earth
    ctx.fillStyle = '#111319';
    ctx.fillRect(0, roadBot, W, H - roadBot);
  }

  function drawWheel(cx, cy, r, angle, M) {
    ctx.save();
    ctx.translate(cx, cy);

    // Tire outer
    const tg = ctx.createRadialGradient(0, 0, r * 0.58, 0, 0, r);
    tg.addColorStop(0, '#2a2d34');
    tg.addColorStop(0.75, '#191b20');
    tg.addColorStop(1, '#0e1014');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Subtle tire sidewall rim highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.84, 0, Math.PI * 2);
    ctx.stroke();

    // Inner brake disc (stationary)
    ctx.fillStyle = '#474c56';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.56, 0, Math.PI * 2);
    ctx.fill();

    // Brake caliper (stationary crimson detail)
    ctx.fillStyle = '#c92a2a';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.52, -0.55, 0.45);
    ctx.lineTo(Math.cos(0.45) * r * 0.34, Math.sin(0.45) * r * 0.34);
    ctx.arc(0, 0, r * 0.34, 0.45, -0.55, true);
    ctx.closePath();
    ctx.fill();

    // Rotating alloy rim + 5 twin spokes
    ctx.save();
    ctx.rotate(angle);

    // Rim lip
    ctx.strokeStyle = '#c8cfd8';
    ctx.lineWidth = r * 0.09;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.64, 0, Math.PI * 2);
    ctx.stroke();

    // Spokes
    const spokes = 5;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * Math.PI * 2;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = '#d9dfe8';
      ctx.beginPath();
      ctx.moveTo(-r * 0.08, -r * 0.14);
      ctx.lineTo(-r * 0.045, -r * 0.62);
      ctx.lineTo(r * 0.045, -r * 0.62);
      ctx.lineTo(r * 0.08, -r * 0.14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#8b94a3';
      ctx.fillRect(-r * 0.015, -r * 0.60, r * 0.03, r * 0.44);
      ctx.restore();
    }

    // Center hub cap & lug nuts
    ctx.fillStyle = '#252932';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e5ebf2';
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // Tire rotation sheen cues
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.92, a, a + 0.18);
      ctx.stroke();
    }
    ctx.restore();

    // Directional top-down shading across wheel
    const sh = ctx.createLinearGradient(0, -r, 0, r);
    sh.addColorStop(0, 'rgba(0,0,0,0.38)');
    sh.addColorStop(0.45, 'rgba(255,255,255,0.06)');
    sh.addColorStop(1, 'rgba(0,0,0,0.34)');
    ctx.fillStyle = sh;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawCar(carX, roadY, scale, wheelAngle, bodyBob, bodyPitch, rearJounce, frontJounce, M) {
    ctx.save();
    ctx.translate(carX, roadY);
    ctx.scale(scale, scale);

    // Ground contact shadow
    const shg = ctx.createRadialGradient(0, 2, 10, 0, 2, 195);
    shg.addColorStop(0, 'rgba(0,0,0,0.72)');
    shg.addColorStop(0.75, 'rgba(0,0,0,0.45)');
    shg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shg;
    ctx.beginPath();
    ctx.ellipse(0, 3, 196, 17, 0, 0, Math.PI * 2);
    ctx.fill();

    // Volumetric headlight beam (anchored to body motion)
    ctx.save();
    ctx.translate(0, bodyBob);
    ctx.rotate(bodyPitch);

    if (M.headlight > 0.02) {
      const hg = ctx.createLinearGradient(168, -42, 560, -18);
      hg.addColorStop(0, `rgba(255,244,205,${(M.headlight * 0.72).toFixed(3)})`);
      hg.addColorStop(0.35, `rgba(255,235,180,${(M.headlight * 0.28).toFixed(3)})`);
      hg.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.moveTo(166, -45);
      ctx.lineTo(560, -92);
      ctx.lineTo(560, 14);
      ctx.lineTo(166, -34);
      ctx.closePath();
      ctx.fill();

      // Road headlight splash
      const sp = ctx.createRadialGradient(280, -4, 10, 330, 0, 180);
      sp.addColorStop(0, `rgba(255,235,180,${(M.headlight * 0.25).toFixed(3)})`);
      sp.addColorStop(1, 'rgba(255,235,180,0)');
      ctx.fillStyle = sp;
      ctx.beginPath();
      ctx.ellipse(320, 0, 170, 16, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Rear taillight glow bloom
    const tg = ctx.createRadialGradient(-164, -52, 2, -164, -52, 46);
    tg.addColorStop(0, `rgba(255,44,44,${(0.45 + M.headlight * 0.45).toFixed(3)})`);
    tg.addColorStop(1, 'rgba(255,30,30,0)');
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(-164, -52, 46, 0, Math.PI * 2);
    ctx.fill();

    // Underbody chassis silhouette
    ctx.fillStyle = '#111319';
    ctx.beginPath();
    ctx.roundRect(-158, -32, 318, 16, 6);
    ctx.fill();

    // Main sculpted fastback body
    const bg = ctx.createLinearGradient(0, -102, 0, -18);
    bg.addColorStop(0, M.carTop);
    bg.addColorStop(0.48, M.carMid);
    bg.addColorStop(0.55, M.carLow);
    bg.addColorStop(0.75, M.carMid);
    bg.addColorStop(1, M.carLow);

    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-162, -24);
    ctx.lineTo(-168, -44);
    ctx.quadraticCurveTo(-168, -58, -152, -62);
    ctx.lineTo(-124, -66);
    ctx.quadraticCurveTo(-76, -98, -26, -101);
    ctx.lineTo(26, -100);
    ctx.quadraticCurveTo(64, -96, 95, -67);
    ctx.quadraticCurveTo(138, -62, 164, -50);
    ctx.quadraticCurveTo(175, -43, 174, -27);
    ctx.lineTo(164, -20);
    ctx.lineTo(-154, -20);
    ctx.closePath();
    ctx.fill();

    // Crisp metallic shoulder specular highlight
    ctx.strokeStyle = M.carSpec;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-148, -60);
    ctx.quadraticCurveTo(-80, -64, 92, -64);
    ctx.quadraticCurveTo(136, -60, 163, -49);
    ctx.stroke();

    // Roofline highlight
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-114, -69);
    ctx.quadraticCurveTo(-70, -96, -24, -99);
    ctx.lineTo(25, -98);
    ctx.quadraticCurveTo(58, -94, 88, -69);
    ctx.stroke();

    // Side skirt & lower character crease
    ctx.fillStyle = 'rgba(10,12,18,0.68)';
    ctx.fillRect(-68, -25, 144, 6);
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-64, -36);
    ctx.lineTo(74, -38);
    ctx.stroke();

    // Cabin glass window cutout + gradient
    const wg = ctx.createLinearGradient(-40, -96, 60, -64);
    wg.addColorStop(0, '#222b3d');
    wg.addColorStop(0.45, '#121824');
    wg.addColorStop(1, '#313d52');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(-98, -66);
    ctx.quadraticCurveTo(-60, -92, -20, -94);
    ctx.lineTo(24, -93);
    ctx.quadraticCurveTo(56, -89, 82, -66);
    ctx.closePath();
    ctx.fill();

    // Driver silhouette & seat inside cabin
    ctx.fillStyle = 'rgba(8,10,16,0.75)';
    ctx.beginPath();
    ctx.arc(8, -81, 7.5, 0, Math.PI * 2); // head
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, -66);
    ctx.quadraticCurveTo(4, -76, 18, -66);
    ctx.closePath();
    ctx.fill();
    // Steering wheel rim
    ctx.strokeStyle = 'rgba(160,175,198,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(35, -75);
    ctx.lineTo(41, -67);
    ctx.stroke();

    // B-pillar & window reflection streaks
    ctx.fillStyle = '#141720';
    ctx.beginPath();
    ctx.moveTo(-16, -94);
    ctx.lineTo(-9, -94);
    ctx.lineTo(-15, -66);
    ctx.lineTo(-22, -66);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, -91);
    ctx.lineTo(-4, -68);
    ctx.moveTo(22, -91);
    ctx.lineTo(10, -68);
    ctx.stroke();

    // Door seam & flush door handle
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-26, -65);
    ctx.lineTo(-30, -25);
    ctx.moveTo(56, -65);
    ctx.lineTo(62, -25);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.fillRect(-10, -56, 16, 3);

    // Side mirror
    ctx.fillStyle = M.carMid;
    ctx.beginPath();
    ctx.ellipse(54, -68, 9, 4.5, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // Front headlight housing
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.moveTo(154, -49);
    ctx.lineTo(171, -44);
    ctx.lineTo(169, -37);
    ctx.lineTo(150, -42);
    ctx.closePath();
    ctx.fill();

    // Front grille intake
    ctx.fillStyle = '#12141a';
    ctx.beginPath();
    ctx.roundRect(160, -34, 13, 10, 3);
    ctx.fill();

    // Rear LED taillight strip & exhaust tip
    ctx.fillStyle = '#ff3838';
    ctx.beginPath();
    ctx.roundRect(-167, -56, 15, 6, 2);
    ctx.fill();
    ctx.fillStyle = '#9aa3b0';
    ctx.fillRect(-165, -24, 11, 5);

    // Dark wheel arches
    ctx.fillStyle = '#0b0c10';
    ctx.beginPath();
    ctx.arc(-104, -22, 34, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(108, -22, 34, Math.PI, 0);
    ctx.fill();

    ctx.restore(); // end body pitch/bob transform

    // Wheels (road-coupled independently with subtle jounce)
    drawWheel(-104, -26 + rearJounce, 28, wheelAngle, M);
    drawWheel(108, -26 + frontJounce, 28, wheelAngle, M);

    ctx.restore();
  }

  function drawDust(dt, carX, roadY, scale) {
    const active = speedMul;
    for (const p of dust) {
      if (!paused) {
        p.life -= dt * (0.65 + active * 0.45);
        p.x -= dt * (210 * active + 70);
        p.y += p.vy * dt * 0.4;
        if (p.life <= 0) {
          p.life = 0.75 + Math.random() * 0.35;
          p.x = -165 * scale + (Math.random() - 0.5) * 14;
          p.y = -18 * scale + (Math.random() - 0.5) * 10;
        }
      }
      const alpha = Math.max(0, p.life * 0.14);
      ctx.fillStyle = `rgba(215,195,180,${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(carX + p.x, roadY + p.y, p.size * (1.7 - p.life), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawForegroundParallax(dist) {
    const off = dist * 1.65;
    for (const f of fgTufts) {
      const x = (((f.x - off) % FG_SPAN) + FG_SPAN) % FG_SPAN - 120;
      if (x < -40 || x > W + 40) continue;
      if (f.isPost) {
        // Blurred fast-passing foreground roadside milepost silhouette
        ctx.fillStyle = 'rgba(10,12,18,0.88)';
        ctx.fillRect(x, H - 56, 7, 56);
        ctx.fillStyle = 'rgba(255,210,130,0.42)';
        ctx.fillRect(x + 1, H - 48, 5, 8);
      } else {
        ctx.strokeStyle = 'rgba(10,12,18,0.82)';
        ctx.lineWidth = 2.2;
        for (let b = 0; b < f.blades; b++) {
          const lean = (b - f.blades * 0.5) * 5 - 4 * speedMul;
          ctx.beginPath();
          ctx.moveTo(x + b * 4, H + 2);
          ctx.quadraticCurveTo(x + b * 4 + lean * 0.4, H - f.h * 0.6, x + b * 4 + lean, H - f.h);
          ctx.stroke();
        }
      }
    }
  }

  let simTime = 0;
  let dist = 0;
  let wheelAngle = 0;
  let lastTs = performance.now();

  function render(now) {
    const dt = Math.min((now - lastTs) / 1000, 0.05);
    lastTs = now;

    if (!paused) {
      simTime += dt;
      const pxSpeed = 360 * speedMul;
      dist += pxSpeed * dt;
      // Realistic wheel angular velocity: v / r_eff
      wheelAngle += (pxSpeed * 1.25 / 28) * dt;
    }

    const M = MOODS[activeMood];
    const horizonY = H * 0.60;
    const roadTop = H * 0.69;
    const roadBot = H * 0.90;
    const carRoadY = roadTop + (roadBot - roadTop) * 0.68;
    const carScale = Math.max(0.68, Math.min(1.22, Math.min(W / 1050, H / 640)));
    const carX = W * 0.36;

    // 1. Sky, stars, sun, clouds
    drawSky(M, simTime, horizonY);

    // 2. Far jagged mountains
    drawMountainLayer(dist, 0.045, horizonY - H * 0.14, H * 0.11, 0.0019, 0.0046, 0.0091, 0.7, M.farMtn, M.farMtnRim, horizonY);

    // 3. Mid hills + valley mist + distant wind turbines
    drawMountainLayer(dist, 0.11, horizonY - H * 0.055, H * 0.055, 0.0022, 0.0051, 0.0095, 2.3, M.midHill, null, horizonY);
    drawWindTurbines(dist, horizonY, M);

    const mist = ctx.createLinearGradient(0, horizonY - H * 0.12, 0, roadTop);
    mist.addColorStop(0, 'rgba(0,0,0,0)');
    mist.addColorStop(0.55, M.midMist);
    mist.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mist;
    ctx.fillRect(0, horizonY - H * 0.12, W, roadTop - (horizonY - H * 0.12));

    // 4. Near rolling foothills
    drawMountainLayer(dist, 0.24, roadTop - H * 0.065, H * 0.032, 0.0031, 0.0068, 0.012, 4.1, M.nearHill, null, roadTop);

    // 5. Distant treeline
    const farTreeOff = dist * 0.36;
    for (const tr of trees) {
      if (tr.depth !== 0) continue;
      const x = (((tr.x - farTreeOff) % TREE_SPAN) + TREE_SPAN) % TREE_SPAN - 150;
      if (x < -90 || x > W + 90) continue;
      drawTree(x, roadTop - H * 0.048, tr.scale * 0.62, tr.type, M);
    }

    // 6. Utility poles & wires
    drawUtilityPoles(dist, roadTop - H * 0.025, M);

    // 7. Roadside nearer trees
    const nearTreeOff = dist * 0.74;
    for (const tr of trees) {
      if (tr.depth !== 1) continue;
      const x = (((tr.x - nearTreeOff) % TREE_SPAN) + TREE_SPAN) % TREE_SPAN - 150;
      if (x < -120 || x > W + 120) continue;
      drawTree(x, roadTop - H * 0.028, tr.scale * 0.96, tr.type, M);
    }

    // 8. Guardrail & asphalt road
    drawRoadAndGuardrail(dist, roadTop, roadBot, M);

    // 9. Subtle road-connected suspension & micro-pitch physics
    const roadFreq = dist * 0.028;
    const rearJounce = Math.sin(roadFreq) * 1.15 + Math.sin(roadFreq * 2.3) * 0.45;
    const frontJounce = Math.sin(roadFreq + 1.1) * 1.15 + Math.sin((roadFreq + 1.1) * 2.3) * 0.45;
    const bodyBob = Math.sin(simTime * 5.2 * (0.6 + speedMul * 0.4)) * 1.8 + (rearJounce + frontJounce) * 0.35;
    const bodyPitch = ((frontJounce - rearJounce) * 0.0028) + Math.sin(simTime * 2.1) * 0.003;

    drawDust(dt, carX, carRoadY, carScale);
    drawCar(carX, carRoadY, carScale, wheelAngle, bodyBob, bodyPitch, rearJounce, frontJounce, M);

    // 10. Fast foreground silhouette parallax
    drawForegroundParallax(dist);

    // Subtle atmospheric color grade & soft vignette
    ctx.fillStyle = M.ambientTint;
    ctx.fillRect(0, 0, W, H);
    const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.38, W * 0.5, H * 0.5, Math.max(W, H) * 0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.34)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
