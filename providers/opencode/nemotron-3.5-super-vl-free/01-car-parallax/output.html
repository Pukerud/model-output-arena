<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nemotron Drive — Parallax Car</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0c10; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud { position: fixed; top: 16px; left: 16px; color: rgba(255,255,255,0.7); font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; pointer-events: none; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 0 8px rgba(0,0,0,0.6); }
</style>
</head>
<body>
<div id="hud">Nemotron Drive &middot; Dusk Parallax &middot; No Libraries</div>
<canvas id="scene"></canvas>
<script>
"use strict";

(function () {
  var cvs = document.getElementById("scene");
  var ctx = cvs.getContext("2d", { alpha: false });

  var W = 0, H = 0, DPR = 1;
  var distance = 0;       // world px travelled
  var SPEED = 260;        // px per second
  var last = 0;
  var paused = false;

  // ---------- helpers ----------
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  // Deterministic index -> [0,1). Scenery repeats byte-for-byte; loop seamless.
  function hash(n) {
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  }
  function hash2(a, b) { return hash(a * 1.6180339887 + b * 0.7320508076); }

  function noise1(x) {
    var i = Math.floor(x), f = x - i, u = smooth(f);
    return lerp(hash(i * 1.31 + 0.7), hash((i + 1) * 1.31 + 0.7), u);
  }
  function fbm1(x) {
    return noise1(x) * 0.55 + noise1(x * 2.17 + 7.3) * 0.27 + noise1(x * 4.63 + 19.7) * 0.18;
  }

  // Wrap world x into view space for a layer moving at parallax `par`.
  function wrapX(worldX, par, pad) {
    var span = W + pad * 2;
    var x = (worldX - distance * par) % span;
    if (x < 0) x += span;
    return x - pad;
  }

  // ---------- layout ----------
  var horizonY, hillBase, vergeY, roadTop, roadBot, groundY;
  var carX, carS, wheelR, wb;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width = Math.max(1, Math.round(W * DPR));
    cvs.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    buildSky();
    buildScenery();
  }

  function layout() {
    horizonY = Math.round(H * 0.50);
    hillBase = Math.round(H * 0.59);
    vergeY = Math.round(H * 0.66);
    roadTop = Math.round(H * 0.675);
    roadBot = Math.round(H * 0.935);
    groundY = Math.round(H * 0.872);
    carX = Math.round(W * 0.28);
    carS = Math.min(W * 0.32, H * 0.42);
    wheelR = carS * 0.072;
    wb = carS * 0.60;
  }

  // ---------- static sky cache ----------
  var sky = null;

  function buildSky() {
    sky = document.createElement("canvas");
    sky.width = Math.max(1, Math.round(W * DPR));
    sky.height = Math.max(1, Math.round(H * DPR));
    var g = sky.getContext("2d");
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Dusk gradient: deep violet zenith -> amber horizon.
    var grad = g.createLinearGradient(0, 0, 0, horizonY + 4);
    grad.addColorStop(0.00, "#140b22");
    grad.addColorStop(0.25, "#2a1642");
    grad.addColorStop(0.50, "#6d2b49");
    grad.addColorStop(0.72, "#b84a3c");
    grad.addColorStop(0.88, "#d97f4a");
    grad.addColorStop(1.00, "#f2ad5f");
    g.fillStyle = grad;
    g.fillRect(0, 0, W, horizonY + 4);

    g.fillStyle = "#120a18";
    g.fillRect(0, horizonY + 3, W, H - horizonY - 3);

    // Sun bloom.
    var sx = W * 0.72, sy = horizonY - H * 0.05, sr = Math.max(24, H * 0.04);
    g.globalCompositeOperation = "lighter";
    var bloom = g.createRadialGradient(sx, sy, sr * 0.15, sx, sy, sr * 10);
    bloom.addColorStop(0, "rgba(255,222,160,0.5)");
    bloom.addColorStop(0.2, "rgba(255,170,100,0.24)");
    bloom.addColorStop(0.5, "rgba(220,110,70,0.08)");
    bloom.addColorStop(1, "rgba(120,50,60,0)");
    g.fillStyle = bloom;
    g.fillRect(0, 0, W, horizonY + 4);

    var core = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 1.4);
    core.addColorStop(0, "rgba(255,250,230,0.95)");
    core.addColorStop(0.45, "rgba(255,210,150,0.9)");
    core.addColorStop(0.75, "rgba(255,150,80,0.5)");
    core.addColorStop(1, "rgba(255,120,70,0)");
    g.beginPath();
    g.arc(sx, sy, sr * 1.5, 0, Math.PI * 2);
    g.fill();

    // Cirrus streaks.
    g.globalCompositeOperation = "source-over";
    for (var i = 0; i < 14; i++) {
      var t = i / 13;
      var y = horizonY * (0.12 + 0.66 * t) + hash2(i, 3) * 8;
      var w = W * (0.28 + 0.62 * hash2(i, 5));
      var x = hash2(i, 7) * W * 1.2 - W * 0.1;
      var h = Math.max(1, H * 0.002) * (0.5 + 2 * hash2(i, 9));
      var lit = clamp(1.3 - t * 1.2, 0, 1);
      g.globalAlpha = 0.04 + 0.18 * hash2(i, 11) * lit;
      g.fillStyle = "rgb(" + Math.round(220 + 35 * lit) + "," + Math.round(150 + 75 * lit) + "," + Math.round(150 + 35 * lit) + ")";
      g.beginPath();
      g.ellipse(x, y, w * 0.45, h, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;

    // Horizon haze.
    var haze = g.createLinearGradient(0, horizonY - H * 0.12, 0, horizonY + 4);
    haze.addColorStop(0, "rgba(210,120,80,0)");
    haze.addColorStop(1, "rgba(220,140,100,0.28)");
    g.fillStyle = haze;
    g.fillRect(0, horizonY - H * 0.12, W, H * 0.12 + 4);
  }

  // ---------- scenery database ----------
  var scenery = { trees: [], poles: [], tufts: [], refl: [] };

  function buildScenery() {
    scenery.trees = []; scenery.poles = []; scenery.tufts = []; scenery.refl = [];

    function tile(arr, spacing, pad, par, make) {
      var span = W + pad * 2;
      var n = Math.max(1, Math.round(span / spacing));
      var cell = span / n;
      for (var i = 0; i < n; i++) {
        arr.push(make(i, i * cell + (hash2(i, 3) - 0.5) * cell * 0.9, par));
      }
    }

    tile(scenery.trees, 360, 340, 0.66, function (i, x, par) {
      return { x: x, par: par, s: 0.42 + hash2(i, 4) * 0.72, seed: i,
        kind: hash2(i, 5) > 0.68 ? "pine" : "round" };
    });
    tile(scenery.poles, 440, 430, 0.40, function (i, x, par) { return { x: x, par: par, seed: i }; });
    tile(scenery.tufts, 72, 70, 0.99, function (i, x, par) {
      return { x: x, par: par, s: 0.5 + hash2(i, 9) * 1.2, seed: i };
    });
    tile(scenery.refl, 320, 200, 1.5, function (i, x, par) { return { x: x, par: par, seed: i }; });
  }

  // ---------- draw layers ----------

  function drawClouds() {
    var pad = W * 0.30;
    for (var i = 0; i < 10; i++) {
      var y = horizonY * (0.28 + 0.56 * hash2(i, 12));
      var k = 0.55 + 1.0 * hash2(i, 13);
      var w = W * 0.22 * k, h = Math.max(4, H * 0.018) * k;
      var x = wrapX(hash2(i, 14) * (W + pad * 2), 0.016, pad);
      if (x < -w * 1.4 || x > W + w * 1.4) continue;
      var lit = clamp(1 - (y / horizonY) * 0.5, 0.22, 1);
      var lobes = 7;
      for (var m = 0; m < lobes; m++) {
        var t = m / (lobes - 1);
        var taper = Math.pow(Math.sin(t * Math.PI), 0.5);
        var r = h * (0.5 + 1.6 * taper) * (0.75 + 0.5 * hash2(i, m));
        var bx = x - w * 0.5 + w * t;
        var by = y - h * 0.32 * taper;
        var g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
        g.addColorStop(0, "rgba(" + Math.round(130 + 100 * lit) + "," + Math.round(70 + 100 * lit) + "," + Math.round(100 + 90 * lit) + ",0.28)");
        g.addColorStop(0.55, "rgba(" + Math.round(120 + 120 * lit) + "," + Math.round(60 + 100 * lit) + "," + Math.round(90 + 70 * lit) + ",0.16)");
        g.addColorStop(1, "rgba(90,50,80,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(bx, by, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (var c = 0; c < 3; c++) {
        var ct = 0.3 + 0.2 * c;
        var cr = h * (0.5 + 1.0 * Math.sin(ct * Math.PI)) * 0.8;
        var cx = x - w * 0.5 + w * ct;
        var cy = y - h * 0.5;
        var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
        cg.addColorStop(0, "rgba(255," + Math.round(180 + 60 * lit) + "," + Math.round(135 + 70 * lit) + ",0.2)");
        cg.addColorStop(1, "rgba(255,150,110,0)");
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(cx, cy, cr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawRidge(par, baseY, amp, color, rimAmt) {
    var pad = 60, step = 7;
    ctx.beginPath();
    ctx.moveTo(-pad, H + 4);
    for (var x = -pad; x <= W + pad; x += step) {
      var w = (x + distance * par) * 0.0011;
      var h = (fbm1(w) * 0.75 + 0.25) * amp;
      h *= 0.8 + 0.35 * Math.sin(x * 0.0009 + 1.2);
      ctx.lineTo(x, baseY - h);
    }
    ctx.lineTo(W + pad, H + 4);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, baseY - amp * 1.5, 0, horizonY + H * 0.09);
    g.addColorStop(0, color);
    g.addColorStop(0.45, "rgba(50,24,52,0.96)");
    g.addColorStop(1, "rgba(26,14,30,1)");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    var rg = ctx.createLinearGradient(W * 0.4, 0, W, 0);
    rg.addColorStop(0, "rgba(255,140,80,0)");
    rg.addColorStop(1, "rgba(255,160,96," + rimAmt + ")");
    ctx.fillStyle = rg;
    ctx.fillRect(0, baseY - amp * 2, W, amp * 3);
    ctx.restore();
  }

  function drawHills() {
    var baseY = hillBase;
    ctx.beginPath();
    ctx.moveTo(-4, H + 4);
    for (var x = -4; x <= W + 4; x += 5) {
      var w = (x + distance * 0.10) * 0.0022;
      var h = (fbm1(w) * 0.55 + 0.45) * H * 0.058;
      ctx.lineTo(x, baseY - h);
    }
    ctx.lineTo(W + 4, H + 4);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, baseY - H * 0.06, 0, baseY + H * 0.06);
    g.addColorStop(0, "#2e1a2e");
    g.addColorStop(0.5, "#201426");
    g.addColorStop(1, "#1a0e1c");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    var cg = ctx.createLinearGradient(0, baseY - H * 0.062, 0, baseY - H * 0.018);
    cg.addColorStop(0, "rgba(255,130,70,0.24)");
    cg.addColorStop(1, "rgba(255,130,70,0)");
    ctx.fillStyle = cg;
    ctx.fillRect(0, baseY - H * 0.07, W, H * 0.055);
    ctx.restore();
  }

  function drawTown() {
    var par = 0.14, spacing = 28, pad = 40, baseY = horizonY + 2;
    var n = Math.ceil((W + pad * 2) / spacing) + 1;
    for (var i = 0; i < n; i++) {
      var x = wrapX(i * spacing + hash2(i, 16) * 10, par, pad);
      if (x < -20 || x > W + 20) continue;
      var h = 2 + 9 * hash2(i, 17);
      var w = 4 + 11 * hash2(i, 18);
      var lit = hash2(i, 19) > 0.46;
      ctx.fillStyle = "rgba(24,12,26,0.9)";
      ctx.fillRect(x - w * 0.5, baseY - h, w, h + 2);
      if (lit) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var g = ctx.createRadialGradient(x, baseY - h * 0.5, 0, x, baseY - h * 0.5, 10);
        g.addColorStop(0, "rgba(255,196,132,0.5)");
        g.addColorStop(1, "rgba(255,170,110,0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - 10, baseY - h - 8, 20, h + 12);
        ctx.restore();
      }
    }
  }

  function drawTreeline() {
    var par = 0.18, spacing = 16, pad = 32, baseY = horizonY + 2;
    var n = Math.ceil((W + pad * 2) / spacing) + 1;
    for (var i = 0; i < n; i++) {
      var x = wrapX(i * spacing + hash2(i, 20) * 10, par, pad);
      if (x < -10 || x > W + 10) continue;
      var h = H * (0.010 + 0.028 * hash2(i, 21));
      ctx.fillStyle = "rgba(26,14,28,0.92)";
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.lineTo(x - h * 0.26, baseY);
      ctx.lineTo(x - h * 0.12, baseY - h * 0.7);
      ctx.lineTo(x - h * 0.26, baseY - h * 0.7);
      ctx.lineTo(x, baseY - h);
      ctx.lineTo(x + h * 0.26, baseY - h * 0.7);
      ctx.lineTo(x + h * 0.12, baseY - h * 0.7);
      ctx.lineTo(x + h * 0.26, baseY);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawField() {
    var top = hillBase + 4, bot = vergeY + 3;
    var g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, "#221626");
    g.addColorStop(0.55, "#2a1c1e");
    g.addColorStop(1, "#38221c");
    ctx.fillStyle = g;
    ctx.fillRect(0, top, W, bot - top);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, top, W, bot - top);
    ctx.clip();
    for (var i = 0; i < 90; i++) {
      var t = i / 89;
      var y = top + Math.pow(t, 1.5) * (bot - top);
      var len = 28 + 200 * hash2(i, 22);
      var x = wrapX(i * len * 0.88, 0.5 + t * 0.5, 200);
      if (x < -len || x > W + len) continue;
      ctx.fillStyle = (i % 2 ? "rgba(255,190,120,0.05)" : "rgba(0,0,0,0.15)");
      ctx.fillRect(x, y, len, 1 + t * 3);
    }
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var wash = ctx.createLinearGradient(W * 0.38, 0, W, 0);
    wash.addColorStop(0, "rgba(255,130,70,0)");
    wash.addColorStop(1, "rgba(255,150,84,0.12)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, top, W, bot - top);
    ctx.restore();
  }

  function drawPoles() {
    var par = 0.40, spacing = 440, pad = spacing;
    var n = Math.ceil((W + pad * 2) / spacing) + 2;
    var top = hillBase - H * 0.18;
    var xs = [];
    for (var i = 0; i < n; i++) xs.push(wrapX(i * spacing, par, pad));
    // wires
    for (var w = 0; w < xs.length - 1; w++) {
      var x0 = xs[w], x1 = xs[w + 1];
      if (x1 < x0) continue;
      for (var c = 0; c < 3; c++) {
        var y = top + 3 + c * H * 0.012;
        ctx.beginPath();
        ctx.moveTo(x0 - 6, y);
        ctx.quadraticCurveTo((x0 + x1) * 0.5, y + H * 0.026, x1 + 6, y);
        ctx.strokeStyle = "rgba(22,12,22,0.55)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    for (var p = 0; p < xs.length; p++) {
      var px = xs[p];
      if (px < -14 || px > W + 14) continue;
      ctx.fillStyle = "#160e1a";
      ctx.fillRect(px - 1.5, top, 3, H * 0.22);
      ctx.fillRect(px - 12, top + 2, 24, 2.6);
      ctx.fillStyle = "rgba(255,164,104,0.28)";
      ctx.fillRect(px + 1.5, top, 0.9, H * 0.22);
    }
  }

  function drawTrees() {
    var baseY = vergeY - 2, pad = 340;
    for (var i = 0; i < scenery.trees.length; i++) {
      var o = scenery.trees[i];
      var x = wrapX(o.x, o.par, pad);
      if (x < -260 || x > W + 260) continue;
      drawTree(x, baseY + (o.par - 0.6) * 8, H * 0.155 * o.s, o.seed, o.kind);
    }
  }

  function drawTree(x, baseY, size, seed, kind) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = "#0a060e";
    ctx.beginPath();
    ctx.ellipse(x + size * 0.16, baseY + 1, size * 0.34, size * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    var lean = (hash2(seed, 23) - 0.5) * size * 0.10;
    if (kind === "pine") {
      ctx.fillStyle = "#130a14";
      ctx.fillRect(x - size * 0.03, baseY - size * 0.55, size * 0.06, size * 0.55);
      for (var i = 0; i < 5; i++) {
        var t = i / 4;
        var y = baseY - size * (0.3 + 0.62 * t);
        var w = size * (0.34 - 0.26 * t);
        ctx.beginPath();
        ctx.moveTo(x + lean * t, y - size * 0.22);
        ctx.lineTo(x - w, y + size * 0.06);
        ctx.lineTo(x + w, y + size * 0.06);
        ctx.closePath();
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = "#130a14";
      ctx.lineCap = "round";
      ctx.lineWidth = size * 0.062;
      ctx.beginPath();
      ctx.moveTo(x, baseY);
      ctx.quadraticCurveTo(x + lean * 0.35, baseY - size * 0.4, x + lean, baseY - size * 0.66);
      ctx.stroke();
      ctx.lineWidth = size * 0.038;
      for (var b = 0; b < 3; b++) {
        var tb = 0.42 + b * 0.15;
        var bx = lerp(x, x + lean, tb), by = baseY - size * 0.66 * tb;
        var dir = b % 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + dir * size * 0.11, by - size * 0.05, bx + dir * size * 0.18, by - size * 0.12);
        ctx.stroke();
      }
      var cy = baseY - size * 0.80;
      for (var k = 0; k < 8; k++) {
        var a = (k / 8) * Math.PI * 2 + hash2(seed, k) * 1.2;
        var rr = size * (0.11 + 0.075 * hash2(seed, k + 7));
        var bx2 = x + lean + Math.cos(a) * size * 0.20 * (0.55 + 0.7 * hash2(seed, k + 3));
        var by2 = cy + Math.sin(a) * size * 0.155;
        ctx.fillStyle = "rgba(24,13,25,0.96)";
        ctx.beginPath();
        ctx.arc(bx2, by2, rr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var cy2 = baseY - size * 0.80;
    for (var m = 0; m < 3; m++) {
      var a2 = -0.55 + m * 0.30;
      var rx = x + lean + Math.cos(a2) * size * 0.20;
      var ry = cy2 + Math.sin(a2) * size * 0.17;
      var rr2 = size * 0.115;
      var g = ctx.createRadialGradient(rx, ry, rr2 * 0.25, rx, ry, rr2);
      g.addColorStop(0, "rgba(255,142,76,0.16)");
      g.addColorStop(1, "rgba(255,100,70,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(rx, ry, rr2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGuardrail() {
    var par = 0.86, spacing = 96, pad = 120;
    var y = vergeY + 6, h = H * 0.030;
    var n = Math.ceil((W + pad * 2) / spacing) + 2;
    var xs = [];
    for (var i = 0; i < n; i++) xs.push(wrapX(i * spacing, par, pad));
    ctx.beginPath();
    for (var i2 = 0; i2 < xs.length; i2++) {
      if (i2 === 0) ctx.moveTo(xs[i2], y); else ctx.lineTo(xs[i2], y);
    }
    ctx.lineWidth = Math.max(2, h * 0.20);
    var railGrad = ctx.createLinearGradient(0, y - h * 0.6, 0, y + h * 0.5);
    railGrad.addColorStop(0, "rgba(226,220,210,0.55)");
    railGrad.addColorStop(0.5, "rgba(150,140,132,0.45)");
    railGrad.addColorStop(1, "rgba(60,40,50,0.5)");
    ctx.strokeStyle = railGrad;
    ctx.stroke();
    for (var p = 0; p < xs.length; p++) {
      if (xs[p] < -10 || xs[p] > W + 10) continue;
      ctx.fillStyle = "rgba(28,16,26,0.9)";
      ctx.fillRect(xs[p] - 1.6, y, 3.2, h + 2);
      ctx.fillStyle = "rgba(255,190,140,0.16)";
      ctx.fillRect(xs[p] + 1.4, y, 0.8, h + 2);
    }
  }

  function drawTufts() {
    var baseY = vergeY + 4, pad = 40;
    for (var i = 0; i < scenery.tufts.length; i++) {
      var o = scenery.tufts[i];
      var x = wrapX(o.x, o.par, pad);
      if (x < -30 || x > W + 30) continue;
      var h = H * 0.020 * o.s, w = h * 0.9;
      ctx.strokeStyle = "rgba(22,13,22,0.85)";
      ctx.lineWidth = Math.max(0.8, h * 0.09);
      ctx.lineCap = "round";
      for (var b = 0; b < 4; b++) {
        var a = (b / 3 - 0.5) * 1.5 + (hash2(o.seed, b) - 0.5) * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.quadraticCurveTo(x + Math.sin(a) * w * 0.5, baseY - h * 0.6, x + Math.sin(a) * w, baseY - h);
        ctx.stroke();
      }
    }
  }

  // ---------- road ----------
  function shear(y) { return (y - (roadTop + roadBot) * 0.5) * -0.13; }

  function drawRoad() {
    var sh = ctx.createLinearGradient(0, vergeY, 0, roadTop + 3);
    sh.addColorStop(0, "#3b2419");
    sh.addColorStop(1, "#4a2c1c");
    ctx.fillStyle = sh;
    ctx.fillRect(0, vergeY, W, roadTop - vergeY + 3);

    var h = roadBot - roadTop;
    var g = ctx.createLinearGradient(0, roadTop, 0, roadBot);
    g.addColorStop(0, "#2e2733");
    g.addColorStop(0.1, "#221d28");
    g.addColorStop(0.45, "#191521");
    g.addColorStop(1, "#0e0b12");
    ctx.fillStyle = g;
    ctx.fillRect(0, roadTop, W, h);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, roadTop, W, h);
    ctx.clip();
    drawAggregate();
    drawMarkings();
    ctx.globalCompositeOperation = "lighter";
    var sheen = ctx.createLinearGradient(W * 0.45, 0, W, 0);
    sheen.addColorStop(0, "rgba(255,130,70,0)");
    sheen.addColorStop(1, "rgba(255,156,88,0.10)");
    ctx.fillStyle = sheen;
    ctx.fillRect(0, roadTop, W, h);
    ctx.globalCompositeOperation = "source-over";
    var edge = ctx.createLinearGradient(0, roadTop, 0, roadTop + h * 0.16);
    edge.addColorStop(0, "rgba(0,0,0,0.55)");
    edge.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = edge;
    ctx.fillRect(0, roadTop, W, h * 0.16);
    ctx.restore();
  }

  function drawAggregate() {
    var bands = 34;
    for (var b = 0; b < bands; b++) {
      var t = b / (bands - 1);
      var y = roadTop + Math.pow(t, 1.55) * (roadBot - roadTop);
      var th = Math.max(1, (roadBot - roadTop) * (Math.pow((b + 1) / (bands - 1), 1.55) - Math.pow(t, 1.55)) * 0.85);
      var par = 0.75 + t * 1.35;
      var sc = 0.5 + t * 2.0;
      var stepX = 9 * sc;
      var count = Math.ceil((W + 60) / stepX) + 1;
      for (var i = 0; i < count; i++) {
        var seed = b * 977 + i * 13;
        var x = wrapX(i * stepX + hash2(seed, 24) * stepX * 0.9, par, 30);
        if (x < -20 || x > W + 20) continue;
        var v = hash2(seed, 25);
        ctx.fillStyle = v > 0.80 ? "rgba(255,225,205,0.030)"
                   : v > 0.46 ? "rgba(0,0,0,0.13)"
                              : "rgba(255,186,146,0.022)";
        var w2 = (1.5 + 7 * hash2(seed, 26)) * sc;
        ctx.fillRect(x, y, w2, Math.max(0.6, th * 0.42));
      }
    }
    for (var s = 0; s < 7; s++) {
      var tt = hash2(s, 27);
      var yy = roadTop + (0.12 + 0.80 * tt) * (roadBot - roadTop);
      var ww = W * (0.2 + 0.5 * hash2(s, 28));
      var xx = wrapX(hash2(s, 29) * (W + 300), 0.9 + tt * 0.8, 150);
      ctx.fillStyle = "rgba(0,0,0,0.14)";
      ctx.fillRect(xx, yy, ww, 1 + tt * 4);
    }
  }

  function drawMarkings() {
    var h = roadBot - roadTop;
    var lines = [
      { f: 0.09, dash: 0, wid: 0.9 },
      { f: 0.80, dash: 1, wid: 1.1 }
    ];
    var period = 340;
    var cycle = period * 0.42;
    for (var li = 0; li < lines.length; li++) {
      var L = lines[li];
      var y = roadTop + L.f * h;
      var thick = Math.max(1.4, h * 0.026 * L.wid);
      var par = 0.9 + L.f * 0.7;
      var alpha = 0.26 + 0.40 * L.f;
      if (!L.dash) {
        ctx.fillStyle = "rgba(246,238,222," + alpha.toFixed(2) + ")";
        ctx.beginPath();
        ctx.moveTo(-30, y);
        ctx.lineTo(W + 30, y);
        ctx.lineTo(W + 30, y + thick);
        ctx.lineTo(-30, y + thick);
        ctx.closePath();
        ctx.fill();
        continue;
      }
      var n = Math.ceil((W + 300) / period) + 2;
      for (var i = 0; i < n; i++) {
        var x = wrapX(i * period, par, 150);
        if (x > W + 30 || x + cycle < -30) continue;
        ctx.fillStyle = "rgba(246,238,222," + alpha.toFixed(2) + ")";
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + cycle, y);
        ctx.lineTo(x + cycle, y + thick);
        ctx.lineTo(x, y + thick);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.5;
    [0.30, 0.40, 0.60, 0.70].forEach(function (f) {
      var y = roadTop + f * h;
      var th = Math.max(1, h * 0.05);
      var g = ctx.createLinearGradient(0, y, 0, y + th);
      g.addColorStop(0, "rgba(255,220,200,0)");
      g.addColorStop(0.5, "rgba(255,220,200,0.045)");
      g.addColorStop(1, "rgba(255,220,200,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20, y);
      ctx.lineTo(W + 20, y);
      ctx.lineTo(W + 20, y + th);
      ctx.lineTo(-20, y + th);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }

  // ---------- car ----------
  function roadProfile(w) {
    var r = Math.sin(w * 0.0125) * 0.55
          + Math.sin(w * 0.0073 + 1.7) * 0.30
          + Math.sin(w * 0.0291 + 0.4) * 0.14;
    var p = w % 1250;
    if (p < 150) {
      var t = p / 150;
      r += Math.sin(t * Math.PI * 2) * 1.0 * (1 - t * 0.3);
    }
    return r;
  }

  function bodyPath(g, S, u) {
    var sill = -0.115 * S;
    g.beginPath();
    g.moveTo(u(-0.5), u(-0.238));
    g.quadraticCurveTo(u(-0.492), u(-0.288), u(-0.452), u(-0.302));
    g.lineTo(u(-0.34), u(-0.318));
    g.quadraticCurveTo(u(-0.205), u(-0.408), u(-0.115), u(-0.452));
    g.lineTo(u(0.115), u(-0.462));
    g.quadraticCurveTo(u(0.205), u(-0.45), u(0.3), u(-0.336));
    g.quadraticCurveTo(u(0.4), u(-0.322), u(0.487), u(-0.3));
    g.quadraticCurveTo(u(0.514), u(-0.28), u(0.506), u(-0.228));
    g.lineTo(u(0.497), u(-0.168));
    g.lineTo(u(0.408), sill);
    g.arc(u(0.31), sill, u(0.098), Math.PI, 0, false);
    g.lineTo(u(-0.212), sill);
    g.arc(u(-0.31), sill, u(0.098), Math.PI, 0, false);
    g.lineTo(u(-0.472), u(-0.118));
    g.closePath();
  }

  function drawCar() {
    var S = carS, R = wheelR, L = carS;
    var x0 = carX;
    var u = function (v) { return v * S; };
    var front = roadProfile(distance) - 0.5;
    var rear = roadProfile(distance - wb) - 0.5;
    var heave = (front + rear) * 0.5 * R * 0.10;
    var pitch = Math.atan2((front - rear) * R * 0.10, wb) * 0.9;
    var roll = Math.sin(distance * 0.0039 + 0.9) * 0.007;
    var ang = distance / R;

    ctx.save();
    // contact shadow
    ctx.save();
    var scx = x0 + wb * 0.08, scy = groundY + R * 0.10;
    var shg = ctx.createRadialGradient(scx, scy, 2, scx, scy, S * 0.60);
    shg.addColorStop(0, "rgba(0,0,0,0.70)");
    shg.addColorStop(0.5, "rgba(0,0,0,0.20)");
    shg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shg;
    ctx.beginPath();
    ctx.ellipse(scx, scy, S * 0.58, S * 0.075, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // headlight pool
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var px = x0 + L * 0.62, py = groundY + R * 0.55;
    var pg = ctx.createRadialGradient(px, py, 0, px, py, S * 0.55);
    pg.addColorStop(0, "rgba(255,214,152,0.10)");
    pg.addColorStop(0.45, "rgba(255,196,128,0.045)");
    pg.addColorStop(1, "rgba(255,180,110,0)");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.ellipse(px, py, S * 0.55, S * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.translate(x0, groundY);
    ctx.rotate(roll);
    ctx.translate(0, heave);
    ctx.rotate(pitch);

    var sill = -0.115 * S, belt = -0.285 * S, roof = -0.462 * S;
    drawWheel(wb * 0.5, -R, R, ang);
    drawWheel(-wb * 0.5, -R, R, ang);

    bodyPath(ctx, S, u);
    var bg = ctx.createLinearGradient(0, roof, 0, u(-0.10));
    bg.addColorStop(0, "#c85a3a");
    bg.addColorStop(0.13, "#b24838");
    bg.addColorStop(0.3, "#8c2e32");
    bg.addColorStop(0.55, "#611d2c");
    bg.addColorStop(0.8, "#39121e");
    bg.addColorStop(1, "#1e0b12");
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.save();
    ctx.clip();
    var sp = ctx.createLinearGradient(0, roof, 0, roof + S * 0.13);
    sp.addColorStop(0, "rgba(255,228,182,0.55)");
    sp.addColorStop(1, "rgba(255,170,120,0)");
    ctx.fillStyle = sp;
    ctx.fillRect(-L, roof - 4, L * 2, S * 0.15);
    ctx.globalCompositeOperation = "lighter";
    var refl = ctx.createLinearGradient(0, belt, 0, sill);
    refl.addColorStop(0, "rgba(255,130,80,0)");
    refl.addColorStop(0.6, "rgba(255,140,86,0.15)");
    refl.addColorStop(1, "rgba(110,46,64,0)");
    ctx.fillStyle = refl;
    ctx.fillRect(-L, belt, L * 2, S * 0.3);
    ctx.globalCompositeOperation = "source-over";
    for (var k = 0; k < 6; k++) {
      var yy = sill - S * (0.015 + 0.022 * k);
      ctx.fillStyle = "rgba(255,200,160,0.028)";
      ctx.fillRect(-L, yy, L * 2, S * 0.008);
    }
    ctx.restore();

    [[0.31, 1], [-0.31, 1]].forEach(function (a) {
      var g = ctx.createRadialGradient(u(a[0]), -R * 0.05, R * 0.45, u(a[0]), -R * 0.05, u(0.125));
      g.addColorStop(0, "rgba(0,0,0,0.5)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(u(a[0]), -R * 0.05, u(0.125), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.strokeStyle = "rgba(255,222,180,0.50)";
    ctx.lineWidth = Math.max(1, S * 0.009);
    ctx.beginPath();
    ctx.moveTo(u(-0.47), u(-0.285));
    ctx.lineTo(u(0.47), u(-0.288));
    ctx.stroke();
    ctx.fillStyle = "rgba(240,232,220,0.16)";
    ctx.fillRect(u(-0.478), u(-0.13), u(0.952), S * 0.008);
    ctx.strokeStyle = "rgba(24,10,16,0.38)";
    ctx.lineWidth = Math.max(0.7, S * 0.0045);
    ctx.beginPath();
    ctx.moveTo(u(-0.17), u(-0.41));
    ctx.lineTo(u(-0.17), u(-0.283));
    ctx.moveTo(u(0.128), u(-0.452));
    ctx.lineTo(u(0.128), u(-0.284));
    ctx.stroke();
    ctx.fillStyle = "rgba(255,214,164,0.45)";
    ctx.fillRect(u(-0.145), u(-0.302), u(0.05), S * 0.01);
    ctx.fillStyle = "#2b131a";
    ctx.beginPath();
    ctx.ellipse(u(0.15), u(-0.3), u(0.019), u(0.012), -0.25, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    bodyPath(ctx, S, u);
    ctx.clip();
    quadGlass(u(-0.318), u(-0.348), u(-0.14), u(-0.44), u(-0.14), u(-0.288), u(-0.318), u(-0.288), S, 0.85);
    quadGlass(u(-0.15), u(-0.448), u(0.108), u(-0.448), u(0.108), u(-0.288), u(-0.15), u(-0.288), S, 1.0);
    quadGlass(u(0.128), u(-0.452), u(0.3), u(-0.34), u(0.3), u(-0.29), u(0.128), u(-0.29), S, 0.82);
    drawDriver(u(0.005), u(-0.286), S, front);
    ctx.restore();

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var hg = ctx.createRadialGradient(u(0.47), u(-0.25), 0, u(0.47), u(-0.25), u(0.075));
    hg.addColorStop(0, "rgba(255,246,220,0.85)");
    hg.addColorStop(0.42, "rgba(255,206,140,0.30)");
    hg.addColorStop(1, "rgba(255,180,110,0)");
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(u(0.47), u(-0.25), u(0.075), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "rgba(255,250,232,0.95)";
    ctx.beginPath();
    ctx.ellipse(u(0.478), u(-0.248), u(0.03), u(0.019), -0.14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,220,170,0.45)";
    ctx.lineWidth = Math.max(0.6, S * 0.0035);
    ctx.stroke();

    ctx.fillStyle = "rgba(26,18,22,0.85)";
    ctx.fillRect(u(0.468), u(-0.215), u(0.036), u(0.042));
    ctx.fillStyle = "rgba(236,230,218,0.34)";
    for (var gi = 0; gi < 4; gi++) ctx.fillRect(u(0.468), u(-0.212) + gi * u(0.011), u(0.036), u(0.004));
    ctx.fillStyle = "rgba(248,240,226,0.30)";
    ctx.fillRect(u(0.412), u(-0.166), u(0.094), u(0.011));

    ctx.fillStyle = "rgba(255,84,72,0.95)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(u(-0.497), u(-0.272), u(0.02), u(0.075), u(0.01));
    else ctx.rect(u(-0.497), u(-0.272), u(0.02), u(0.075));
    ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var tg = ctx.createRadialGradient(u(-0.487), u(-0.234), 0, u(-0.487), u(-0.234), u(0.1));
    tg.addColorStop(0, "rgba(255,60,50,0.35)");
    tg.addColorStop(1, "rgba(255,40,40,0)");
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(u(-0.487), u(-0.234), u(0.1), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "rgba(230,224,208,0.16)";
    ctx.fillRect(u(-0.462), u(-0.202), u(0.066), u(0.024));
    ctx.fillStyle = "rgba(248,240,226,0.22)";
    ctx.fillRect(u(-0.51), u(-0.166), u(0.09), u(0.01));

    ctx.fillStyle = "rgba(196,190,182,0.40)";
    ctx.fillRect(u(-0.512), u(-0.112), u(0.03), u(0.011));
    ctx.restore();

    emitExhaust(front, rear);
  }

  function quadGlass(x0, y0, x1, y1, x2, y2, x3, y3, S, alpha) {
    var minX = Math.min(x0, x1, x2, x3), maxX = Math.max(x0, x1, x2, x3);
    var minY = Math.min(y0, y1, y2, y3), maxY = Math.max(y0, y1, y2, y3);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
    ctx.closePath();
    ctx.clip();
    var g = ctx.createLinearGradient(minX, minY, maxX, maxY);
    g.addColorStop(0, "rgba(64,46,80,0.97)");
    g.addColorStop(0.45, "rgba(26,18,36,0.97)");
    g.addColorStop(1, "rgba(80,48,58,0.95)");
    ctx.fillStyle = g;
    ctx.fillRect(minX - 6, minY - 6, maxX - minX + 12, maxY - minY + 12);
    var span = (maxX - minX) + S * 0.20;
    var shift = -((distance * 0.09) % span);
    ctx.globalCompositeOperation = "lighter";
    var rg = ctx.createLinearGradient(minX + shift, minY, minX + shift + span * 0.8, maxY);
    rg.addColorStop(0, "rgba(255,140,80,0)");
    rg.addColorStop(0.38, "rgba(255,178,118,0.32)");
    rg.addColorStop(0.6, "rgba(255,204,156,0.14)");
    rg.addColorStop(1, "rgba(255,140,80,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(minX - 6, minY - 6, maxX - minX + 12, maxY - minY + 12);
    ctx.restore();
    ctx.strokeStyle = "rgba(255,222,186,0.26)";
    ctx.lineWidth = Math.max(0.6, S * 0.004);
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
    ctx.closePath();
    ctx.stroke();
  }

  function drawDriver(x, floorY, S, bump) {
    var hy = floorY - S * 0.048 + bump * S * 0.006;
    ctx.save();
    ctx.fillStyle = "rgba(10,7,12,0.9)";
    ctx.beginPath();
    ctx.arc(x, hy, S * 0.03, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - S * 0.046, floorY + 2);
    ctx.quadraticCurveTo(x - S * 0.04, hy + S * 0.03, x - S * 0.008, hy + S * 0.026);
    ctx.lineTo(x + S * 0.028, hy + S * 0.029);
    ctx.quadraticCurveTo(x + S * 0.05, hy + S * 0.052, x + S * 0.05, floorY + 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(10,7,12,0.92)";
    ctx.lineWidth = S * 0.013;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + S * 0.02, hy + S * 0.043);
    ctx.lineTo(x + S * 0.07, hy + S * 0.046);
    ctx.stroke();
    ctx.restore();
  }

  function drawWheel(cx, cy, R, ang) {
    ctx.save();
    ctx.translate(cx, cy);
    var tg = ctx.createRadialGradient(-R * 0.32, -R * 0.36, R * 0.08, 0, 0, R);
    tg.addColorStop(0, "#3d3640");
    tg.addColorStop(0.55, "#231e28");
    tg.addColorStop(1, "#0e0b11");
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.rotate(ang);
    var blocks = 24;
    for (var i = 0; i < blocks; i++) {
      ctx.save();
      ctx.rotate((i / blocks) * Math.PI * 2);
      ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.30)";
      ctx.fillRect(R * 0.79, -R * 0.11, R * 0.23, R * 0.22);
      ctx.restore();
    }
    ctx.strokeStyle = "rgba(255,222,190,0.10)";
    ctx.lineWidth = R * 0.045;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.70, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "rgba(70,62,66,0.55)";
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.50, 0, Math.PI * 2);
    ctx.fill();
    var rg = ctx.createRadialGradient(-R * 0.16, -R * 0.20, 0, 0, 0, R * 0.62);
    rg.addColorStop(0, "#f6f0e4");
    rg.addColorStop(0.5, "#b9afa1");
    rg.addColorStop(1, "#655c51");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.60, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.rotate(ang);
    for (var s = 0; s < 5; s++) {
      ctx.save();
      ctx.rotate((s / 5) * Math.PI * 2);
      var sg = ctx.createLinearGradient(0, 0, 0, -R * 0.58);
      sg.addColorStop(0, "rgba(78,72,66,1)");
      sg.addColorStop(0.45, "rgba(232,226,214,1)");
      sg.addColorStop(1, "rgba(150,142,132,1)");
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(-R * 0.1, 0);
      ctx.lineTo(-R * 0.055, -R * 0.56);
      ctx.lineTo(R * 0.055, -R * 0.56);
      ctx.lineTo(R * 0.1, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    var hg = ctx.createRadialGradient(-R * 0.06, -R * 0.08, 0, 0, 0, R * 0.20);
    hg.addColorStop(0, "#fff8ea");
    hg.addColorStop(1, "#7d7264");
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.185, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = "#fff2dc";
    ctx.lineWidth = R * 0.13;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.45, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, R * 0.90, R * 0.70, R * 0.13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }

  var puffs = [], lastEmit = 0;
  function emitExhaust(front, rear) {
    var idx = Math.floor(distance / 34);
    while (lastEmit < idx) {
      lastEmit++;
      var prof = roadProfile(lastEmit * 34);
      if (Math.random() > 0.52) continue;
      var big = Math.random() < 0.25 + Math.max(0, prof) * 0.3;
      puffs.push({
        x: carX - wb - wheelR * 0.05,
        y: groundY - wheelR * 0.12,
        vx: -(28 + Math.random() * 55) - (big ? 40 : 0),
        vy: -(4 + Math.random() * (big ? 16 : 7)),
        r: wheelR * (big ? 0.26 : 0.13) * (0.7 + Math.random() * 0.6),
        life: 1,
        decay: big ? 0.85 : 1.5
      });
    }
    for (var i = puffs.length - 1; i >= 0; i--) {
      var p = puffs[i];
      p.x += p.vx / 60;
      p.y += p.vy / 60;
      p.r *= 1.022;
      p.life -= p.decay / 60;
      if (p.life <= 0) { puffs.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life) * 0.20;
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, "rgba(196,182,196,0.9)");
      g.addColorStop(1, "rgba(150,138,158,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (puffs.length > 160) puffs.splice(0, puffs.length - 160);
  }

  function drawForeground() {
    var baseY = roadBot + (H - roadBot) * 0.34;
    for (var i = 0; i < scenery.refl.length; i++) {
      var o = scenery.refl[i];
      var x = wrapX(o.x, o.par, 200);
      if (x < -20 || x > W + 20) continue;
      var h = H * 0.048;
      ctx.save();
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = "#100a12";
      ctx.fillRect(x - 2, baseY - h, 4, h);
      ctx.fillStyle = "rgba(255,120,80,0.6)";
      ctx.fillRect(x - 3, baseY - h * 0.80, 6, h * 0.09);
      ctx.restore();
    }
    var g = ctx.createLinearGradient(0, H - (H - roadBot) * 0.7, 0, H);
    g.addColorStop(0, "rgba(14,9,16,0)");
    g.addColorStop(1, "rgba(12,8,14,0.80)");
    ctx.fillStyle = g;
    ctx.fillRect(0, H - (H - roadBot) * 0.7, W, (H - roadBot) * 0.7 + 2);
    for (var k = 0; k < 40; k++) {
      var x2 = wrapX(k * 150 + hash2(k, 30) * 110, 1.85, 150);
      if (x2 < -60 || x2 > W + 60) continue;
      var hh = H * (0.026 + 0.030 * hash2(k, 31));
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = "rgba(10,7,12,0.9)";
      ctx.lineWidth = Math.max(1.2, hh * 0.09);
      ctx.lineCap = "round";
      for (var b = 0; b < 5; b++) {
        var a = (b / 4 - 0.5) * 1.35 + (hash2(k, b) - 0.5) * 0.6;
        ctx.beginPath();
        ctx.moveTo(x2, H + 4);
        ctx.quadraticCurveTo(x2 + Math.sin(a) * hh * 0.5, H - hh * 0.6, x2 + Math.sin(a) * hh * 1.1, H - hh);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  var vig = null;
  function drawVignette() {
    if (!vig) {
      vig = document.createElement("canvas");
      vig.width = cvs.width; vig.height = cvs.height;
      var g = vig.getContext("2d");
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      var rg = g.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.34, W * 0.5, H * 0.52, Math.max(W, H) * 0.8);
      rg.addColorStop(0, "rgba(0,0,0,0)");
      rg.addColorStop(0.65, "rgba(10,5,14,0.14)");
      rg.addColorStop(1, "rgba(8,4,12,0.52)");
      g.fillStyle = rg;
      g.fillRect(0, 0, W, H);
    }
    ctx.drawImage(vig, 0, 0, W, H);
  }

  function render() {
    ctx.drawImage(sky, 0, 0, W, H);
    drawClouds();
    drawRidge(0.045, horizonY + H * 0.055, H * 0.13, "#7b3a58", 0.45);
    drawRidge(0.075, horizonY + H * 0.09, H * 0.10, "#4c2347", 0.3);
    drawHills();
    drawTown();
    drawTreeline();
    drawField();
    drawPoles();
    drawTrees();
    drawGuardrail();
    drawTufts();
    drawRoad();
    drawCar();
    drawForeground();
    drawVignette();
  }

  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) distance += SPEED * dt;
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) last = 0; });
  window.addEventListener("keydown", function (e) { if (e.key === " ") paused = !paused; });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
