<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour Run — Parallax Drive</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #07091a;
  }
  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ffd9a0;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fallback">This scene needs a browser with HTML canvas support.</div>
<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------
  // Golden Hour Run
  // A side-view car driving through a dusk landscape.
  // Vanilla canvas 2D, no libraries.
  // ------------------------------------------------------------------

  const TAU = Math.PI * 2;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) {
    document.getElementById('fallback').style.display = 'flex';
    return;
  }

  // --- deterministic noise -------------------------------------------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // --- viewport ------------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  let horizon = 0, roadTop = 0, vergeTop = 0, contactY = 0, carScale = 1, carX = 0;

  const layers = [];
  let skyGrad = null;
  let grainTile = null;

  function layout() {
    horizon = Math.round(H * 0.50);
    vergeTop = Math.round(H * 0.655);
    roadTop = Math.round(H * 0.735);
    contactY = Math.round(H * 0.885);
    carScale = Math.max(0.42, Math.min(W / 820, H / 560));
    carX = Math.round(W * 0.30);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1, Math.round(W * DPR));
    canvas.height = Math.max(1, Math.round(H * DPR));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
    buildSky();
    buildTiles();
  }

  // ------------------------------------------------------------------
  // Sky
  // ------------------------------------------------------------------
  function buildSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizon + H * 0.06);
    g.addColorStop(0.00, '#070b22');
    g.addColorStop(0.18, '#131a44');
    g.addColorStop(0.38, '#2b2559');
    g.addColorStop(0.55, '#4d2a63');
    g.addColorStop(0.70, '#843a5e');
    g.addColorStop(0.82, '#bd5548');
    g.addColorStop(0.91, '#e5813f');
    g.addColorStop(0.97, '#f6ad55');
    g.addColorStop(1.00, '#ffd08c');
    skyGrad = g;
  }

  function drawSun() {
    const sx = W * 0.735;
    const sy = horizon - H * 0.118;
    const r = Math.max(14, H * 0.034);

    // broad atmospheric glow
    const glow = ctx.createRadialGradient(sx, sy, r * 0.4, sx, sy, r * 11);
    glow.addColorStop(0.00, 'rgba(255, 214, 150, 0.55)');
    glow.addColorStop(0.18, 'rgba(255, 168, 92, 0.24)');
    glow.addColorStop(0.48, 'rgba(214, 96, 60, 0.10)');
    glow.addColorStop(1.00, 'rgba(120, 50, 60, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // warm band hugging the horizon
    const band = ctx.createLinearGradient(0, horizon - H * 0.14, 0, horizon);
    band.addColorStop(0, 'rgba(255, 150, 70, 0)');
    band.addColorStop(0.65, 'rgba(255, 158, 76, 0.16)');
    band.addColorStop(1, 'rgba(255, 190, 110, 0.30)');
    ctx.fillStyle = band;
    ctx.fillRect(0, horizon - H * 0.14, W, H * 0.14 + 2);

    // the disc itself
    const disc = ctx.createRadialGradient(sx, sy - r * 0.2, r * 0.1, sx, sy, r);
    disc.addColorStop(0, '#fffaf0');
    disc.addColorStop(0.45, '#ffe3a8');
    disc.addColorStop(0.8, '#ffb469');
    disc.addColorStop(1, '#ff8f4e');
    ctx.fillStyle = disc;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, TAU);
    ctx.fill();
    return { x: sx, y: sy, r: r };
  }

  // ------------------------------------------------------------------
  // Tile helpers — every layer is drawn into an offscreen tile that is
  // then repeated with a modulo offset, so the scroll wraps seamlessly.
  // ------------------------------------------------------------------
  function makeTile(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * DPR));
    c.height = Math.max(1, Math.round(h * DPR));
    const t = c.getContext('2d');
    t.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(t, w, h);
    return { canvas: c, w: w, h: h };
  }

  function blit(tile, y, offset) {
    let x = -(((offset % tile.w) + tile.w) % tile.w);
    while (x > 0) x -= tile.w;
    for (; x < W; x += tile.w) {
      ctx.drawImage(tile.canvas, x, y, tile.w, tile.h);
    }
  }

  // A ridge built only from integer harmonics of the tile width, so the
  // silhouette repeats perfectly with no seam.
  function ridgePath(g, w, baseY, harmonics) {
    g.beginPath();
    g.moveTo(0, baseY);
    for (let x = 0; x <= w; x += 4) {
      let y = baseY;
      for (let i = 0; i < harmonics.length; i++) {
        const h = harmonics[i];
        y -= h.amp * Math.sin((x / w) * TAU * h.n + h.phase);
      }
      g.lineTo(x, y);
    }
    g.lineTo(w, baseY);
    g.closePath();
  }

  function buildTiles() {
    layers.length = 0;

    // Every layer owns an explicit screen band [top, base]. Its tile is
    // exactly that tall and the scenery inside it is anchored to the tile
    // floor, so each depth plane meets the ground where it should.
    function push(o) {
      const h = Math.max(8, o.base - o.top);
      layers.push({ speed: o.speed, y: o.top, tile: makeTile(o.tileW, h, o.draw) });
    }

    // --- clouds ------------------------------------------------------
    push({
      speed: 5, top: Math.round(H * 0.08), base: Math.round(H * 0.46), tileW: 1500,
      draw: (t, w, h) => {
        const rnd = mulberry32(9182);
        for (let i = 0; i < 26; i++) {
          const cx = rnd() * w;
          const cy = h * (0.05 + rnd() * 0.95);
          const len = 220 + rnd() * 520;
          const thick = 2.5 + rnd() * 6;
          const warm = Math.pow(cy / h, 1.6);
          const grd = t.createLinearGradient(0, cy - thick, 0, cy + thick);
          grd.addColorStop(0, `rgba(${60 + warm * 40 | 0}, ${50 + warm * 30 | 0}, ${80 + warm * 20 | 0}, 0.10)`);
          grd.addColorStop(0.6, `rgba(${120 + warm * 110 | 0}, ${80 + warm * 60 | 0}, ${90 + warm * 20 | 0}, 0.16)`);
          grd.addColorStop(1, `rgba(255, ${150 + warm * 70 | 0}, ${90 + warm * 40 | 0}, ${0.10 + warm * 0.26})`);
          t.fillStyle = grd;
          t.beginPath();
          t.ellipse(cx, cy, len * 0.5, thick, 0, 0, TAU);
          t.fill();
          t.beginPath();
          t.ellipse(cx - len * 0.22, cy - thick * 0.4, len * 0.26, thick * 0.7, 0, 0, TAU);
          t.fill();
        }
      }
    });

    // --- far mountain range -------------------------------------------
    push({
      speed: 3.2, top: Math.round(horizon - H * 0.145), base: horizon + 4, tileW: 1800,
      draw: (t, w, h) => {
        const rnd = mulberry32(4417);
        const harm = [];
        for (let i = 0; i < 5; i++) {
          harm.push({ n: 1 + i * 2, amp: h * (0.46 - i * 0.06) * (0.7 + rnd() * 0.6), phase: rnd() * TAU });
        }
        ridgePath(t, w, h, harm);
        const g = t.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#6b4a72');
        g.addColorStop(0.55, '#4d3359');
        g.addColorStop(1, '#3a2745');
        t.fillStyle = g;
        t.fill();
        t.save();
        t.clip();
        t.globalCompositeOperation = 'lighter';
        const rim = t.createLinearGradient(w * 0.5, 0, w, 0);
        rim.addColorStop(0, 'rgba(255, 150, 90, 0)');
        rim.addColorStop(1, 'rgba(255, 168, 100, 0.34)');
        t.fillStyle = rim;
        t.fillRect(0, 0, w, h);
        t.restore();
      }
    });

    // --- near mountain range ------------------------------------------
    push({
      speed: 7.5, top: Math.round(horizon - H * 0.088), base: horizon + 8, tileW: 1300,
      draw: (t, w, h) => {
        const rnd = mulberry32(2286);
        const harm = [];
        for (let i = 0; i < 4; i++) {
          harm.push({ n: 1 + i * 2, amp: h * (0.50 - i * 0.06) * (0.7 + rnd() * 0.6), phase: rnd() * TAU });
        }
        ridgePath(t, w, h, harm);
        const g = t.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#4a2c55');
        g.addColorStop(1, '#2a1b39');
        t.fillStyle = g;
        t.fill();
      }
    });

    // --- far treeline --------------------------------------------------
    push({
      speed: 14, top: Math.round(horizon - H * 0.032), base: horizon + 10, tileW: 1100,
      draw: (t, w, h) => {
        const rnd = mulberry32(7731);
        t.fillStyle = '#241a33';
        for (let x = -6; x < w + 6; x += 3) {
          const th = h * (0.35 + rnd() * 0.62);
          const tw = 4 + rnd() * 5;
          t.beginPath();
          t.moveTo(x, h);
          t.lineTo(x + tw * 0.5, h - th);
          t.lineTo(x + tw, h);
          t.closePath();
          t.fill();
        }
      }
    });

    // --- rolling hills with tree clumps --------------------------------
    push({
      speed: 26, top: Math.round(horizon - H * 0.062), base: horizon + 24, tileW: 1600,
      draw: (t, w, h) => {
        const rnd = mulberry32(5529);
        const harm = [
          { n: 1, amp: h * 0.26, phase: 0.7 },
          { n: 2, amp: h * 0.14, phase: 2.1 },
          { n: 4, amp: h * 0.07, phase: 4.4 }
        ];
        ridgePath(t, w, h, harm);
        const g = t.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#2f2a3f');
        g.addColorStop(1, '#1e1a2b');
        t.fillStyle = g;
        t.fill();
        for (let i = 0; i < 70; i++) {
          const x = rnd() * w;
          const y = h * (0.24 + rnd() * 0.32);
          const th = 8 + rnd() * 18;
          const tw = 3 + rnd() * 6;
          t.fillStyle = `rgba(${18 + rnd() * 10 | 0}, ${16 + rnd() * 8 | 0}, ${28 + rnd() * 10 | 0}, 0.95)`;
          t.beginPath();
          t.moveTo(x, y);
          t.lineTo(x + tw * 0.5, y - th);
          t.lineTo(x + tw, y);
          t.closePath();
          t.fill();
        }
      }
    });

    // --- utility poles with sagging wires --------------------------------
    push({
      speed: 46, top: Math.round(vergeTop - H * 0.30), base: vergeTop - 26, tileW: 960,
      draw: (t, w, h) => {
        const base = h;
        const poleH = h * 0.92;
        const spacing = w / 3;
        const poleW = 4.5;

        const wireYs = [poleH * 0.60, poleH * 0.69, poleH * 0.78];
        for (const wy of wireYs) {
          t.strokeStyle = 'rgba(18, 14, 26, 0.85)';
          t.lineWidth = 1.1;
          t.beginPath();
          for (let i = 0; i < 3; i++) {
            const x0 = i * spacing;
            const x1 = x0 + spacing;
            t.moveTo(x0, wy);
            t.quadraticCurveTo((x0 + x1) / 2, wy + poleH * 0.15, x1, wy);
          }
          t.stroke();
        }

        for (let i = 0; i <= 3; i++) {
          const x = i * spacing;
          const topY = base - poleH;
          const g = t.createLinearGradient(x - poleW, 0, x + poleW, 0);
          g.addColorStop(0, '#241a24');
          g.addColorStop(0.45, '#3c2c30');
          g.addColorStop(1, '#171018');
          t.fillStyle = g;
          t.fillRect(x - poleW / 2, topY, poleW, poleH);
          t.fillStyle = '#241a24';
          t.fillRect(x - 22, topY + poleH * 0.16, 44, 3.2);
          t.fillStyle = '#3c3448';
          for (const dx of [-16, 0, 16]) {
            t.beginPath();
            t.ellipse(x + dx, topY + poleH * 0.145, 2.4, 3.2, 0, 0, TAU);
            t.fill();
          }
          t.fillStyle = 'rgba(255, 165, 105, 0.32)';
          t.fillRect(x + poleW / 2 - 1, topY, 1.2, poleH);
        }
      }
    });

    // --- roadside trees ---------------------------------------------------
    push({
      speed: 78, top: Math.round(vergeTop - H * 0.150), base: vergeTop - 4, tileW: 1400,
      draw: (t, w, h) => {
        const rnd = mulberry32(8123);
        const base = h;
        const count = 7;
        for (let i = 0; i < count; i++) {
          const x = (i + 0.15 + rnd() * 0.7) * (w / count);
          const kind = rnd();
          const th = h * (0.52 + rnd() * 0.42);
          if (kind < 0.34) {
            const tw = th * 0.32;
            t.fillStyle = '#1b1f27';
            for (let k = 0; k < 4; k++) {
              const f = 1 - k * 0.2;
              const y = base - th * (0.16 + k * 0.19);
              t.beginPath();
              t.moveTo(x - tw * f, y);
              t.lineTo(x, y - th * 0.32 * f);
              t.lineTo(x + tw * f, y);
              t.closePath();
              t.fill();
            }
            t.fillStyle = '#15181f';
            t.fillRect(x - 2, base - th * 0.2, 4, th * 0.2);
          } else if (kind < 0.68) {
            const tw = th * 0.40;
            t.fillStyle = '#3a2a24';
            t.fillRect(x - 3, base - th * 0.52, 6, th * 0.52);
            const cy = base - th * 0.70;
            for (let b = 0; b < 9; b++) {
              const a = (b / 9) * TAU;
              t.fillStyle = b % 3 === 0 ? '#232c2c' : (b % 3 === 1 ? '#2b3530' : '#1e2629');
              t.beginPath();
              t.ellipse(x + Math.cos(a) * tw * 0.42, cy + Math.sin(a) * tw * 0.3, tw * 0.48, tw * 0.38, a, 0, TAU);
              t.fill();
            }
            t.strokeStyle = 'rgba(255, 178, 112, 0.34)';
            t.lineWidth = 2.2;
            t.beginPath();
            t.ellipse(x + tw * 0.26, cy - tw * 0.22, tw * 0.34, tw * 0.26, -0.5, -2.5, 0.35);
            t.stroke();
          } else {
            const tw = th * 0.20;
            t.fillStyle = '#332722';
            t.fillRect(x - 2.2, base - th * 0.38, 4.4, th * 0.38);
            t.fillStyle = '#25302b';
            t.beginPath();
            t.ellipse(x, base - th * 0.62, tw, th * 0.34, 0, 0, TAU);
            t.fill();
            t.strokeStyle = 'rgba(255, 172, 104, 0.32)';
            t.lineWidth = 2;
            t.beginPath();
            t.ellipse(x + tw * 0.30, base - th * 0.62, tw * 0.90, th * 0.30, -0.4, -2.3, 0.4);
            t.stroke();
          }
        }
      }
    });

    // --- guardrail, bushes and a road sign ---------------------------------
    push({
      speed: 112, top: Math.round(vergeTop - H * 0.055), base: vergeTop + 18, tileW: 820,
      draw: (t, w, h) => {
        const rnd = mulberry32(3345);
        const railY = h * 0.70;
        for (let i = 0; i < 26; i++) {
          const x = rnd() * w;
          const y = railY + 4 + rnd() * 8;
          const r = 7 + rnd() * 15;
          t.fillStyle = `rgba(${26 + rnd() * 12 | 0}, ${38 + rnd() * 14 | 0}, ${30 + rnd() * 12 | 0}, 0.95)`;
          t.beginPath();
          t.ellipse(x, y, r, r * 0.72, 0, 0, TAU);
          t.fill();
        }
        for (let x = 10; x < w; x += 96) {
          t.fillStyle = '#2b2730';
          t.fillRect(x, railY, 4, h - railY);
        }
        const beam = t.createLinearGradient(0, railY - 9, 0, railY + 9);
        beam.addColorStop(0, '#6f6b78');
        beam.addColorStop(0.4, '#a49daa');
        beam.addColorStop(0.65, '#57525f');
        beam.addColorStop(1, '#2e2b36');
        t.fillStyle = beam;
        t.fillRect(0, railY - 8, w, 17);
        t.fillStyle = 'rgba(255, 170, 110, 0.26)';
        t.fillRect(0, railY - 8, w, 2.2);
        t.fillStyle = 'rgba(20, 18, 26, 0.35)';
        t.fillRect(0, railY + 3, w, 1.8);
        const sx = w * 0.62;
        t.fillStyle = '#3a3644';
        t.fillRect(sx - 1.8, railY - 30, 3.6, 32);
        t.fillStyle = '#e9e4e8';
        t.beginPath();
        t.roundRect(sx - 13, railY - 52, 26, 26, 5);
        t.fill();
        t.fillStyle = '#1e1b24';
        t.fillRect(sx - 8, railY - 42, 16, 3.4);
        t.fillRect(sx - 3.4, railY - 46, 6.8, 11);
      }
    });

    // --- grass verge ---------------------------------------------------------
    push({
      speed: 165, top: vergeTop, base: roadTop, tileW: 700,
      draw: (t, w, h) => {
        const rnd = mulberry32(6677);
        const g = t.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#1d2a24');
        g.addColorStop(1, '#121c1c');
        t.fillStyle = g;
        t.fillRect(0, 0, w, h);
        for (let i = 0; i < 340; i++) {
          const x = rnd() * w;
          const y = h * (0.15 + rnd() * 0.9);
          const len = 4 + rnd() * 16;
          const sway = (rnd() - 0.5) * 6;
          t.strokeStyle = `rgba(${38 + rnd() * 26 | 0}, ${58 + rnd() * 34 | 0}, ${40 + rnd() * 22 | 0}, ${0.45 + rnd() * 0.5})`;
          t.lineWidth = 0.9 + rnd() * 1.1;
          for (const ox of [-w, 0, w]) {
            t.beginPath();
            t.moveTo(x + ox, y);
            t.quadraticCurveTo(x + ox + sway * 0.5, y - len * 0.6, x + ox + sway, y - len);
            t.stroke();
          }
        }
        for (let i = 0; i < 60; i++) {
          const x = rnd() * w;
          const y = h * (0.2 + rnd() * 0.8);
          t.fillStyle = `rgba(255, 170, 100, ${0.10 + rnd() * 0.16})`;
          t.fillRect(x, y, 1.4, 1.4);
        }
      }
    });

    // --- asphalt ---------------------------------------------------------------
    push({
      speed: 240, top: roadTop, base: H, tileW: 560,
      draw: (t, w, h) => {
        const rnd = mulberry32(1213);
        const g = t.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#3a3740');
        g.addColorStop(0.35, '#2c2a33');
        g.addColorStop(1, '#1d1c24');
        t.fillStyle = g;
        t.fillRect(0, 0, w, h);
        for (let i = 0; i < 5200; i++) {
          const x = rnd() * w;
          const y = rnd() * h;
          const v = rnd();
          const col = v > 0.72
            ? `rgba(190, 182, 190, ${0.05 + rnd() * 0.10})`
            : `rgba(12, 10, 16, ${0.10 + rnd() * 0.22})`;
          const sz = 1 + (rnd() > 0.85 ? 1 : 0);
          // wrapped so the tile has no visible seam
          ctx.fillStyle = col;
          ctx.fillRect(x, y, sz, 1);
          ctx.fillRect(x - w, y, sz, 1);
          ctx.fillRect(x + w, y, sz, 1);
        }
        t.strokeStyle = 'rgba(14, 12, 18, 0.55)';
        t.lineWidth = 2.2;
        for (let i = 0; i < 3; i++) {
          const y = h * (0.18 + rnd() * 0.7);
          t.beginPath();
          t.moveTo(0, y);
          for (let x = 0; x <= w; x += 26) {
            t.lineTo(x, y + Math.sin(x * TAU * 3 / w + i) * 2.4);
          }
          t.stroke();
        }
        const warm = t.createLinearGradient(0, 0, 0, h);
        warm.addColorStop(0, 'rgba(255, 168, 108, 0.15)');
        warm.addColorStop(0.45, 'rgba(255, 160, 100, 0.04)');
        warm.addColorStop(1, 'rgba(255, 150, 95, 0)');
        t.fillStyle = warm;
        t.fillRect(0, 0, w, h);
      }
    });

    // --- out-of-focus foreground grass ------------------------------------------
    push({
      speed: 430, top: Math.round(H * 0.952), base: H + 8, tileW: 520,
      draw: (t, w, h) => {
        const rnd = mulberry32(9042);
        for (let i = 0; i < 120; i++) {
          const x = rnd() * w;
          const len = h * (0.45 + rnd() * 0.75);
          const sway = (rnd() - 0.5) * 22;
          const shade = 18 + rnd() * 26;
          t.strokeStyle = `rgba(${shade | 0}, ${(shade * 1.6) | 0}, ${(shade * 1.25) | 0}, ${0.55 + rnd() * 0.4})`;
          t.lineWidth = 2 + rnd() * 3.5;
          t.beginPath();
          t.moveTo(x, h);
          t.quadraticCurveTo(x + sway * 0.4, h - len * 0.55, x + sway, h - len);
          t.stroke();
        }
      }
    });

    // film grain tile
    grainTile = makeTile(160, 160, (t, w, h) => {
      const img = t.createImageData(w, h);
      const rnd = mulberry32(5150);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 128 + (rnd() - 0.5) * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      t.putImageData(img, 0, 0);
    });
  }

  // ------------------------------------------------------------------
  // Road geometry helpers
  // ------------------------------------------------------------------
  // A smooth, endless road profile the car rides on.
  function roadProfile(d) {
    return (
      3.10 * Math.sin(d * 0.0032) +
      1.55 * Math.sin(d * 0.0107 + 1.17) +
      0.85 * Math.sin(d * 0.0263 + 2.41) +
      0.40 * Math.sin(d * 0.0611 + 0.33)
    );
  }

  // ------------------------------------------------------------------
  // The car
  // ------------------------------------------------------------------
  const REAR_AXLE = -72;
  const FRONT_AXLE = 74;
  const WHEEL_R = 26;

  function drawWheel(cx, cy, r, angle) {
    const c = ctx;
    c.save();
    c.translate(cx, cy);

    // tyre carcass
    const tg = c.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.15, 0, 0, r * 1.05);
    tg.addColorStop(0, '#34333a');
    tg.addColorStop(0.55, '#1a1a1f');
    tg.addColorStop(0.88, '#101014');
    tg.addColorStop(1, '#08080b');
    c.fillStyle = tg;
    c.beginPath();
    c.arc(0, 0, r, 0, TAU);
    c.fill();

    // tread
    c.save();
    c.rotate(angle);
    c.strokeStyle = 'rgba(60, 58, 66, 0.35)';
    c.lineWidth = 1.2;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * TAU;
      c.beginPath();
      c.moveTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82);
      c.lineTo(Math.cos(a) * r * 0.99, Math.sin(a) * r * 0.99);
      c.stroke();
    }
    c.restore();

    // sidewall highlight
    c.strokeStyle = 'rgba(255, 178, 118, 0.22)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.arc(0, 0, r - 1.4, -2.5, 0.4);
    c.stroke();

    // brake disc
    c.fillStyle = '#2a2a31';
    c.beginPath();
    c.arc(0, 0, r * 0.52, 0, TAU);
    c.fill();

    // rim
    const rg = c.createLinearGradient(-r * 0.6, -r * 0.6, r * 0.6, r * 0.6);
    rg.addColorStop(0, '#e7e2ea');
    rg.addColorStop(0.42, '#a29cad');
    rg.addColorStop(0.6, '#6f6a79');
    rg.addColorStop(1, '#cfc8d4');
    c.fillStyle = rg;
    c.beginPath();
    c.arc(0, 0, r * 0.60, 0, TAU);
    c.fill();

    // spokes
    c.save();
    c.rotate(angle);
    for (let i = 0; i < 5; i++) {
      c.save();
      c.rotate((i / 5) * TAU);
      const g2 = c.createLinearGradient(0, 0, r * 0.6, 0);
      g2.addColorStop(0, '#8e8898');
      g2.addColorStop(0.5, '#e9e4ee');
      g2.addColorStop(1, '#7c7686');
      c.fillStyle = g2;
      c.beginPath();
      c.moveTo(r * 0.16, -r * 0.085);
      c.lineTo(r * 0.58, -r * 0.045);
      c.lineTo(r * 0.58, r * 0.045);
      c.lineTo(r * 0.16, r * 0.085);
      c.closePath();
      c.fill();
      c.restore();
    }
    // hub
    const hg = c.createRadialGradient(-r * 0.04, -r * 0.05, 1, 0, 0, r * 0.19);
    hg.addColorStop(0, '#f6f2f8');
    hg.addColorStop(1, '#8d8797');
    c.fillStyle = hg;
    c.beginPath();
    c.arc(0, 0, r * 0.185, 0, TAU);
    c.fill();
    c.fillStyle = '#3b3742';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU + 0.3;
      c.beginPath();
      c.arc(Math.cos(a) * r * 0.125, Math.sin(a) * r * 0.125, r * 0.022, 0, TAU);
      c.fill();
    }
    c.restore();
    c.restore();
  }

  function bodyPath(c) {
    c.beginPath();
    c.moveTo(-134, -20);
    c.lineTo(-137, -34);
    c.quadraticCurveTo(-138, -45, -124, -49);
    c.lineTo(-84, -52);
    c.quadraticCurveTo(-52, -56, -30, -64);
    c.quadraticCurveTo(-8, -73, 10, -75);
    c.lineTo(28, -75);
    c.quadraticCurveTo(52, -74, 66, -55);
    c.lineTo(102, -51);
    c.quadraticCurveTo(126, -49, 131, -39);
    c.lineTo(135, -29);
    c.lineTo(133, -21);
    c.lineTo(116, -18);
    c.lineTo(104, -17);
    const a1 = Math.atan2(5, 30);
    const a2 = Math.atan2(5, -30);
    c.arc(FRONT_AXLE, -22, 30, a1, a2, true);
    c.lineTo(-42.6, -17);
    c.arc(REAR_AXLE, -22, 30, Math.atan2(5, 29.4), Math.atan2(5, -29.4), true);
    c.lineTo(-120, -18);
    c.closePath();
  }

  function drawCar(cx, cy, s, pitch, wheelAngle, rearDy, frontDy) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(pitch);
    ctx.scale(s, s);

    // ---- wheels (behind the body) ----
    drawWheel(REAR_AXLE, -WHEEL_R + rearDy / s, WHEEL_R, wheelAngle);
    drawWheel(FRONT_AXLE, -WHEEL_R + frontDy / s, WHEEL_R, wheelAngle);

    // ---- body ----
    ctx.save();
    bodyPath(ctx);
    const bg = ctx.createLinearGradient(0, -78, 0, -14);
    bg.addColorStop(0, '#d8483a');
    bg.addColorStop(0.22, '#c33c33');
    bg.addColorStop(0.58, '#8e2a2b');
    bg.addColorStop(0.85, '#4c1b23');
    bg.addColorStop(1, '#2a1219');
    ctx.fillStyle = bg;
    ctx.fill();

    // sun side wash
    ctx.save();
    ctx.clip();
    const wash = ctx.createLinearGradient(-60, 0, 140, -20);
    wash.addColorStop(0, 'rgba(255, 150, 80, 0)');
    wash.addColorStop(0.75, 'rgba(255, 158, 92, 0.20)');
    wash.addColorStop(1, 'rgba(255, 196, 130, 0.38)');
    ctx.fillStyle = wash;
    ctx.fillRect(-140, -80, 280, 70);
    // lower shadow
    const low = ctx.createLinearGradient(0, -44, 0, -14);
    low.addColorStop(0, 'rgba(18, 6, 12, 0)');
    low.addColorStop(1, 'rgba(18, 6, 12, 0.55)');
    ctx.fillStyle = low;
    ctx.fillRect(-140, -44, 280, 32);
    ctx.restore();

    // top rim light
    ctx.strokeStyle = 'rgba(255, 206, 150, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-30, -64.5);
    ctx.quadraticCurveTo(-8, -73.5, 10, -75.5);
    ctx.lineTo(28, -75.5);
    ctx.quadraticCurveTo(52, -74.5, 66, -55.5);
    ctx.stroke();

    // shoulder line
    ctx.strokeStyle = 'rgba(255, 190, 140, 0.22)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-128, -46);
    ctx.quadraticCurveTo(-40, -50, 104, -47);
    ctx.stroke();

    // door shut line
    ctx.strokeStyle = 'rgba(20, 8, 12, 0.55)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(-26, -49);
    ctx.lineTo(-26, -19);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 190, 140, 0.10)';
    ctx.beginPath();
    ctx.moveTo(-25, -49);
    ctx.lineTo(-25, -19);
    ctx.stroke();

    // chrome side trim
    ctx.strokeStyle = 'rgba(226, 220, 232, 0.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-120, -26);
    ctx.lineTo(112, -26);
    ctx.stroke();

    // door handle
    ctx.fillStyle = '#e2dce8';
    ctx.beginPath();
    ctx.roundRect(-18, -44, 15, 3.6, 1.8);
    ctx.fill();

    // ---- glass ----
    const glass = new Path2D();
    glass.moveTo(-64, -51);
    glass.quadraticCurveTo(-42, -63, -18, -70);
    glass.quadraticCurveTo(6, -73, 26, -71);
    glass.quadraticCurveTo(44, -68, 58, -53.5);
    glass.lineTo(52, -49.5);
    glass.quadraticCurveTo(-10, -45.5, -64, -51);
    glass.closePath();
    const gg = ctx.createLinearGradient(0, -73, 0, -46);
    gg.addColorStop(0, '#3c4f74');
    gg.addColorStop(0.45, '#1d2740');
    gg.addColorStop(1, '#5b3140');
    ctx.fillStyle = gg;
    ctx.fill(glass);

    // reflection sweep across the glass
    ctx.save();
    ctx.clip(glass);
    ctx.globalAlpha = 0.32;
    ctx.fillStyle = '#ffcf9a';
    ctx.beginPath();
    ctx.moveTo(-20, -74);
    ctx.lineTo(10, -74);
    ctx.lineTo(34, -44);
    ctx.lineTo(16, -44);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#ffe6c8';
    ctx.beginPath();
    ctx.moveTo(-40, -74);
    ctx.lineTo(-22, -74);
    ctx.lineTo(2, -44);
    ctx.lineTo(-12, -44);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // window trim + B-pillar
    ctx.strokeStyle = 'rgba(228, 222, 234, 0.70)';
    ctx.lineWidth = 1.5;
    ctx.stroke(glass);
    ctx.strokeStyle = 'rgba(24, 12, 16, 0.75)';
    ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(-24, -69.5);
    ctx.lineTo(-26, -47);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(232, 226, 238, 0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-22.6, -69.5);
    ctx.lineTo(-24.4, -47);
    ctx.stroke();

    // vent window
    ctx.fillStyle = 'rgba(26, 20, 34, 0.75)';
    ctx.beginPath();
    ctx.moveTo(-58, -52.5);
    ctx.lineTo(-46, -58);
    ctx.lineTo(-47, -49.5);
    ctx.closePath();
    ctx.fill();

    // mirror
    ctx.fillStyle = '#3a1620';
    ctx.beginPath();
    ctx.roundRect(52, -54, 13, 6, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 200, 150, 0.35)';
    ctx.fillRect(52, -54, 13, 1.6);

    // ---- lights ----
    // headlight
    const hl = ctx.createRadialGradient(124, -40, 1, 124, -40, 16);
    hl.addColorStop(0, '#fffdf2');
    hl.addColorStop(0.4, '#ffe6ab');
    hl.addColorStop(1, 'rgba(255, 200, 120, 0)');
    ctx.fillStyle = hl;
    ctx.beginPath();
    ctx.ellipse(124, -40, 13, 8, -0.22, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff6df';
    ctx.beginPath();
    ctx.ellipse(125, -40, 7.5, 4.6, -0.22, 0, TAU);
    ctx.fill();

    // taillight
    const tl = ctx.createRadialGradient(-133, -36, 1, -133, -36, 12);
    tl.addColorStop(0, 'rgba(255, 90, 70, 0.9)');
    tl.addColorStop(1, 'rgba(255, 60, 50, 0)');
    ctx.fillStyle = tl;
    ctx.beginPath();
    ctx.ellipse(-133, -36, 9, 7, 0, 0, TAU);
    ctx.fill();

    // bumpers
    const chrome = ctx.createLinearGradient(0, -34, 0, -16);
    chrome.addColorStop(0, '#efeaf4');
    chrome.addColorStop(0.45, '#a8a2b2');
    chrome.addColorStop(1, '#5d5866');
    ctx.fillStyle = chrome;
    ctx.beginPath();
    ctx.roundRect(-140, -32, 10, 13, 3);
    ctx.roundRect(128, -31, 10, 12, 3);
    ctx.fill();

    // exhaust
    ctx.fillStyle = '#2b2730';
    ctx.beginPath();
    ctx.roundRect(-142, -25, 8, 4.5, 2);
    ctx.fill();

    // fuel filler
    ctx.strokeStyle = 'rgba(20, 8, 12, 0.5)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(-96, -42, 4.2, 0, TAU);
    ctx.stroke();

    ctx.restore();
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // Main loop
  // ------------------------------------------------------------------
  let distance = 0;          // world distance travelled (screen px on the road layer)
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    clock += dt;

    const roadSpeed = 240;
    distance += roadSpeed * dt;

    // ---- sky ----
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizon + 2);
    const sun = drawSun();

    // ---- ground base: no sky may show through the depth planes ----
    const gg = ctx.createLinearGradient(0, horizon - 6, 0, roadTop + 40);
    gg.addColorStop(0, '#5c3a46');
    gg.addColorStop(0.28, '#3b2836');
    gg.addColorStop(0.66, '#2a1f2d');
    gg.addColorStop(1, '#1d1826');
    ctx.fillStyle = gg;
    ctx.fillRect(0, horizon - 6, W, roadTop + 46 - (horizon - 6));
    // faint field striations for depth
    ctx.save();
    ctx.globalAlpha = 0.16;
    for (let i = 0; i < 7; i++) {
      const y = horizon + 26 + i * 16;
      ctx.fillStyle = i % 2 ? '#1a1424' : '#4a3140';
      ctx.fillRect(0, y, W, 3 + i * 0.7);
    }
    ctx.restore();

    // ---- layers ----
    for (const L of layers) {
      if (L.y >= H) continue;
      blit(L.tile, L.y, distance * (L.speed / roadSpeed));
    }

    // ---- haze over the far scenery ----
    const haze = ctx.createLinearGradient(0, horizon - H * 0.12, 0, horizon + H * 0.03);
    haze.addColorStop(0, 'rgba(255, 150, 90, 0.0)');
    haze.addColorStop(1, 'rgba(255, 160, 100, 0.22)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, horizon - H * 0.12, W, H * 0.15);

    // ---- lane dashes on the road ----
    const dashY = contactY + (H - contactY) * 0.42;
    const dashW = 62, dashGap = 54;
    const dashCycle = dashW + dashGap;
    const dashOff = (distance * 1.55) % dashCycle;
    ctx.save();
    ctx.fillStyle = 'rgba(236, 216, 150, 0.72)';
    for (let x = -dashOff - dashCycle; x < W + dashCycle; x += dashCycle) {
      ctx.beginPath();
      ctx.roundRect(x, dashY, dashW, Math.max(3, H * 0.008), 2);
      ctx.fill();
    }
    ctx.restore();

    // ---- car ----
    const worldD = distance / carScale;
    const rearDy = roadProfile(worldD + REAR_AXLE) * carScale;
    const frontDy = roadProfile(worldD + FRONT_AXLE) * carScale;
    const axleSpan = FRONT_AXLE - REAR_AXLE;
    const pitch = Math.atan2(frontDy - rearDy, axleSpan * carScale) * 0.55;
    const bounce = (rearDy + frontDy) * 0.5 + Math.sin(clock * 21.0) * 0.35 + Math.sin(clock * 9.3) * 0.22;
    const wheelAngle = distance / WHEEL_R;

    // contact shadow
    ctx.save();
    ctx.globalAlpha = 0.42;
    const sh = ctx.createRadialGradient(carX, contactY + 3, 2, carX, contactY + 3, 150 * carScale);
    sh.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
    sh.addColorStop(0.6, 'rgba(0, 0, 0, 0.28)');
    sh.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = sh;
    ctx.save();
    ctx.translate(carX, contactY + 3);
    ctx.scale(1, 0.17);
    ctx.beginPath();
    ctx.arc(0, 0, 150 * carScale, 0, TAU);
    ctx.fill();
    ctx.restore();
    ctx.restore();

    drawCar(carX, contactY + bounce, carScale, pitch, wheelAngle, rearDy, frontDy);

    // warm light spill from the headlight onto the road
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const gx = carX + 150 * carScale, gy = contactY - 40 * carScale;
    const spill = ctx.createRadialGradient(gx, gy, 4, gx, gy, 260 * carScale);
    spill.addColorStop(0, 'rgba(255, 200, 130, 0.16)');
    spill.addColorStop(1, 'rgba(255, 180, 110, 0)');
    ctx.fillStyle = spill;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // ---- vignette ----
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.34, W * 0.5, H * 0.52, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(4, 2, 12, 0.52)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // ---- grain ----
    if (grainTile) {
      ctx.save();
      ctx.globalAlpha = 0.035;
      ctx.globalCompositeOperation = 'overlay';
      const gw = grainTile.w, gh = grainTile.h;
      const ox = -Math.floor(Math.random() * gw), oy = -Math.floor(Math.random() * gh);
      for (let y = oy; y < H; y += gh) {
        for (let x = ox; x < W; x += gw) {
          ctx.drawImage(grainTile.canvas, x, y, gw, gh);
        }
      }
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
