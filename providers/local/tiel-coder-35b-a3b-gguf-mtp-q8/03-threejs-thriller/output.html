<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thriller — Cinematic Dance Scene</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",system-ui,sans-serif;}
  #app{position:relative;width:100vw;height:100vh;}
  canvas{display:block;}
  #hud{position:absolute;top:14px;left:0;right:0;text-align:center;color:#e9d8c0;z-index:10;
    text-shadow:0 2px 8px #000;pointer-events:none;}
  #hud h1{margin:0;font-size:clamp(22px,5vw,46px);letter-spacing:4px;font-weight:800;
    background:linear-gradient(#ff8a5c,#ffcf6b);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #hud p{margin:2px 0;opacity:.75;font-size:13px;letter-spacing:1px;}
  #ctrl{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:11;}
  button{font:inherit;font-weight:600;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;
    background:rgba(30,20,15,.75);color:#ffdca8;border:1px solid rgba(255,180,120,.35);backdrop-filter:blur(4px);}
  button.active{background:linear-gradient(#c0392b,#7a1a10);color:#fff;}
  button:hover{border-color:rgba(255,200,140,.8);}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffcf6b;z-index:20;
    font-size:20px;letter-spacing:2px;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <h1>THRILLER</h1>
    <p>Michael Jackson · Pepe the Frog · Donald Trump · Elon Musk</p>
    <p id="beat">♪ The beat drops… ♪</p>
  </div>
  <div id="ctrl">
    <button data-song="thriller" class="active">Thriller Dance</button>
    <button data-song="freeze">Freeze Pose</button>
    <button data-song="spin">Group Spin</button>
  </div>
  <div id="loading">Loading scene…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
}}
</script>

<script type="module">
import * as THREE from "three";

// -----------------------------------------------------------------------------
// Renderer / scene / camera
// -----------------------------------------------------------------------------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0710);
scene.fog = new THREE.FogExp2(0x0a0710, 0.028);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 3.4, 11.5);
camera.lookAt(0, 1.6, 0);

// -----------------------------------------------------------------------------
// Lights — cinematic stage lighting
// -----------------------------------------------------------------------------
const ambient = new THREE.AmbientLight(0x2a2438, 0.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffd9a8, 1.1);
key.position.set(6, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 40;
key.shadow.camera.left=-12; key.shadow.camera.right=12; key.shadow.camera.top=12; key.shadow.camera.bottom=-12;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x6a8bff, 0.7);
rim.position.set(-8, 6, -6);
scene.add(rim);

// moving colored spotlights for the stage feel
const spots = [];
const spotColors = [0xff5c3a, 0xffcf4a, 0x4ab6ff, 0xc04aff];
for (let i=0;i<4;i++){
  const s = new THREE.SpotLight(spotColors[i], 14, 40, Math.PI/6, 0.5, 1.4);
  s.position.set(Math.cos(i/4*Math.PI*2)*10, 12, Math.sin(i/4*Math.PI*2)*10);
  s.target.position.set(0,1,0);
  scene.add(s); scene.add(s.target);
  spots.push({ light:s, phase:i/4*Math.PI*2 });
}

// moon glow
const moon = new THREE.DirectionalLight(0xbfd8ff, 0.4);
moon.position.set(-4, 8, -10);
scene.add(moon);

// -----------------------------------------------------------------------------
// Ground — circular moonlit stage
// -----------------------------------------------------------------------------
const stageGeo = new THREE.CircleGeometry(22, 64);
const stageMat = new THREE.MeshStandardMaterial({ color:0x1a1526, roughness:0.95, metalness:0.05 });
const stage = new THREE.Mesh(stageGeo, stageMat);
stage.rotation.x = -Math.PI/2;
stage.receiveShadow = true;
scene.add(stage);

// eerie ground runes (glowing rings)
for (let i=0;i<3;i++){
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(4+i*3.2, 4+i*3.2+0.12, 64),
    new THREE.MeshBasicMaterial({ color:0x7a4aff, transparent:true, opacity:0.35, side:THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.02 + i*0.001;
  scene.add(ring);
}

// distant gravestones silhouettes
const graveMat = new THREE.MeshStandardMaterial({ color:0x0f0c18, roughness:1 });
for (let i=0;i<18;i++){
  const a = i/18*Math.PI*2;
  const r = 16 + (i%3);
  const g = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1+ (i%2)*0.5, 0.18), graveMat);
  g.position.set(Math.cos(a)*r, 0.5, Math.sin(a)*r);
  g.rotation.y = a;
  g.castShadow = true;
  scene.add(g);
}

// -----------------------------------------------------------------------------
// Character factory — stylised low-poly figures with distinct looks
// -----------------------------------------------------------------------------
function makePerson(opts){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color:opts.skin||0xd9a87c, roughness:0.7 });
  const cloth = new THREE.MeshStandardMaterial({ color:opts.cloth||0x222222, roughness:0.8 });
  const joint = new THREE.Group(); // anchor for limbs

  // pelvis/torso
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.7, 4, 12), cloth);
  torso.position.y = 1.05; torso.castShadow=true; g.add(torso);
  // head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.30, 20, 16), skin);
  head.position.y = 1.78; head.castShadow=true; g.add(head);
  // neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.15), skin);
  neck.position.y=1.58; g.add(neck);

  function arm(side){
    const sh = new THREE.Group();
    sh.position.set(side*0.36, 1.38, 0);
    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.11,0.4,4,8), cloth);
    upper.position.y=-0.28; upper.castShadow=true; sh.add(upper);
    const fore = new THREE.Group(); fore.position.y=-0.56;
    const lower = new THREE.Mesh(new THREE.CapsuleGeometry(0.09,0.38,4,8), skin);
    lower.position.y=-0.24; lower.castShadow=true; fore.add(lower);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,8), skin);
    hand.position.y=-0.48; fore.add(hand);
    sh.add(fore);
    g.add(sh);
    return { shoulder:sh, elbow:fore };
  }
  function leg(side){
    const sh = new THREE.Group();
    sh.position.set(side*0.17, 0.72, 0);
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.42,4,8), cloth);
    thigh.position.y=-0.3; thigh.castShadow=true; sh.add(thigh);
    const shin = new THREE.Group(); shin.position.y=-0.58;
    const lower = new THREE.Mesh(new THREE.CapsuleGeometry(0.1,0.42,4,8), cloth);
    lower.position.y=-0.28; lower.castShadow=true; shin.add(lower);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.1,0.34), cloth);
    foot.position.set(0,-0.54,0.06); foot.castShadow=true; shin.add(foot);
    sh.add(shin); g.add(sh);
    return { hip:sh, knee:shin };
  }
  const L = { arm:arm(-1), leg:leg(-1) };
  const R = { arm:arm(1),  leg:leg(1) };

  // apply identity cosmetics
  if (opts.hair) { const h=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,12,0,Math.PI*2,0,Math.PI*0.6), new THREE.MeshStandardMaterial({color:opts.hair,roughness:0.9})); h.position.y=1.82; h.scale.set(1,0.9,1); g.add(h); }
  if (opts.extra){ opts.extra(g, head, skin, cloth); }

  g.userData = { torso, head, L, R, opts };
  return g;
}

// ---- Michael Jackson (red jacket, white shoes vibe, cap) ----
const mj = makePerson({ skin:0x8d5a3c, cloth:0xc0392b, hair:0x14101a });
mj.userData.extra = (g)=>{
  // snapback cap
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.31,0.31,0.12,16), new THREE.MeshStandardMaterial({color:0x101018}));
  cap.position.y=1.92; cap.castShadow=true; g.add(cap);
  const brim=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.03,16,1,false,Math.PI,Math.PI*2), new THREE.MeshStandardMaterial({color:0x101018}));
  brim.position.set(0,1.9,0.05); g.add(brim);
  // sunglasses
  const gl=new THREE.MeshStandardMaterial({color:0x050505,metalness:0.8,roughness:0.2});
  const glass=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.09,0.05), gl); glass.position.set(0,1.80,0.28); g.add(glass);
  // white performance glove on the right hand
  mj.userData.R.arm.elbow.userData.glove = new THREE.MeshStandardMaterial({color:0xf5f5f0});
};
mj.name="mj";

// ---- Pepe the Frog (green, big eyes, smile) ----
const pepe = makePerson({ skin:0x4caf50, cloth:0x256d34, hair:0x3a9d3f });
pepe.scale.setScalar(1.02);
pepe.userData.extra=(g,head)=>{
  const eyeMat=new THREE.MeshStandardMaterial({color:0xffffff});
  for(const s of [-1,1]){
    const e=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,12),eyeMat);
    e.position.set(s*0.13,1.90,0.22); g.add(e);
    const pupil=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),new THREE.MeshStandardMaterial({color:0x000}));
    pupil.position.set(s*0.13,1.90,0.30); g.add(pupil);
  }
  // wide smile
  const smile=new THREE.Mesh(new THREE.TorusGeometry(0.14,0.025,8,16,Math.PI),new THREE.MeshStandardMaterial({color:0x7a1f1f}));
  smile.position.set(0,1.62,0.26); smile.rotation.x=Math.PI*0.15; g.add(smile);
};
pepe.name="pepe";

// ---- Donald Trump (suit, blonde hair) ----
const donald = makePerson({ skin:0xf0c29a, cloth:0x1b2340, hair:0xe8c14a });
donald.userData.extra=(g,head)=>{
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.33,20,14,0,Math.PI*2,0,Math.PI*0.55),new THREE.MeshStandardMaterial({color:0xe8c14a,roughness:0.8}));
  hair.position.y=1.86; hair.scale.set(1.02,0.85,1.05); g.add(hair);
  // tie
  const tie=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.4,8),new THREE.MeshStandardMaterial({color:0xb02020}));
  tie.position.set(0,1.15,0.30); tie.rotation.x=0.15; g.add(tie);
  // mouth
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.04,0.04),new THREE.MeshStandardMaterial({color:0xa3452f}));
  mouth.position.set(0,1.66,0.30); g.add(mouth);
};
donald.name="donald";

// ---- Elon Musk (suit, short hair) ----
const elon = makePerson({ skin:0xe0b090, cloth:0x111116, hair:0x2b2118 });
elon.userData.extra=(g)=>{
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.31,16,12,0,Math.PI*2,0,Math.PI*0.5),new THREE.MeshStandardMaterial({color:0x2b2118,roughness:0.9}));
  hair.position.y=1.85; g.add(hair);
};
elon.name="elon";

const dancers = [mj, pepe, donald, elon];
// fan out starting positions
const positions = [ [-2.2,0,1.0],[2.2,0,1.0],[-2.2,0,-1.4],[2.2,0,-1.4] ];
dancers.forEach((d,i)=>{ d.position.copy(positions[i]); scene.add(d); });

document.getElementById("loading").style.display="none";

// -----------------------------------------------------------------------------
// Choreography — procedural keyframes over a looping clock
// Each pose is defined per dancer; blend between them.
// -----------------------------------------------------------------------------
const clamp3 = (v)=>Math.max(-1.4,Math.min(1.4,v));

// Pose function: given normalized pose value t in [-1,1] returns a set of limb rotations (radians)
// We'll define 4 signature Thriller-ish poses and cycle them.
function poseValue(t){ // t: 0..1
  return Math.sin(t*Math.PI*2);
}

function applyPose(p, kind, amp){
  const {torso,L,R,head}=p.userData;
  const s=Math.sin(amp*Math.PI*2);
  const c=Math.cos(amp*Math.PI*2);
  switch(kind){
    case "zombie": {
      // arms out & swaying, body lean
      L.shoulder.rotation.x = -1.7 + s*0.25; L.shoulder.rotation.z = -0.5;
      R.shoulder.rotation.x = -1.7 - s*0.25; R.shoulder.rotation.z =  0.5;
      L.elbow.rotation.x = -0.6; R.elbow.rotation.x = -0.6;
      torso.rotation.z = s*0.18; torso.rotation.x = -0.25;
      head.rotation.y = c*0.5; head.rotation.z = s*0.15;
      L.hip.rotation.x = c*0.12; R.hip.rotation.x = -c*0.12;
      break;
    }
    case "point": {
      // iconic pointing + hip pop
      L.shoulder.rotation.x=-0.2; L.shoulder.rotation.z=-0.9-s*0.3;
      R.shoulder.rotation.x=-0.2; R.shoulder.rotation.z= 0.9+s*0.3;
      L.elbow.rotation.x=-0.3; R.elbow.rotation.x=-0.3;
      torso.rotation.z = -s*0.22; torso.rotation.x=0.1;
      head.rotation.y = s*0.6; head.rotation.z=-s*0.1;
      L.hip.rotation.z = 0.15*s; R.hip.rotation.z=-0.15*s;
      break;
    }
    case "crouch": {
      // low crouch, arms sweeping down
      L.shoulder.rotation.x=-1.2+s*0.6; L.shoulder.rotation.z=-0.9;
      R.shoulder.rotation.x=-1.2-s*0.6; R.shoulder.rotation.z= 0.9;
      L.elbow.rotation.x=-0.9; R.elbow.rotation.x=-0.9;
      torso.rotation.x=0.5;
      head.rotation.x=-0.4;
      L.hip.rotation.x=0.9; R.hip.rotation.x=0.9;
      L.knee.rotation.x=-0.8; R.knee.rotation.x=-0.8;
      break;
    }
    case "shake": {
      // shoulder shake / body roll
      L.shoulder.rotation.x=-0.6+Math.abs(s)*0.8; L.shoulder.rotation.z=-0.7;
      R.shoulder.rotation.x=-0.6-Math.abs(s)*0.8; R.shoulder.rotation.z= 0.7;
      L.elbow.rotation.x=-0.5; R.elbow.rotation.x=-0.5;
      torso.rotation.z=Math.sin(amp*Math.PI*8)*0.25;
      head.rotation.y=Math.sin(amp*Math.PI*4)*0.3;
      break;
    }
    case "freeze": {
      // triumphant freeze: one arm up, one out
      L.shoulder.rotation.x=-2.0; L.shoulder.rotation.z=-0.7;
      R.shoulder.rotation.x=-0.4; R.shoulder.rotation.z= 1.5;
      L.elbow.rotation.x=-0.8; R.elbow.rotation.x=-0.2;
      torso.rotation.x=-0.15; torso.rotation.z=0.05;
      head.rotation.y=0.2; head.rotation.z=-0.1;
      L.hip.rotation.z=0.05; R.hip.rotation.z=-0.05;
      break;
    }
  }
}

// Each dancer gets a phase offset so the group forms lines/waves.
let mode="thriller";
let time=0;

document.querySelectorAll("#ctrl button").forEach(b=>{
  b.addEventListener("click",()=>{
    mode=b.dataset.song;
    document.querySelectorAll("#ctrl button").forEach(x=>x.classList.toggle("active",x===b));
  });
});

// formation positions per mode
function formation(i){
  const t=time;
  if(mode==="spin"){
    const r=3.2, sp=time*0.6;
    const a=i/4*Math.PI*2+sp;
    return new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r);
  }
  // thriller / freeze: V formation with subtle advance
  const adv=Math.sin(t*0.4)*0.6;
  const spots=[[-2.6,adv,1.6],[2.6,adv,1.6],[-1.3,adv,-1.4],[1.3,adv,-1.4]];
  const v=new THREE.Vector3(...spots[i]);
  return v;
}

// -----------------------------------------------------------------------------
// Animate
// -----------------------------------------------------------------------------
const clock=new THREE.Clock();
function animate(){
  const dt=clock.getDelta();
  time+=dt;

  // rotate spotlights around stage
  spots.forEach((s,i)=>{
    const a=s.phase+time*0.35;
    s.light.target.position.set(Math.cos(time*0.4+i)*2,1,Math.sin(time*0.4+i)*2);
    s.light.position.set(Math.cos(a)*11,12,Math.sin(a)*11);
  });

  dancers.forEach((d,i)=>{
    // move to formation
    const f=formation(i);
    d.position.lerp(f, Math.min(1,dt*4));

    // face the group center / travel direction
    const targetAngle = mode==="spin" ? -time*0.6 - i/4*Math.PI*2 : Math.atan2(-d.position.x, 1);
    // smooth face angle
    let da = targetAngle - d.rotation.y;
    while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2;
    d.rotation.y += da*Math.min(1,dt*6);

    // choreography phase
    let kind, amp;
    const ph = ((time*0.5 + i*0.12) % 4); // 4-beat pose cycle per dancer
    if(mode==="thriller"){
      if(ph<1){kind="zombie";amp=ph;}
      else if(ph<2){kind="point";amp=ph-1;}
      else if(ph<3){kind="crouch";amp=ph-2;}
      else {kind="shake";amp=ph-3;}
      // keep last pose as base, override limbs
      applyPose(d, kind, amp);
      // subtle bounce
      d.position.y += Math.abs(Math.sin(time*4))*0.04;
    } else if(mode==="freeze"){
      applyPose(d,"freeze",0);
    } else if(mode==="spin"){
      // arms wide, lean into the spin
      d.userData.L.shoulder.rotation.x=-1.6; d.userData.L.shoulder.rotation.z=-0.4;
      d.userData.R.shoulder.rotation.x=-1.6; d.userData.R.shoulder.rotation.z= 0.4;
      d.userData.L.elbow.rotation.x=-0.4; d.userData.R.elbow.rotation.x=-0.4;
      d.userData.torso.rotation.x=-0.15;
      d.userData.head.rotation.z=Math.sin(time*6+i)*0.15;
      // whole-body tilt while spinning
      d.rotation.z = Math.sin(time*6+i)*0.12;
    }
  });

  // camera drift
  camera.position.x = Math.sin(time*0.15)*2.2;
  camera.position.y = 3.2 + Math.sin(time*0.25)*0.5;
  camera.lookAt(0, 1.7, 0.5);

  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();

// -----------------------------------------------------------------------------
// Resize
// -----------------------------------------------------------------------------
window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
