<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dusk Drive — parallax side-view</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060b;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:14px;bottom:12px;color:#e8dccd;opacity:.55;
        font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;
        pointer-events:none;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint">space&nbsp;=&nbsp;pause&nbsp;&nbsp;·&nbsp;&nbsp;↑↓&nbsp;=&nbsp;speed&nbsp;&nbsp;·&nbsp;&nbsp;1/2/3&nbsp;=&nbsp;dusk&nbsp;/&nbsp;day&nbsp;/&nbsp;night</div>
<script>
/* =========================================================================
   DUSK DRIVE — pure canvas 2D, no libraries.
   The world is one horizontal line of integer tiles per layer. A tile's
   contents come from hash(tileIndex), so scenery scrolls endlessly, repeats
   in pattern but never in detail, and cannot "seam" when it wraps.
   ========================================================================= */
(() => {
  'use strict';
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d', { alpha: false });

  // ---------- utils ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  // deterministic value in [0,1) from an integer + salt
  const rnd = (n, salt) => {
    let h = (n * 374761393 + salt * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  const mix = (c1, c2, t) => [
    Math.round(lerp(c1[0], c2[0], t)),
    Math.round(lerp(c1[1], c2[1], t)),
    Math.round(lerp(c1[2], c2[2], t))];
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

  // ---------- palettes ----------
  const THEMES = {
    dusk: { top:[26,17,54], mid:[92,44,92], haze:[233,120,74], low:[255,168,92],
            sun:[255,214,150], ground:[36,26,34], road:[42,39,44], hillFar:[70,50,86],
            hillNear:[45,35,60], treeFar:[30,24,42], treeNear:[18,15,26],
            lightOn:[255,214,150], beam:.20, star:.55, grain:.055 },
    day:  { top:[62,120,196], mid:[126,178,222], haze:[214,232,244], low:[238,246,250],
            sun:[255,252,236], ground:[86,110,66], road:[92,92,96], hillFar:[128,150,166],
            hillNear:[96,128,110], treeFar:[62,92,66], treeNear:[38,66,44],
            lightOn:[255,246,214], beam:.0, star:.0, grain:.03 },
    night:{ top:[5,8,20], mid:[12,18,40], haze:[40,54,96], low:[64,78,120],
            sun:[222,232,255], ground:[14,16,26], road:[22,22,30], hillFar:[24,28,50],
            hillNear:[16,19,34], treeFar:[10,12,22], treeNear:[6,7,13],
            lightOn:[255,226,168], beam:.34, star:1.0, grain:.075 }
  };
  let themeName = 'dusk';
  let theme = THEMES[themeName];

  // ---------- viewport ----------
  let W = 0, H = 0, DPR = 1, horizon = 0, roadTop = 0, roadBottom = 0, scale = 1;
  function resize() {
    DPR = clamp(window.devicePixelRatio || 1, 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    scale = clamp(H / 720, 0.55, 2.2);
    horizon = Math.round(H * 0.53);
    roadTop = Math.round(H * 0.60);
    roadBottom = Math.round(H * 0.965);
    buildNoise();
  }

  // ---------- film grain tile ----------
  let grainTile = null, grainFlip = false;
  function buildNoise() {
    const s = 128;
    grainTile = document.createElement('canvas');
    grainTile.width = grainTile.height = s;
    const g = grainTile.getContext('2d');
    const img = g.createImageData(s, s);
    for (let i = 0; i < s * s; i++) {
      const v = 128 + (Math.random() - 0.5) * 190;
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
      img.data[i * 4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }

 // ---------- state ----------
  let dist = 0;            // world distance in px at speed 1.0
  let speed = 235;         // px/s
  let paused = false;
  let t = 0;
  const wheelR = () => 34 * scale;

  // tile descriptors: width(px) + parallax factor
  const L = {
    cloud:   { w: 620, f: 0.055 },
    mount:   { w: 900, f: 0.11 },
    hill:    { w: 560, f: 0.20 },
    treeFar: { w: 210, f: 0.33 },
    treeNear:{ w: 260, f: 0.54 },
    pole:    { w: 330, f: 0.80 },
    dash:    { w: 150, f: 1.00 },
    speck:   { w: 90,  f: 1.00 },
    grass:   { w: 46,  f: 1.32 }
  };
  // layerX: pixel offset of tile 0's left edge, plus the integer index range
  function layerX(l) {
    const off = -((dist * l.f) % l.w);
    return { off, first: Math.floor((dist * l.f) / l.w) };
  }
  function tiles(l, cb) {
    const { off, first } = layerX(l);
    const n = Math.ceil(W / l.w) + 2;
    for (let i = 0; i < n; i++) cb(first + i, off + i * l.w);
  }

  // ================= sky =================
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, horizon + 40);
    g.addColorStop(0, rgb(theme.top));
    g.addColorStop(0.55, rgb(theme.mid));
    g.addColorStop(0.88, rgb(theme.haze));
    g.addColorStop(1, rgb(theme.low));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizon + 40);

    // stars (fixed sky positions, twinkle)
    if (theme.star > 0.01) {
      for (let i = 0; i < 150; i++) {
        const sx = rnd(i, 11) * W, sy = rnd(i, 12) * horizon * 0.82;
        const tw = 0.45 + 0.55 * Math.sin(t * (0.7 + rnd(i, 13) * 2.2) + rnd(i, 14) * 6.28);
        ctx.globalAlpha = theme.star * tw * (0.35 + rnd(i, 15) * 0.65);
        ctx.fillStyle = '#dfe8ff';
        const r = rnd(i, 16) * 1.1 + 0.35;
        ctx.fillRect(sx, sy, r, r);
      }
      ctx.globalAlpha = 1;
    }

    // sun / moon: parked just above the far ridge, glows hard
    const sunX = W * 0.74, sunY = horizon - H * 0.075, sunR = Math.min(W, H) * 0.052;
    const halo = ctx.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 8);
    halo.addColorStop(0, rgba(theme.sun, 0.55));
    halo.addColorStop(0.25, rgba(theme.sun, 0.14));
    halo.addColorStop(1, rgba(theme.sun, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, horizon + 40);
    const disc = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
    disc.addColorStop(0, rgba(theme.sun, 0.98));
    disc.addColorStop(1, rgba(mix(theme.sun, theme.haze, 0.6), 0.92));
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 6.2832); ctx.fill();
    // retro banding across the disc
    ctx.save(); ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, 6.2832); ctx.clip();
    ctx.fillStyle = rgba(theme.mid, 0.55);
    for (let b = 0; b < 5; b++) {
      const yy = sunY - sunR * 0.1 + b * sunR * 0.33;
      ctx.fillRect(sunX - sunR, yy, sunR * 2, sunR * (0.05 + b * 0.035));
    }
    ctx.restore();
  }

  function drawClouds() {
    tiles(L.cloud, (i, x) => {
      const seed = i;
      const cyp = horizon - 40 - rnd(seed, 31) * H * 0.22;
      const w = L.cloud.w * (0.5 + rnd(seed, 32) * 0.7);
      const h = 26 + rnd(seed, 33) * 20;
      const tint = mix(theme.mid, theme.haze, 0.55 + rnd(seed, 34) * 0.35);
      ctx.globalAlpha = 0.30 + rnd(seed, 35) * 0.22;
      for (let p = 0; p < 6; p++) {
        const px = x + w * (p / 6) + rnd(seed * 7 + p, 36) * 30;
        const py = cyp + Math.sin(p * 1.4) * h * 0.28;
        const pr = h * (0.75 + rnd(seed * 7 + p, 37) * 0.9);
        const g = ctx.createRadialGradient(px, py, pr * 0.2, px, py, pr);
        g.addColorStop(0, rgba(mix(tint, [255, 236, 214], 0.35), 0.9));
        g.addColorStop(1, rgba(tint, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  }

  // Draw a scrolling silhouette band whose profile is a sum of sines keyed to
  // the band's own offset — guaranteed continuous, so no wrap seams at all.
  function band(width, factor, baseY, amp, harmonics, colTop, colBot, salt) {
    const shift = dist * factor;
    ctx.beginPath();
    ctx.moveTo(-20, H);
    for (let x = -20; x <= W + 20; x += 6) {
      const u = (x + shift) / width;
      let y = baseY;
      for (let h = 0; h < harmonics.length; h++) {
        const a = harmonics[h];
        y += Math.sin(u * (h + 1) * 1.7 + salt * 2.3 + h) * amp * a;
      }
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 20, H);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, baseY - amp * 1.6, 0, baseY + 30);
    g.addColorStop(0, rgb(colTop));
    g.addColorStop(1, rgb(colBot));
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawMountains() {
    band(1100, L.mount.f, horizon + 6, H * 0.10, [0.62, 0.30, 0.16],
         mix(theme.hillFar, theme.haze, 0.30), theme.hillFar, 1);
    band(720, L.hill.f, horizon + 14, H * 0.062, [0.5, 0.34, 0.2],
         mix(theme.hillNear, theme.haze, 0.22), theme.hillNear, 2);
  }

  // ---------- trees ----------
  function conifer(x, baseY, h, w, col, salt) {
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(x, baseY - h);
    for (let s = 0; s < 4; s++) {
      const yy = baseY - h + (s + 1) * h / 4.2;
      const ww = w * (0.30 + 0.22 * s);
      const notch = w * (0.10 + 0.05 * rnd(salt + s, 61));
      ctx.lineTo(x + ww - notch, yy - h * 0.04);
      ctx.lineTo(x + ww, yy);
      ctx.lineTo(x + ww * 0.55, yy - h * 0.02);
    }
    ctx.lineTo(x + w * 0.14, baseY);
    ctx.lineTo(x - w * 0.14, baseY);
    for (let s = 3; s >= 0; s--) {
      const yy = baseY - h + (s + 1) * h / 4.2;
      const ww = w * (0.30 + 0.22 * s);
      const notch = w * (0.10 + 0.05 * rnd(salt + s, 61));
      ctx.lineTo(x - ww, yy);
      ctx.lineTo(x - ww + notch, yy - h * 0.04);
    }
    ctx.closePath();
    ctx.fill();
  }
  function broadleaf(x, baseY, h, w, col, salt) {
    ctx.strokeStyle = rgb(mix(col, [0, 0, 0], 0.25));
    ctx.lineWidth = Math.max(1.5, w * 0.12);
    ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x + w * 0.05, baseY - h * 0.62); ctx.stroke();
    ctx.fillStyle = rgb(col);
    for (let b = 0; b < 5; b++) {
      const a = b / 5 * 6.2832 + rnd(salt + b, 62) * 1.2;
      const rr = w * (0.42 + rnd(salt + b, 63) * 0.36);
      const cx = x + Math.cos(a) * w * 0.42;
      const cy = baseY - h * 0.72 + Math.sin(a) * h * 0.20;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.2832); ctx.fill();
    }
  }
  function drawTreeline() {
    // far: dense dark band of small conifers
    tiles(L.treeFar, (i, x) => {
      const h = (52 + rnd(i, 71) * 46) * scale;
      const w = h * (0.30 + rnd(i, 72) * 0.12);
      conifer(x + L.treeFar.w * 0.5, horizon + 12, h, w, theme.treeFar, i * 5);
      if (rnd(i, 73) > 0.55) {
        const h2 = h * (0.5 + rnd(i, 74) * 0.4);
        conifer(x + L.treeFar.w * 0.05, horizon + 12, h2, w * 0.9, theme.treeFar, i * 7);
      }
    });
    // near: mixed species, taller, with a rim light on top edge
    tiles(L.treeNear, (i, x) => {
      const baseY = roadTop + 4;
      const h = (92 + rnd(i, 81) * 78) * scale;
      const w = h * (0.34 + rnd(i, 82) * 0.22);
      const cx = x + L.treeNear.w * (0.3 + rnd(i, 83) * 0.4);
      if (rnd(i, 84) > 0.45) conifer(cx, baseY, h, w, theme.treeNear, i * 11);
      else broadleaf(cx, baseY, h, w * 1.15, theme.treeNear, i * 13);
      // sun-side rim on the canopy edge, kept tight so it reads as light, not a hole
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = rgb(theme.haze);
      ctx.beginPath(); ctx.ellipse(cx + w * 0.40, baseY - h * 0.82, w * 0.15, h * 0.11, 0.25, 0, 6.2832);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  // ---------- roadside props: poles with wires, signs, bushes, guardrail ----------
  function drawRoadside() {
    // guardrail runs continuously, tied to the pole layer speed
    const gy = roadTop + 12;
    ctx.fillStyle = rgba(mix(theme.road, [230, 230, 235], 0.35), 0.9);
    ctx.fillRect(0, gy, W, 4 * scale);
    ctx.fillStyle = rgba(mix(theme.road, [120, 120, 130], 0.25), 0.75);
    ctx.fillRect(0, gy + 4 * scale, W, 2 * scale);

    tiles(L.pole, (i, x) => {
      const px = x + L.pole.w * 0.5;
      const kind = rnd(i, 91);
      if (kind < 0.52) {
        // utility pole + arms, wire droops to the neighbour
        const ph = (150 + rnd(i, 92) * 52) * scale;
        ctx.fillStyle = rgb(mix(theme.treeNear, [90, 70, 58], 0.45));
        ctx.fillRect(px - 2.5 * scale, gy - ph, 5 * scale, ph);
        ctx.fillRect(px - 15 * scale, gy - ph + 12 * scale, 30 * scale, 3.5 * scale);
        ctx.fillRect(px - 11 * scale, gy - ph + 30 * scale, 22 * scale, 3 * scale);
        // catenary to the next pole
        ctx.strokeStyle = rgba(mix(theme.treeNear, [120, 110, 100], 0.5), 0.75);
        ctx.lineWidth = 1.2 * scale;
        for (let a = 0; a < 2; a++) {
          const y0 = gy - ph + (a ? 30 : 12) * scale;
          ctx.beginPath();
          ctx.moveTo(px, y0);
          ctx.quadraticCurveTo(px + L.pole.w * 0.5, y0 + (14 + a * 6) * scale,
                               px + L.pole.w, y0 + rnd(i + 1, 93) * 10 * scale);
          ctx.stroke();
        }
      } else if (kind < 0.78) {
        // road sign
        const sh = (74 + rnd(i, 94) * 26) * scale;
        ctx.fillStyle = rgb(mix(theme.treeNear, [120, 120, 125], 0.5));
        ctx.fillRect(px - 1.8 * scale, gy - sh, 3.6 * scale, sh);
        const wS = 44 * scale, hS = 30 * scale;
        ctx.fillStyle = kind < 0.66 ? '#1c6b3a' : '#17408c';
        ctx.fillRect(px - wS / 2, gy - sh - hS * 0.2, wS, hS);
        ctx.fillStyle = 'rgba(255,255,255,.82)';
        ctx.fillRect(px - wS * 0.34, gy - sh + hS * 0.22, wS * 0.68, 2.5 * scale);
        ctx.fillRect(px - wS * 0.24, gy - sh + hS * 0.52, wS * 0.48, 2.5 * scale);
      } else {
        // bush cluster
        const bh = (26 + rnd(i, 95) * 22) * scale;
        ctx.fillStyle = rgb(mix(theme.treeNear, [70, 92, 54], 0.35));
        for (let b = 0; b < 4; b++) {
          ctx.beginPath();
          ctx.arc(px + (b - 1.5) * bh * 0.44, gy + 2 - bh * (0.45 + rnd(i * 4 + b, 96) * 0.5),
                  bh * (0.42 + rnd(i * 4 + b, 97) * 0.32), 0, 6.2832);
          ctx.fill();
        }
      }
    });
  }

  // ---------- road ----------
  function drawRoad() {
    const g = ctx.createLinearGradient(0, roadTop, 0, roadBottom);
    g.addColorStop(0, rgb(mix(theme.road, theme.haze, 0.18)));
    g.addColorStop(0.35, rgb(theme.road));
    g.addColorStop(1, rgb(mix(theme.road, [0, 0, 0], 0.35)));
    ctx.fillStyle = g;
    ctx.fillRect(0, roadTop, W, roadBottom - roadTop);

    // shoulder line
    ctx.fillStyle = 'rgba(240,236,224,.55)';
    ctx.fillRect(0, roadTop + 5, W, 2.2 * scale);

    // speckle + patches
    tiles(L.speck, (i, x) => {
      const n = 3;
      for (let k = 0; k < n; k++) {
        const sx = x + rnd(i * 3 + k, 111) * L.speck.w;
        const sy = roadTop + 20 + rnd(i * 3 + k, 112) * (roadBottom - roadTop - 40);
        ctx.fillStyle = rgba([255, 255, 255], 0.02 + rnd(i * 3 + k, 113) * 0.035);
        ctx.fillRect(sx, sy, 1 + rnd(i * 3 + k, 114) * 3, 1.5);
      }
    });
    // centre dashes
    const yc = roadTop + (roadBottom - roadTop) * 0.52;
    tiles(L.dash, (i, x) => {
      ctx.fillStyle = i % 7 === 3 ? 'rgba(236,196,84,.75)' : 'rgba(244,240,226,.68)';
      ctx.fillRect(x, yc, L.dash.w * 0.46, 3.6 * scale);
    });
    // wet sheen from the sun, smeared along the road
    if (theme.beam > 0.02) {
      const sx = W * 0.74;
      const sheen = ctx.createLinearGradient(0, roadTop, 0, roadBottom);
      sheen.addColorStop(0, rgba(theme.sun, 0.055));
      sheen.addColorStop(1, rgba(theme.sun, 0));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = sheen;
      ctx.beginPath();
      ctx.moveTo(sx - W * 0.07, roadTop);
      ctx.lineTo(sx + W * 0.07, roadTop);
      ctx.lineTo(sx + W * 0.26, roadBottom);
      ctx.lineTo(sx - W * 0.26, roadBottom);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawForeground() {
    // fast blurred strip so the nearest ground reads as "whooshing" past
    const fy = roadBottom - 6;
    const g = ctx.createLinearGradient(0, fy - 10, 0, H);
    g.addColorStop(0, rgb(mix(theme.ground, [0, 0, 0], 0.6)));
    g.addColorStop(1, rgb(mix(theme.ground, [0, 0, 0], 0.88)));
    ctx.fillStyle = g;
    ctx.fillRect(0, fy, W, H - fy);
    const shift = dist * L.grass.f;
    ctx.strokeStyle = rgba(mix(theme.ground, [210, 190, 150], 0.5), 0.30);
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 120; i++) {
      const x = ((i * 137 + shift * 1.0) % (W + 120)) - 60;
      const y = fy + rnd(i, 121) * (H - fy);
      const len = 8 + rnd(i, 122) * 26;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len, y + 1); ctx.stroke();
    }
  }

  // ================= the car =================
  const exhaust = [];
  function spawnExhaust(dt) {
    if (Math.random() < dt * 18) {
      exhaust.push({ x: 0, y: 0, r: 3 + Math.random() * 4, life: 1, vx: -120 - Math.random() * 90, vy: -14 + Math.random() * 12 });
    }
    for (let i = exhaust.length - 1; i >= 0; i--) {
      const p = exhaust[i];
      p.life -= dt * 1.1; p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * 26;
      if (p.life <= 0) exhaust.splice(i, 1);
    }
  }

  function wheel(cx, cy, r, ang, dark) {
    // tyre
    ctx.fillStyle = '#0e0e11';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
    // sidewall sheen
    ctx.strokeStyle = 'rgba(180,180,190,.16)';
    ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.86, 0, 6.2832); ctx.stroke();
    // rim
    const rg = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.25, r * 0.05, cx, cy, r * 0.72);
    rg.addColorStop(0, 'rgba(236,240,246,.95)');
    rg.addColorStop(1, 'rgba(96,102,112,.9)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.62, 0, 6.2832); ctx.fill();
    // spokes: rotating, and motion-blurred into a disc at speed
    const blur = clamp((speed - 150) / 240, 0, 1);
    if (blur < 0.95) {
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(ang);
      for (let s = 0; s < 5; s++) {
        ctx.rotate(6.2832 / 5);
        ctx.globalAlpha = 0.85 * (1 - blur * 0.55);
        ctx.fillStyle = 'rgba(40,44,50,.95)';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.07);
        ctx.lineTo(r * 0.56, -r * 0.11);
        ctx.lineTo(r * 0.56, r * 0.05);
        ctx.lineTo(0, r * 0.07);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    if (blur > 0.05) {
      ctx.save();
      ctx.globalAlpha = blur * 0.42;
      ctx.strokeStyle = 'rgba(210,216,226,.8)';
      ctx.lineWidth = r * 0.5;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.40, 0, 6.2832); ctx.stroke();
      ctx.restore();
    }
    // brake hub
    ctx.fillStyle = dark ? '#1a1c20' : '#2a2d33';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.16, 0, 6.2832); ctx.fill();
  }

  function drawCar() {
    spawnExhaust(1 / 60);
    const s = scale;
    // suspension: two sines + road buzz, wheels stay planted on the asphalt
    const groundY = roadTop + (roadBottom - roadTop) * 0.74;
    const bob = Math.sin(t * 5.1) * 1.9 * s + Math.sin(t * 11.7) * 0.9 * s
              + Math.sin(t * 27.0) * 0.35 * s;
    const pitch = Math.sin(t * 3.3) * 0.0075 + Math.sin(t * 8.9) * 0.0022;
    const cx = W * 0.40;

    ctx.save();
    ctx.translate(cx, groundY);
    ctx.rotate(pitch);
    ctx.translate(0, bob);

    const wheelbase = 200 * s;
    const r = wheelR();
    const fx = -wheelbase / 2, rx = wheelbase / 2;   // front(-x) … rear(+x): car faces left
    const bodyY = -r * 1.05;                          // sill line

    // contact shadows
    ctx.save();
    const sh = ctx.createRadialGradient(0, r * 0.55, r * 0.2, 0, r * 0.6, wheelbase * 0.75);
    sh.addColorStop(0, 'rgba(0,0,0,.62)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.ellipse(0, r * 0.62, wheelbase * 0.72, r * 0.42, 0, 0, 6.2832); ctx.fill();
    ctx.restore();

    // ---- wheels (behind body so arches cut them) ----
    const ang = dist / r;
    wheel(fx, 0, r, ang, true);
    wheel(rx, 0, r, ang, false);

    // ---- exhaust puffs (behind the car, world-space offset) ----
    ctx.save();
    for (const p of exhaust) {
      ctx.globalAlpha = p.life * 0.22;
      const g2 = ctx.createRadialGradient(p.x + rx + 34 * s, bodyY + p.y * 0.0 + 6 * s, 1, p.x + rx + 34 * s, bodyY + 6 * s, p.r * s);
      g2.addColorStop(0, 'rgba(220,220,225,.65)');
      g2.addColorStop(1, 'rgba(200,200,210,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(p.x + rx + 34 * s, bodyY + 6 * s, p.r * s, 0, 6.2832); ctx.fill();
    }
    ctx.restore();

    // ---- body ----
    const noseX = fx - 74 * s, tailX = rx + 66 * s;
    const roofY = bodyY - 86 * s;
    ctx.beginPath();
    ctx.moveTo(noseX, bodyY + 30 * s);
    ctx.quadraticCurveTo(noseX - 6 * s, bodyY + 4 * s, noseX + 14 * s, bodyY - 6 * s);
    ctx.lineTo(noseX + 66 * s, bodyY - 14 * s);                       // bonnet
    ctx.quadraticCurveTo(fx - 6 * s, bodyY - 22 * s, fx + 22 * s, roofY + 12 * s);
    ctx.lineTo(fx + 74 * s, roofY - 4 * s);                           // roof front
    ctx.lineTo(rx - 44 * s, roofY - 2 * s);                           // roof
    ctx.quadraticCurveTo(rx + 12 * s, roofY + 8 * s, rx + 34 * s, bodyY - 16 * s);
    ctx.quadraticCurveTo(tailX, bodyY - 14 * s, tailX, bodyY + 8 * s); // tail
    ctx.lineTo(tailX - 4 * s, bodyY + 32 * s);
    ctx.lineTo(rx + 6 * s, bodyY + 36 * s);
    ctx.lineTo(fx - 6 * s, bodyY + 36 * s);
    ctx.closePath();
    const bodyG = ctx.createLinearGradient(0, roofY, 0, bodyY + 36 * s);
    bodyG.addColorStop(0, '#f0f3f7');
    bodyG.addColorStop(0.30, '#c8d2dd');
    bodyG.addColorStop(0.55, '#6f7d8e');
    bodyG.addColorStop(1, '#2c333d');
    ctx.fillStyle = bodyG;
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,12,16,.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // sunset rim along the upper edge, warm; cool bounce below
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(theme.sun, 0.5);
    ctx.lineWidth = 2.2 * s;
    ctx.beginPath();
    ctx.moveTo(fx + 24 * s, roofY + 10 * s);
    ctx.lineTo(fx + 74 * s, roofY - 3 * s);
    ctx.lineTo(rx - 44 * s, roofY - 1 * s);
    ctx.quadraticCurveTo(rx + 12 * s, roofY + 8 * s, rx + 34 * s, bodyY - 15 * s);
    ctx.stroke();
    ctx.strokeStyle = rgba(mix(theme.haze, [255, 150, 90], 0.5), 0.28);
    ctx.beginPath();
    ctx.moveTo(noseX + 10 * s, bodyY + 2 * s);
    ctx.lineTo(noseX + 66 * s, bodyY - 12 * s);
    ctx.stroke();
    ctx.restore();

    // travelling highlight band → sells the movement across the paintwork
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(noseX, bodyY + 30 * s);
    ctx.lineTo(noseX + 14 * s, bodyY - 6 * s);
    ctx.lineTo(fx + 22 * s, roofY + 12 * s);
    ctx.lineTo(rx + 34 * s, bodyY - 16 * s);
    ctx.lineTo(tailX, bodyY + 8 * s);
    ctx.lineTo(tailX, bodyY + 34 * s);
    ctx.closePath();
    ctx.clip();
    const hlPos = ((dist * 0.35) % 520) / 520;
    const hlX = lerp(noseX - 120 * s, tailX + 160 * s, hlPos);
    const hl = ctx.createLinearGradient(hlX - 90 * s, 0, hlX + 90 * s, 0);
    hl.addColorStop(0, 'rgba(255,255,255,0)');
    hl.addColorStop(0.5, 'rgba(255,255,255,.16)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(noseX - 200 * s, roofY - 20 * s, tailX - noseX + 400 * s, 200 * s);
    ctx.restore();

    // ---- glass ----
    ctx.beginPath();
    ctx.moveTo(fx + 30 * s, roofY + 10 * s);
    ctx.lineTo(fx + 74 * s, roofY + 3 * s);
    ctx.lineTo(rx - 46 * s, roofY + 3 * s);
    ctx.lineTo(rx - 4 * s, roofY + 12 * s);
    ctx.lineTo(rx - 14 * s, bodyY - 14 * s);
    ctx.lineTo(fx + 12 * s, bodyY - 12 * s);
    ctx.closePath();
    const glass = ctx.createLinearGradient(0, roofY, 0, bodyY);
    glass.addColorStop(0, rgba(mix(theme.top, theme.haze, 0.5), 0.95));
    glass.addColorStop(0.6, rgba(mix(theme.mid, [20, 26, 34], 0.55), 0.95));
    glass.addColorStop(1, 'rgba(14,18,24,.9)');
    ctx.fillStyle = glass; ctx.fill();
    ctx.strokeStyle = 'rgba(220,230,240,.30)'; ctx.lineWidth = 1 * s; ctx.stroke();
    // B-pillar + glass glare
    ctx.fillStyle = 'rgba(30,34,40,.85)';
    ctx.fillRect(fx + 84 * s, roofY + 2 * s, 5 * s, bodyY - roofY - 16 * s);
    ctx.save();
    ctx.globalAlpha = 0.22; ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(fx + 34 * s, roofY + 12 * s);
    ctx.lineTo(fx + 58 * s, roofY + 12 * s);
    ctx.lineTo(fx + 30 * s, bodyY - 14 * s);
    ctx.lineTo(fx + 16 * s, bodyY - 14 * s);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // door seam, handle, skirt
    ctx.strokeStyle = 'rgba(12,14,18,.45)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(fx + 88 * s, bodyY - 12 * s); ctx.lineTo(fx + 88 * s, bodyY + 30 * s);
    ctx.stroke();
    ctx.fillStyle = 'rgba(230,236,242,.75)';
    ctx.fillRect(fx + 96 * s, bodyY - 2 * s, 13 * s, 2.6 * s);
    ctx.fillStyle = 'rgba(8,9,12,.8)';
    ctx.fillRect(fx - 20 * s, bodyY + 30 * s, wheelbase + 60 * s, 7 * s);

    // wheel arches
    ctx.strokeStyle = 'rgba(10,12,16,.75)'; ctx.lineWidth = 3 * s;
    for (const wx of [fx, rx]) {
      ctx.beginPath(); ctx.arc(wx, 0, r * 1.16, Math.PI * 1.02, Math.PI * 1.98); ctx.stroke();
    }

    // ---- lights ----
    // headlamp (car faces -x)
    const hlx = noseX + 8 * s, hly = bodyY + 2 * s;
    ctx.fillStyle = rgba(theme.lightOn, 0.95);
    ctx.beginPath();
    ctx.ellipse(hlx, hly, 7 * s, 4.4 * s, -0.25, 0, 6.2832); ctx.fill();
    if (theme.beam > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const beam = ctx.createLinearGradient(hlx, hly, hlx - 340 * s, hly + 40 * s);
      beam.addColorStop(0, rgba(theme.lightOn, theme.beam));
      beam.addColorStop(1, rgba(theme.lightOn, 0));
      ctx.fillStyle = beam;
      ctx.beginPath();
      ctx.moveTo(hlx, hly - 3 * s);
      ctx.lineTo(hlx - 360 * s, hly - 26 * s);
      ctx.lineTo(hlx - 360 * s, hly + 52 * s);
      ctx.lineTo(hlx, hly + 4 * s);
      ctx.closePath(); ctx.fill();
      const glow = ctx.createRadialGradient(hlx, hly, 1, hlx, hly, 42 * s);
      glow.addColorStop(0, rgba(theme.lightOn, 0.55));
      glow.addColorStop(1, rgba(theme.lightOn, 0));
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(hlx, hly, 42 * s, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    // taillamp
    const tlx = tailX - 4 * s, tly = bodyY - 2 * s;
    ctx.fillStyle = 'rgba(226,44,44,.92)';
    ctx.fillRect(tlx - 4 * s, tly - 6 * s, 8 * s, 12 * s);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const tg = ctx.createRadialGradient(tlx, tly, 1, tlx, tly, 40 * s);
    tg.addColorStop(0, 'rgba(255,60,40,.55)');
    tg.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(tlx, tly, 40 * s, 0, 6.2832); ctx.fill();
    ctx.restore();

    ctx.restore();

    // wind streaks over the body, tied to speed
    ctx.save();
    ctx.globalAlpha = clamp((speed - 150) / 320, 0, 0.5) * 0.34;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 20; i++) {
      const y = groundY - 200 * s + rnd(i, 201) * 150 * s;
      const len = (40 + rnd(i, 202) * 140) * clamp(speed / 240, 0.4, 1.8);
      const x = W - ((dist * (1.6 + rnd(i, 203))) % (W + 300));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
    }
    ctx.restore();
  }

  // ================= post =================
  function drawPost() {
    // vignette
    const v = ctx.createRadialGradient(W * 0.5, H * 0.52, Math.min(W, H) * 0.30, W * 0.5, H * 0.52, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.62)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
    // grain
    if (grainTile) {
      grainFlip = !grainFlip;
      ctx.save();
      ctx.globalCompositeOperation = 'overlay';
      ctx.globalAlpha = theme.grain;
      const ox = grainFlip ? 37 : 91, oy = grainFlip ? 11 : 68;
      const pat = ctx.createPattern(grainTile, 'repeat');
      ctx.translate(-ox, -oy);
      ctx.fillStyle = pat;
      ctx.fillRect(0, 0, W + 256, H + 256);
      ctx.restore();
    }
    // cinematic letterbox
    const bar = Math.round(H * 0.055);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, bar);
    ctx.fillRect(0, H - bar, W, bar);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, bar, W, 1);
    ctx.fillRect(0, H - bar - 1, W, 1);
  }

  // ================= loop =================
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    dt = clamp(dt, 0, 1 / 20);
    if (!paused) { dist += speed * dt; t += dt; }
    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawClouds();
    drawMountains();
    drawTreeline();
    drawRoadside();
    drawRoad();
    drawCar();
    drawForeground();
    drawPost();
    requestAnimationFrame(frame);
  }

  // ================= input =================
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
    else if (e.code === 'ArrowUp') { speed = clamp(speed + 30, 40, 460); e.preventDefault(); }
    else if (e.code === 'ArrowDown') { speed = clamp(speed - 30, 40, 460); e.preventDefault(); }
    else if (e.key === '1') { themeName = 'dusk'; theme = THEMES[themeName]; }
    else if (e.key === '2') { themeName = 'day'; theme = THEMES[themeName]; }
    else if (e.key === '3') { themeName = 'night'; theme = THEMES[themeName]; }
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
