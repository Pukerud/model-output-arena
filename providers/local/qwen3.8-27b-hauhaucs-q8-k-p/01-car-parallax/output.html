<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dusk Drive — Parallax Car</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0e1a; }
  #scene { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
"use strict";
/* ------------------------------------------------------------------ *
 *  DUSK DRIVE — a seamlessly looping side-view parallax car scene.
 *  Pure canvas 2D, zero libraries, zero assets. Everything is drawn
 *  procedurally; far scenery is a pure function of world-x (sine-sum
 *  ridges) so there is no wrap seam, and near scenery is generated
 *  per-tile from a deterministic integer hash so it repeats but never
 *  looks identical twice.
 * ------------------------------------------------------------------ */

const cv  = document.getElementById("scene");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------------- deterministic randomness ---------------- */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* integer tile hash -> [0,1). Stable across frames. */
function h1(k, s) {
  let n = (Math.imul(k, 374761393) + Math.imul(s, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

/* ---------------- world state ---------------- */

const SPEED = 220;          // world px per second (road speed)
let dist = 0;               // total world distance travelled
let t  = 0;                 // elapsed seconds
let last = performance.now();

/* layout anchors (fractions of H) — recomputed each frame from H */
function layout() {
  return {
    horizon:  H * 0.44,
    grassTop: H * 0.56,
    roadTop:  H * 0.74,
    roadBot:  H * 0.90,
    wheelY:   H * 0.855,
    carX:     W * 0.42,
    carScale: clamp(H / 720, 0.6, 1.7),
  };
}

/* ---------------- sky ---------------- */

const starRnd = mulberry32(1234);
const stars = [];
for (let i = 0; i < 110; i++) {
  stars.push({
    x: starRnd(), y: starRnd() * 0.55,
    r: 0.5 + starRnd() * 1.1,
    ph: starRnd() * Math.PI * 2,
    a: 0.25 + starRnd() * 0.55,
  });
}

const cloudRnd = mulberry32(777);
const clouds = [];
for (let i = 0; i < 7; i++) {
  const puffs = [];
  const n = 3 + Math.floor(cloudRnd() * 3);
  for (let j = 0; j < n; j++) {
    puffs.push({ dx: (j - n / 2) * 46 + cloudRnd() * 24, dy: (cloudRnd() - 0.5) * 16, r: 26 + cloudRnd() * 30 });
  }
  clouds.push({
    x: cloudRnd() * 1.4, y: 0.10 + cloudRnd() * 0.26,
    s: 0.7 + cloudRnd() * 1.1, v: 5 + cloudRnd() * 9, puffs,
    warm: 0.08 + cloudRnd() * 0.07,
  });
}

const birdRnd = mulberry32(4242);
const birds = [];
for (let i = 0; i < 4; i++) {
  birds.push({ x: birdRnd(), y: 0.18 + birdRnd() * 0.2, s: 5 + birdRnd() * 5, ph: birdRnd() * 7, v: 26 + birdRnd() * 22 });
}

function drawSky(L) {
  const sky = ctx.createLinearGradient(0, 0, 0, L.horizon * 1.12);
  sky.addColorStop(0.00, "#111731");
  sky.addColorStop(0.34, "#2e2c56");
  sky.addColorStop(0.58, "#5d4370");
  sky.addColorStop(0.80, "#a5626a");
  sky.addColorStop(1.00, "#e89a5f");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, L.horizon + 4);

  /* stars — fade in higher up */
  for (const s of stars) {
    const y = s.y * H;
    const fade = clamp(1 - s.y / 0.55, 0, 1);
    const tw = 0.55 + 0.45 * Math.sin(t * 1.8 + s.ph);
    ctx.globalAlpha = s.a * fade * fade * tw;
    ctx.fillStyle = "#cfd6ff";
    ctx.fillRect(s.x * W, y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  /* sun, low on the horizon */
  const sunX = W * 0.74, sunY = L.horizon - 24;
  const glowR = 240 * (1 + 0.03 * Math.sin(t * 1.7));
  const g = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, glowR);
  g.addColorStop(0.0, "rgba(255,206,150,0.85)");
  g.addColorStop(0.25, "rgba(255,158,94,0.42)");
  g.addColorStop(1.0, "rgba(255,140,80,0)");
  ctx.fillStyle = g;
  ctx.fillRect(sunX - glowR, sunY - glowR, glowR * 2, glowR * 2);
  ctx.fillStyle = "#ffe3b0";
  ctx.beginPath(); ctx.arc(sunX, sunY, 30, 0, Math.PI * 2); ctx.fill();

  /* thin warm bands crossing the sun */
  ctx.save();
  ctx.globalAlpha = 0.20;
  ctx.fillStyle = "#b3574a";
  for (let i = 0; i < 3; i++) {
    const by = sunY + 6 + i * 9 + Math.sin(t * 0.6 + i) * 2;
    ctx.fillRect(sunX - 46, by, 92, 2.4 + i * 0.8);
  }
  ctx.restore();

  /* clouds */
  for (const c of clouds) {
    const cx = c.x * (W + 600) - dist * 0.015 - t * c.v;
    const wrapped = ((cx % (W + 600)) + (W + 600)) % (W + 600) - 300;
    const cy = c.y * H;
    for (const p of c.puffs) {
      ctx.fillStyle = "rgba(74,58,102,0.30)";
      ctx.beginPath(); ctx.ellipse(wrapped + p.dx * c.s, cy + p.dy * c.s + 6, p.r * c.s, p.r * 0.42 * c.s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,176,138," + c.warm.toFixed(3) + ")";
      ctx.beginPath(); ctx.ellipse(wrapped + p.dx * c.s, cy + p.dy * c.s, p.r * c.s, p.r * 0.46 * c.s, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* distant birds */
  ctx.strokeStyle = "rgba(24,22,36,0.75)";
  ctx.lineWidth = 1.4;
  for (const b of birds) {
    const bx = b.x * W - t * (b.v + SPEED * 0.06);
    const wrapped = ((bx % (W + 120)) + (W + 120)) % (W + 120) - 60;
    const by = b.y * H + Math.sin(t * 0.7 + b.ph) * 6;
    const f = Math.sin(t * 6 + b.ph) * 0.6 + 0.4;
    ctx.beginPath();
    ctx.moveTo(wrapped - b.s, by - b.s * f);
    ctx.quadraticCurveTo(wrapped, by + b.s * 0.35 * f, wrapped, by);
    ctx.quadraticCurveTo(wrapped, by + b.s * 0.35 * f, wrapped + b.s, by - b.s * f);
    ctx.stroke();
  }
}

/* ---------------- ridged hills (pure functions of world-x) ---------------- */

function ridgeY(wx, seed, amp, base) {
  const r =
    Math.sin(wx * 0.00110 + seed) * 0.55 +
    Math.sin(wx * 0.00270 + seed * 1.7 + 1.3) * 0.30 +
    Math.sin(wx * 0.00610 + seed * 2.3 + 4.1) * 0.15;
  return base - amp * (0.5 + 0.5 * r);
}

function drawRidgeLayer(par, baseFrac, ampFrac, seed, color, haze) {
  const L = layout();
  const base = L.horizon + baseFrac * H;
  const amp  = ampFrac * H;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  const step = 8;
  for (let x = -step; x <= W + step; x += step) {
    ctx.lineTo(x, ridgeY(x + dist * par, seed, amp, base));
  }
  ctx.lineTo(W + step, H);
  ctx.closePath();
  ctx.fill();
  if (haze) {
    const hg = ctx.createLinearGradient(0, L.horizon, 0, base + amp * 0.5);
    hg.addColorStop(0, haze);
    hg.addColorStop(1, "rgba(232,154,95,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, L.horizon, W, base + amp - L.horizon);
  }
}

/* ---------------- treeline band ---------------- */

function drawTreeline(L) {
  const par = 0.30, tile = 56;
  const base = L.grassTop + H * 0.035;
  ctx.fillStyle = "#23253c";
  ctx.beginPath();
  ctx.moveTo(0, L.grassTop + H * 0.12);
  const k0 = Math.floor((dist * par - tile) / tile);
  const k1 = Math.floor((dist * par + W + tile) / tile) + 1;
  for (let k = k0; k <= k1; k++) {
    const x = k * tile - dist * par;
    const h = 10 + h1(k, 91) * 34;
    const w = tile * (0.6 + h1(k, 92) * 0.5);
    ctx.lineTo(x - w / 2, base);
    ctx.quadraticCurveTo(x, base - h, x + w / 2, base);
  }
  ctx.lineTo(W, L.grassTop + H * 0.12);
  ctx.closePath();
  ctx.fill();
}

/* ---------------- ground, road ---------------- */

function drawGround(L) {
  const g = ctx.createLinearGradient(0, L.grassTop - H * 0.05, 0, L.roadTop);
  g.addColorStop(0, "#4d4257");
  g.addColorStop(0.5, "#3c3a50");
  g.addColorStop(1, "#2e3143");
  ctx.fillStyle = g;
  ctx.fillRect(0, L.horizon, W, L.roadTop - L.horizon);

  /* warm sun wash on the far grass */
  const wash = ctx.createRadialGradient(W * 0.74, L.horizon, 10, W * 0.74, L.horizon, W * 0.55);
  wash.addColorStop(0, "rgba(255,160,90,0.10)");
  wash.addColorStop(1, "rgba(255,160,90,0)");
  ctx.fillStyle = wash;
  ctx.fillRect(0, L.horizon, W, L.roadTop - L.horizon);

  /* grass tufts — deterministic per tile, two bands */
  for (let band = 0; band < 2; band++) {
    const par = band === 0 ? 0.82 : 0.94;
    const tile = 46;
    const yBand0 = L.grassTop + (L.roadTop - L.grassTop) * (band === 0 ? 0.10 : 0.42);
    const yBand1 = L.grassTop + (L.roadTop - L.grassTop) * (band === 0 ? 0.55 : 0.95);
    const k0 = Math.floor((dist * par - tile) / tile);
    const k1 = Math.floor((dist * par + W + tile) / tile) + 1;
    ctx.lineWidth = 1.3;
    for (let k = k0; k <= k1; k++) {
      const r1 = h1(k, 101 + band * 7);
      if (r1 < 0.30) continue;
      const x = (k + h1(k, 103 + band * 7) * 0.8) * tile - dist * par;
      const y = lerp(yBand0, yBand1, h1(k, 105 + band * 7));
      const n = 3 + Math.floor(h1(k, 107 + band * 7) * 4);
      const lean = (h1(k, 109 + band * 7) - 0.5) * 6;
      ctx.strokeStyle = band === 0 ? "rgba(120,110,90,0.30)" : "rgba(150,128,96,0.40)";
      for (let i = 0; i < n; i++) {
        const bx = x + (i - n / 2) * 3.2;
        const bh = 5 + h1(k * 31 + i, 111 + band) * 8;
        ctx.beginPath();
        ctx.moveTo(bx, y);
        ctx.quadraticCurveTo(bx + lean * 0.4, y - bh * 0.6, bx + lean, y - bh);
        ctx.stroke();
      }
    }
  }
}

function drawRoad(L) {
  /* asphalt */
  const g = ctx.createLinearGradient(0, L.roadTop, 0, L.roadBot);
  g.addColorStop(0, "#2b2d38");
  g.addColorStop(0.5, "#23252e");
  g.addColorStop(1, "#1b1c24");
  ctx.fillStyle = g;
  ctx.fillRect(0, L.roadTop, W, L.roadBot - L.roadTop);

  /* far shoulder line */
  ctx.fillStyle = "#4a4d5c";
  ctx.fillRect(0, L.roadTop, W, 2.5);
  ctx.fillStyle = "rgba(255,170,110,0.12)";
  ctx.fillRect(0, L.roadTop + 2.5, W, 2);

  /* sun sheen travelling across the tarmac */
  const sheenX = ((t * SPEED * 0.35) % (W * 1.4)) - W * 0.2;
  const sg = ctx.createLinearGradient(sheenX - 180, 0, sheenX + 180, 0);
  sg.addColorStop(0, "rgba(255,170,110,0)");
  sg.addColorStop(0.5, "rgba(255,170,110,0.05)");
  sg.addColorStop(1, "rgba(255,170,110,0)");
  ctx.fillStyle = sg;
  ctx.fillRect(sheenX - 180, L.roadTop, 360, L.roadBot - L.roadTop);

  /* speckle texture, scrolls with road */
  ctx.fillStyle = "rgba(0,0,0,0.16)";
  const sp = 37;
  const k0 = Math.floor(dist / sp) - 1;
  const k1 = k0 + Math.ceil(W / sp) + 2;
  for (let k = k0; k <= k1; k++) {
    for (let j = 0; j < 3; j++) {
      const x = k * sp + h1(k * 5 + j, 501) * sp - dist;
      const y = lerp(L.roadTop + 6, L.roadBot - 6, h1(k * 7 + j, 503));
      ctx.fillRect(x, y, 1.6, 1.6);
    }
  }

  /* near edge + curb */
  ctx.fillStyle = "#43465a";
  ctx.fillRect(0, L.roadBot - 3, W, 3);
  ctx.fillStyle = "#15161d";
  ctx.fillRect(0, L.roadBot, W, H - L.roadBot);

  /* lane dashes */
  const laneY = L.roadTop + (L.roadBot - L.roadTop) * 0.46;
  const dashLen = 72, gap = 58, period = dashLen + gap;
  const off = dist % period;
  ctx.fillStyle = "rgba(214,196,150,0.85)";
  for (let x = -off - period; x < W + period; x += period) {
    ctx.fillRect(x, laneY - 2.5, dashLen, 5);
  }
}

/* ---------------- roadside (poles, wires, signs, bushes, guardrail) ------- */

const POLE_SP = 700;

function poleScreenX(k, L) { return k * POLE_SP - dist; }

function drawRoadside(L) {
  const k0 = Math.floor(dist / POLE_SP) - 2;
  const k1 = Math.floor((dist + W) / POLE_SP) + 2;

  /* guardrail along the far edge */
  const railY = L.roadTop - 9;
  ctx.fillStyle = "rgba(20,20,28,0.35)";
  ctx.fillRect(0, L.roadTop - 2, W, 2);
  ctx.fillStyle = "#484c5e";
  ctx.fillRect(0, railY, W, 5);
  ctx.fillStyle = "rgba(255,190,140,0.16)";
  ctx.fillRect(0, railY, W, 1.6);
  ctx.fillStyle = "#3a3e50";
  const gp = 64;
  const g0 = Math.floor(dist / gp) - 1;
  const g1 = g0 + Math.ceil(W / gp) + 2;
  for (let k = g0; k <= g1; k++) {
    const x = k * gp - dist;
    ctx.fillRect(x, railY - 2, 5, L.roadTop - railY + 4);
  }

  /* utility poles */
  const poleH = H * 0.30;
  const baseY = L.roadTop - 4;
  for (let k = k0; k <= k1; k++) {
    const x = poleScreenX(k, L);
    if (x < -60 || x > W + 60) continue;
    const sway = Math.sin(k * 12.9898) * 1.2;
    /* soft shadow to the left (sun is right) */
    ctx.fillStyle = "rgba(10,10,18,0.25)";
    ctx.beginPath();
    ctx.ellipse(x - 18, baseY + 3, 34, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    /* pole */
    const pg = ctx.createLinearGradient(x - 3, 0, x + 3, 0);
    pg.addColorStop(0, "#232532");
    pg.addColorStop(0.5, "#34364a");
    pg.addColorStop(1, "#1c1e2a");
    ctx.fillStyle = pg;
    ctx.fillRect(x - 3 + sway * 0.3, baseY - poleH, 6, poleH);
    /* crossarm + insulators */
    const armY = baseY - poleH * 0.86;
    ctx.fillRect(x - 26 + sway, armY, 52, 4);
    ctx.fillStyle = "#15161f";
    for (const dx of [-22, -7.5, 7.5, 22]) {
      ctx.fillRect(x + dx - 2 + sway, armY + 3, 4, 7);
    }
  }

  /* catenary wires between successive poles */
  ctx.strokeStyle = "rgba(16,17,26,0.85)";
  ctx.lineWidth = 1.3;
  const armY = L.roadTop - 4 - H * 0.30 * 0.86 + 8;
  for (let k = k0; k < k1; k++) {
    const xa = poleScreenX(k, L);
    const xb = poleScreenX(k + 1, L);
    if (xb < -80 || xa > W + 80) continue;
    const sag = 26 + (h1(k, 707) - 0.5) * 10;
    ctx.beginPath();
    ctx.moveTo(xa - 22, armY);
    ctx.quadraticCurveTo((xa + xb) / 2, armY + sag, xb + 22, armY);
    ctx.stroke();
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(xa + 22, armY + 2);
    ctx.quadraticCurveTo((xa + xb) / 2, armY + sag + 14, xb - 22, armY + 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* signs, bushes, rocks — hashed per tile */
  const tile = 110;
  const s0 = Math.floor((dist - tile) / tile);
  const s1 = Math.floor((dist + W + tile) / tile) + 1;
  for (let k = s0; k <= s1; k++) {
    const r = h1(k, 201);
    const x = (k + h1(k, 203) * 0.7) * tile - dist;
    if (x < -80 || x > W + 80) continue;
    const by = L.roadTop - 6 - h1(k, 205) * 8;

    if (r > 0.86) {
      /* road sign */
      const sw = 34, sh = h1(k, 207) > 0.5 ? 22 : 30;
      const postH = H * 0.10;
      ctx.fillStyle = "#2c2e3c";
      ctx.fillRect(x - 2.5, by - postH, 5, postH);
      const panelY = by - postH - sh;
      ctx.fillStyle = "rgba(10,10,16,0.3)";
      ctx.fillRect(x - sw / 2 + 4, panelY + 3, sw, sh);
      if (h1(k, 209) > 0.5) {
        ctx.fillStyle = "#3f6d4f";
        ctx.fillRect(x - sw / 2, panelY, sw, sh * 0.72);
        ctx.fillStyle = "rgba(235,240,235,0.85)";
        ctx.fillRect(x - sw / 2 + 5, panelY + 5, sw - 10, 3);
        ctx.fillRect(x - sw / 2 + 5, panelY + 11, sw - 14, 3);
      } else {
        ctx.save();
        ctx.translate(x, panelY + sw / 2);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "#c9a23a";
        ctx.fillRect(-sw * 0.42, -sw * 0.42, sw * 0.84, sw * 0.84);
        ctx.strokeStyle = "#2a2a30";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-sw * 0.42, -sw * 0.42, sw * 0.84, sw * 0.84);
        ctx.restore();
      }
    } else if (r > 0.62) {
      /* bush cluster */
      const n = 2 + Math.floor(h1(k, 211) * 3);
      for (let i = 0; i < n; i++) {
        const bx = x + (i - n / 2) * 14 + h1(k * 13 + i, 213) * 8;
        const br = 9 + h1(k * 17 + i, 215) * 13;
        const bg = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.8, 1, bx, by - br * 0.4, br * 1.4);
        bg.addColorStop(0, "#3d4a52");
        bg.addColorStop(1, "#232b33");
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(bx, by - br * 0.45, br, 0, Math.PI * 2);
        ctx.fill();
        /* warm rim from the setting sun */
        ctx.fillStyle = "rgba(255,160,100,0.14)";
        ctx.beginPath();
        ctx.arc(bx + br * 0.25, by - br * 0.5, br * 0.8, -1.1, 1.1);
        ctx.fill();
      }
      ctx.fillStyle = "rgba(10,10,16,0.3)";
      ctx.beginPath();
      ctx.ellipse(x, by + 2, 30, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (r > 0.52) {
      /* rock */
      const rw = 12 + h1(k, 217) * 16;
      ctx.fillStyle = "#3a3946";
      ctx.beginPath();
      ctx.moveTo(x - rw, by);
      ctx.lineTo(x - rw * 0.4, by - rw * 0.7);
      ctx.lineTo(x + rw * 0.5, by - rw * 0.55);
      ctx.lineTo(x + rw, by);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255,170,110,0.10)";
      ctx.beginPath();
      ctx.moveTo(x + rw * 0.5, by - rw * 0.55);
      ctx.lineTo(x + rw, by);
      ctx.lineTo(x + rw * 0.3, by);
      ctx.closePath();
      ctx.fill();
    }
  }
}

/* ---------------- near ground (closest to camera, fastest) ---------------- */

function drawNearGround(L) {
  const y0 = L.roadBot;
  const g = ctx.createLinearGradient(0, y0, 0, H);
  g.addColorStop(0, "#181a24");
  g.addColorStop(1, "#0d0e15");
  ctx.fillStyle = g;
  ctx.fillRect(0, y0, W, H - y0);

  const tile = 90;
  const par = 1.30;
  const k0 = Math.floor((dist * par - tile) / tile);
  const k1 = Math.floor((dist * par + W + tile) / tile) + 1;
  for (let k = k0; k <= k1; k++) {
    const r = h1(k, 301);
    const x = (k + h1(k, 303) * 0.8) * tile - dist * par;
    const y = lerp(y0 + 14, H - 8, h1(k, 305));
    const n = 5 + Math.floor(h1(k, 307) * 5);
    const lean = (h1(k, 309) - 0.5) * 10;
    const s = 1.1 + h1(k, 311) * 0.9;
    ctx.strokeStyle = "rgba(14,16,22,0.9)";
    ctx.lineWidth = 2.2 * s;
    ctx.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const bx = x + (i - n / 2) * 4.5 * s;
      const bh = 14 + h1(k * 31 + i, 313) * 22 * s;
      ctx.beginPath();
      ctx.moveTo(bx, y);
      ctx.quadraticCurveTo(bx + lean * 0.5, y - bh * 0.55, bx + lean, y - bh);
      ctx.stroke();
    }
    if (r > 0.9) { /* wildflower */
      ctx.fillStyle = "rgba(226,178,120,0.8)";
      ctx.beginPath(); ctx.arc(x + lean, y - 26 * s, 2.6 * s, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.lineCap = "butt";
}

/* ---------------- the car ---------------- */

const exhaust = [];
let exAcc = 0;

function drawCar(L) {
  const s = L.carScale;
  const cx = L.carX;
  const wheelY = L.wheelY;

  /* suspension: body bobs and pitches relative to the road; wheels stay planted */
  const bob   = Math.sin(t * 6.3) * 1.4 + Math.sin(t * 9.7 + 1.2) * 0.8;
  const pitch = Math.sin(t * 4.9 + 0.5) * 0.0035 + Math.sin(t * 7.7) * 0.0018;
  const rot   = dist / 34;          /* true rolling: angle = distance / radius */

  ctx.save();
  ctx.translate(cx, wheelY);
  ctx.scale(s, s);

  /* shadow (sun is to the right, shadow falls left) */
  ctx.fillStyle = "rgba(8,8,14,0.4)";
  ctx.beginPath();
  ctx.ellipse(-14, 2, 200, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  const wheelX = 120, rearX = -120, R = 34;

  /* wheel wells first (dark ring visible around the tyres) */
  for (const wx of [wheelX, rearX]) {
    ctx.fillStyle = "#0d0e13";
    ctx.beginPath(); ctx.arc(wx, -R, R + 10, 0, Math.PI * 2); ctx.fill();
  }

  /* wheels */
  for (const wx of [wheelX, rearX]) {
    ctx.save();
    ctx.translate(wx, -R);
    /* tyre */
    ctx.fillStyle = "#14151a";
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, R - 1.5, -2.4, -0.7); ctx.stroke();
    /* tread notches */
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) {
      const a = rot + i * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (R - 4.5), Math.sin(a) * (R - 4.5));
      ctx.lineTo(Math.cos(a) * (R - 0.5), Math.sin(a) * (R - 0.5));
      ctx.stroke();
    }
    /* brake disc */
    ctx.fillStyle = "#585d68";
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    /* rim: 5 spokes, ghosted for motion blur */
    for (const ghost of [0, 0.35]) {
      ctx.strokeStyle = ghost === 0 ? "rgba(214,218,226,0.95)" : "rgba(214,218,226,0.35)";
      ctx.lineWidth = 7;
      for (let i = 0; i < 5; i++) {
        const a = rot + ghost + i * Math.PI * 2 / 5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
        ctx.lineTo(Math.cos(a) * 25, Math.sin(a) * 25);
        ctx.stroke();
      }
    }
    /* rim ring + hub */
    ctx.strokeStyle = "#c9cdd4";
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(0, 0, 26.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#e6e8ec";
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a8f99";
    ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* body — bobs on its suspension */
  ctx.save();
  ctx.translate(0, bob);
  ctx.rotate(pitch);

  const body = new Path2D();
  body.moveTo(-178, -14);
  body.lineTo(-184, -40);
  body.quadraticCurveTo(-182, -58, -164, -62);
  body.lineTo(-112, -68);
  body.quadraticCurveTo(-96, -100, -52, -104);
  body.quadraticCurveTo(-10, -110, 34, -104);
  body.quadraticCurveTo(78, -100, 96, -64);
  body.lineTo(148, -56);
  body.quadraticCurveTo(184, -52, 188, -38);
  body.lineTo(188, -14);
  body.lineTo(162, -14);
  body.arc(wheelX, -R, 44, 0, Math.PI, true);
  body.lineTo(-78, -14);
  body.arc(rearX, -R, 44, 0, Math.PI, true);
  body.lineTo(-178, -14);
  body.closePath();

  const paint = ctx.createLinearGradient(0, -110, 0, -10);
  paint.addColorStop(0.00, "#a8434f");
  paint.addColorStop(0.30, "#8c2f3c");
  paint.addColorStop(0.62, "#6d2331");
  paint.addColorStop(1.00, "#471823");
  ctx.fillStyle = paint;
  ctx.fill(body);

  /* glass band */
  const glass = new Path2D();
  glass.moveTo(-102, -70);
  glass.quadraticCurveTo(-92, -98, -54, -102);
  glass.quadraticCurveTo(-10, -108, 30, -102);
  glass.quadraticCurveTo(68, -98, 88, -68);
  glass.closePath();
  const gg = ctx.createLinearGradient(0, -108, 0, -66);
  gg.addColorStop(0, "#232c4a");
  gg.addColorStop(0.55, "#39406b");
  gg.addColorStop(0.85, "#8a5a54");
  gg.addColorStop(1, "#c97a50");
  ctx.fillStyle = gg;
  ctx.fill(glass);
  /* sunset glint drifting across the glass */
  ctx.save();
  ctx.clip(glass);
  const gx = -110 + ((t * 46) % 280);
  const gl = ctx.createLinearGradient(gx - 30, 0, gx + 30, 0);
  gl.addColorStop(0, "rgba(255,255,255,0)");
  gl.addColorStop(0.5, "rgba(255,240,220,0.14)");
  gl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gl;
  ctx.fillRect(gx - 30, -110, 60, 48);
  ctx.restore();
  /* B pillar */
  ctx.fillStyle = "#5a1f2a";
  ctx.beginPath();
  ctx.moveTo(-6, -104); ctx.lineTo(8, -104); ctx.lineTo(2, -68); ctx.lineTo(-10, -68);
  ctx.closePath(); ctx.fill();
  /* window frame + chrome sill line */
  ctx.strokeStyle = "rgba(20,16,22,0.9)";
  ctx.lineWidth = 2.5;
  ctx.stroke(glass);
  ctx.strokeStyle = "rgba(220,200,180,0.35)";
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-104, -68); ctx.lineTo(90, -66); ctx.stroke();

  /* passing-scene highlight travelling along the flank */
  ctx.save();
  ctx.clip(body);
  const bx = -190 + ((t * 130) % 480);
  const bl = ctx.createLinearGradient(bx - 40, 0, bx + 40, 0);
  bl.addColorStop(0, "rgba(255,255,255,0)");
  bl.addColorStop(0.5, "rgba(255,235,215,0.06)");
  bl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = bl;
  ctx.fillRect(bx - 40, -112, 80, 100);
  /* fixed warm sun-side sheen */
  const sh2 = ctx.createLinearGradient(0, -70, 90, -40);
  sh2.addColorStop(0, "rgba(255,170,110,0)");
  sh2.addColorStop(1, "rgba(255,170,110,0.10)");
  ctx.fillStyle = sh2;
  ctx.fillRect(0, -110, 190, 100);
  /* character line */
  ctx.strokeStyle = "rgba(30,10,16,0.35)";
  ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-168, -44); ctx.quadraticCurveTo(0, -50, 180, -42); ctx.stroke();
  /* lower rocker shade */
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fillRect(-176, -20, 360, 8);
  ctx.restore();

  /* door seams + handles */
  ctx.strokeStyle = "rgba(24,8,14,0.5)";
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-4, -66); ctx.lineTo(-6, -16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(86, -64); ctx.lineTo(88, -16); ctx.stroke();
  ctx.fillStyle = "rgba(235,225,210,0.5)";
  ctx.fillRect(28, -48, 16, 4);
  ctx.fillRect(-46, -48, 16, 4);

  /* mirror */
  ctx.fillStyle = "#5a1f2a";
  ctx.fillRect(84, -78, 4, 8);
  ctx.beginPath();
  ctx.ellipse(90, -80, 8, 5.5, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#2c3554";
  ctx.beginPath(); ctx.ellipse(91, -80, 5.5, 3.4, -0.2, 0, Math.PI * 2); ctx.fill();

  /* roofline + antenna */
  ctx.strokeStyle = "rgba(255,220,190,0.35)";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-50, -104.5);
  ctx.quadraticCurveTo(-10, -110.5, 34, -104.5);
  ctx.stroke();
  ctx.strokeStyle = "rgba(30,20,30,0.8)";
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-58, -104); ctx.quadraticCurveTo(-66, -116, -72, -120); ctx.stroke();

  /* headlight */
  ctx.fillStyle = "#ffedc8";
  ctx.beginPath();
  ctx.moveTo(156, -52);
  ctx.quadraticCurveTo(184, -50, 186, -42);
  ctx.lineTo(156, -40);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgba(255,236,190,0.9)";
  ctx.beginPath(); ctx.ellipse(176, -45, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();

  /* taillight */
  ctx.fillStyle = "#e23b30";
  ctx.beginPath();
  ctx.moveTo(-184, -46);
  ctx.lineTo(-176, -48);
  ctx.lineTo(-175, -32);
  ctx.lineTo(-183, -34);
  ctx.closePath();
  ctx.fill();

  ctx.restore(); /* body */

  /* headlight beam + tail glow (screen space of the car, additive) */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const beam = ctx.createLinearGradient(188, 0, 640, 0);
  beam.addColorStop(0, "rgba(255,214,150,0.16)");
  beam.addColorStop(1, "rgba(255,214,150,0)");
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(186, -50);
  ctx.lineTo(640, -78);
  ctx.lineTo(640, 6);
  ctx.lineTo(186, -34);
  ctx.closePath();
  ctx.fill();
  const tl = ctx.createRadialGradient(-186, -40, 2, -186, -40, 30);
  tl.addColorStop(0, "rgba(255,70,50,0.30)");
  tl.addColorStop(1, "rgba(255,70,50,0)");
  ctx.fillStyle = tl;
  ctx.fillRect(-216, -70, 60, 60);
  ctx.restore();

  ctx.restore(); /* car transform */

  /* exhaust puffs (screen space) */
  exAcc += 1 / 60;
  const exX = cx + (rearX - 26) * s;
  const exY = wheelY - 10 * s + bob * s;
  if (exAcc > 0.10) {
    exAcc = 0;
    exhaust.push({
      x: exX, y: exY,
      vx: -(55 + Math.random() * 30), vy: -(6 + Math.random() * 14),
      life: 1, size: (2.5 + Math.random() * 2.5) * s,
    });
  }
  for (let i = exhaust.length - 1; i >= 0; i--) {
    const p = exhaust[i];
    p.life -= 0.016 / 0.95;
    p.x += p.vx * 0.016;
    p.y += p.vy * 0.016;
    p.size += 0.09 * s;
    if (p.life <= 0) { exhaust.splice(i, 1); continue; }
    ctx.fillStyle = "rgba(176,176,190," + (p.life * 0.22).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------------- post: grade, vignette, grain, letterbox ---------------- */

let grainTile = null;
function makeGrain() {
  grainTile = document.createElement("canvas");
  grainTile.width = 160; grainTile.height = 160;
  const g = grainTile.getContext("2d");
  const img = g.createImageData(160, 160);
  const rnd = mulberry32(99);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 90 + rnd() * 130;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}
makeGrain();
let grainFrame = 0;

function drawPost(L) {
  /* gentle color grade: cool corners, warm heart */
  ctx.save();
  ctx.globalCompositeOperation = "soft-light";
  const cg = ctx.createRadialGradient(W * 0.72, H * 0.42, H * 0.1, W * 0.5, H * 0.5, W * 0.75);
  cg.addColorStop(0, "rgba(255,170,110,0.55)");
  cg.addColorStop(1, "rgba(70,90,160,0.55)");
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  /* vignette */
  const v = ctx.createRadialGradient(W * 0.5, H * 0.46, H * 0.42, W * 0.5, H * 0.5, H * 0.95);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(4,4,10,0.42)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  /* film grain */
  grainFrame = (grainFrame + 1) % 8;
  if (grainTile) {
    ctx.save();
    ctx.globalAlpha = 0.05;
    const ox = (grainFrame * 37) % 160;
    const oy = (grainFrame * 53) % 160;
    for (let x = -ox; x < W; x += 160)
      for (let y = -oy; y < H; y += 160)
        ctx.drawImage(grainTile, x, y);
    ctx.restore();
  }

  /* letterbox */
  const bar = Math.max(10, H * 0.045);
  ctx.fillStyle = "#05060a";
  ctx.fillRect(0, 0, W, bar);
  ctx.fillRect(0, H - bar, W, bar);
}

/* ---------------- main loop ---------------- */

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  t += dt;
  dist += SPEED * dt;

  const L = layout();
  ctx.clearRect(0, 0, W, H);

  drawSky(L);
  drawRidgeLayer(0.045, 0.010, 0.165, 3.1, "#5a527b", "rgba(232,154,95,0.10)");
  drawRidgeLayer(0.075, 0.018, 0.125, 8.7, "#463f6a", "rgba(232,154,95,0.07)");
  drawRidgeLayer(0.160, 0.030, 0.085, 14.2, "#35325a", null);
  drawTreeline(L);
  drawGround(L);
  drawRoad(L);
  drawRoadside(L);
  drawCar(L);
  drawNearGround(L);
  drawPost(L);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
