<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunset Drive — Parallax Car (vanilla canvas)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14092b; }
  #c { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- deterministic scenery (seeded PRNG) ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- layout anchors (fractions of viewport height) ---------- */
const L = {
  horizon:   0.545,  // where distant mountains meet the sky
  hillBase:  0.615,  // mid hills base line
  fieldTop:  0.635,  // near field top (fence / bushes)
  roadTop:   0.72,   // far edge of asphalt
  wheelY:    0.845,  // car tyre contact line
};

/* ---------- palette (dusk / sunset) ---------- */
const PAL = {
  skyTop:     '#1b1038',
  skyMid:     '#5c2a5e',
  skyLow:     '#c65a4e',
  horizonGlow:'#ff9e4f',
  sunCore:    '#ffd9a0',
  sunHalo:    'rgba(255,158,79,0.35)',
  cloud:      'rgba(255,170,120,0.16)',
  mtnFar:     '#4a2b52',
  mtnNear:    '#3a2144',
  hill:       '#2e1c3d',
  treeDark:   '#241533',
  field:      '#20132f',
  fence:      '#170d26',
  pole:       '#120a1f',
  lampGlow:   'rgba(255,190,110,0.85)',
  roadFar:    '#241a33',
  roadNear:   '#171021',
  dash:       'rgba(255,205,130,0.55)',
  carBody:    '#8e2f3c',
  carBodyHi:  '#d96a4f',
  carGlass:   '#2b1e46',
  glassGlint: 'rgba(255,170,110,0.35)',
  tyre:       '#0d0817',
  rim:        '#c9a06a',
  shadow:     'rgba(8,4,16,0.55)',
};

/* ---------- scenery tiles (generated once, drawn with wrap) ---------- */

// Distant mountains: periodic ridge so the tile is seamless by construction.
const MTN_T = 2600;
function mtnRidge(x, seedPhase, amp, base) {
  const u = x / MTN_T * Math.PI * 2;
  return base
    - amp * (0.55 + 0.45 * Math.sin(u * 1 + seedPhase))
    - amp * 0.38 * Math.sin(u * 2.7 + seedPhase * 1.9)
    - amp * 0.22 * Math.sin(u * 6.1 + seedPhase * 3.3);
}

// Mid hills: also periodic.
const HILL_T = 1800;
function hillRidge(x, phase) {
  const u = x / HILL_T * Math.PI * 2;
  return L.hillBase * H
    - (H * 0.045) * (0.6 + 0.4 * Math.sin(u + phase))
    - (H * 0.03) * Math.sin(u * 3 + phase * 2.1);
}

// Trees on the mid hills: fixed positions per tile, varied shapes.
const TREES = (() => {
  const rnd = mulberry32(1337);
  const arr = [];
  for (let i = 0; i < 26; i++) {
    arr.push({
      x: rnd() * HILL_T,
      s: 0.5 + rnd() * 0.9,          // size factor
      kind: rnd() < 0.45 ? 'pine' : 'round',
      lean: (rnd() - 0.5) * 0.12,
    });
  }
  return arr;
})();

// Near field: fence posts + bushes per tile.
const FIELD_T = 900;
const FENCE = (() => {
  const rnd = mulberry32(4242);
  const arr = [];
  for (let i = 0; i < 6; i++) arr.push({ x: (i + rnd() * 0.7) / 6 * FIELD_T, h: 0.85 + rnd() * 0.3 });
  return arr;
})();
const BUSHES = (() => {
  const rnd = mulberry32(9001);
  const arr = [];
  for (let i = 0; i < 7; i++) arr.push({ x: rnd() * FIELD_T, s: 0.5 + rnd() * 1.1 });
  return arr;
})();

// Street lamps just behind the road edge — fastest scenery layer before the car.
const LAMP_T = 640;
const LAMPS = [{ x: 80 }, { x: 420 }];

/* ---------- clouds (drift on their own, slowest of all) ---------- */
const CLOUDS = (() => {
  const rnd = mulberry32(777);
  const arr = [];
  for (let i = 0; i < 6; i++) {
    arr.push({ x: rnd(), y: 0.08 + rnd() * 0.3, w: 140 + rnd() * 260, h: 14 + rnd() * 18, v: 0.004 + rnd() * 0.006 });
  }
  return arr;
})();

/* ---------- scroll state ---------- */
const SPEED = 340; // px/s at road speed (layer speeds are fractions of this)
let scroll = 0;    // master distance travelled in px
let t = 0;         // seconds elapsed
let last = performance.now();

function wrapOffset(tileW, factor) {
  return -((scroll * factor) % tileW);
}

/* ---------- drawing helpers ---------- */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, L.horizon * H + H * 0.12);
  g.addColorStop(0, PAL.skyTop);
  g.addColorStop(0.55, PAL.skyMid);
  g.addColorStop(0.85, PAL.skyLow);
  g.addColorStop(1, PAL.horizonGlow);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, L.horizon * H + H * 0.12);

  // sun low on the horizon
  const sx = W * 0.72, sy = L.horizon * H - H * 0.045;
  let halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.34);
  halo.addColorStop(0, 'rgba(255,190,120,0.55)');
  halo.addColorStop(0.35, PAL.sunHalo);
  halo.addColorStop(1, 'rgba(255,158,79,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(sx - H * 0.4, sy - H * 0.4, H * 0.8, H * 0.8);

  const core = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.055);
  core.addColorStop(0, PAL.sunCore);
  core.addColorStop(1, '#ffb46a');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(sx, sy, H * 0.052, 0, Math.PI * 2);
  ctx.fill();

  // clouds
  for (const c of CLOUDS) {
    const cx = ((c.x - t * c.v) % 1.3 + 1.3) % 1.3 * W - W * 0.15;
    const cy = c.y * H;
    ctx.fillStyle = PAL.cloud;
    ctx.beginPath();
    ctx.ellipse(cx, cy, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - c.w * 0.28, cy + c.h * 0.18, c.w * 0.3, c.h * 0.4, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + c.w * 0.3, cy + c.h * 0.12, c.w * 0.26, c.h * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMountains() {
  // far ridge (slowest)
  const off = wrapOffset(MTN_T, 0.05);
  ctx.fillStyle = PAL.mtnFar;
  for (let rep = -1; rep <= Math.ceil(W / MTN_T) + 1; rep++) {
    const x0 = off + rep * MTN_T;
    if (x0 > W || x0 < -MTN_T) continue;
    ctx.beginPath();
    ctx.moveTo(x0, L.horizon * H);
    for (let px = 0; px <= MTN_T; px += 24) {
      ctx.lineTo(x0 + px, mtnRidge(px, 1.3, H * 0.16, L.horizon * H));
    }
    ctx.lineTo(x0 + MTN_T, L.horizon * H);
    ctx.closePath();
    ctx.fill();
  }
  // nearer ridge (slightly faster for depth)
  const off2 = wrapOffset(MTN_T, 0.085);
  ctx.fillStyle = PAL.mtnNear;
  ctx.beginPath();
  ctx.moveTo(off2 - MTN_T, L.horizon * H + H * 0.01);
  for (let px = 0; px <= MTN_T * 3; px += 24) {
    ctx.lineTo(off2 + px, mtnRidge(px, 4.7, H * 0.105, L.horizon * H + H * 0.01));
  }
  ctx.lineTo(off2 + MTN_T * 3, L.horizon * H + H * 0.01);
  ctx.closePath();
  ctx.fill();
}

function drawHillsAndTrees() {
  const off = wrapOffset(HILL_T, 0.16);
  // hills silhouette
  ctx.fillStyle = PAL.hill;
  ctx.beginPath();
  ctx.moveTo(off - HILL_T, L.horizon * H + H * 0.09);
  for (let px = 0; px <= HILL_T * 3; px += 20) {
    ctx.lineTo(off + px, hillRidge(px, 2.1));
  }
  ctx.lineTo(off + HILL_T * 3, L.horizon * H + H * 0.09);
  ctx.closePath();
  ctx.fill();

  // trees standing on the ridge (drawn per tile instance)
  for (let rep = -1; rep <= Math.ceil(W / HILL_T) + 1; rep++) {
    const x0 = off + rep * HILL_T;
    if (x0 > W + 200 || x0 < -HILL_T - 200) continue;
    for (const tr of TREES) {
      const tx = x0 + tr.x;
      if (tx < -150 || tx > W + 150) continue;
      const ty = hillRidge(tr.x, 2.1);
      drawTree(tx, ty, H * 0.05 * tr.s, tr.kind, tr.lean);
    }
  }
}

function drawTree(x, y, h, kind, lean) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(lean);
  ctx.fillStyle = PAL.treeDark;
  if (kind === 'pine') {
    const w = h * 0.52;
    for (let i = 0; i < 3; i++) {
      const fy = -h * (0.28 + i * 0.3);
      const fw = w * (1 - i * 0.26);
      ctx.beginPath();
      ctx.moveTo(0, fy - h * 0.42);
      ctx.lineTo(-fw / 2, fy);
      ctx.lineTo(fw / 2, fy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillRect(-h * 0.035, -h * 0.1, h * 0.07, h * 0.14);
  } else {
    ctx.fillRect(-h * 0.045, -h * 0.55, h * 0.09, h * 0.6);
    ctx.beginPath();
    ctx.arc(0, -h * 0.72, h * 0.34, 0, Math.PI * 2);
    ctx.arc(-h * 0.24, -h * 0.58, h * 0.26, 0, Math.PI * 2);
    ctx.arc(h * 0.24, -h * 0.6, h * 0.27, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawField() {
  const off = wrapOffset(FIELD_T, 0.38);
  // ground band between hills and road
  const g = ctx.createLinearGradient(0, L.fieldTop * H, 0, L.roadTop * H);
  g.addColorStop(0, PAL.hill);
  g.addColorStop(1, PAL.field);
  ctx.fillStyle = g;
  ctx.fillRect(0, L.fieldTop * H - H * 0.02, W, (L.roadTop - L.fieldTop) * H + H * 0.03);

  // bushes
  for (let rep = -1; rep <= Math.ceil(W / FIELD_T) + 1; rep++) {
    const x0 = off + rep * FIELD_T;
    if (x0 > W + 200 || x0 < -FIELD_T - 200) continue;
    for (const b of BUSHES) {
      const bx = x0 + b.x;
      if (bx < -100 || bx > W + 100) continue;
      const by = L.fieldTop * H + H * 0.028;
      ctx.fillStyle = PAL.treeDark;
      ctx.beginPath();
      ctx.arc(bx, by, H * 0.016 * b.s, Math.PI, 0);
      ctx.fill();
    }
  }

  // fence: two rails + posts
  const fy = L.fieldTop * H + H * 0.03;
  ctx.strokeStyle = PAL.fence;
  ctx.lineWidth = Math.max(2, H * 0.004);
  for (let rep = -1; rep <= Math.ceil(W / FIELD_T) + 1; rep++) {
    const x0 = off + rep * FIELD_T;
    if (x0 > W + FIELD_T || x0 < -FIELD_T * 2) continue;
    ctx.beginPath();
    for (const p of FENCE) {
      const px = x0 + p.x;
      const ph = H * 0.035 * p.h;
      ctx.moveTo(px, fy);
      ctx.lineTo(px, fy - ph);
    }
    ctx.stroke();
    // rails (continuous across tile)
    ctx.beginPath();
    ctx.moveTo(x0, fy - H * 0.026);
    ctx.lineTo(x0 + FIELD_T, fy - H * 0.026);
    ctx.moveTo(x0, fy - H * 0.013);
    ctx.lineTo(x0 + FIELD_T, fy - H * 0.013);
    ctx.stroke();
  }
}

function drawLamps() {
  const off = wrapOffset(LAMP_T, 0.72);
  for (let rep = -1; rep <= Math.ceil(W / LAMP_T) + 1; rep++) {
    const x0 = off + rep * LAMP_T;
    if (x0 > W + LAMP_T || x0 < -LAMP_T * 2) continue;
    for (const lp of LAMPS) {
      const px = x0 + lp.x;
      if (px < -80 || px > W + 80) continue;
      const baseY = L.roadTop * H - H * 0.005;
      const topY = baseY - H * 0.16;
      ctx.strokeStyle = PAL.pole;
      ctx.lineWidth = Math.max(3, H * 0.007);
      ctx.beginPath();
      ctx.moveTo(px, baseY);
      ctx.lineTo(px, topY);
      ctx.quadraticCurveTo(px, topY - H * 0.012, px + W * 0.018, topY - H * 0.014);
      ctx.stroke();
      // lamp head + glow (dusk: lamps are on)
      const hx = px + W * 0.018, hy = topY - H * 0.012;
      const gl = ctx.createRadialGradient(hx, hy, 0, hx, hy, H * 0.05);
      gl.addColorStop(0, PAL.lampGlow);
      gl.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.fillStyle = gl;
      ctx.beginPath();
      ctx.arc(hx, hy, H * 0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe6b8';
      ctx.beginPath();
      ctx.arc(hx, hy, Math.max(2.5, H * 0.006), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawRoad() {
  const top = L.roadTop * H;
  const g = ctx.createLinearGradient(0, top, 0, H);
  g.addColorStop(0, PAL.roadFar);
  g.addColorStop(1, PAL.roadNear);
  ctx.fillStyle = g;
  ctx.fillRect(0, top, W, H - top);

  // far edge line (curb highlight catching sunset)
  ctx.fillStyle = 'rgba(255,170,110,0.28)';
  ctx.fillRect(0, top, W, Math.max(1.5, H * 0.003));

  // lane dashes scrolling at full road speed
  const dashW = 90, gap = 70, period = dashW + gap;
  let off = -((scroll) % period);
  const dy = top + (H - top) * 0.42;
  ctx.fillStyle = PAL.dash;
  for (let x = off; x < W + period; x += period) {
    ctx.beginPath();
    ctx.roundRect(x, dy - H * 0.006, dashW, H * 0.012, 4);
    ctx.fill();
  }

  // subtle asphalt speckle (deterministic, scrolls with road)
  const rnd = mulberry32(555);
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  const spPeriod = 480;
  let soff = -((scroll * 1.0) % spPeriod);
  for (let rep = -1; rep <= Math.ceil(W / spPeriod) + 1; rep++) {
    const x0 = soff + rep * spPeriod;
    if (x0 > W + spPeriod || x0 < -spPeriod * 2) continue;
    for (let i = 0; i < 40; i++) {
      const sx = x0 + rnd() * spPeriod;
      const sy = top + H * 0.03 + rnd() * (H - top - H * 0.05);
      ctx.fillRect(sx, sy, 2, 1.4);
    }
  }
}

/* ---------- the car ---------- */
function drawCar() {
  const s = Math.min(W * 0.36, H * 0.62);   // overall car length in px
  const cx = W * 0.40;                       // fixed screen position (world moves)
  const wheelR = s * 0.105;

  // suspension: gentle bob + micro-noise, plus a tiny pitch from the bob's slope
  const bob = Math.sin(t * 6.2) * H * 0.0035 + Math.sin(t * 17.3 + 1.7) * H * 0.0012;
  const pitch = (Math.cos(t * 6.2) * 0.9 + Math.cos(t * 17.3 + 1.7) * 0.4) * 0.006;

  const groundY = L.wheelY * H;
  const bodyLift = -bob; // body moves opposite to wheel load for a sprung feel

  // shadow stays planted on the road (drawn before the body transform)
  ctx.fillStyle = PAL.shadow;
  ctx.beginPath();
  ctx.ellipse(cx, groundY + H * 0.012, s * 0.52, H * 0.02, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(cx, groundY + bodyLift);
  ctx.rotate(pitch);

  const Lx = -s / 2, Rx = s / 2;
  const deckY = -wheelR * 1.35;      // bottom of body
  const roofY = -wheelR * 3.05;      // top of cabin

  // headlight beam (dusk) — soft cone forward
  const beam = ctx.createLinearGradient(Rx, deckY, Rx + s * 0.9, deckY);
  beam.addColorStop(0, 'rgba(255,214,150,0.30)');
  beam.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(Rx - s * 0.02, deckY - wheelR * 0.75);
  ctx.lineTo(Rx + s * 0.95, deckY - wheelR * 1.6);
  ctx.lineTo(Rx + s * 0.95, deckY + H * 0.03);
  ctx.lineTo(Rx - s * 0.02, deckY - wheelR * 0.15);
  ctx.closePath();
  ctx.fill();

  // body silhouette (facing right)
  const bodyGrad = ctx.createLinearGradient(0, roofY, 0, deckY);
  bodyGrad.addColorStop(0, PAL.carBodyHi);   // sunset rim light on top surfaces
  bodyGrad.addColorStop(0.45, PAL.carBody);
  bodyGrad.addColorStop(1, '#5e1f2c');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(Lx + s * 0.03, deckY);
  ctx.lineTo(Lx - s * 0.015, deckY - wheelR * 0.62);          // rear bumper
  ctx.quadraticCurveTo(Lx - s * 0.03, deckY - wheelR * 1.05, Lx + s * 0.04, deckY - wheelR * 1.18); // trunk
  ctx.lineTo(Lx + s * 0.20, deckY - wheelR * 1.28);           // rear deck to C-pillar
  ctx.quadraticCurveTo(Lx + s * 0.30, roofY, Lx + s * 0.46, roofY); // roofline back->front
  ctx.lineTo(Rx - s * 0.16, roofY + wheelR * 0.12);           // windshield base area (roof front)
  ctx.quadraticCurveTo(Rx - s * 0.05, deckY - wheelR * 1.35, Rx + s * 0.01, deckY - wheelR * 1.05); // hood to nose
  ctx.quadraticCurveTo(Rx + s * 0.028, deckY - wheelR * 0.7, Rx - s * 0.01, deckY - wheelR * 0.45); // front bumper
  ctx.lineTo(Rx - s * 0.06, deckY);
  // wheel arches (cut into the bottom edge: front arch, rocker panel, rear arch)
  ctx.arc(s * 0.315, deckY + wheelR * 0.28, wheelR * 1.18, 0, Math.PI, true);   // front arch over the top
  ctx.lineTo(-s * 0.315 + wheelR * 1.18, deckY + wheelR * 0.28);                // rocker panel between wheels
  ctx.arc(-s * 0.315, deckY + wheelR * 0.28, wheelR * 1.18, 0, Math.PI, true);  // rear arch over the top
  ctx.closePath();
  ctx.fill();

  // greenhouse (glass) — one continuous side glass with a B-pillar gap
  const glassGrad = ctx.createLinearGradient(0, roofY, 0, deckY - wheelR * 1.2);
  glassGrad.addColorStop(0, PAL.glassGlint);
  glassGrad.addColorStop(0.5, PAL.carGlass);
  glassGrad.addColorStop(1, '#1c1334');
  ctx.fillStyle = glassGrad;
  // rear window + door glass
  ctx.beginPath();
  ctx.moveTo(Lx + s * 0.235, deckY - wheelR * 1.3);
  ctx.quadraticCurveTo(Lx + s * 0.315, roofY + wheelR * 0.18, Lx + s * 0.455, roofY + wheelR * 0.2);
  ctx.lineTo(Lx + s * 0.475, deckY - wheelR * 1.3);
  ctx.closePath();
  ctx.fill();
  // front door glass (windshield side)
  ctx.beginPath();
  ctx.moveTo(Lx + s * 0.52, deckY - wheelR * 1.3);
  ctx.lineTo(Lx + s * 0.495, roofY + wheelR * 0.22);
  ctx.quadraticCurveTo(Rx - s * 0.185, roofY + wheelR * 0.3, Rx - s * 0.175, deckY - wheelR * 1.3);
  ctx.closePath();
  ctx.fill();

  // chrome-ish trim line along the body side (sunset reflection)
  ctx.strokeStyle = 'rgba(255,190,140,0.5)';
  ctx.lineWidth = Math.max(1.2, H * 0.0022);
  ctx.beginPath();
  ctx.moveTo(Lx + s * 0.03, deckY - wheelR * 0.78);
  ctx.quadraticCurveTo(0, deckY - wheelR * 0.95, Rx - s * 0.01, deckY - wheelR * 0.62);
  ctx.stroke();

  // door seam + handle
  ctx.strokeStyle = 'rgba(30,10,20,0.5)';
  ctx.lineWidth = Math.max(1, H * 0.0018);
  ctx.beginPath();
  ctx.moveTo(Lx + s * 0.497, roofY + wheelR * 0.35);
  ctx.lineTo(Lx + s * 0.492, deckY - wheelR * 0.3);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,210,160,0.7)';
  ctx.fillRect(Lx + s * 0.53, deckY - wheelR * 1.02, s * 0.045, Math.max(2, H * 0.004));

  // lights
  ctx.fillStyle = '#ffe9c4';
  ctx.beginPath();
  ctx.roundRect(Rx - s * 0.018, deckY - wheelR * 1.02, s * 0.03, wheelR * 0.34, 3);
  ctx.fill();
  const tl = ctx.createRadialGradient(Lx + s * 0.005, deckY - wheelR * 0.95, 0, Lx + s * 0.005, deckY - wheelR * 0.95, wheelR * 1.4);
  tl.addColorStop(0, 'rgba(255,70,60,0.8)');
  tl.addColorStop(1, 'rgba(255,70,60,0)');
  ctx.fillStyle = tl;
  ctx.beginPath();
  ctx.arc(Lx + s * 0.005, deckY - wheelR * 0.95, wheelR * 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ff5a4e';
  ctx.beginPath();
  ctx.roundRect(Lx - s * 0.012, deckY - wheelR * 1.1, s * 0.026, wheelR * 0.3, 3);
  ctx.fill();

  // wheels (rotate with road speed: angle = scroll / radius)
  const spin = scroll / wheelR;
  drawWheel(s * 0.315, deckY + wheelR * 0.28, wheelR, spin);
  drawWheel(-s * 0.315, deckY + wheelR * 0.28, wheelR, spin);

  ctx.restore();
}

function drawWheel(x, y, r, angle) {
  // tyre
  ctx.fillStyle = PAL.tyre;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // rim
  const rg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r * 0.72);
  rg.addColorStop(0, '#e8c896');
  rg.addColorStop(1, PAL.rim);
  ctx.fillStyle = rg;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.68, 0, Math.PI * 2);
  ctx.fill();
  // spokes (5) — rotation makes the spin readable
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(40,22,14,0.85)';
  for (let i = 0; i < 5; i++) {
    ctx.rotate(Math.PI * 2 / 5);
    ctx.beginPath();
    ctx.roundRect(-r * 0.07, -r * 0.62, r * 0.14, r * 0.58, r * 0.05);
    ctx.fill();
  }
  // hub
  ctx.fillStyle = '#f0dcb4';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* ---------- main loop ---------- */
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05; // clamp after tab switches
  t += dt;
  scroll += SPEED * dt;

  drawSky();
  drawMountains();
  drawHillsAndTrees();
  drawField();
  drawLamps();
  drawRoad();
  drawCar();

  requestAnimationFrame(frame);
}
requestAnimationFrame((n) => { last = n; frame(n); });
})();
</script>
</body>
</html>
