<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THRILLER — A Three.js Night Scene</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Cinematic letterbox */
  .bar { position: fixed; left: 0; width: 100%; height: 7vh; background: #000; z-index: 5; pointer-events: none; }
  #bar-top    { top: 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  #bar-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,.06); }

  /* Vignette + grain */
  #vignette { position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  #title {
    position: fixed; top: calc(7vh + 2.2vh); left: 0; width: 100%; text-align: center; z-index: 6;
    pointer-events: none; font-family: Georgia, 'Times New Roman', serif; color: #e8e4da;
    letter-spacing: .55em; text-indent: .55em; font-size: clamp(20px, 3.4vw, 44px);
    text-shadow: 0 0 18px rgba(255,40,40,.65), 0 2px 6px #000;
    animation: titleIn 3s ease-out both;
  }
  @keyframes titleIn { from { opacity: 0; transform: translateY(-14px); letter-spacing: .9em; } to { opacity: 1; transform: none; } }

  #caption {
    position: fixed; bottom: calc(7vh + 2vh); left: 0; width: 100%; text-align: center; z-index: 6;
    pointer-events: none; font-family: Georgia, serif; color: rgba(235,230,220,.85);
    font-style: italic; font-size: clamp(12px, 1.4vw, 18px); letter-spacing: .12em;
    text-shadow: 0 1px 4px #000; transition: opacity .6s ease;
  }

  #hint {
    position: fixed; bottom: calc(7vh + .5vh); left: 12px; z-index: 6; pointer-events: none;
    font-family: monospace; color: rgba(255,255,255,.35); font-size: 11px; letter-spacing: .08em;
  }

  #fade { position: fixed; inset: 0; background: #000; z-index: 9; pointer-events: none;
    animation: fadeOut 2.4s ease-out both; }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  #err { position: fixed; inset: 0; display: none; place-items: center; z-index: 10;
    color: #f88; font-family: monospace; background: #000; text-align: center; padding: 2em; }
</style>
</head>
<body>
<div id="app"></div>
<div class="bar" id="bar-top"></div>
<div class="bar" id="bar-bottom"></div>
<div id="vignette"></div>
<div id="title">THRILLER</div>
<div id="caption">the night they all came out to dance…</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<div id="fade"></div>
<div id="err"><div>WebGL / CDN unavailable.<br/>This scene needs a network connection for the Three.js CDN.</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   THRILLER — cinematic Three.js night scene
   Four stylized characters perform the Thriller zombie dance:
   Michael Jackson, Pepe the Frog, Donald Trump, Elon Musk.
   ============================================================ */

const app = document.getElementById('app');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('err').style.display = 'grid';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x0a0c1e, 0.030);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);

/* ---------------- Lights ---------------- */
scene.add(new THREE.AmbientLight(0x223, 0.5));

// Moonlight — cool blue key light with shadows
const moon = new THREE.DirectionalLight(0xbfd4ff, 1.6);
moon.position.set(-18, 26, -14);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -25; moon.shadow.camera.right = 25;
moon.shadow.camera.top = 25;   moon.shadow.camera.bottom = -25;
moon.shadow.bias = -0.0006;
scene.add(moon);

// Warm rim from behind (stage feel)
const rim = new THREE.DirectionalLight(0xff7744, 0.55);
rim.position.set(10, 8, -20);
scene.add(rim);

// Sweeping red stage spotlights
function makeSpot(color, x) {
  const s = new THREE.SpotLight(color, 260, 60, Math.PI / 9, 0.45, 1.8);
  s.position.set(x, 16, 14);
  s.castShadow = false;
  scene.add(s);
  const target = new THREE.Object3D();
  target.position.set(0, 2, 0);
  scene.add(target);
  s.target = target;
  return { light: s, target };
}
const spotA = makeSpot(0xff1a1a, -9);
const spotB = makeSpot(0x8822ff, 9);

// Flickering ground glow (like a fire in the distance)
const flicker = new THREE.PointLight(0xff5522, 30, 40, 1.8);
flicker.position.set(0, 1.5, -16);
scene.add(flicker);

/* ---------------- Sky: moon disc + stars ---------------- */
{
  const moonGeo = new THREE.SphereGeometry(4.2, 32, 32);
  const moonMat = new THREE.MeshBasicMaterial({ color: 0xf5f2e8, fog: false });
  const moonBall = new THREE.Mesh(moonGeo, moonMat);
  moonBall.position.set(-60, 46, -90);
  scene.add(moonBall);

  // halo
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: (() => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(128,128,20,128,128,128);
      grad.addColorStop(0,'rgba(240,238,225,.9)');
      grad.addColorStop(.35,'rgba(200,210,255,.25)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0,0,256,256);
      return new THREE.CanvasTexture(c);
    })(),
    transparent: true, fog: false, depthWrite: false
  }));
  halo.scale.setScalar(34);
  halo.position.copy(moonBall.position);
  scene.add(halo);

  // stars
  const N = 1600;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 140 + Math.random() * 60;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 0.9); // upper hemisphere bias
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = Math.abs(r * Math.cos(ph)) + 4;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xcdd6ff, size: 0.55, fog: false, transparent: true, opacity: .9 })));
}

/* ---------------- Ground & graveyard set ---------------- */
{
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(70, 48),
    new THREE.MeshStandardMaterial({ color: 0x141a26, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // dance floor — worn dirt circle
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(9.5, 48),
    new THREE.MeshStandardMaterial({ color: 0x1d2333, roughness: .95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.01;
  floor.receiveShadow = true;
  scene.add(floor);

  const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3a4152, roughness: .9 });
  const tombRand = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const rnd = tombRand(1337);

  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2 + rnd() * .5;
    const r = 14 + rnd() * 22;
    const h = 1.2 + rnd() * 1.8;
    const t = new THREE.Mesh(new THREE.BoxGeometry(1.1, h, .35), stoneMat);
    t.position.set(Math.cos(a) * r, h / 2 - .05, Math.sin(a) * r);
    t.rotation.y = rnd() * Math.PI;
    t.rotation.z = (rnd() - .5) * .18;
    t.castShadow = t.receiveShadow = true;
    scene.add(t);
    // cross on some
    if (i % 4 === 0) {
      const c = new THREE.Mesh(new THREE.BoxGeometry(.22, h + .9, .22), stoneMat);
      c.position.set(Math.cos(a) * r, (h + .9) / 2 - .05, Math.sin(a) * r);
      c.rotation.z = t.rotation.z;
      c.castShadow = true;
      scene.add(c);
    }
  }

  // dead trees
  const barkMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 1 });
  function deadTree(x, z, s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.28 * s, .5 * s, 6 * s, 7), barkMat);
    trunk.position.y = 3 * s;
    trunk.castShadow = true;
    g.add(trunk);
    for (let b = 0; b < 4; b++) {
      const br = new THREE.Mesh(new THREE.CylinderGeometry(.06 * s, .18 * s, (2.5 + rnd() * 2) * s, 5), barkMat);
      br.position.y = (3.6 + rnd() * 1.6) * s;
      br.rotation.z = (rnd() - .5) * 1.9;
      br.rotation.x = (rnd() - .5) * 1.2;
      br.translateY(1.1 * s);
      br.castShadow = true;
      g.add(br);
    }
    g.position.set(x, 0, z);
    scene.add(g);
  }
  deadTree(-16, -8, 1.25); deadTree(17, -12, 1.5); deadTree(-13, 14, 1.0); deadTree(12, 16, 1.15);

  // foggy mist planes
  const mistTex = (() => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    for (let i = 0; i < 40; i++) {
      const x = rnd() * 256, y = rnd() * 128, r = 30 + rnd() * 70;
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0, 'rgba(140,150,190,.16)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad; g.fillRect(0, 0, 256, 128);
    }
    return new THREE.CanvasTexture(c);
  })();
  const mists = [];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(34, 7),
      new THREE.MeshBasicMaterial({ map: mistTex, transparent: true, opacity: .5, depthWrite: false })
    );
    m.position.set((rnd() - .5) * 40, 1.2 + rnd(), (rnd() - .5) * 36);
    m.rotation.y = rnd() * Math.PI;
    scene.add(m);
    mists.push(m);
  }
  window.__mists = mists;
}

/* ---------------- Character builder ---------------- */
const M = {
  skin:   new THREE.MeshStandardMaterial({ color: 0xd9a06b, roughness: .7 }),
  white:  new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: .8 }),
  red:    new THREE.MeshStandardMaterial({ color: 0xb3121c, roughness: .65 }),
  black:  new THREE.MeshStandardMaterial({ color: 0x14141a, roughness: .7 }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xd8b23a, roughness: .35, metalness: .6 }),
  green:  new THREE.MeshStandardMaterial({ color: 0x59c135, roughness: .75 }),
  orange: new THREE.MeshStandardMaterial({ color: 0xe8944a, roughness: .7 }),
  hairY:  new THREE.MeshStandardMaterial({ color: 0xf2d24b, roughness: .6 }),
  blue:   new THREE.MeshStandardMaterial({ color: 0x1f3f8f, roughness: .7 }),
  tieR:   new THREE.MeshStandardMaterial({ color: 0xc22a2a, roughness: .5 }),
  grey:   new THREE.MeshStandardMaterial({ color: 0x4a4f5a, roughness: .8 }),
  brown:  new THREE.MeshStandardMaterial({ color: 0x6b4a2f, roughness: .7 }),
  eyeW:   new THREE.MeshBasicMaterial({ color: 0xffffff }),
  eyeB:   new THREE.MeshBasicMaterial({ color: 0x101018 }),
};

function limb(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; return m; }

/**
 * Build a stylized humanoid. Returns group with named pivots for animation:
 * hips, torso, head, armL/armR (shoulder pivot), foreL/foreR (elbow pivot), legL/legR (hip pivot)
 */
function buildHumanoid(opts) {
  const g = new THREE.Group();

  // hips
  const hips = new THREE.Group(); hips.position.y = 1.05; g.add(hips);
  const pelvis = limb(new THREE.BoxGeometry(.62, .34, .4), opts.pants || M.black);
  pelvis.position.y = .05; hips.add(pelvis);

  // torso
  const torso = new THREE.Group(); torso.position.y = .18; hips.add(torso);
  const chest = limb(new THREE.BoxGeometry(.72, .85, .46), opts.shirt || M.white);
  chest.position.y = .42; torso.add(chest);
  if (opts.jacket) {
    const jL = limb(new THREE.BoxGeometry(.16, .9, .5), opts.jacket);
    jL.position.set(-.42, .42, 0); torso.add(jL);
    const jR = jL.clone(); jR.position.x = .42; torso.add(jR);
  }

  // head
  const head = new THREE.Group(); head.position.y = 1.0; torso.add(head);
  const skull = limb(new THREE.SphereGeometry(.3, 24, 20), opts.skin || M.skin);
  skull.scale.set(1, 1.12, .95); skull.position.y = .18; head.add(skull);

  // face: eyes + mouth
  const eyeGeoL = new THREE.SphereGeometry(.045, 10, 10);
  const eL = new THREE.Mesh(eyeGeoL, M.eyeB); eL.position.set(-.1, .22, .26); head.add(eL);
  const eR = eL.clone(); eR.position.x = .1; head.add(eR);
  if (opts.bigEyes) { // Pepe-style bulging eyes
    for (const sx of [-1, 1]) {
      const ew = new THREE.Mesh(new THREE.SphereGeometry(.13, 16, 14), M.eyeW);
      ew.position.set(sx * .12, .34, .2); head.add(ew);
      const eb = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 10), M.eyeB);
      eb.position.set(sx * .12, .34, .31); head.add(eb);
    }
    eL.visible = eR.visible = false;
    const mouth = new THREE.Mesh(new THREE.TorusGeometry(.16, .035, 8, 20, Math.PI), M.eyeB);
    mouth.position.set(0, .02, .27); mouth.rotation.z = Math.PI; head.add(mouth);
  } else {
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(.14, .03, .02), M.eyeB);
    mouth.position.set(0, .05, .28); head.add(mouth);
  }

  // hair / hat
  if (opts.hat === 'fedora') {
    const brim = limb(new THREE.CylinderGeometry(.42, .42, .05, 20), M.black);
    brim.position.y = .46; head.add(brim);
    const crown = limb(new THREE.CylinderGeometry(.3, .34, .3, 20), M.black);
    crown.position.y = .61; head.add(crown);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(.345, .345, .07, 20), opts.band || M.red);
    band.position.y = .5; head.add(band);
  } else if (opts.hair === 'swoop') { // Trump
    const h1 = limb(new THREE.SphereGeometry(.3, 16, 14), opts.hairMat || M.hairY);
    h1.scale.set(1.25, .7, 1.15); h1.position.y = .48; head.add(h1);
    const h2 = limb(new THREE.SphereGeometry(.16, 12, 10), opts.hairMat || M.hairY);
    h2.scale.set(1.6, .5, .9); h2.position.set(-.18, .42, .22); head.add(h2);
  } else if (opts.hair === 'short') {
    const h = limb(new THREE.SphereGeometry(.305, 16, 14), opts.hairMat || M.brown);
    h.scale.set(1.02, .78, 1.0); h.position.y = .4; head.add(h);
  } else if (opts.hair === 'slick') { // MJ black hair under hat handled by fedora; slick for others
    const h = limb(new THREE.SphereGeometry(.31, 16, 14), M.black);
    h.scale.set(1.02, .85, 1.0); h.position.y = .42; head.add(h);
  }

  // arms — shoulder pivots at torso top sides
  function arm(side) { // side: -1 left, +1 right
    const sh = new THREE.Group();
    sh.position.set(side * .46, .78, 0);
    torso.add(sh);
    const upper = limb(new THREE.BoxGeometry(.2, .5, .2), opts.jacket || opts.shirt || M.white);
    upper.position.y = -.25; sh.add(upper);
    const el = new THREE.Group(); el.position.y = -.5; sh.add(el);
    const fore = limb(new THREE.BoxGeometry(.17, .46, .17), opts.foreMat || (opts.jacket || opts.shirt || M.white));
    fore.position.y = -.23; el.add(fore);
    const hand = limb(new THREE.SphereGeometry(.11, 12, 10), opts.handMat || (opts.skin || M.skin));
    hand.position.y = -.5; el.add(hand);
    return { sh, el };
  }
  const armL = arm(-1), armR = arm(1);

  // legs — hip pivots
  function leg(side) {
    const hp = new THREE.Group();
    hp.position.set(side * .2, -.12, 0);
    hips.add(hp);
    const thigh = limb(new THREE.BoxGeometry(.24, .55, .26), opts.pants || M.black);
    thigh.position.y = -.28; hp.add(thigh);
    const kn = new THREE.Group(); kn.position.y = -.56; hp.add(kn);
    const shin = limb(new THREE.BoxGeometry(.21, .5, .23), opts.pants || M.black);
    shin.position.y = -.26; kn.add(shin);
    const foot = limb(new THREE.BoxGeometry(.24, .12, .42), opts.shoeMat || M.black);
    foot.position.set(0, -.52, .08); kn.add(foot);
    return { hp, kn };
  }
  const legL = leg(-1), legR = leg(1);

  g.userData.joints = { hips, torso, head, armL: armL.sh, foreL: armL.el, armR: armR.sh, foreR: armR.el, legL: legL.hp, kneeL: legL.kn, legR: legR.hp, kneeR: legR.kn };
  return g;
}

/* ---------------- The four dancers ---------------- */
const cast = [];

function addDancer(builder, x, z, faceY) {
  const d = builder();
  d.position.set(x, 0, z);
  d.rotation.y = faceY;
  scene.add(d);
  const j = d.userData.joints;
  // gold glove on MJ's right hand
  cast.push({ root: d, j, baseX: x, baseZ: z });
  return { d, j };
}

// Michael Jackson — white suit, red jacket, fedora, gold glove
{
  const mj = buildHumanoid({ shirt: M.white, pants: M.white, jacket: M.red, hat: 'fedora', band: M.gold, skin: M.skin });
  addDancer(() => mj, -3.2, 0, Math.PI / 2);
  // gold glove on right hand
  const j = mj.userData.joints;
  const glove = limb(new THREE.SphereGeometry(.135, 14, 12), M.gold);
  glove.position.y = -.5;
  j.foreR.add(glove);
}

// Pepe the Frog — big green blob with bulging eyes
{
  const pepe = new THREE.Group();
  const body = limb(new THREE.SphereGeometry(.78, 24, 20), M.green);
  body.scale.set(1.05, .95, .9); body.position.y = .8; pepe.add(body);
  for (const sx of [-1, 1]) {
    const ew = new THREE.Mesh(new THREE.SphereGeometry(.24, 16, 14), M.eyeW);
    ew.position.set(sx * .3, 1.55, .42); pepe.add(ew);
    const eb = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 10), M.eyeB);
    eb.position.set(sx * .3, 1.55, .62); pepe.add(eb);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.34, .07, 10, 24, Math.PI), M.eyeB);
  mouth.position.set(0, 1.05, .62); mouth.rotation.z = Math.PI; pepe.add(mouth);
  // stubby arms
  function pArm(side) {
    const sh = new THREE.Group(); sh.position.set(side * .72, 1.15, 0); pepe.add(sh);
    const a = limb(new THREE.CapsuleGeometry(.14, .6, 4, 10), M.green);
    a.position.y = -.38; sh.add(a);
    return sh;
  }
  const armL = pArm(-1), armR = pArm(1);
  // stubby legs
  function pLeg(side) {
    const hp = new THREE.Group(); hp.position.set(side * .34, .35, 0); pepe.add(hp);
    const l = limb(new THREE.CapsuleGeometry(.16, .28, 4, 10), M.green);
    l.position.y = -.2; hp.add(l);
    return hp;
  }
  const legL = pLeg(-1), legR = pLeg(1);
  pepe.userData.joints = { hips: new THREE.Group(), torso: pepe, head: pepe, armL, foreL: armL, armR, foreR: armR, legL, kneeL: legL, legR, kneeR: legR };
  addDancer(() => pepe, -1.05, .4, Math.PI / 2);
}

// Donald Trump — orange skin, yellow swoop hair, blue suit, red tie
{
  const trump = buildHumanoid({ shirt: M.blue, pants: M.blue, skin: M.orange, hair: 'swoop', shoeMat: M.black });
  addDancer(() => trump, 1.05, .4, Math.PI / 2);
  // red tie
  const j = trump.userData.joints;
  const tie = limb(new THREE.BoxGeometry(.16, .7, .03), M.tieR);
  tie.position.set(0, .45, .25);
  j.torso.add(tie);
}

// Elon Musk — grey hoodie, short brown hair
{
  const elon = buildHumanoid({ shirt: M.grey, pants: M.black, skin: M.skin, hair: 'short', shoeMat: M.white });
  addDancer(() => elon, 3.2, 0, Math.PI / 2);
}

/* ---------------- Choreography ----------------
   Loop length 16 s. Phases:
   0–2    : rise from the ground (zombie emergence)
   2–6    : classic Thriller — arms straight forward, slow shamble, head tilt
   6–10   : alternating arm punches + body roll
   10–14  : side-to-side shuffle, arms out wide
   14–16  : final freeze pose (arms forward), then loop
------------------------------------------------ */
const LOOP = 16;

function smooth(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }

// pose = set of joint angles. We blend between phase poses.
const POSES = {
  down:   { hipsY: .18, torsoX: .9,  headX: .5,  armLx: -.2, armRx: -.2, foreLx: 0,    foreRx: 0,    legLx: -.7, legRx: -.7, kneeLx: .9, kneeRx: .9, torsoZ: 0,   headY: 0 },
  shamble:{ hipsY: 1.02,torsoX: .18, headX: .1,  armLx: -1.5,armRx: -1.5,foreLx: -.15, foreRx: -.15, legLx: 0,   legRx: 0,   kneeLx: .2,  kneeRx: .2,  torsoZ: 0,   headY: 0 },
  punchA: { hipsY: 1.0, torsoX: .1,  headX: 0,   armLx: -.4, armRx: -1.6,foreLx: -.3,  foreRx: -.1,  legLx: .25, legRx: -.2, kneeLx: .3,  kneeRx: .3,  torsoZ: .18, headY: .4 },
  punchB: { hipsY: 1.0, torsoX: .1,  headX: 0,   armLx: -1.6,armRx: -.4, foreLx: -.1,  foreRx: -.3,  legLx: -.2, legRx: .25, kneeLx: .3,  kneeRx: .3,  torsoZ: -.18,headY: -.4 },
  wideA:  { hipsY: .96, torsoX: .05, headX: 0,   armLx: -.5, armRx: -.5, foreLx: 0,    foreRx: 0,    legLx: .3,  legRx: -.1, kneeLx: .4,  kneeRx: .2,  torsoZ: .3,  headY: .3 },
  wideB:  { hipsY: .96, torsoX: .05, headX: 0,   armLx: -.5, armRx: -.5, foreLx: 0,    foreRx: 0,    legLx: -.1, legRx: .3,  kneeLx: .2,  kneeRx: .4,  torsoZ: -.3, headY: -.3 },
  freeze: { hipsY: 1.05,torsoX: .28, headX: .25, armLx: -1.62,armRx:-1.62,foreLx: -.05,foreRx: -.05, legLx: 0,   legRx: 0,   kneeLx: .1,  kneeRx: .1,  torsoZ: 0,   headY: 0 },
};

function blendPose(out, a, b, t) {
  for (const k in out) out[k] = lerp(a[k], b[k], t);
}

const pose = {};
for (const k in POSES.down) pose[k] = POSES.down[k];

function choreo(t) {
  const T = ((t % LOOP) + LOOP) % LOOP;
  if (T < 2) {
    blendPose(pose, POSES.down, POSES.shamble, smooth(0.4, 1.9, T));
  } else if (T < 6) {
    // shamble with slow head sway + arm bob
    const s = Math.sin((T - 2) * 2.4);
    blendPose(pose, POSES.shamble, POSES.shamble, 0);
    pose.headY = s * .35;
    pose.armLx += s * .06; pose.armRx -= s * .06;
    pose.hipsY += Math.abs(Math.sin((T - 2) * 4.8)) * .05;
  } else if (T < 10) {
    const p = (T - 6) / 4;                 // 0..1 over the phase
    const beat = Math.floor(p * 4);        // 4 alternating beats
    const bt = smooth(0.25, 0.95, (p * 4) % 1);
    const A = POSES.punchA, B = POSES.punchB;
    blendPose(pose, beat % 2 === 0 ? A : B, beat % 2 === 0 ? B : A, bt);
  } else if (T < 14) {
    const p = (T - 10) / 4;
    const beat = Math.floor(p * 3);
    const bt = smooth(0.25, 0.95, (p * 3) % 1);
    blendPose(pose, POSES.wideA, POSES.wideB, beat % 2 === 0 ? bt : 1 - bt);
  } else {
    blendPose(pose, POSES.wideB, POSES.freeze, smooth(14.0, 15.0, T));
  }
}

function applyPose(d, t) {
  const j = d.j;
  // per-character micro-offset so they're synced but not robotic
  const off = d.phaseOff || 0;
  const p = pose;
  j.hips.position.y = lerp(1.05, 1.05, 1) + (p.hipsY - 1.02); // hips group base y is 1.05
  j.torso.rotation.x = p.torsoX;
  j.torso.rotation.z = p.torsoZ * Math.cos(t * 1.3 + off);
  j.head.rotation.x = p.headX;
  j.head.rotation.y = p.headY;
  // zombie arms: shoulder pitch (negative x = forward)
  const bob = Math.sin(t * 2.6 + off) * .05;
  j.armL.rotation.x = p.armLx + bob;
  j.armR.rotation.x = p.armRx - bob;
  j.foreL.rotation.x = p.foreLx;
  j.foreR.rotation.x = p.foreRx;
  // slight zombie arm droop wobble
  j.armL.rotation.z = .12 + Math.sin(t * 1.7 + off) * .05;
  j.armR.rotation.z = -.12 - Math.sin(t * 1.9 + off) * .05;
  // legs
  const step = Math.sin(t * 4.8 + off);
  j.legL.rotation.x = p.legLx + (p.torsoX > .5 ? 0 : step * .12);
  j.legR.rotation.x = p.legRx - (p.torsoX > .5 ? 0 : step * .12);
  j.kneeL.rotation.x = Math.max(0, p.kneeLx + Math.max(0, -step) * .3);
  j.kneeR.rotation.x = Math.max(0, p.kneeRx + Math.max(0, step) * .3);
}

// assign phase offsets (tiny, keeps the troupe tight)
cast.forEach((d, i) => d.phaseOff = i * 0.12);

/* ---------------- Camera rig (cinematic) ---------------- */
const camRig = { theta: Math.PI / 2, radius: 15, height: 4.6, targetY: 2.2 };
let userTheta = null, userRadius = null; // manual overrides via drag/zoom

renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  userTheta = (userTheta ?? camRig.theta) - (e.clientX - lastX) * 0.005;
  camRig.height = THREE.MathUtils.clamp(camRig.height + (e.clientY - lastY) * 0.02, 1.5, 14);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('wheel', (e) => {
  userRadius = THREE.MathUtils.clamp((userRadius ?? camRig.radius) + e.deltaY * 0.012, 7, 30);
}, { passive: true });

let dragging = false, lastX = 0, lastY = 0;

function updateCamera(t) {
  const autoTheta = Math.PI / 2 + Math.sin(t * 0.11) * 0.55 + t * 0.02; // slow dolly orbit
  camRig.theta = userTheta ?? autoTheta;
  camRig.radius = userRadius ?? (15 + Math.sin(t * 0.07) * 2.2);
  const bobY = Math.sin(t * 0.9) * 0.18; // handheld feel
  camera.position.set(
    Math.cos(camRig.theta) * camRig.radius,
    camRig.height + bobY,
    Math.sin(camRig.theta) * camRig.radius
  );
  camera.lookAt(0, camRig.targetY, 0);
}

/* ---------------- Captions ---------------- */
const captions = [
  [0.5, 'the night they all came out to dance…'],
  [2.5, 'one… two… three… four…'],
  [6.5, 'are you ready, boys?'],
  [10.5,'left… right… left… right…'],
  [14.3,'freeze!'],
];
const capEl = document.getElementById('caption');
let lastCap = -1;

/* ---------------- Main loop ---------------- */
const clock = new THREE.Clock();
let elapsed = 0;

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  choreo(t);
  for (const d of cast) applyPose(d, t);

  // spotlights sweep in counter-phase
  spotA.target.position.x = Math.sin(t * 0.7) * 6;
  spotB.target.position.x = -Math.sin(t * 0.55 + 1.3) * 6;
  spotA.light.intensity = 240 + Math.sin(t * 9) * 30;
  spotB.light.intensity = 240 + Math.cos(t * 8) * 30;

  // flicker light
  flicker.intensity = 26 + Math.sin(t * 17.3) * 5 + Math.sin(t * 31.7) * 4;

  // mist drift
  for (const m of window.__mists || []) {
    m.position.x += dt * 0.35;
    if (m.position.x > 26) m.position.x = -26;
  }

  updateCamera(t);

  // captions on loop time
  const T = t % LOOP;
  let ci = -1;
  for (let i = 0; i < captions.length; i++) if (T >= captions[i][0]) ci = i;
  if (ci !== lastCap) {
    lastCap = ci;
    capEl.style.opacity = ci === -1 ? '0' : '1';
    if (ci !== -1) capEl.textContent = captions[ci][1];
  }

  renderer.render(scene, camera);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
