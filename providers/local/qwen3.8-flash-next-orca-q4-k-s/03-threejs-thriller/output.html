<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thriller — Four Legends Dance</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Georgia,serif;}
  #c{display:block;width:100vw;height:100vh;}
  #title{
    position:fixed;top:6vh;left:0;right:0;text-align:center;color:#f5d76e;
    font-size:clamp(28px,6vw,64px);letter-spacing:.35em;font-weight:bold;
    text-shadow:0 0 24px rgba(255,180,40,.7),0 4px 12px #000;
    opacity:0;transition:opacity 3s ease 1s;pointer-events:none;
  }
  #title.show{opacity:1;}
  #sub{
    position:fixed;top:calc(6vh + 1.1em);left:0;right:0;text-align:center;color:#cfd6e6;
    font-size:clamp(11px,1.6vw,16px);letter-spacing:.5em;opacity:0;transition:opacity 3s ease 2.2s;pointer-events:none;
  }
  #sub.show{opacity:.85;}
  #hint{position:fixed;bottom:14px;width:100%;text-align:center;color:#8899aa;font:12px system-ui,sans-serif;letter-spacing:.15em;opacity:.7;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">THRILLER</div>
<div id="sub">MJ · PEPE · TRUMP · MUSK</div>
<div id="hint">drag to look · scroll to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
"use strict";
/* ============ Three.js "Thriller" — Michael Jackson, Pepe, Trump, Musk ============
   Single self-contained file. Three.js via CDN (as permitted). Cinematic:
   moonlit graveyard street stage, volumetric spotlights, fog, bloom-toned tone
   mapping, synced 8-step Thriller choreography with per-character personality,
   camera dolly/orbit with slow cinematic cuts. */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x0a0c1a, 0.028);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2.2, 11);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x33406a, 0x0c1508, 0.55));
const moon = new THREE.DirectionalLight(0xbfd0ff, 1.35);
moon.position.set(-8, 14, -6);
moon.castShadow = true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-14; moon.shadow.camera.right=14;
moon.shadow.camera.top=10; moon.shadow.camera.bottom=-4;
scene.add(moon);
function spot(color, x, y, z, tx, ty, tz, intensity){
  const s = new THREE.SpotLight(color, intensity, 40, Math.PI/7, 0.45, 1.4);
  s.position.set(x,y,z);
  s.target.position.set(tx,ty,tz);
  s.castShadow = false;
  scene.add(s, s.target);
  return s;
}
const keySpot  = spot(0xffc46b, -6, 8, 4, -2.5, 1, 0, 42);
const rimSpot  = spot(0x6ba7ff,  6, 8, 4,  2.5, 1, 0, 36);
const backSpot = spot(0x8affc1,  0, 6, -8, 0, 1, -2, 22);
// volumetric-ish light cones
function coneGeo(color, r1, r2, h){ const g=new THREE.CylinderGeometry(r1,r2,h,24,1,true); return g; }
function addBeam(light, color){
  const m = new THREE.Mesh(new THREE.ConeGeometry(1.9, 8.6, 24, 1, true),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.055, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending}));
  m.position.copy(light.position);
  m.lookAt(light.target.position);
  m.rotateX(Math.PI/2);
  m.position.lerp(light.target.position, 0.42);
  scene.add(m);
}
[keySpot,rimSpot,backSpot].forEach((l,i)=>addBeam(l,[0xffc46b,0x6ba7ff,0x8affc1][i]));

/* ---------- moon + stars + fog floor ---------- */
const moonBall = new THREE.Mesh(new THREE.SphereGeometry(2.4,32,16), new THREE.MeshBasicMaterial({color:0xf4f1de}));
moonBall.position.set(-14, 12, -30); scene.add(moonBall);
{
  const g = new THREE.BufferGeometry(), N=900, pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const r=40+Math.random()*40, t=Math.random()*Math.PI*2, u=Math.random()*Math.PI;
    pos[i*3]=r*Math.sin(u)*Math.cos(t); pos[i*3+1]=Math.abs(r*Math.cos(u))*0.6+4; pos[i*3+2]=-Math.abs(r*Math.sin(u)*Math.sin(t))-10; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xcfd8ff,size:0.06,transparent:true,opacity:0.8})));
}

/* ---------- stage: cracked asphalt street with gravestones behind ---------- */
const street = new THREE.Mesh(new THREE.PlaneGeometry(60, 26),
  new THREE.MeshStandardMaterial({color:0x1b1e26, roughness:0.92, metalness:0.05}));
street.rotation.x = -Math.PI/2; street.receiveShadow = true; scene.add(street);
{ // painted lane lines
  const mat = new THREE.MeshStandardMaterial({color:0xd9c85a, roughness:0.8, emissive:0x2a2405});
  for(let i=-3;i<=3;i++){ const l=new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.14),mat);
    l.rotation.x=-Math.PI/2; l.position.set(i*4.2, 0.012, 5.2); scene.add(l); }
}
{ // gravestones + fence silhouettes
  const stone = new THREE.MeshStandardMaterial({color:0x6a7280, roughness:1});
  for(let i=0;i<14;i++){
    const h = 0.9+Math.random()*0.9;
    const s = new THREE.Mesh(new THREE.CapsuleGeometry(0.42,h,4,10), stone);
    s.position.set(-14+i*2.2+Math.random()*0.8, h/2-0.05, -7.5-Math.random()*2);
    s.rotation.y = Math.random()*0.6-0.3; s.rotation.z = Math.random()*0.12-0.06;
    s.castShadow = true; scene.add(s);
  }
}

/* ---------- characters ---------- */
function mkMat(color, opts={}){ return new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.6, metalness:0.05},opts)); }
function limb(len, r, mat){ const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,len,6,12), mat); m.castShadow=true; return m; }

function buildCharacter(cfg){
  const g = new THREE.Group();
  const suit = mkMat(cfg.suit, {metalness:cfg.metalness||0.15, roughness:0.45});
  const skin = mkMat(cfg.skin, {roughness:0.7});
  const dark = mkMat(0x14161c, {roughness:0.8});
  // legs (hip pivot -> thigh -> shin)
  function leg(side){
    const hip = new THREE.Group();
    const thigh = limb(0.42,0.115,suit); thigh.position.y=-0.24; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y=-0.46;
    const shin = limb(0.42,0.1,dark); shin.position.y=-0.24; knee.add(shin);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.1,0.34), dark);
    shoe.position.set(0,-0.5,0.07); shoe.castShadow=true; knee.add(shoe);
    hip.add(knee); hip.position.set(side*0.16,0.92,0); hip.userData.knee=knee;
    return hip;
  }
  const legL = leg(-1), legR = leg(1); g.add(legL, legR);
  // torso
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.26,0.5,6,14), suit);
  torso.position.y = 1.35; torso.castShadow = true; g.add(torso);
  if(cfg.vest){ const v=new THREE.Mesh(new THREE.CapsuleGeometry(0.265,0.34,6,14), mkMat(cfg.vest,{metalness:0.7,roughness:0.25})); v.position.set(0,1.32,0); v.scale.z=0.6; g.add(v); }
  // arms (shoulder -> upper -> elbow -> forearm -> hand)
  function arm(side){
    const sh = new THREE.Group();
    const up = limb(0.34,0.085,suit); up.position.y=-0.2; sh.add(up);
    const el = new THREE.Group(); el.position.y=-0.42;
    const fo = limb(0.32,0.075,cfg.sleeve||suit); fo.position.y=-0.19; el.add(fo);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.085,12,10), cfg.glove?mkMat(0xf5f5e8,{metalness:0.85,roughness:0.15}):skin);
    hand.position.y=-0.4; hand.castShadow=true; el.add(hand);
    sh.add(el); sh.position.set(side*0.34,1.62,0); sh.userData.elbow=el;
    return sh;
  }
  const armL = arm(-1), armR = arm(1); g.add(armL, armR);
  // head
  const headG = new THREE.Group(); headG.position.y = 1.98;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,20,16), skin); head.castShadow=true; headG.add(head);
  if(cfg.hair){ const h=new THREE.Mesh(new THREE.SphereGeometry(0.225,20,12,0,Math.PI*2,0,Math.PI*cfg.hair[0]), mkMat(cfg.hair[1])); h.position.y=0.045; h.scale.set(1, cfg.hair[2]||1, 1); headG.add(h); }
  if(cfg.hat){ cfg.hat(headG); }
  if(cfg.face){ cfg.face(headG, skin); }
  g.add(headG);
  g.userData = {legL,legR,armL,armR,headG,torso};
  return g;
}
function fedora(parent){ // MJ's fedora
  const mat = mkMat(0x1c1c22,{roughness:0.4,metalness:0.3});
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.28,0.03,20), mat); brim.position.y=0.18;
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.2,0.16,18), mat); crown.position.y=0.26;
  brim.castShadow=true; crown.castShadow=true; parent.add(brim,crown);
}
function eyes(parent, ex={}){
  const w = new THREE.MeshBasicMaterial({color:0xf6f6f6});
  const p = new THREE.MeshBasicMaterial({color:ex.pupil||0x101418});
  for(const s of [-1,1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(ex.r||0.045,10,8), w);
    e.position.set(s*(ex.spread||0.085), ex.y||0.04, 0.19); parent.add(e);
    const pp = new THREE.Mesh(new THREE.SphereGeometry((ex.r||0.045)*0.5,8,8), p);
    pp.position.set(s*(ex.spread||0.085), ex.y||0.04, 0.215); parent.add(pp);
  }
}
function mouth(parent, w_, y, mat){ const m = new THREE.Mesh(new THREE.BoxGeometry(w_,0.03,0.02), mat||mkMat(0x7a2330)); m.position.set(0,y,0.21); parent.add(m); }

/* Michael Jackson — red jacket, fedora, gold glove, curls */
const mj = buildCharacter({suit:0xb0181c, skin:0xc98e6b, sleeve:0xb0181c, glove:true, vest:null, hair:[0.55,0x17130f,0.9]});
fedora(mj.userData.headG); eyes(mj.userData.headG,{r:0.04,spread:0.08}); mouth(mj.userData.headG,0.1,0.03);
/* Pepe — green frog: wide eyes, big smile mouth */
const pepe = buildCharacter({suit:0x2e5fb0, skin:0x63c14e, sleeve:0x2e5fb0, hair:[0.35,0x4ea244,0.6]});
eyes(pepe.userData.headG,{r:0.075,spread:0.11,y:0.1,pupil:0x0a0a0a}); mouth(pepe.userData.headG,0.24,0.02,mkMat(0x8a2f2f,{roughness:0.6}));
/* Trump — navy suit, long tie, blond swoop */
const trump = buildCharacter({suit:0x1b2a52, skin:0xe8a862, sleeve:0x1b2a52, vest:null, hair:[0.5,0xf2d264,1.25]});
eyes(trump.userData.headG,{r:0.038,spread:0.085,y:0.05}); mouth(trump.userData.headG,0.12,-0.01);
{ const tie=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.42,6), mkMat(0xc22, {roughness:0.5})); tie.position.set(0,1.3,0.24); tie.rotation.x=0.12; trump.add(tie); }
/* Musk — black bomber jacket, stubble-ish dark skin tone hair */
const musk = buildCharacter({suit:0x22252c, skin:0xd9a583, sleeve:0x22252c, metalness:0.35, hair:[0.4,0x2a1f18,0.7], vest:0x3a3f4a});
eyes(musk.userData.headG,{r:0.04,spread:0.085}); mouth(musk.userData.headG,0.11,-0.02);

const cast = [mj, pepe, trump, musk];
const NAMES = ['Michael Jackson','Pepe','Donald Trump','Elon Musk'];
const castX = [-3.3,-1.1,1.1,3.3];
cast.forEach((c,i)=>{
  c.position.set(castX[i], 0, Math.abs(i-1.5)*-0.6);
  c.rotation.y = 0.08*(i-1.5);
  scene.add(c);
  // name plate
  const cv2 = document.createElement('canvas'); cv2.width=512; cv2.height=128;
  const g2 = cv2.getContext('2d');
  g2.fillStyle='rgba(10,12,24,0.65)'; g2.fillRect(0,0,512,128);
  g2.font='bold 58px Georgia'; g2.fillStyle='#f5d76e'; g2.textAlign='center'; g2.textBaseline='middle';
  g2.fillText(NAMES[i],256,66);
  const tex = new THREE.CanvasTexture(cv2);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0.92}));
  spr.scale.set(1.7,0.42,1); spr.position.set(castX[i], 2.75, c.position.z);
  scene.add(spr);
});

/* ---------- Thriller choreography (8-step loop, ~16s) ---------- */
const BEAT = 0.5; // s per 8th note at 120 BPM feel
function choreograph(t){
  const cycle = 16, p = (t % cycle)/cycle; // 0..1 over 4x 4-beat phrases
  const ph = Math.floor(p*4), bt = (p*4)%1, beat = Math.floor(bt*4);
  const s2 = Math.sin(t*Math.PI/BEAT), c2 = Math.cos(t*Math.PI/BEAT);
  for(let i=0;i<4;i++){
    const c = cast[i], u = c.userData;
    const wob = Math.sin(t*2 + i);
    // phrase-wide: classic Thriller "claw" arms swinging side to side per phrase
    const swing = Math.sin(t*Math.PI/2) ; // slow pendulum
    // arms
    let aL=0,aR=0,eL=-0.2,eR=-0.2,pivL=0,pivR=0;
    if(ph===0){ // side-to-side zombie claws
      pivL = -1.9 + swing*0.55; pivR = -1.9 - swing*0.55; eL=-0.9; eR=-0.9;
    } else if(ph===1){ // up-down pumps
      pivL = -2.6 + s2*0.35; pivR = -2.6 - s2*0.35; eL=-0.5; eR=-0.5;
    } else if(ph===2){ // alternating jabs
      pivL = -1.6 - Math.max(0,Math.sin(t*Math.PI/BEAT))*0.9;
      pivR = -1.6 - Math.max(0,-Math.sin(t*Math.PI/BEAT))*0.9;
      eL=-1.1; eR=-1.1;
    } else { // squat bounce with arms out
      pivL = -1.2 + c2*0.3; pivR = -1.2 - c2*0.3; eL=-1.5; eR=-1.5;
    }
    u.armL.rotation.z = 0.15 + (i%2? pivL:pivL); u.armL.rotation.x = 0.1*Math.sin(t*3+i);
    u.armR.rotation.z = -0.15 + pivR;
    u.armL.userData.elbow.rotation.x = eL;
    u.armR.userData.elbow.rotation.x = eR;
    // legs: squat on phrase 4, knee bend pulse otherwise
    const squat = ph===3 ? (0.5+0.5*Math.sin(t*Math.PI*2/BEAT))*0.4 : 0;
    u.legL.rotation.x = 0.18*Math.sin(t*Math.PI/BEAT) + squat*0.5;
    u.legR.rotation.x = -0.18*Math.sin(t*Math.PI/BEAT) + squat*0.5;
    u.legL.userData.knee.rotation.x = 0.25 + squat;
    u.legR.userData.knee.rotation.x = 0.25 + squat;
    // bounce + sway of whole body
    c.position.y = Math.abs(Math.sin(t*Math.PI/BEAT))*0.06;
    c.rotation.y = 0.08*(i-1.5) + swing*0.12;
    // head bob, MJ adds hat tilt snap on every 4th beat
    u.headG.rotation.z = Math.sin(t*3.1+i*1.7)*0.08;
    u.headG.rotation.x = (i===0 && beat===0)? -0.25 : Math.sin(t*2.7+i)*0.07;
    // MJ solo flair in final phrase: moonwalk lean handled by per-character extras
    if(i===0 && ph===3){ c.rotation.y = 0.08*(i-1.5) + Math.sin(t*Math.PI/BEAT)*0.22; }
    if(i===1) u.headG.rotation.z = Math.sin(t*4.2)*0.12; // Pepe wobble
    if(i===2) u.torso.rotation.y = swing*0.2;             // Trump swagger
    if(i===3){ u.armR.rotation.z = -1.2 - Math.abs(Math.sin(t*2.4))*0.8; } // Musk enthusiastic wave
  }
}

/* ---------- camera ---------- */
let drag=null, yaw=-0.05, pitch=0.06, zoom=11;
canvas.addEventListener('pointerdown',e=>drag=[e.clientX,e.clientY,yaw,pitch]);
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{ if(!drag)return; yaw=drag[2]-(e.clientX-drag[0])*0.004; pitch=Math.max(-0.15,Math.min(0.5,drag[3]+(e.clientY-drag[1])*0.003)); });
canvas.addEventListener('wheel',e=>{ zoom=Math.max(6,Math.min(18,zoom+e.deltaY*0.01)); e.preventDefault(); },{passive:false});
function updateCamera(t){
  const auto = !drag ? Math.sin(t*0.08)*0.5 : 0;
  const y = yaw + auto;
  camera.position.set(Math.sin(y)*zoom, 1.4 + pitch*6 + Math.sin(t*0.35)*0.15, Math.cos(y)*zoom);
  camera.lookAt(0, 1.25, 0);
}

/* ---------- loop ---------- */
document.getElementById('title').classList.add('show');
document.getElementById('sub').classList.add('show');
let start = performance.now();
function frame(now){
  const t = (now-start)/1000;
  choreograph(t);
  updateCamera(t);
  // light flicker for atmosphere
  keySpot.intensity = 42 + Math.sin(t*11.3)*1.6 + (Math.random()<0.01? -8:0);
  rimSpot.intensity = 36 + Math.sin(t*9.7+2)*1.4;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
