<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dusk Drive — Parallax Car</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1028; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font-family: Georgia, 'Times New Roman', serif; font-size: 13px; letter-spacing: 3px;
    color: rgba(255, 224, 178, 0.55); text-transform: uppercase; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Dusk Drive</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;
  let horizonY = 0, roadTopY = 0, roadBottomY = 0;
  let vignette = null;

  // ---------- deterministic pseudo-random per tile index ----------
  function hash(n) {
    let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    horizonY = H * 0.46;
    roadTopY = H * 0.72;
    roadBottomY = H * 1.0;

    // pre-render vignette
    vignette = document.createElement("canvas");
    vignette.width = W; vignette.height = H;
    const v = vignette.getContext("2d");
    const g = v.createRadialGradient(W/2, H*0.55, Math.min(W,H)*0.42, W/2, H*0.55, Math.max(W,H)*0.78);
    g.addColorStop(0, "rgba(10,5,20,0)");
    g.addColorStop(1, "rgba(8,4,16,0.55)");
    v.fillStyle = g;
    v.fillRect(0, 0, W, H);
    // subtle letterbox for a cinematic frame
    const bar = Math.round(H * 0.045);
    v.fillStyle = "rgba(5,3,10,0.85)";
    v.fillRect(0, 0, W, bar);
    v.fillRect(0, H - bar, W, bar);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- world parameters ----------
  const SPEED = 240;          // world units per second (road speed)
  let dist = 0;               // total distance travelled
  let last = performance.now();

  // palette (sunset / dusk)
  const C = {
    skyTop:    "#1b1440",
    skyMid:    "#6b2d5e",
    skyLow:    "#d95f4e",
    skyGlow:   "#ffb35c",
    sun:       "#ffd9a0",
    farHill:   "#3a2547",
    midHill:   "#2c1c38",
    treeFar:   "#241631",
    grass:     "#1f1830",
    grassLit:  "#33203f",
    road:      "#231c2e",
    roadEdge:  "#0f0b18",
    dash:      "#e8c47a",
    pole:      "#141021",
    carBody:   "#8a2432",
    carBodyLo: "#571521",
    carGlass:  "#ffce8f",
    rim:       "#c9ccd6",
  };

  // ---------- sky ----------
  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, horizonY + 40);
    g.addColorStop(0.0, C.skyTop);
    g.addColorStop(0.45, C.skyMid);
    g.addColorStop(0.78, C.skyLow);
    g.addColorStop(1.0, C.skyGlow);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, horizonY + 40);

    // sun low on the horizon, fixed (infinitely far)
    const sunX = W * 0.68, sunY = horizonY - H * 0.035, sunR = H * 0.055;
    const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.2, sunX, sunY, sunR * 4.2);
    glow.addColorStop(0, "rgba(255,196,120,0.85)");
    glow.addColorStop(0.35, "rgba(255,150,90,0.28)");
    glow.addColorStop(1, "rgba(255,150,90,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(sunX - sunR * 4.5, sunY - sunR * 4.5, sunR * 9, sunR * 9);
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
    const sg = ctx.createRadialGradient(sunX, sunY - sunR*0.3, sunR*0.1, sunX, sunY, sunR);
    sg.addColorStop(0, "#fff3d6");
    sg.addColorStop(1, C.sun);
    ctx.fillStyle = sg;
    ctx.fill();

    // thin sun bands across the sky
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = "#2a1830";
    for (let i = 0; i < 5; i++) {
      const y = horizonY - 18 - i * 26;
      ctx.fillRect(0, y, W, 3 + i * 1.5);
    }
    ctx.restore();

    // stars fading in up top
    ctx.save();
    for (let i = 0; i < 40; i++) {
      const sx = hash(i * 3.7) * W;
      const sy = hash(i * 7.9) * horizonY * 0.5;
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.5 + hash(i) * 1.2) + i));
      ctx.globalAlpha = 0.5 * tw * (1 - sy / (horizonY * 0.6));
      ctx.fillStyle = "#ffe9c9";
      ctx.fillRect(sx, sy, 1.4, 1.4);
    }
    ctx.restore();

    // slow clouds, parallax 0.04
    ctx.save();
    const cloudSpeed = dist * 0.04;
    for (let i = 0; i < 4; i++) {
      const span = W + 500;
      let cx = ((hash(i * 13.3) * span - cloudSpeed) % span + span) % span - 250;
      const cy = horizonY * (0.25 + hash(i * 5.1) * 0.45);
      const s = 0.7 + hash(i * 9.2) * 0.9;
      ctx.globalAlpha = 0.16 + 0.1 * hash(i * 2.2);
      ctx.fillStyle = i % 2 ? "#f0a06a" : "#c76a6e";
      for (let b = 0; b < 4; b++) {
        ctx.beginPath();
        ctx.ellipse(cx + b * 34 * s, cy + (b % 2) * 6, 46 * s, 12 * s, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------- far hills (parallax 0.08) ----------
  function drawFarHills() {
    const off = dist * 0.08;
    const amp = H * 0.05, base = horizonY + 2;
    ctx.beginPath();
    ctx.moveTo(0, base + amp);
    const step = 8;
    for (let x = 0; x <= W + step; x += step) {
      const u = (x + off) * 0.004;
      const y = base - Math.abs(Math.sin(u) * 0.7 + Math.sin(u * 2.7 + 1.3) * 0.3) * amp - 6;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, base - amp, 0, base + amp * 2);
    g.addColorStop(0, "#4a2c55");
    g.addColorStop(1, C.farHill);
    ctx.fillStyle = g;
    ctx.fill();
  }

  // ---------- mid hills with treeline (parallax 0.22) ----------
  function drawMidHills() {
    const off = dist * 0.22;
    const base = horizonY + H * 0.055;
    const amp = H * 0.045;

    ctx.beginPath();
    ctx.moveTo(0, base + amp * 2);
    const step = 10;
    for (let x = 0; x <= W + step; x += step) {
      const u = (x + off) * 0.006;
      const y = base - Math.abs(Math.sin(u * 0.8 + 4.1) * 0.8 + Math.sin(u * 2.1) * 0.2) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fillStyle = C.midHill;
    ctx.fill();

    // treeline bumps: one tree cluster per world tile of 260 units
    const tile = 260;
    const first = Math.floor(off / tile) - 1;
    const count = Math.ceil(W / tile) + 3;
    for (let i = first; i < first + count; i++) {
      const wx = i * tile - off;
      const u = (wx) * 0.006;
      const y = base - Math.abs(Math.sin(u * 0.8 + 4.1) * 0.8 + Math.sin(u * 2.1) * 0.2) * amp;
      const r = hash(i * 17.7);
      const n = 3 + Math.floor(r * 4);
      for (let k = 0; k < n; k++) {
        const rx = hash(i * 31.1 + k * 7.3);
        const tx = wx + (rx - 0.5) * tile * 0.8;
        const th = (10 + hash(i * 3.3 + k * 11.7) * 22) * (H / 800 + 0.4);
        if (tx < -40 || tx > W + 40) continue;
        ctx.fillStyle = C.treeFar;
        ctx.beginPath();
        // rounded conifer silhouette
        ctx.ellipse(tx, y - th * 0.45, th * 0.34, th * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---------- roadside strip (grass between horizon road and car lane) ----------
  function drawShoulder() {
    const g = ctx.createLinearGradient(0, roadTopY - H * 0.16, 0, roadTopY);
    g.addColorStop(0, C.midHill);
    g.addColorStop(1, C.grassLit);
    ctx.fillStyle = g;
    ctx.fillRect(0, roadTopY - H * 0.16, W, H * 0.16 + 2);
  }

  // ---------- roadside objects (parallax 0.6): poles, signs, bushes, fence posts ----------
  function drawRoadside() {
    const off = dist * 0.6;
    const yLine = roadTopY + 2;
    const tile = 340; // world units between "landmarks"
    const first = Math.floor(off / tile) - 1;
    const count = Math.ceil(W / tile) + 3;

    for (let i = first; i < first + count; i++) {
      const x = i * tile - off;
      const r = hash(i * 5.7);
      const scale = 0.75 + hash(i * 2.9) * 0.5;
      const kind = Math.floor(hash(i * 41.3) * 4);

      if (kind === 0) {
        // street lamp
        const hgt = H * 0.16 * scale;
        ctx.strokeStyle = C.pole;
        ctx.lineWidth = 4 * scale;
        ctx.beginPath();
        ctx.moveTo(x, yLine);
        ctx.lineTo(x, yLine - hgt);
        ctx.quadraticCurveTo(x, yLine - hgt - 14, x + 26 * scale, yLine - hgt - 10);
        ctx.stroke();
        // warm lamp glow
        const lx = x + 30 * scale, ly = yLine - hgt - 8;
        const lg = ctx.createRadialGradient(lx, ly, 1, lx, ly, 26 * scale);
        lg.addColorStop(0, "rgba(255,190,110,0.5)");
        lg.addColorStop(1, "rgba(255,190,110,0)");
        ctx.fillStyle = lg;
        ctx.beginPath(); ctx.arc(lx, ly, 26 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffd9a0";
        ctx.beginPath(); ctx.arc(lx, ly, 3.4 * scale, 0, Math.PI * 2); ctx.fill();
      } else if (kind === 1) {
        // road sign
        const hgt = H * 0.085 * scale;
        ctx.strokeStyle = C.pole;
        ctx.lineWidth = 3.5 * scale;
        ctx.beginPath(); ctx.moveTo(x, yLine); ctx.lineTo(x, yLine - hgt); ctx.stroke();
        ctx.fillStyle = hash(i * 3.1) > 0.5 ? "#2e4d43" : "#513a5e";
        ctx.fillRect(x - 16 * scale, yLine - hgt - 22 * scale, 32 * scale, 22 * scale);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x - 16 * scale, yLine - hgt - 22 * scale, 32 * scale, 22 * scale);
      } else if (kind === 2) {
        // bush cluster
        const n = 3 + Math.floor(hash(i * 8.8) * 3);
        for (let k = 0; k < n; k++) {
          const bx = x + (hash(i * 13.9 + k * 5.5) - 0.5) * 70 * scale;
          const br = (9 + hash(i * 7.7 + k * 3.3) * 13) * scale;
          ctx.fillStyle = k % 2 ? "#2a1c3c" : "#33224a";
          ctx.beginPath();
          ctx.ellipse(bx, yLine - br * 0.4, br, br * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // fence posts with a rail
        ctx.strokeStyle = C.pole;
        ctx.lineWidth = 3 * scale;
        for (let k = 0; k < 3; k++) {
          const px = x + k * 26 * scale;
          ctx.beginPath();
          ctx.moveTo(px, yLine);
          ctx.lineTo(px, yLine - 18 * scale);
          ctx.stroke();
        }
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 8, yLine - 14 * scale);
        ctx.lineTo(x + 2 * 26 * scale + 8, yLine - 14 * scale);
        ctx.stroke();
      }
    }
  }

  // ---------- road (full speed) ----------
  function drawRoad(t) {
    // asphalt
    const g = ctx.createLinearGradient(0, roadTopY, 0, roadBottomY);
    g.addColorStop(0, "#2b2238");
    g.addColorStop(0.5, C.road);
    g.addColorStop(1, "#150f20");
    ctx.fillStyle = g;
    ctx.fillRect(0, roadTopY, W, roadBottomY - roadTopY);

    // shoulder line
    ctx.fillStyle = C.roadEdge;
    ctx.fillRect(0, roadTopY, W, 4);

    // sun reflection strip on the asphalt
    ctx.save();
    ctx.globalAlpha = 0.10;
    const rg = ctx.createLinearGradient(0, roadTopY, 0, roadTopY + (roadBottomY - roadTopY) * 0.5);
    rg.addColorStop(0, C.skyGlow);
    rg.addColorStop(1, "rgba(255,179,92,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, roadTopY + 4, W, (roadBottomY - roadTopY) * 0.5);
    ctx.restore();

    // lane dashes scrolling at full speed
    const dashSpan = 130; // world units per dash cell
    const dashW = 64;
    const first = Math.floor(dist / dashSpan) - 1;
    const count = Math.ceil(W / dashSpan) + 3;
    const laneY = roadTopY + (roadBottomY - roadTopY) * 0.52;
    ctx.fillStyle = C.dash;
    for (let i = first; i < first + count; i++) {
      const x = i * dashSpan - dist;
      ctx.save();
      ctx.globalAlpha = 0.85;
      // slight perspective: dashes nearer the bottom are longer/thicker
      const persp = 0.75 + 0.5 * ((laneY - roadTopY) / (roadBottomY - roadTopY));
      ctx.beginPath();
      ctx.ellipse(x, laneY, dashW * persp, 4.5 * persp, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // faint tire-track lines
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = "#0a0712";
    ctx.fillRect(0, roadTopY + (roadBottomY - roadTopY) * 0.30, W, 3);
    ctx.fillRect(0, roadTopY + (roadBottomY - roadTopY) * 0.72, W, 3);
    ctx.restore();
  }

  // ---------- the car ----------
  const car = {
    x: 0, y: 0, scale: 1,
    wheelR: 0,
    angle: 0,      // wheel rotation
    bob: 0,
    pitch: 0,
  };

  function layoutCar() {
    car.scale = Math.max(0.62, Math.min(W, H * 1.6) / 1250);
    car.wheelR = 34 * car.scale;
    car.x = W * 0.38;
    car.y = roadTopY + (roadBottomY - roadTopY) * 0.62;
  }

  function drawWheel(cx, cy, r, angle) {
    // tire
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "#0c0a12";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#23202c";
    ctx.stroke();

    // rim
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.62, 0, Math.PI * 2);
    const rg = ctx.createRadialGradient(cx - r*0.18, cy - r*0.18, r*0.05, cx, cy, r*0.62);
    rg.addColorStop(0, "#e8eaf0");
    rg.addColorStop(0.7, C.rim);
    rg.addColorStop(1, "#7c8090");
    ctx.fillStyle = rg;
    ctx.fill();

    // spokes
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = "#4a4e5c";
    for (let i = 0; i < 5; i++) {
      ctx.rotate(Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.roundRect(-r * 0.06, -r * 0.58, r * 0.12, r * 0.5, r * 0.05);
      ctx.fill();
    }
    // hub
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = "#2c2f3a";
    ctx.fill();
    ctx.restore();

    // brake glow (warm, since we brake into sunset)
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
    ctx.fillStyle = "#ff9c5a";
    ctx.fill();
    ctx.restore();
  }

  function drawCar(t) {
    layoutCar();
    const s = car.scale;
    const bob = Math.sin(t * 5.1) * 1.6 * s + Math.sin(t * 11.3 + 1.2) * 0.7 * s;
    const pitch = Math.sin(t * 2.6) * 0.006 + Math.sin(t * 5.1) * 0.004;

    // ground shadow
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.ellipse(car.x + 118 * s, car.y + 30 * s, 175 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#05030a";
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(car.x, car.y + bob);
    ctx.rotate(pitch);
    ctx.scale(s, s);

    // --- headlight beam (pointing right, into the scene) ---
    ctx.save();
    const beam = ctx.createLinearGradient(330, -10, 900, 60);
    beam.addColorStop(0, "rgba(255,224,160,0.20)");
    beam.addColorStop(1, "rgba(255,224,160,0)");
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(326, -34);
    ctx.lineTo(980, -90);
    ctx.lineTo(980, 96);
    ctx.lineTo(326, -6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // --- body ---
    const bodyPath = () => {
      ctx.beginPath();
      ctx.moveTo(-150, -18);
      ctx.lineTo(-146, -52);
      ctx.quadraticCurveTo(-140, -66, -118, -68);   // rear deck
      ctx.lineTo(-96, -70);
      ctx.quadraticCurveTo(-84, -118, -34, -124);    // rear glass rise
      ctx.lineTo(52, -126);                          // roof
      ctx.quadraticCurveTo(96, -124, 118, -78);      // windshield
      ctx.lineTo(150, -70);
      ctx.quadraticCurveTo(216, -64, 244, -40);      // hood
      ctx.quadraticCurveTo(258, -28, 252, -12);      // nose
      ctx.lineTo(246, -4);
      ctx.quadraticCurveTo(240, 4, 224, 4);
      ctx.lineTo(-132, 4);
      ctx.quadraticCurveTo(-152, 4, -150, -18);
      ctx.closePath();
    };

    // lower shadow of body
    bodyPath();
    ctx.save();
    ctx.translate(0, 5);
    ctx.fillStyle = "rgba(5,3,10,0.35)";
    ctx.fill();
    ctx.restore();

    // main body
    const bg = ctx.createLinearGradient(0, -126, 0, 10);
    bg.addColorStop(0, "#b03a48");
    bg.addColorStop(0.45, C.carBody);
    bg.addColorStop(0.8, C.carBodyLo);
    bg.addColorStop(1, "#3d0f18");
    bodyPath();
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(20,8,14,0.8)";
    ctx.stroke();

    // sun rim light along the roofline
    ctx.save();
    bodyPath();
    ctx.clip();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = "#ffd9a0";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-96, -118);
    ctx.quadraticCurveTo(-84, -122, -34, -124);
    ctx.lineTo(52, -126);
    ctx.quadraticCurveTo(96, -124, 118, -78);
    ctx.stroke();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = "#ffd9a0";
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(-150, -60);
    ctx.quadraticCurveTo(40, -74, 250, -40);
    ctx.stroke();
    ctx.restore();

    // --- glass ---
    const glass = () => {
      ctx.beginPath();
      ctx.moveTo(-88, -72);
      ctx.quadraticCurveTo(-78, -110, -34, -116);
      ctx.lineTo(50, -118);
      ctx.quadraticCurveTo(88, -116, 108, -76);
      ctx.closePath();
    };
    const gg = ctx.createLinearGradient(0, -118, 0, -70);
    gg.addColorStop(0, "rgba(255,206,143,0.95)");
    gg.addColorStop(0.5, "rgba(214,140,110,0.85)");
    gg.addColorStop(1, "rgba(90,52,70,0.9)");
    glass();
    ctx.fillStyle = gg;
    ctx.fill();

    // window divider (B-pillar)
    ctx.strokeStyle = "rgba(30,12,20,0.9)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(12, -118);
    ctx.lineTo(10, -72);
    ctx.stroke();

    // glass reflection streak
    ctx.save();
    glass();
    ctx.clip();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#fff3dd";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-60, -118);
    ctx.lineTo(-8, -70);
    ctx.stroke();
    ctx.restore();

    // --- details: door line, handles, lights ---
    ctx.strokeStyle = "rgba(30,10,16,0.65)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(2, -70);
    ctx.lineTo(4, 0);
    ctx.stroke();
    ctx.fillStyle = "rgba(255,220,170,0.5)";
    ctx.fillRect(14, -58, 16, 4);   // handle
    ctx.fillRect(-52, -58, 16, 4);  // handle

    // headlight
    ctx.fillStyle = "#fff0c8";
    ctx.beginPath();
    ctx.ellipse(246, -30, 9, 7, -0.2, 0, Math.PI * 2);
    ctx.fill();
    // taillight (glowing red)
    ctx.fillStyle = "#ff4a3c";
    ctx.beginPath();
    ctx.ellipse(-146, -54, 7, 5, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.5;
    const tg = ctx.createRadialGradient(-146, -54, 1, -146, -54, 26);
    tg.addColorStop(0, "rgba(255,70,50,0.8)");
    tg.addColorStop(1, "rgba(255,70,50,0)");
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(-146, -54, 26, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // exhaust puff (subtle)
    ctx.save();
    ctx.globalAlpha = 0.10 + 0.05 * Math.sin(t * 7);
    ctx.fillStyle = "#cfd2da";
    for (let i = 0; i < 3; i++) {
      const px = -160 - i * 22 - (t * 90 % 22);
      ctx.beginPath();
      ctx.arc(px, -6 - i * 5, 7 + i * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // --- wheels ---
    drawWheel(-88, 22, 34, car.angle);
    drawWheel(162, 22, 34, car.angle + 0.35);

    // wheel arch shading
    ctx.strokeStyle = "rgba(10,5,12,0.8)";
    ctx.lineWidth = 4;
    for (const wx of [-88, 162]) {
      ctx.beginPath();
      ctx.arc(wx, 22, 37, Math.PI, 0);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- foreground grass strip (parallax 1.35) ----------
  function drawForeground(t) {
    const off = dist * 1.35;
    const yBase = H + 4;
    const tile = 90;
    const first = Math.floor(off / tile) - 1;
    const count = Math.ceil(W / tile) + 3;
    ctx.save();
    ctx.fillStyle = "#0d0916";
    for (let i = first; i < first + count; i++) {
      const x = i * tile - off;
      const r = hash(i * 6.1);
      const h = 16 + r * 30;
      const sway = Math.sin(t * 2 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(x, yBase);
      ctx.quadraticCurveTo(x + 10 + sway, yBase - h * 0.6, x + 22 + sway, yBase - h);
      ctx.quadraticCurveTo(x + 30 + sway, yBase - h * 0.5, x + 34, yBase);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------- main loop ----------
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    layoutCar();
    dist += SPEED * dt;
    if (car.wheelR > 0) car.angle -= (SPEED / car.wheelR) * dt;

    ctx.clearRect(0, 0, W, H);
    drawSky(t);
    drawFarHills();
    drawMidHills();
    drawShoulder();
    drawRoadside();
    drawRoad(t);
    drawCar(t);
    drawForeground(t);

    if (vignette) ctx.drawImage(vignette, 0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
