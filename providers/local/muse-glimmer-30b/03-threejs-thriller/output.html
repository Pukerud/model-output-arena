<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thriller Three.js - Muse Glimmer 30B</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block}</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x020210);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(0,4,12);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

scene.add(new THREE.AmbientLight(0xffffff,0.4));
const dir=new THREE.DirectionalLight(0xffffff,1.2);
dir.position.set(5,10,7);dir.castShadow=true;scene.add(dir);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x111122,metalness:.3,roughness:.6}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);

// stage lights
for(let i=0;i<8;i++){
  const l=new THREE.PointLight(0xff6600,1,30);
  const a=i/8*Math.PI*2;
  l.position.set(Math.cos(a)*10,6,Math.sin(a)*10);
  scene.add(l);
}

// characters as simple capsules
function makeCharacter(color,name){
  const group=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.5,1.2,4,16),new THREE.MeshStandardMaterial({color}));
  body.castShadow=true;body.position.y=1.2;group.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32),new THREE.MeshStandardMaterial({color:0xffdbac}));
  head.position.y=2.1;group.add(head);
  group.userData.name=name;
  scene.add(group);
  return group;
}
const chars=[
  makeCharacter(0x222222,'Michael Jackson'),
  makeCharacter(0x7cfc00,'Pepe the Frog'),
  makeCharacter(0x1e90ff,'Donald Trump'),
  makeCharacter(0xff4500,'Elon Musk')
];
chars.forEach((c,i)=>{c.position.x=(i-1.5)*3;});

// Thriller choreography simple
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.02;
  chars.forEach((c,i)=>{
    c.rotation.y=Math.sin(t+i)*0.2;
    c.position.y=Math.sin(t*2+i)*0.1+0;
    // arm wave
    c.children[0].rotation.z=Math.sin(t*3+i)*0.3;
  });
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
