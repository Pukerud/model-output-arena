<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parallax Car Drive — Sunset Highway</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Configuration ---
const roadY = () => H * 0.68;
const carX = () => W * 0.35;
const baseSpeed = 120; // pixels per second for nearest layer
let t = 0;

// --- Scenery generators (procedural, repeating) ---
function hash(n) { return ((Math.sin(n * 127.1 + 311.7) * 43758.5453) % 1 + 1) % 1; }

// Generate distant mountains (layer 0 - slowest)
const mountainCount = 60;
function getMountainX(i, offset) {
  const period = W * 8;
  return ((i * (period / mountainCount) + offset) % period) - (W * 2);
}

// Generate mid-ground hills (layer 1)
const hillCount = 40;
function getHillX(i, offset) {
  const period = W * 5;
  return ((i * (period / hillCount) + offset) % period) - (W * 2);
}

// Generate trees and poles (layer 2)
const treeCount = 80;
function getTreeX(i, offset) {
  const period = W * 3.5;
  return ((i * (period / treeCount) + offset) % period) - (W);
}

// Generate roadside elements (layer 3)
const signCount = 30;
function getSignX(i, offset) {
  const period = W * 2.5;
  return ((i * (period / signCount) + offset) % period) - (W);
}

// --- Drawing functions ---

function drawSky() {
  // Sunset gradient sky
  const grad = ctx.createLinearGradient(0, 0, 0, H * 0.75);
  grad.addColorStop(0, '#1a0a2e');      // deep purple top
  grad.addColorStop(0.3, '#4a1942');    // magenta-purple
  grad.addColorStop(0.55, '#c84b31');   // burnt orange
  grad.addColorStop(0.75, '#f7a64d');   // golden yellow
  grad.addColorStop(1, '#ffd98e');      // warm light near horizon
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sun glow
  const sunX = W * 0.72;
  const sunY = roadY() - H * 0.12;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.35);
  sunGrad.addColorStop(0, 'rgba(255, 240, 180, 0.9)');
  sunGrad.addColorStop(0.15, 'rgba(255, 200, 100, 0.6)');
  sunGrad.addColorStop(0.4, 'rgba(255, 140, 60, 0.2)');
  sunGrad.addColorStop(1, 'rgba(255, 100, 40, 0)');
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, W, H);

  // Sun disc
  ctx.beginPath();
  ctx.arc(sunX, sunY, H * 0.035, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8e1';
  ctx.fill();

  // Subtle clouds
  for (let i = 0; i < 5; i++) {
    const cx = ((hash(i + 7) * W * 2 - W * 0.5) + t * baseSpeed * 0.03) % (W * 2) - W * 0.25;
    const cy = H * (0.12 + hash(i + 13) * 0.2);
    const cw = W * (0.15 + hash(i + 17) * 0.2);
    ctx.beginPath();
    ctx.fillStyle = `rgba(255, 220, 180, ${0.06 + hash(i + 19) * 0.04})`;
    for (let j = 0; j < 4; j++) {
      const bx = cx + j * cw / 5;
      const by = cy - hash(i * 3 + j) * H * 0.02;
      const br = cw / 6 + hash(i * 7 + j) * cw / 8;
      ctx.moveTo(bx + br, by);
      ctx.arc(bx, by, br, 0, Math.PI * 2);
    }
    ctx.fill();
  }
}

function drawMountains(offset) {
  const rY = roadY();
  // Far mountains - dark purple/blue silhouettes
  ctx.beginPath();
  ctx.moveTo(-W, rY);
  for (let i = 0; i <= mountainCount + 2; i++) {
    const x = getMountainX(i, offset * baseSpeed * 0.08);
    const h = H * (0.15 + hash(i) * 0.18);
    ctx.lineTo(x, rY - h);
  }
  ctx.lineTo(W * 2, rY);
  ctx.closePath();
  const mGrad = ctx.createLinearGradient(0, rY - H * 0.35, 0, rY);
  mGrad.addColorStop(0, '#2d1b4e');
  mGrad.addColorStop(1, '#4a3068');
  ctx.fillStyle = mGrad;
  ctx.fill();

  // Second mountain range - slightly closer
  ctx.beginPath();
  ctx.moveTo(-W, rY);
  for (let i = 0; i <= mountainCount + 2; i++) {
    const x = getMountainX(i + 100, offset * baseSpeed * 0.12);
    const h = H * (0.1 + hash(i + 50) * 0.14);
    ctx.lineTo(x, rY - h);
  }
  ctx.lineTo(W * 2, rY);
  ctx.closePath();
  ctx.fillStyle = '#3d2860';
  ctx.fill();
}

function drawHills(offset) {
  const rY = roadY();
  // Mid-ground rolling hills
  ctx.beginPath();
  ctx.moveTo(-W * 1.5, rY);
  for (let i = 0; i <= hillCount + 2; i++) {
    const x = getHillX(i, offset * baseSpeed * 0.25);
    const h = H * (0.06 + hash(i + 20) * 0.1);
    ctx.lineTo(x, rY - h);
  }
  ctx.lineTo(W * 2, rY);
  ctx.closePath();
  const hGrad = ctx.createLinearGradient(0, rY - H * 0.18, 0, rY);
  hGrad.addColorStop(0, '#5a4030');
  hGrad.addColorStop(1, '#7a5c42');
  ctx.fillStyle = hGrad;
  ctx.fill();
}

function drawTrees(offset) {
  const rY = roadY();
  for (let i = 0; i < treeCount; i++) {
    let x = getTreeX(i, offset * baseSpeed * 0.5);
    if (x < -W * 0.3 || x > W * 1.3) continue;

    const h = H * (0.12 + hash(i + 40) * 0.18);
    const trunkW = Math.max(3, h * 0.06);
    const canopyR = h * 0.35;
    const baseY = rY - H * 0.02;

    // Trunk
    ctx.fillStyle = '#3d2b1f';
    ctx.fillRect(x - trunkW / 2, baseY - h * 0.6, trunkW, h * 0.6);

    // Canopy layers (pine-like)
    const layers = 4;
    for (let j = 0; j < layers; j++) {
      const ly = baseY - h * 0.55 - j * h * 0.12;
      const lr = canopyR * (1 - j * 0.18);
      ctx.beginPath();
      ctx.arc(x, ly, lr, 0, Math.PI * 2);
      const shade = hash(i + j) * 0.15;
      ctx.fillStyle = `rgb(${30 + shade * 40}, ${60 + shade * 30 - j * 8}, ${25 + shade * 20})`;
      ctx.fill();
    }
  }
}

function drawRoadsideElements(offset) {
  const rY = roadY();
  for (let i = 0; i < signCount; i++) {
    let x = getSignX(i, offset * baseSpeed * 0.7);
    if (x < -W * 0.2 || x > W * 1.2) continue;

    const type = Math.floor(hash(i + 60) * 3);
    const poleH = H * (0.15 + hash(i + 80) * 0.1);
    const baseY = rY - H * 0.015;

    // Pole
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(x - 2, baseY - poleH, 4, poleH);

    if (type === 0) {
      // Street light
      const bulbX = x + H * 0.03;
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, baseY - poleH);
      ctx.lineTo(bulbX, baseY - poleH + 5);
      ctx.stroke();

      // Light glow
      const glowGrad = ctx.createRadialGradient(bulbX, baseY - poleH + 8, 0, bulbX, baseY - poleH + 8, H * 0.12);
      glowGrad.addColorStop(0, 'rgba(255, 240, 160, 0.35)');
      glowGrad.addColorStop(1, 'rgba(255, 220, 100, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(bulbX - H * 0.12, baseY - poleH - H * 0.04, H * 0.24, H * 0.2);

      // Bulb
      ctx.beginPath();
      ctx.arc(bulbX, baseY - poleH + 8, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fff9c4';
      ctx.fill();
    } else if (type === 1) {
      // Road sign
      const sw = H * 0.05;
      const sh = H * 0.035;
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(x - sw / 2, baseY - poleH - sh / 2, sw, sh);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - sw / 2, baseY - poleH - sh / 2, sw, sh);
    } else {
      // Power line tower (simple)
      const tw = H * 0.04;
      ctx.strokeStyle = '#4b5563';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - tw / 2, baseY);
      ctx.lineTo(x, baseY - poleH);
      ctx.lineTo(x + tw / 2, baseY);
      ctx.stroke();
    }
  }
}

function drawGround(offset) {
  const rY = roadY();

  // Far ground (behind road)
  ctx.fillStyle = '#4a5d3a';
  ctx.fillRect(0, rY - H * 0.02, W, H * 0.04);

  // Road surface with gradient
  const roadGrad = ctx.createLinearGradient(0, rY, 0, H);
  roadGrad.addColorStop(0, '#374151');
  roadGrad.addColorStop(0.3, '#2d3748');
  roadGrad.addColorStop(1, '#1f2937');
  ctx.fillStyle = roadGrad;
  ctx.fillRect(0, rY, W, H - rY);

  // Road edge lines (yellow)
  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = Math.max(2, H * 0.004);
  ctx.beginPath();
  ctx.moveTo(0, rY + 2);
  ctx.lineTo(W, rY + 2);
  ctx.stroke();

  // Center dashed line (white)
  const dashLen = W * 0.06;
  const gapLen = W * 0.04;
  const totalPeriod = dashLen + gapLen;
  const roadCenterY = rY + (H - rY) * 0.52;
  const scrollOffset = -(t * baseSpeed * 1.2) % totalPeriod;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = Math.max(2, H * 0.003);
  ctx.setLineDash([dashLen, gapLen]);
  ctx.lineDashOffset = scrollOffset;
  ctx.beginPath();
  ctx.moveTo(-W, roadCenterY);
  ctx.lineTo(W * 2, roadCenterY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Near ground (foreground grass)
  const nearGroundY = rY + (H - rY) * 0.85;
  const ngGrad = ctx.createLinearGradient(0, nearGroundY, 0, H);
  ngGrad.addColorStop(0, '#3d5a2e');
  ngGrad.addColorStop(1, '#2d4a1f');
  ctx.fillStyle = ngGrad;
  ctx.fillRect(0, nearGroundY, W, H - nearGroundY);

  // Grass tufts scrolling fast (foreground)
  const grassCount = 60;
  for (let i = 0; i < grassCount; i++) {
    let gx = ((i * (W * 2 / grassCount)) - (t * baseSpeed * 1.5)) % (W * 2) - W * 0.5;
    const gy = nearGroundY + hash(i + 90) * (H - nearGroundY);
    const gh = H * (0.01 + hash(i + 100) * 0.02);

    ctx.strokeStyle = `rgba(${60 + hash(i) * 40}, ${100 + hash(i + 1) * 50}, ${30 + hash(i + 2) * 30}, 0.8)`;
    ctx.lineWidth = 1.5;
    for (let j = -1; j <= 1; j++) {
      ctx.beginPath();
      ctx.moveTo(gx + j * 3, gy);
      ctx.quadraticCurveTo(gx + j * 5 + Math.sin(t * 2 + i) * 2, gy - gh * 0.6, gx + j * 4 + Math.sin(t * 3 + i) * 3, gy - gh);
      ctx.stroke();
    }
  }

  // Road texture (subtle noise-like specks scrolling)
  const specCount = 120;
  for (let i = 0; i < specCount; i++) {
    let sx = ((i * (W * 3 / specCount)) - (t * baseSpeed * 0.95)) % (W * 3) - W;
    const sy = rY + hash(i + 110) * (nearGroundY - rY);
    ctx.fillStyle = `rgba(${80 + hash(i + 120) * 60}, ${80 + hash(i + 130) * 60}, ${90 + hash(i + 140) * 50}, 0.4)`;
    ctx.fillRect(sx, sy, 2 + hash(i) * 3, 1);
  }
}

function drawCar(x, y) {
  const scale = H / 800;
  const bounce = Math.sin(t * 6) * 1.5 * scale; // subtle body motion from road vibration
  const tilt = Math.sin(t * 4 + 0.3) * 0.003;   // very slight pitch oscillation

  ctx.save();
  ctx.translate(x, y + bounce);
  ctx.rotate(tilt);

  // Shadow under car
  ctx.beginPath();
  ctx.ellipse(0, 55 * scale, 140 * scale, 12 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
  ctx.fill();

  // --- Car body (sedan profile) ---
  const carColor = '#c41e3a';       // deep red
  const carDark = '#8b1528';        // darker shade
  const highlight = '#ff6b7a';      // light reflection

  // Lower body
  ctx.beginPath();
  ctx.moveTo(-130 * scale, 40 * scale);
  ctx.lineTo(130 * scale, 40 * scale);
  ctx.quadraticCurveTo(145 * scale, 40 * scale, 148 * scale, 25 * scale);
  ctx.lineTo(145 * scale, 10 * scale);
  ctx.lineTo(-135 * scale, 10 * scale);
  ctx.quadraticCurveTo(-140 * scale, 10 * scale, -140 * scale, 25 * scale);
  ctx.closePath();

  const bodyGrad = ctx.createLinearGradient(0, 10 * scale, 0, 40 * scale);
  bodyGrad.addColorStop(0, carColor);
  bodyGrad.addColorStop(0.7, carDark);
  bodyGrad.addColorStop(1, '#5a0e1c');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Upper cabin / roof
  ctx.beginPath();
  ctx.moveTo(-95 * scale, 10 * scale);
  ctx.lineTo(-75 * scale, -25 * scale);
  ctx.quadraticCurveTo(-60 * scale, -40 * scale, -30 * scale, -42 * scale);
  ctx.lineTo(40 * scale, -42 * scale);
  ctx.quadraticCurveTo(70 * scale, -40 * scale, 85 * scale, -25 * scale);
  ctx.lineTo(100 * scale, 10 * scale);
  ctx.closePath();

  const cabinGrad = ctx.createLinearGradient(0, -42 * scale, 0, 10 * scale);
  cabinGrad.addColorStop(0, carColor);
  cabinGrad.addColorStop(1, carDark);
  ctx.fillStyle = cabinGrad;
  ctx.fill();

  // Windows (dark tinted)
  const windowColor = '#1a2744';
  const windowReflect = 'rgba(180, 210, 255, 0.15)';

  // Rear window
  ctx.beginPath();
  ctx.moveTo(-90 * scale, 8 * scale);
  ctx.lineTo(-73 * scale, -22 * scale);
  ctx.quadraticCurveTo(-60 * scale, -36 * scale, -45 * scale, -38 * scale);
  ctx.lineTo(-40 * scale, 8 * scale);
  ctx.closePath();
  ctx.fillStyle = windowColor;
  ctx.fill();

  // Front window
  ctx.beginPath();
  ctx.moveTo(42 * scale, 8 * scale);
  ctx.lineTo(37 * scale, -38 * scale);
  ctx.quadraticCurveTo(65 * scale, -36 * scale, 80 * scale, -22 * scale);
  ctx.lineTo(95 * scale, 8 * scale);
  ctx.closePath();
  ctx.fillStyle = windowColor;
  ctx.fill();

  // Window reflections (sunlight streaks)
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#ffe4b5';
  ctx.beginPath();
  ctx.moveTo(-70 * scale, -18 * scale);
  ctx.lineTo(-50 * scale, -35 * scale);
  ctx.lineTo(-45 * scale, -35 * scale);
  ctx.lineTo(-65 * scale, -18 * scale);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(50 * scale, -18 * scale);
  ctx.lineTo(72 * scale, -34 * scale);
  ctx.lineTo(77 * scale, -34 * scale);
  ctx.lineTo(55 * scale, -18 * scale);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // Body highlight (sun reflection on hood)
  ctx.beginPath();
  ctx.moveTo(60 * scale, 12 * scale);
  ctx.lineTo(135 * scale, 14 * scale);
  ctx.lineTo(138 * scale, 20 * scale);
  ctx.lineTo(60 * scale, 18 * scale);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 200, 150, 0.18)';
  ctx.fill();

  // Door line
  ctx.strokeStyle = carDark;
  ctx.lineWidth = 1.5 * scale;
  ctx.beginPath();
  ctx.moveTo(-10 * scale, 10 * scale);
  ctx.lineTo(-10 * scale, 38 * scale);
  ctx.stroke();

  // Door handle
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(5 * scale, 22 * scale, 12 * scale, 3 * scale);

  // Headlight (front)
  ctx.beginPath();
  ctx.moveTo(140 * scale, 18 * scale);
  ctx.lineTo(147 * scale, 16 * scale);
  ctx.lineTo(147 * scale, 26 * scale);
  ctx.quadraticCurveTo(145 * scale, 30 * scale, 140 * scale, 28 * scale);
  ctx.closePath();
  const hlGrad = ctx.createLinearGradient(140 * scale, 0, 147 * scale, 0);
  hlGrad.addColorStop(0, '#fff9c4');
  hlGrad.addColorStop(1, '#ffe082');
  ctx.fillStyle = hlGrad;
  ctx.fill();

  // Headlight beam glow (subtle)
  const beamGrad = ctx.createRadialGradient(147 * scale, 22 * scale, 0, 160 * scale, 25 * scale, H * 0.1);
  beamGrad.addColorStop(0, 'rgba(255, 248, 200, 0.08)');
  beamGrad.addColorStop(1, 'rgba(255, 240, 160, 0)');
  ctx.fillStyle = beamGrad;
  ctx.fillRect(147 * scale, 0, W, H);

  // Taillight (rear)
  ctx.beginPath();
  ctx.moveTo(-138 * scale, 15 * scale);
  ctx.lineTo(-142 * scale, 16 * scale);
  ctx.lineTo(-142 * scale, 28 * scale);
  ctx.quadraticCurveTo(-140 * scale, 32 * scale, -138 * scale, 30 * scale);
  ctx.closePath();
  const tlGrad = ctx.createLinearGradient(-142 * scale, 0, -138 * scale, 0);
  tlGrad.addColorStop(0, '#ff1744');
  tlGrad.addColorStop(1, '#d50000');
  ctx.fillStyle = tlGrad;
  ctx.fill();

  // Taillight glow
  const tailGlow = ctx.createRadialGradient(-142 * scale, 22 * scale, 0, -160 * scale, 22 * scale, H * 0.08);
  tailGlow.addColorStop(0, 'rgba(255, 30, 60, 0.1)');
  tailGlow.addColorStop(1, 'rgba(255, 0, 40, 0)');
  ctx.fillStyle = tailGlow;
  ctx.fillRect(-W * 0.3, 0, W * 0.3, H);

  // --- Wheels ---
  const wheelRadius = 18 * scale;
  const wheelOffsetY = 42 * scale;
  const frontWheelX = 75 * scale;
  const rearWheelX = -80 * scale;
  const rotation = t * baseSpeed * 0.03; // wheel spin speed

  drawWheel(frontWheelX, wheelOffsetY, wheelRadius, rotation);
  drawWheel(rearWheelX, wheelOffsetY, wheelRadius, rotation);

  // Bumper details
  ctx.fillStyle = '#2d2d2d';
  ctx.fillRect(135 * scale, 34 * scale, 15 * scale, 6 * scale);
  ctx.fillRect(-148 * scale, 34 * scale, 10 * scale, 6 * scale);

  // Side mirror
  ctx.fillStyle = carColor;
  ctx.beginPath();
  ctx.ellipse(92 * scale, -5 * scale, 6 * scale, 4 * scale, -0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawWheel(x, y, r, rotation) {
  // Tire shadow
  ctx.beginPath();
  ctx.ellipse(x + 1, y + r + 1, r * 0.95, 4, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fill();

  // Tire (black rubber)
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const tireGrad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  tireGrad.addColorStop(0, '#4a4a4a');
  tireGrad.addColorStop(0.6, '#2d2d2d');
  tireGrad.addColorStop(1, '#1a1a1a');
  ctx.fillStyle = tireGrad;
  ctx.fill();

  // Tire tread marks (rotating)
  const spokeCount = 8;
  for (let i = 0; i < spokeCount; i++) {
    const angle = rotation + (i * Math.PI * 2 / spokeCount);
    const tx = x + Math.cos(angle) * r * 0.85;
    const ty = y + Math.sin(angle) * r * 0.85;
    ctx.beginPath();
    ctx.arc(tx, ty, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#3d3d3d';
    ctx.fill();
  }

  // Rim (silver alloy)
  const rimR = r * 0.6;
  ctx.beginPath();
  ctx.arc(x, y, rimR, 0, Math.PI * 2);
  const rimGrad = ctx.createRadialGradient(x - rimR * 0.3, y - rimR * 0.3, 0, x, y, rimR);
  rimGrad.addColorStop(0, '#e8e8e8');
  rimGrad.addColorStop(0.5, '#c0c0c0');
  rimGrad.addColorStop(1, '#909090');
  ctx.fillStyle = rimGrad;
  ctx.fill();

  // Rim spokes (rotating)
  const spokeNum = 5;
  for (let i = 0; i < spokeNum; i++) {
    const angle = rotation + (i * Math.PI * 2 / spokeNum);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, -2);
    ctx.lineTo(rimR * 0.9, -3);
    ctx.lineTo(rimR * 0.9, 3);
    ctx.closePath();
    const spokeGrad = ctx.createLinearGradient(0, 0, rimR, 0);
    spokeGrad.addColorStop(0, '#d4d4d4');
    spokeGrad.addColorStop(1, '#a8a8a8');
    ctx.fillStyle = spokeGrad;
    ctx.fill();
    ctx.restore();
  }

  // Center cap
  ctx.beginPath();
  ctx.arc(x, y, rimR * 0.25, 0, Math.PI * 2);
  const capGrad = ctx.createRadialGradient(x - 1, y - 1, 0, x, y, rimR * 0.25);
  capGrad.addColorStop(0, '#f5f5f5');
  capGrad.addColorStop(1, '#b8b8b8');
  ctx.fillStyle = capGrad;
  ctx.fill();

  // Hub detail (rotating)
  for (let i = 0; i < 4; i++) {
    const angle = rotation + (i * Math.PI / 2);
    const hx = x + Math.cos(angle) * rimR * 0.15;
    const hy = y + Math.sin(angle) * rimR * 0.15;
    ctx.beginPath();
    ctx.arc(hx, hy, 1, 0, Math.PI * 2);
    ctx.fillStyle = '#888';
    ctx.fill();
  }
}

function drawAtmosphericEffects() {
  // Heat haze / dust particles near road
  const rY = roadY();
  for (let i = 0; i < 30; i++) {
    let px = ((i * W * 0.15) - t * baseSpeed * 0.6) % (W * 2) - W * 0.5;
    const py = rY + H * 0.02 + Math.sin(t * 3 + i * 7) * H * 0.03;
    const size = 1 + hash(i + 200) * 2;
    ctx.beginPath();
    ctx.arc(px, py, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 240, 200, ${0.03 + hash(i + 210) * 0.04})`;
    ctx.fill();
  }

  // Vignette effect for cinematic feel
  const vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.8);
  vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.35)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // Warm color overlay (sunset mood)
  ctx.fillStyle = 'rgba(255, 140, 60, 0.04)';
  ctx.fillRect(0, 0, W, H);
}

// --- Main animation loop ---
function animate(timestamp) {
  const dt = (timestamp - (animate.lastTime || timestamp)) / 1000;
  animate.lastTime = timestamp;
  t += dt;

  ctx.clearRect(0, 0, W, H);

  // Draw layers back to front with parallax scrolling
  drawSky();
  drawMountains(t);
  drawHills(t);
  drawTrees(t);
  drawRoadsideElements(t);
  drawGround(t);

  // Car stays fixed in position (world moves around it)
  const carY = roadY() + H * 0.12;
  drawCar(carX(), carY);

  // Atmospheric effects on top
  drawAtmosphericEffects();

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
