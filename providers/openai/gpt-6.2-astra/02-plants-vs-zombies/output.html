*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 22% 0,#37483d,#152c2b 55%,#10201f);min-height:100dvh;color:#f5eed6;font:15px system-ui,sans-serif;display:grid;place-items:center}main{width:min(860px,96vw);padding:20px 0 30px}header,.line,nav,.stat{display:flex;gap:12px;align-items:center}header,.line{justify-content:space-between}header{border-bottom:1px solid #728275;padding:0 0 12px;margin-bottom:12px}h1,h2,p{margin:0}h1,h2{font:italic 700 clamp(30px,5vw,58px)/1.05 Georgia,serif;letter-spacing:-.045em}h1{font-size:clamp(25px,4vw,44px)}small,label,.chip,aside{font:600 10px/1.5 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;color:#f6efd9;background:#334940;border:1px solid #718273;border-radius:8px;padding:8px 14px}button:hover,button:focus-visible{border-color:#fff1aa;outline:2px solid #e9cf8244}button:disabled{opacity:.45;cursor:default}button.primary{background:#e3bd6e;color:#23382e;font-weight:750;border-color:#f3d99c}.chip{border:1px solid #6c8071;border-radius:100px;padding:5px 10px;color:#e7d598}.line{padding:6px 0 10px;flex-wrap:wrap}.stat{gap:7px;color:#e2dfc4}.stat b{color:#ffd56c;font-variant-numeric:tabular-nums}.frame{border:1px solid #879981;background:#233e32;box-shadow:0 15px 40px #081b1c88;border-radius:12px;padding:7px;position:relative}#board{width:100%;display:block;border-radius:7px;aspect-ratio:800/400;touch-action:manipulation}.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 7px}.seed{text-align:left;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;padding:7px 9px;background:linear-gradient(145deg,#405746,#2c433c);border-bottom:3px solid #152c27}.seed i{font:italic bold 22px Georgia;color:#bdcb9b}.seed strong{display:block;font:700 clamp(12px,2vw,16px) Georgia}.seed span{font:10px ui-monospace,monospace;color:#f9d78d}.seed.sel{border-color:#edd491;background:#526847}.tip{f </style><main><header><div><small>Glasshouse Games · Botanical defense</small><h1>Graveyard Shift</h1></div><span class="chip">Issue № 04</span></header><div class="line"><div class="stat">☀ <b id="bank">160</b> sunlight</div><div class="stat">Wave <b id="wave">1/5</b> · Gate <b id="gate">3</b> · Score <b id="score">0</b></div><button id="pause" aria-label="Pause game">Ⅱ</button></div><div class="frame"><canvas id="board" width="800" height="400" tabindex="0" aria-label="Four garden lanes. Use arrows to choose a plot, Enter to plant."></canvas></div><div id="tray" class="tray"></div><p id="tip" class="tip" aria-live="polite"></p><aside>Field station 04 &nbsp; / &nbsp; West cemetery &nbsp; · &nbsp; Night watch</aside></main><div id="overlay"><section role="dialog" aria-modal="true" aria-labelledby="heading" class="panel" id="panel"></section></div><script>
// Plan: four lanes with distinct plant roles; timed waves and a recoverable gate; then menus, keyboard/touch controls and a persistent local scorebook.
'use strict';const $=id=>document.getElementById(id),cv=$('board'),c=cv.getContext('2d'),P=Math.PI,T=2*P;const seed=[['Pea pod',50,80,'Fires peas at walkers in its lane.'],['Sunbell',35,62,'Produces 15 extra sunlight every 7 seconds.'],['Barkguard',40,310,'A sturdy blocker. Plant ahead of your shooters.'],['Frost bud',75,75,'Slows walkers for 3 seconds with every hit.']];let plants,zs,shots,fx,age,bank,wave,life,points,selected,state='menu',clock=0,spawn,remaining,income,inter,serial,cursor=null,flash='',flashTill=0,name='Gardener',rows=[],saved=false;try{rows=JSON.parse(localStorage.getItem('glasshouse.v1'))||[];if(!Array.isArray(rows))rows=[]}catch{}function clean(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}function reset(){plants=[];zs=[];shots=[];fx=[];age=0;bank=160;wave=1;life=3;points=0;selected=0;remaining=5;spawn=4;income=3;inter=0;serial=0;cursor=null;flash='';saved=false;hud()}function hud(){for(let [id,val] of [['bank',bank],['score',points],['wave',wave+'/5'],['gate',life]])$(id).textContent=val;[...$('tray').children].forEach((b,i)=>{b.classList.toggle('sel',i===selected);b.setAttribute('aria-pressed',String(i===selected))});$('tip').textContent=flash&&age<flashTill?flash:`${selected+1} · ${seed[selected][0]} — ${seed[selected][3]}`}
function notice(t){flash=t;flashTill=age+2.8;hud()}seed.forEach((s,i)=>{let b=document.createElement('button');b.className='seed';b.innerHTML=`<i>0${i+1}</i><div><strong>${s[0]}</strong><span>☀ ${s[1]}</span></div>`;b.onclick=()=>choose(i);$('tray').append(b)});function choose(i){if(state!=='play')return;selected=i;flash='';hud()}function dialog(k,title,body,actions){state=k;$('overlay').hidden=false;$('panel').innerHTML=`<small>Glasshouse / Field station 04</small><h2 id="heading">${title}</h2>${body}<div class="actions"></div>`;actions.forEach(([text,fn],i)=>{let b=document.createElement('button');b.textContent=text;b.className=i?'':'primary';b.onclick=fn;$('panel').lastChild.append(b)});$('panel').querySelector('button').focus()}function menu(){dialog('menu','Graveyard Shift','<p>The cemetery gate is open. Keep the dead out of your greenhouse until the fifth wave passes.</p><label for="alias">Gardener name</label><input id="alias" maxlength="16" placeholder="Gardener" value="'+clean(name)+'">',[['Start shift',()=>{name=$('alias').value.trim()||'Gardener';reset();resume()}],['Field guide',guide],['Leaderboard',()=>leaders(menu)]])}function guide(){dialog('guide','Field guide','<p>Select a seed packet, then click or tap an empty plot. Plant a Pea pod near the left of each lane. The gold marker shows the next arrival.</p><p>Sunlight returns automatically; Sunbells grow more. Frost slows the crowd and Barkguard buys time. Three walkers through the gate end the shift.</p><small>Keys 1–4 · arrows + enter · P to pause</small>',[['Back to menu',menu]])}function leaders(back){let html=rows.length?'<ol>'+rows.slice(0,8).map(r=>`<li>${clean(r.name)} <b>${clean(r.score)}</b></li>`).join('')+'</ol>':'<p>No finished shifts yet. Complete a run to record the first score.</p>';dialog('scores','Local leaderboard',html+'<small>Top eight · this browser</small>',[['Back',back]])}function resume(){state='play';$('overlay').hidden=true;cv.focus()}function stop(){if(state==='play')dialog('pause','On a break','<p>The garden is paused. Your plants and sunlight will be here when you return.</p>',[['Resume',resume],['Leave shift',()=>dialog('leave','Leave the garden?','<p>This unfinished score will not be saved.</p>',[['Keep playing',resume],['Leave',menu]])]])}function finish(win){if(!saved){if(win)points+=life*200+bank;rows.push({name,score:points});rows.sort((a,b)=>b.score-a.score);rows=rows.slice(0,8);try{localStorage.setItem('glasshouse.v1',JSON.stringify(rows))}catch{}saved=true;hud()}let show=()=>dialog('end',win?'Dawn breaks.':'Gate overrun.',`<p>${clean(name)}, ${win?'your greenhouse survived all five waves.':'the night claimed the greenhouse.'}</p><p><strong>${points} points</strong> · Wave ${wave} of 5</p>`,[['Play again',()=>{reset();resume()}],['Leaderboard',()=>leaders(show)],['Menu',menu]]);show()}$('pause').onclick=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key.toLowerCase()==='p'||e.key==='Escape'){if(state==='play')stop();else if(state==='pause')resume();return}if(state!=='play')return;if('1234'.includes(e.key)&&e.key.length===1)choose(+e.key-1);if(e.key.startsWith('Arrow')){e.preventDefault();cursor=cursor||[0,0];let [x,y]=cursor;cursor=[Math.max(0,Math.min(6,x+(e.key==='ArrowRight')-(e.key==='ArrowLeft'))),Math.max(0,Math.min(3,y+(e.key==='ArrowDown')-(e.key==='ArrowUp')))];cv.focus()}if(e.key==='Enter'&&e.target===cv){e.preventDefault();plant(...(cursor||[0,0]))}});
const X=i=>78+i*92,Y=r=>93+r*78;function plot(e){let b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*800/b.width,y=(e.clientY-b.top)*400/b.height;return [Math.floor((x-32)/92),Math.floor((y-54)/78)]}cv.onpointermove=e=>{cursor=plot(e)};cv.onpointerleave=()=>cursor=null;cv.onpointerdown=e=>{cursor=plot(e);plant(...cursor)};function plant(col,row){if(state!=='play'||row<0||row>3||col<0||col>6)return;if(plants.some(p=>p.col===col&&p.row===row))return notice('This plot is already occupied.');let s=seed[selected];if(s[1]>bank)return notice(`Need ${s[1]-bank} more sunlight for ${s[0]}.`);if(zs.some(z=>z.row===row&&Math.abs(z.x-X(col))<32))return notice('A walker is standing on this plot.');bank-=s[1];plants.push({col,row,x:X(col),k:selected,h:s[2],max:s[2],cd:selected===1?6:.1});puff(X(col),Y(row),'#f7d993');hud()}
function lane(){return (serial*3+Math.floor(serial/4)+wave)%4}function puff(x,y,col){for(let i=0;i<9;i++)fx.push({x,y,dx:(Math.random()-.5)*88,dy:-10-Math.random()*53,t:.5,col})}function tick(dt){age+=dt;if(flash&&age>=flashTill){flash='';hud()}income-=dt;if(income<=0){income+=3;bank+=15;hud()}if(remaining){spawn-=dt;if(spawn<=0){let heavy=wave>=3&&serial%4===2,runner=wave>=2&&serial%4===1;let hp=heavy?125:runner?47:60;zs.push({row:lane(),x:779,h:hp,max:hp,speed:runner?27:heavy?12:16,k:heavy?2:runner?1:0,slow:0,hit:0,phase:serial*1.7});serial++;remaining--;spawn=Math.max(1.75,4.75-.45*wave)}}for(let p of plants){p.cd-=dt;if(p.cd>0)continue;if(p.k===1){bank+=15;p.cd=7;puff(p.x,Y(p.row)-12,'#ffd272');hud()}else if(p.k!==2&&zs.some(z=>z.row===p.row&&z.x>p.x-4)){shots.push({x:p.x+14,row:p.row,k:p.k});p.cd=p.k===3?1.65:1.05}}for(let b of shots){let prev=b.x;b.x+=dt*330;let z=zs.filter(z=>z.h>0&&z.row===b.row&&z.x>=prev-16&&z.x<=b.x+16).sort((a,z)=>a.x-z.x)[0];if(z){z.h-=b.k===3?17:21;if(b.k===3)z.slow=3;z.hit=.12;b.x=900;puff(z.x,Y(z.row)-14,b.k===3?'#aeefe5':'#d6de89');if(z.h<=0){points+=z.k===2?90:60;bank+=6;hud()}}}shots=shots.filter(b=>b.x<820);zs=zs.filter(z=>z.h>0);for(let z of zs){z.slow=Math.max(0,z.slow-dt);z.hit=Math.max(0,z.hit-dt);let p=plants.find(p=>p.h>0&&p.row===z.row&&z.x-p.x<33&&z.x-p.x> -12);if(p)p.h-=dt*13;else z.x-=dt*z.speed*(z.slow?.48:1);if(z.x<14){z.h=0;life--;notice('A walker slipped through the gate!');if(life<=0){finish(false);return}}}zs=zs.filter(z=>z.h>0);plants=plants.filter(p=>p.h>0);if(!remaining&&!zs.length){inter+=dt;if(inter>2){if(wave===5){finish(true);return}wave++;remaining=4+wave*2;inter=0;spawn=3;bank+=35;notice('Fresh supplies: +35 sunlight. Wave '+wave+' approaches.')}}for(let f of fx){f.x+=f.dx*dt;f.y+=f.dy*dt;f.dy+=110*dt;f.t-=dt}fx=fx.filter(f=>f.t>0)}
function el(x,y,rx,ry,col,a=0){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,a,0,T);c.fill()}function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function line(x,y,X,Y,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}function leaf(x,y,s,a,col){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-3*s,-15*s,12*s,-21*s);c.quadraticCurveTo(18*s,-4*s,0,0);c.fill();c.restore()}function bg(){rect(0,0,800,400,'#2a423a');for(let i=0;i<24;i++){let x=i*38-8,y=32+Math.sin(i*2.3)*8;el(x,y,22,17,'#455e53');rect(x-8,y-10,16,19,'#78857a');el(x,y-10,8,5,'#78857a');line(x-3,y-7,x+3,y-7,'#586c61',1.6)}rect(0,41,800,6,'#b0a07b');for(let j=0;j<4;j++){for(let i=0;i<8;i++){let x=32+i*92,y=54+j*78;rect(x,y,91,76,(i+j)%2?'#6e895a':'#78935f');rect(x,y+70,91,6,'#658052');for(let k=0;k<12;k++){let xx=x+((k*31+i*9+j*7)%86),yy=y+((k*23+i*5)%68);line(xx,yy,xx-1.7,yy-3,'#90a570',1.1)}}rect(0,54+j*78,22,76,'#506453');rect(5,58+j*78,4,66,'#b3a17a');rect(14,58+j*78,3,66,'#83957a')}rect(677,51,123,314,'#888976');for(let k=0;k<96;k++){let y=51+(k*31)%310,x=681+(k*29)%112;rect(x,y,10,1.4,'#707965')}c.font='10px monospace';c.fillStyle='#e1dabb';c.fillText('G R E E N H O U S E   /   0 4',24,387);c.fillText('C E M E T E R Y   →',634,387);if(remaining&&state==='play'){c.fillStyle='#ffe290';c.beginPath();let y=Y(lane());c.moveTo(752,y);c.lineTo(766,y-8);c.lineTo(766,y+8);c.fill()}}
function drawPlant(p){let x=p.x,y=Y(p.row);el(x,y+24,23,6,'#39563e66');c.save();c.translate(x,y+19);c.rotate(.035*Math.sin(age*3+p.x));leaf(-1,3,1.05,-1.65,'#365b3c');leaf(0,3,1.05,.55,'#47773e');if(p.k===2){el(0,-12,24,29,'#684e38');el(-2,-14,21,27,'#ac754a');for(let k=0;k<3;k++)line(-15+k*12,-28,-18+k*13,-18,'#835c42',2);leaf(0,-36,.7,.3,'#517e45');el(-7,-13,2.4,3,'#2a382c');el(7,-13,2.4,3,'#2a382c')}else{line(0,1,0,-23,'#335e3b',6);leaf(-1,-5,.7,-1.8,'#62934b');if(p.k===1){for(let j=0;j<10;j++){let a=j*T/10;el(Math.cos(a)*13,-28+Math.sin(a)*13,9,5.5,'#ecc366',a)}el(0,-28,12,12,'#9a6438');el(-3,-30,1.6,2,'#332e28');el(4,-30,1.6,2,'#332e28')}else{let icy=p.k===3;el(0,-25,18,16,icy?'#76bcb2':'#82ac54');el(-4,-31,10,7,icy?'#9bd5c3':'#a3c976');el(14,-24,11,7,icy?'#93d7c9':'#a1c876');el(23,-24,4.5,7.5,icy?'#3c827e':'#527847');el(-1,-27,2.4,3,'#233e35');leaf(-11,-36,.65,-1.4,icy?'#d0f3dc':'#4d8249')}}c.restore();if(p.h<p.max){rect(x-16,y+30,32,3,'#395241');rect(x-16,y+30,32*p.h/p.max,3,'#edc276')}}function walker(z){let x=z.x,y=Y(z.row),t=age*(z.slow?3:6)+z.phase,b=Math.sin(t);el(x,y+25,19,5,'#31493466');c.save();c.translate(x,y+Math.abs(b)*2);for(let s of [-1,1]){line(s*6,5,s*6+b*s*5,21,'#3b4540',6);line(s*6+b*s*5,21,s*6+b*s*5-7,22,'#273a35',6)}c.rotate(-.13);let coat=z.k===2?'#6a6476':z.k===1?'#a4664e':'#697970',skin=z.hit?'#f4d7a0':z.slow?'#99c9bb':'#a9b894';el(0,-3,14,18,coat);line(-7,-9,-22,-6,coat,7);line(-22,-6,-29,-9,skin,5);el(-4,-23,13,14,skin);el(-15,-21,4,4,skin);rect(-16,-30,21,4,'#667567');el(-10,-23,3,3,'#eee3b2');el(-11,-23,1.5,2,'#343f37');line(-14,-15,-6,-14,'#59675a',2);if(z.k===2){rect(-19,-39,29,10,'#9da7a3');rect(-21,-30,33,3,'#63726d')}else{rect(-14,-36,22,6,'#485851');rect(1,-32,7,5,'#485851')}c.restore();if(z.h<z.max){rect(x-13,y-43,26,3,'#375040');rect(x-13,y-43,26*z.h/z.max,3,'#f5c383')}}
function draw(){bg();if(cursor&&state==='play'){let [i,j]=cursor;if(i>=0&&i<7&&j>=0&&j<4){c.strokeStyle='#fff2ac';c.lineWidth=2;c.strokeRect(X(i)-44,Y(j)-37,88,73)}}for(let j=0;j<4;j++){plants.filter(p=>p.row===j).forEach(drawPlant);zs.filter(z=>z.row===j).forEach(walker)}for(let b of shots){el(b.x-4,Y(b.row)-8,8,3,b.k===3?'#c6efe599':'#bcdf9299');el(b.x,Y(b.row)-8,5,5,b.k===3?'#a2f1eb':'#dafa92')}for(let f of fx){c.globalAlpha=Math.min(1,f.t*3);rect(f.x,f.y,3,3,f.col)}c.globalAlpha=1}function frame(t){let dt=Math.min(.05,(t-clock)/1000);clock=t;if(state==='play')tick(dt);draw();requestAnimationFrame(frame)}reset();menu();requestAnimationFrame(frame);
</script></html>
