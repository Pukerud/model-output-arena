'use strict';const c=film.getContext('2d'),PI=Math.PI,TAU=2*PI,{sin,cos,floor}=Math;let W,H,S,time=0,last=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches;function toggle(){run=!run;label()}function label(){play.textContent=run?'Ⅱ   PAUSE':'▷   RESUME'}play.onclick=toggle;label();function resize(){let w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio,2);film.width=w*d;film.height=h*d;S=Math.min(w/770,h/650);W=w/S;H=h/S;c.setTransform(d*S,0,0,d*S,0,0)}onresize=resize;resize();function rand(i){const f=sin(i*127.1+85.33)*43758.5453;return f-floor(f)}function noise(x){let n=floor(x),u=x-n;u=u*u*(3-2*u);return rand(n)*(1-u)+rand(n+1)*u}function box(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function path(p,col,stroke,width=1){let a=new Path2D(p);if(col){c.fillStyle=col;c.fill(a)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(a)}}function oval(x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill()}function grad(y1,y2,...stops){let g=c.createLinearGradient(0,y1,0,y2);stops.forEach(([n,v])=>g.addColorStop(n,v));return g}function field(spacing,offset,fn,pad=1){let s=floor(offset/spacing);for(let i=s-pad;i<=s+Math.ceil(W/spacing)+pad;i++)fn(i,i*spacing-offset)}function ridge(y,amp,scale,v,col,seed){let t=time*v;c.fillStyle=col;c.beginPath();c.moveTo(-6,H);for(let x=-6;x<=W+6;x+=5){let n=(x+t)/scale+seed;c.lineTo(x,y-amp*(.48*noise(n)+.32*noise(n*3.2)+.15*noise(n*8.2)+.05*noise(n*23)))}c.lineTo(W+6,H);c.fill()}
function tree(x,y,h,i){c.save();c.translate(x,y);c.scale(h/100,h/100);path('M-2 0 L-1 -56 L1 -78 L2 0Z','#4a4840');for(let k=0;k<9;k++){let v=k/9,yy=-96+v*67,rr=4+10*v,j=rand(i*11+k);path(`M0 ${yy-10} Q${-rr*.5} ${yy+4} ${-rr*(1+j*.4)} ${yy+12} Q0 ${yy+8} ${rr*1.1} ${yy+10} Q${rr*.55} ${yy+4} 0 ${yy-10}`,k%2?'#384942':'#415047')}c.restore()}

function wheel(x,y,angle){c.save();c.translate(x,y);oval(0,0,31,31,'#15191a');oval(0,0,28.7,28.7,'#2c2e2d');oval(0,0,25.7,25.7,'#151b1d');oval(0,0,21.6,21.6,'#d1c1a4');oval(0,0,19.4,19.4,'#34383a');c.save();c.rotate(angle);for(let i=0;i<12;i++){c.rotate(TAU/12);path('M-2 -5 Q-1 -11 2 -19 L5 -18 Q2 -12 1 -5Z','#aaa99c');path('M1 -7 L4 -18 L5 -18 L2 -7Z','#e0d3b8')}c.restore();oval(0,0,6.8,6.8,'#ada99c');oval(0,0,3.4,3.4,'#685f50');path('M-18 -10 Q-10 -23 6 -20',null,'#fae1bcaa',1.8);path('M-25 8 Q-19 29 2 28',null,'#575550',.9);c.restore()}
function coupe(){let x=W*.44+6*sin(time*.29),y=H*.756+H*.077,k=Math.min(1.28,W/570,Math.max(.86,H/730)),bob=.65*sin(time*5.1)+.32*sin(time*10.8);c.save();c.translate(x,y);c.scale(k,k);let sh=c.createRadialGradient(0,0,3,0,0,177);sh.addColorStop(0,'#231e20b5');sh.addColorStop(.76,'#24202380');sh.addColorStop(1,'#28222200');c.save();c.translate(0,3);c.scale(1,.085);oval(0,0,183,180,sh);c.restore();wheel(-106,-30,time*182/(31*k));wheel(109,-30,time*182/(31*k));c.save();c.translate(0,bob);c.rotate(.0016*sin(time*2.7));let paint=grad(-113,-14,[0,'#efd7af'],[.12,'#e8bc8b'],[.34,'#c79368'],[.43,'#eed1a1'],[.51,'#d2ad80'],[.57,'#996448'],[.79,'#9a674b'],[.91,'#694c40'],[1,'#312f2d']);path('M-179 -61 Q-178 -68 -163 -70 L-125 -77 Q-87 -103 -53 -110 Q-26 -117 9 -110 Q33 -105 71 -80 Q89 -73 119 -72 Q151 -70 173 -62 Q182 -58 182 -47 L179 -28 Q175 -22 144 -21 C142 -78 79 -79 76 -22 L-72 -21 C-71 -78 -139 -80 -141 -22 L-167 -25 Q-180 -28 -181 -39Z',paint,'#493d36',1.6);path('M-117 -78 Q-77 -107 -48 -108 Q-13 -114 8 -107 Q37 -95 63 -77 Q-22 -73 -117 -78Z','#e5d0ad','#4a413d',1.6);let glass=grad(-110,-74,[0,'#7b8b90'],[.32,'#93a09e'],[.55,'#626f72'],[1,'#444c50']);path('M-105 -80 Q-83 -96 -61 -102 L-66 -80Z M-59 -103 Q-36 -109 -11 -106 L-8 -79 -62 -79Z M-6 -106 Q17 -106 51 -80 L-4 -79Z',glass,'#343c3e',1.4);path('M-40 -81 Q-41 -91 -36 -94 Q-29 -98 -24 -91 L-24 -86 -17 -80Z M-2 -81 Q-5 -85 1 -93 Q5 -100 12 -93 Q15 -90 12 -85 L22 -80Z','#394346');path('M-97 -82 L-69 -97 M-52 -101 Q-35 -106 -18 -105 M5 -104 L45 -82',null,'#d3c9b088',1.2);path('M-176 -62 Q-133 -64 -113 -71 Q-75 -74 -48 -71 Q48 -65 88 -68 Q133 -73 173 -59',null,'#f6d9a5',2);path('M-175 -46 Q-158 -48 -146 -49 M-65 -48 Q-7 -46 72 -50 M146 -50 L180 -50',null,'#704c3d',1.4);path('M-58 -76 Q-64 -63 -61 -46 Q-59 -32 -51 -30 L53 -31 Q63 -45 57 -72',null,'#694d42',1.25);path('M-68 -26 L72 -27',null,'#c9baa0',2);path('M-49 -65 h12',null,'#4e4840',3.4);path('M-49 -66 h12',null,'#f6deb4',1.3);path('M43 -74 l5 -6 5 1 -4 7Z','#665e52 function frame(now){if(run&&last)time+=Math.min(.045,(now-last)/1000);last=now;landscape();coupe();let g=c.createRadialGradient(W*.5,H*.53,H*.23,W*.5,H*.5,Math.hypot(W,H)*.58);g.addColorStop(0,'#31262400');g.addColorStop(1,'#29212844');box(0,0,W,H,g);requestAnimationFrame(frame)}requestAnimationFrame(frame);
