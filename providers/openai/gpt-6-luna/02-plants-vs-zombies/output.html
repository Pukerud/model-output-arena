<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Backyard Brigade</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--ink:#202b32;--cream:#fbf6e8;--green:#356c48;--sun:#ffd16a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#fffdf6,#ece8d9 75%);color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:grid;place-items:center;padding:14px}.shell{width:min(100%,1050px)}header{display:flex;justify-content:space-between;align-items:end;margin:0 4px 12px}.brand{font:500 10px 'DM Mono',monospace;letter-spacing:.2em;color:#78817b}.brand b{display:block;font:900 clamp(25px,4vw,42px)/1 Nunito,sans-serif;letter-spacing:-.05em;color:#254534;margin-top:4px}.stats{display:flex;gap:8px;align-items:center}.pill{background:#fffdf2;border:1px solid #ddd8c6;border-radius:999px;padding:7px 12px;font:500 12px 'DM Mono',monospace;box-shadow:0 2px 3px #39392712}.pill strong{color:#82602a}.frame{position:relative;overflow:hidden;border:7px solid #eee9da;border-radius:18px;box-shadow:0 18px 50px #32352424,0 2px 4px #32352417;background:#81b76b}.topbar{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none}.sunbank{height:38px;display:flex;align-items:center;gap:8px;background:#fff9e9e8;border:1px solid #fff;border-radius:10px;padding:0 11px;font:600 12px 'DM Mono',monospace;box-shadow:0 3px 12px #293d2520}.sunicon{font-size:17px}.deck{display:flex;gap:6px;pointer-events:auto}.seed{width:52px;height:55px;border:1px solid #ddd6bd;background:#fff9e9;border-radius:9px;display:grid;place-items:center;position:relative;cursor:pointer;box-shadow:0 2px 4px #293d251a;transition:.15s transform,.15s border}.seed:hover{transform:translateY(-2px)}.seed.selected{border:2px solid #e6ad41;box-shadow:0 0 0 3px #fff8d2}.seed.disabled{filter:grayscale(.9);opacity:.55}.seed i{font-style:normal;font-size:26px}.seed small{position:absolute;bottom:1px;right:4px;font:500 9px 'DM Mono',monospace;color:#6a6555}.right-tools{margin-left:auto;pointer-events:auto;display:flex;gap:6px}.tool{border:1px solid #fff;background:#fff9e9;border-radius:9px;padding:9px 11px;color:#263d2b;cursor:pointer;font:800 11px Nunito;box-shadow:0 3px 12px #293d2520}.tool:hover{background:white}canvas{display:block;width:100%;height:auto;aspect-ratio:1000/560;touch-action:none}.foot{display:flex;justify-content:space-between;padding:10px 4px;color:#79817a;font:10px 'DM Mono',monospace;letter-spacing:.06em}.modal{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:#142621a8;backdrop-filter:blur(5px)}.card{width:min(88%,440px);padding:28px;border:1px solid #fff;border-radius:18px;background:#fff9eb;box-shadow:0 22px 70px #1118;text-align:center}.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.18em;color:#8b7955}.card h1{font-size:clamp(30px,6vw,48px);line-height:.98;letter-spacing:-.05em;margin:9px 0 12px;color:#254534}.card p{color:#62685f;line-height:1.55;font-size:14px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}.cta{border:0;border-radius:9px;padding:12px 17px;background:#356c48;color:white;font:800 13px Nunito;cursor:pointer;box-shadow:0 3px 0 #214630}.cta.alt{background:#e7dfc9;color:#435042;box-shadow:0 3px 0 #c9c0aa}.leaders{margin:16px auto 0;max-width:300px;text-align:left;font:11px 'DM Mono',monospace}.leaders div{display:flex;justify-content:space-between;border-bottom:1px solid #e8e1d0;padding:6px}.hide{display:none!important}@media(max-width:590px){body{padding:7px}.frame{border-width:4px;border-radius:12px}.topbar{top:6px;left:6px;right:6px;gap:4px}.sunbank{height:34px;padding:0 7px;gap:4px;font-size:10px}.seed{width:39px;height:43px}.seed i{font-size:21px}.tool{padding:7px 8px;font-size:10px}.foot{font-size:8px}header{align-items:center}.stats{gap:4px}.pill{padding:6px 7px;font-size:10px}}
</style>
<main class="shell"><header><div class="brand">A SMALL GARDEN DEFENSE GAME<b>Backyard Brigade</b></div><div class="stats"><span class="pill">WAVE <strong id="wave">1</strong></span><span class="pill">TIME <strong id="clock">0:00</strong></span></div></header><section class="frame"><div class="topbar"><div class="sunbank"><span class="sunicon">☀</span><span id="sun">125</span></div><div class="deck" id="deck"></div><div class="right-tools"><button class="tool" id="pause">Ⅱ</button><button class="tool" id="sound">♪</button></div></div><canvas id="game" width="1000" height="560"></canvas><div class="modal" id="menu"><div class="card"><div class="eyebrow">A SUNNY DAY · A SLIGHTLY ODD PROBLEM</div><h1>Hold the<br>garden.</h1><p>Grow a little defense, collect falling sunshine, and keep the shambling neighbors off your porch.</p><div class="actions"><button class="cta" id="start">PLANT THE FIRST SEED</button><button class="cta alt" id="scores">LEADERBOARD</button></div><div class="leaders hide" id="leaderboard"></div></div></div></section><div class="foot"><span>CLICK A SEED, THEN A TILE TO PLANT</span><span>YOUR BEST RUN SAVES ON THIS DEVICE</span></div></main>
<script>
(()=>{'use strict';/* Plan: paint a lane grid; let the player spend sunshine on plants; animate defenders, projectiles and advancing zombies; finish on a breach or a survived final wave; persist the best scores locally. */const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=1000,H=560,cols=9,rows=5,left=168,top=112,cw=88,ch=78;const $=s=>document.querySelector(s),types=[{id:'sun',icon:'🌻',name:'Sunflower',cost:50,cd:4,hp:5},{id:'pea',icon:'🌱',name:'Pea shooter',cost:100,cd:6,hp:7},{id:'wall',icon:'🥔',name:'Wall-nut',cost:50,cd:9,hp:25},{id:'ice',icon:'❄️',name:'Snow pea',cost:175,cd:9,hp:8}];let state='menu',sun=125,plants=[],zombies=[],shots=[],orbs=[],selected=null,t=0,last=0,spawn=5,wave=1,elapsed=0,paused=false,sound=true,score=0,best=JSON.parse(localStorage.getItem('bb-leaderboard')||'[]'),mouse={x:-1,y:-1};
function layout(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,150);sky.addColorStop(0,'#93c6ec');sky.addColorStop(1,'#d7eac0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f9db8c';ctx.beginPath();ctx.arc(870,70,35,0,7);ctx.fill();ctx.fillStyle='#d7e8c5';ctx.fillRect(0,86,W,38);for(let i=0;i<14;i++){let x=(i*97+13)%W,y=45+(i*43)%42;cloud(x,y)}ctx.fillStyle='#a7ce7a';ctx.fillRect(0,124,W,H-124);ctx.fillStyle='#6b9a56';ctx.fillRect(0,124,W,7);for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.fillStyle=(r+c)%2?'#8dbb63':'#95c66c';ctx.fillRect(left+c*cw,top+r*ch,cw-2,ch-2);ctx.fillStyle='#ffffff0c';ctx.fillRect(left+c*cw,top+r*ch,cw-2,3)}// distant fence
ctx.strokeStyle='#68844f';ctx.lineWidth=5;for(let i=0;i<11;i++){let x=i*100+20;ctx.beginPath();ctx.moveTo(x,128);ctx.lineTo(x,155);ctx.stroke()}ctx.strokeStyle='#78945c';ctx.beginPath();ctx.moveTo(0,140);ctx.lineTo(W,140);ctx.moveTo(0,151);ctx.lineTo(W,151);ctx.stroke();ctx.fillStyle='#5d4a3f';ctx.fillRect(0,top+rows*ch,W,22);ctx.fillStyle='#82684d';ctx.fillRect(0,top+rows*ch,W,4);for(let i=0;i<28;i++){let x=(i*179)%W,y=160+(i*71)%(H-195);ctx.fillStyle=i%2?'#fff6bb':'#f3b9a7';ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,7);ctx.fill();ctx.globalAlpha=1}}
function cloud(x,y){ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(x,y,14,Math.PI,0);ctx.arc(x+20,y-6,19,Math.PI,0);ctx.arc(x+40,y,14,Math.PI,0);ctx.fillRect(x,y,40,14);ctx.fill()}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function flower(p,now){const x=left+p.c*cw+cw/2,y=top+p.r*ch+ch/2+Math.sin(now*3+p.phase)*2;ctx.save();ctx.translate(x,y);if(p.kind==='sun'){ctx.strokeStyle='#387746';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,25);ctx.lineTo(0,-3);ctx.stroke();for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*Math.PI/5+now*.2);ctx.fillStyle='#ffc84d';ctx.beginPath();ctx.ellipse(0,-13,5,11,0,0,7);ctx.fill();ctx.restore()}ctx.fillStyle='#71482e';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#fff2bf';ctx.beginPath();ctx.arc(-3,-2,2,0,7);ctx.arc(4,-2,2,0,7);ctx.fill()}else if(p.kind==='pea'||p.kind==='ice'){ctx.strokeStyle='#397a46';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-2,25);ctx.quadraticCurveTo(-9,6,-2,-1);ctx.stroke();ctx.fillStyle='#408952';ctx.beginPath();ctx.ellipse(-10,15,12,5,-.5,0,7);ctx.ellipse(8,24,12,5,.35,0,7);ctx.fill();ctx.fillStyle=p.kind==='ice'?'#a7e5dc':'#69b66a';ctx.beginPath();ctx.arc(1,-4,19,0,7);ctx.fill();ctx.fillStyle='#6da870';ctx.beginPath();ctx.ellipse(19,-5,12,9,0,0,7);ctx.fill();ctx.fillStyle='#1f402e';ctx.beginPath();ctx.arc(-4,-9,2.3,0,7);ctx.arc(7,-9,2.3,0,7);ctx.fill();ctx.fillStyle='#f7f3d6';ctx.beginPath();ctx.arc(19,-4,4,0,7);ctx.fill()}else{rounded(-22,-22,44,48,13,'#c69d5f');ctx.fillStyle='#e5c281';ctx.beginPath();ctx.ellipse(-4,-5,4,2,0,0,7);ctx.ellipse(8,7,3,2,0,0,7);ctx.fill();ctx.fillStyle='#554532';ctx.beginPath();ctx.arc(-7,-3,2,0,7);ctx.arc(7,-3,2,0,7);ctx.strokeStyle='#554532';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,6);ctx.quadraticCurveTo(0,9,5,6);ctx.stroke()}if(p.hp<p.max){ctx.fillStyle='#27342a';ctx.fillRect(-18,30,36,4);ctx.fillStyle='#68b765';ctx.fillRect(-18,30,36*Math.max(0,p.hp/p.max),4)}ctx.restore()}
function zombie(z){ctx.save();ctx.translate(z.x,z.y);ctx.globalAlpha=z.hp<=0?.45:1;ctx.fillStyle=z.slow>0?'#819d87':'#9aaf83';ctx.beginPath();ctx.ellipse(0,-8,17,21,0,0,7);ctx.fill();ctx.fillStyle='#d9d1b3';ctx.fillRect(-14,5,27,18);ctx.fillStyle='#49594b';ctx.beginPath();ctx.arc(-6,-13,3,0,7);ctx.arc(6,-13,3,0,7);ctx.fill();ctx.strokeStyle='#4a5040';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-5,-1);ctx.lineTo(5,1);ctx.stroke();ctx.fillStyle='#6c7f61';ctx.beginPath();ctx.moveTo(-11,12);ctx.lineTo(-25,18);ctx.lineTo(-13,20);ctx.fill();ctx.fillStyle='#62503e';ctx.fillRect(-12,21,9,14);ctx.fillRect(4,21,9,14);if(z.max>2){ctx.fillStyle='#9b433b';ctx.fillRect(-15,-34,30,13);ctx.fillStyle='#e0bc76';ctx.fillRect(-16,-22,32,5)}if(z.hp<z.max){ctx.fillStyle='#2a3429';ctx.fillRect(-16,-40,32,3);ctx.fillStyle='#cb6048';ctx.fillRect(-16,-40,32*Math.max(0,z.hp/z.max),3)}ctx.restore()}
function render(now){layout();for(const o of orbs){ctx.shadowColor='#ffd362';ctx.shadowBlur=18;ctx.fillStyle='#ffe17b';ctx.beginPath();ctx.arc(o.x,o.y,13+Math.sin(now*4+o.phase)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff8ce';ctx.beginPath();ctx.arc(o.x-4,o.y-4,4,0,7);ctx.fill()}for(const p of plants)flower(p,now);for(const s of shots){ctx.fillStyle=s.ice?'#adf5ee':'#74ce62';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.beginPath();ctx.arc(s.x,s.y,7,0,7);ctx.fill();ctx.shadowBlur=0}for(const z of zombies)zombie(z);if(selected){ctx.strokeStyle='#fff3a4';ctx.lineWidth=2;ctx.strokeRect(left+selected.c*cw+4,top+selected.r*ch+4,cw-10,ch-10)}if(state==='playing'&&!paused){const dt=Math.min((now-last)/1000,.05);step(dt)}last=now;requestAnimationFrame(render)}
function step(dt){t+=dt;elapsed+=dt;$('#clock').textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,'0')}`;spawn-=dt;if(spawn<=0){const row=Math.floor(Math.random()*rows),hp=4+Math.floor(wave/3);zombies.push({x:W+20,y:top+row*ch+ch*.69,row,hp,max:hp,speed:8+wave*.6,slow:0,attack:0});spawn=Math.max(2.5,7-wave*.32+Math.random()*2);if(elapsed>65&&Math.floor(elapsed)%70<.1)wave++;$('#wave').textContent=wave}for(const o of orbs){o.age+=dt;o.y+=Math.sin(t*2+o.phase)*.06}orbs=orbs.filter(o=>o.age<14);for(const p of plants){p.fire-=dt;p.sun-=dt;if(p.kind==='sun'&&p.sun<=0){orbs.push({x:left+p.c*cw+cw/2,y:top+p.r*ch+14,age:0,phase:Math.random()*6});p.sun=7+Math.random()*2}if((p.kind==='pea'||p.kind==='ice')&&p.fire<=0&&zombies.some(z=>z.row===p.r&&z.x>left+p.c*cw)){shots.push({x:left+p.c*cw+cw*.68,y:top+p.r*ch+ch*.47,row:p.r,ice:p.kind==='ice',speed:260});p.fire=1.35}}for(const s of shots){s.x+=s.speed*dt;const z=zombies.find(a=>a.row===s.row&&Math.abs(a.x-s.x)<21&&a.hp>0);if(z){z.hp--;if(s.ice)z.slow=2.5;s.dead=true;score+=5}}shots=shots.filter(s=>s.x<W+15&&!s.dead);for(const z of zombies){if(z.hp<=0){z.dead=true;continue}if(z.slow>0)z.slow-=dt;const p=plants.find(a=>a.r===z.row&&z.x>left+a.c*cw&&z.x<left+(a.c+1)*cw);if(p){z.attack-=dt;if(z.attack<=0){p.hp--;z.attack=.85;if(p.hp<=0)plants=plants.filter(a=>a!==p)}}else z.x-=(z.slow>0?z.speed*.45:z.speed)*dt;if(z.x<left-4){finish(false);return}}zombies=zombies.filter(z=>!z.dead);$('#sun').textContent=sun;updateDeck();if(elapsed>150){finish(true)}}
function updateDeck(){$('#sun').textContent=sun;$('#deck').innerHTML=types.map(a=>`<button class="seed ${sun<a.cost?'disabled':''} ${selected?.kind===a.id?'selected':''}" title="${a.name} — ${a.cost} sun" data-kind="${a.id}"><i>${a.icon}</i><small>${a.cost}</small></button>`).join('')}
function start(){state='playing';sun=125;plants=[];zombies=[];shots=[];orbs=[];elapsed=0;wave=1;score=0;spawn=4;selected=null;paused=false;$('#menu').classList.add('hide');$('#sun').textContent=sun;$('#wave').textContent=wave;updateDeck()}
function finish(win){if(state!=='playing')return;state='over';const entry={score:Math.max(score,Math.floor(elapsed*2)),wave,when:new Date().toLocaleDateString()};best.push(entry);best.sort((a,b)=>b.score-a.score);best=best.slice(0,5);localStorage.setItem('bb-leaderboard',JSON.stringify(best));showCard(win?'The lawn is yours.':'They reached the porch.',win?'A fine bit of gardening. Your score has been saved.':'The neighbors have overrun the yard. Your score has been saved.')}
function showCard(title,copy){$('#menu').classList.remove('hide');$('#menu .card').innerHTML=`<div class="eyebrow">BACKYARD BRIGADE · RESULTS</div><h1>${title}</h1><p>${copy}</p><div class="actions"><button class="cta" id="again">PLAY AGAIN</button><button class="cta alt" id="scores">LEADERBOARD</button></div><div class="leaders hide" id="leaderboard"></div>`;$('#again').onclick=start;$('#scores').onclick=showLeaders}
function showLeaders(){const box=$('#leaderboard');box.innerHTML='<b>TOP GARDENERS</b>'+((best.length?best:[]).map((a,i)=>`<div><span>${String(i+1).padStart(2,'0')} · WAVE ${a.wave}</span><span>${a.score} pts</span></div>`).join('')||'<div><span>No scores yet</span><span>—</span></div>');box.classList.toggle('hide')}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});canvas.addEventListener('pointerdown',e=>{if(state!=='playing'||paused)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const orb=orbs.find(a=>Math.hypot(a.x-x,a.y-y)<30);if(orb){sun+=25;orbs=orbs.filter(a=>a!==orb);$('#sun').textContent=sun;updateDeck();return}if(y<95)return;if(selected){const c=Math.floor((x-left)/cw),row=Math.floor((y-top)/ch);if(c>=0&&c<cols&&row>=0&&row<rows){const kind=types.find(a=>a.id===selected.kind);if(sun>=kind.cost&&!plants.some(p=>p.c===c&&p.r===row)){sun-=kind.cost;plants.push({kind:kind.id,c,r:row,hp:kind.hp,max:kind.hp,fire:1,sun:2,phase:Math.random()*6});selected=null;updateDeck()}}}});$('#deck').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;const kind=types.find(a=>a.id===b.dataset.kind);if(sun>=kind.cost){selected={kind:kind.id};updateDeck()}});$('#start').onclick=start;$('#scores').onclick=showLeaders;$('#pause').onclick=()=>{if(state==='playing'){paused=!paused;$('#pause').textContent=paused?'▶':'Ⅱ'}};$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'♪':'×'};updateDeck();requestAnimationFrame(render)})();
</script></html>
