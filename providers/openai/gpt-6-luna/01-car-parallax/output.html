<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow — a quiet drive</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171d32}canvas{display:block;width:100%;height:100%}.label{position:fixed;left:clamp(18px,4vw,58px);top:clamp(20px,5vh,54px);color:#fff8e8;font:500 11px/1.4 system-ui;letter-spacing:.24em;text-transform:uppercase;opacity:.85}.label strong{display:block;margin-top:9px;font:300 clamp(30px,5vw,64px)/1 Georgia,serif;letter-spacing:-.04em}.hint{position:fixed;right:24px;bottom:22px;color:#fff9;font:11px system-ui;letter-spacing:.1em}</style>
<div class="label">MILE 084 · PACIFIC COAST<strong>Afterglow</strong></div><div class="hint">A CALM DRIVE · MOVE YOUR POINTER TO LOOK AROUND</div><canvas id="scene"></canvas>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,dpr,scroll=0,last=0,px=.5;const TAU=Math.PI*2;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>px=e.clientX/w);
function hill(y,amp,period,off,col){x.fillStyle=col;x.beginPath();x.moveTo(0,h);for(let i=0;i<=w+8;i+=8){const xx=i;x.lineTo(xx,y+Math.sin((xx+off)/period)*amp+Math.sin((xx-off*.37)/(period*.47))*amp*.23)}x.lineTo(w,h);x.fill()}
function wheel(cx,cy,r,rot){x.save();x.translate(cx,cy);x.fillStyle='#171a20';x.beginPath();x.arc(0,0,r,0,TAU);x.fill();x.strokeStyle='#68727a';x.lineWidth=r*.1;x.stroke();x.rotate(rot);x.strokeStyle='#bdc4c4';x.lineWidth=r*.055;for(let i=0;i<8;i++){x.rotate(TAU/8);x.beginPath();x.moveTo(0,0);x.lineTo(r*.72,0);x.stroke()}x.fillStyle='#e0c98d';x.beginPath();x.arc(0,0,r*.18,0,TAU);x.fill();x.restore()}
function car(t){const s=Math.min(w/1100,1.4),cx=w*.51,base=h*.78+Math.sin(t*5)*1.8;x.save();x.translate(cx,base);x.scale(s,s);x.shadowColor='#f38d58';x.shadowBlur=28;x.fillStyle='#f4eee0';x.beginPath();x.moveTo(-262,-50);x.quadraticCurveTo(-240,-87,-170,-98);x.lineTo(-92,-155);x.quadraticCurveTo(-71,-171,-37,-171);x.lineTo(65,-169);x.quadraticCurveTo(101,-164,133,-122);x.lineTo(194,-104);x.quadraticCurveTo(243,-99,257,-67);x.lineTo(263,-33);x.quadraticCurveTo(250,-15,216,-15);x.lineTo(-228,-15);x.quadraticCurveTo(-261,-21,-262,-50);x.fill();x.shadowBlur=0;x.fillStyle='#303e4b';x.beginPath();x.moveTo(-76,-158);x.quadraticCurveTo(-64,-163,-39,-163);x.lineTo(3,-162);x.lineTo(3,-111);x.lineTo(-149,-111);x.closePath();x.fill();x.beginPath();x.moveTo(13,-162);x.lineTo(64,-160);x.quadraticCurveTo(89,-156,113,-119);x.lineTo(13,-111);x.closePath();x.fill();x.fillStyle='#d9825e';x.fillRect(204,-67,24,10);x.fillStyle='#fae2a7';x.fillRect(-249,-60,22,9);wheel(-171,-23,34,t*8);wheel(173,-23,34,t*8);x.fillStyle='#bdc6cb';x.fillRect(-104,-107,3,20);x.fillRect(8,-107,3,20);x.fillStyle='#fff8e9';x.fillRect(-205,-42,29,5);x.restore()}
function draw(now){const dt=Math.min((now-last)/1000,.05)||0;last=now;scroll+=dt*54;const t=now/1000,off=scroll+(px-.5)*100;x.clearRect(0,0,w,h);const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#243354');g.addColorStop(.42,'#c27570');g.addColorStop(.72,'#f0b27c');g.addColorStop(1,'#566473');x.fillStyle=g;x.fillRect(0,0,w,h);const sunX=w*(.73+(px-.5)*.035),sunY=h*.31,sunR=Math.min(w,h)*.075,glow=x.createRadialGradient(sunX,sunY,1,sunX,sunY,sunR*2.5);glow.addColorStop(0,'#ffe7b9aa');glow.addColorStop(1,'#ffd39b00');x.fillStyle=glow;x.fillRect(sunX-sunR*3,sunY-sunR*3,sunR*6,sunR*6);x.fillStyle='#ffe8bc';x.beginPath();x.arc(sunX,sunY,sunR,0,TAU);x.fill();hill(h*.48,h*.07,210,off*.09,'#60627d');hill(h*.55,h*.065,142,off*.16,'#48536e');hill(h*.62,h*.035,95,off*.27,'#344759');x.fillStyle='#d2a47e';x.fillRect(0,h*.66,w,h*.04);x.fillStyle='#292d38';x.fillRect(0,h*.70,w,h*.3);
// Road perspective and broken center line
x.fillStyle='#d7c0a0';x.fillRect(0,h*.70,w,3);x.fillStyle='#e6c58d';x.fillRect(0,h*.70,w,2);for(let i=-1;i<Math.ceil(w/130)+2;i++){let xx=((i*130-(off*1.6)%130)+130*3)%(w+130)-40;x.fillStyle='#f2d7a0';x.fillRect(xx,h*.88,62,3)}
// Repeating roadside silhouettes in three depth bands
for(let i=-1;i<Math.ceil(w/95)+2;i++){let xx=((i*95-off*1.2)% (w+190)+w+190)%(w+190)-70;const height=18+((i*37%43)+43)%43;x.fillStyle='#252f39';x.fillRect(xx,h*.695-height,3,height);x.fillStyle='#3c4848';x.beginPath();x.arc(xx+1,h*.695-height-8,7,0,TAU);x.fill()}
for(let i=-1;i<Math.ceil(w/230)+2;i++){let xx=((i*230-off*2.05)%(w+460)+w+460)%(w+460)-120;const th=50+((i*29%65)+65)%65;x.fillStyle='#202e35';x.fillRect(xx-3,h*.70-th*.48,6,th*.48);for(let j=0;j<3;j++){x.beginPath();x.moveTo(xx,h*.70-th+j*17);x.lineTo(xx-22+j*2,h*.70-th*.45+j*12);x.lineTo(xx+22-j*2,h*.70-th*.45+j*12);x.fill()}}
// Light atmospheric grain
x.globalAlpha=.11;for(let i=0;i<90;i++){const xx=((i*197+Math.sin(i*13+t)*9)%w+w)%w,yy=(i*89%h);x.fillStyle=i%2?'#fff':'#0b1424';x.fillRect(xx,yy,1.5,1.5)}x.globalAlpha=1;car(t);const vg=x.createRadialGradient(w/2,h*.52,Math.min(w,h)*.22,w/2,h*.52,Math.max(w,h)*.72);vg.addColorStop(0,'#0000');vg.addColorStop(1,'#10162977');x.fillStyle=vg;x.fillRect(0,0,w,h);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
