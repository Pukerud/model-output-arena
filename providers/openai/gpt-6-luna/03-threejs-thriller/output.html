<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midnight on the Lot</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b12;color:#f5efdf;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%}.title{position:fixed;z-index:2;top:5vh;left:5vw;pointer-events:none;text-shadow:0 2px 30px #000}.title small{font:500 10px/1.4 ui-monospace,monospace;letter-spacing:.25em;color:#e7bba5}.title h1{font:300 clamp(34px,7vw,86px)/.88 Georgia,serif;letter-spacing:-.045em;margin:12px 0 8px}.title p{font:11px ui-monospace,monospace;letter-spacing:.1em;color:#d9c8bd}.credit{position:fixed;z-index:2;bottom:22px;left:5vw;color:#c9b9ad;font:10px ui-monospace,monospace;letter-spacing:.09em}.control{position:fixed;z-index:2;right:5vw;bottom:18px;border:1px solid #eac9ac55;border-radius:99px;background:#12141dcc;color:#f6e8d7;padding:10px 15px;font:11px ui-monospace,monospace;letter-spacing:.1em;cursor:pointer}.control:hover{background:#28252a}</style>
<div class="title"><small>STUDIO NOCTURNE · A LITTLE MOONLIGHT</small><h1>Midnight<br>on the Lot</h1><p>FOUR DANCERS · ONE FAMILIAR BEAT</p></div><div class="credit">A PROCEDURAL THREE.JS STAGE · CLICK TO PAUSE</div><button class="control" id="toggle">PAUSE CHOREOGRAPHY</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b12);scene.fog=new THREE.FogExp2(0x090b12,.026);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,5.1,18);camera.lookAt(0,2.1,0);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9cb4de,0x251d25,1.4));const key=new THREE.SpotLight(0xffdcb2,150,36,Math.PI/5,.5,1.2);key.position.set(-5,12,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.SpotLight(0x9cb8ff,175,35,Math.PI/4,.65,1);rim.position.set(5,9,-7);scene.add(rim);const red=new THREE.PointLight(0xc12b43,45,13);red.position.set(-8,4,-2);scene.add(red);
const mat=(color,roughness=.75,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),mat(0x171820,.9));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;floor.receiveShadow=true;scene.add(floor);const circle=new THREE.Mesh(new THREE.CircleGeometry(6.6,64),new THREE.MeshBasicMaterial({color:0xd0a57e,transparent:true,opacity:.09}));circle.rotation.x=-Math.PI/2;circle.position.y=.01;scene.add(circle);
// A quiet cemetery skyline: low tombstones, iron rails, pointed silhouettes.
const stoneMat=mat(0x35343a),railMat=mat(0x39363a,.5,.45);for(let i=0;i<21;i++){const x=(i-10)*1.25,z=-5-Math.random()*2,h=.6+Math.random()*1.8;const stone=new THREE.Mesh(new THREE.BoxGeometry(.48,h,.25),stoneMat);stone.position.set(x,h/2,z);stone.castShadow=true;scene.add(stone);const cap=new THREE.Mesh(new THREE.SphereGeometry(.24,10,7,0,Math.PI*2,0,Math.PI/2),stoneMat);cap.position.set(x,h,z);cap.scale.y=.55;scene.add(cap)}for(let side of [-1,1])for(let i=0;i<12;i++){const post=new THREE.Mesh(new THREE.CylinderGeometry(.025,.045,1.7,6),railMat);post.position.set(side*(6.5+i*.4),.85,-2.8);scene.add(post)}
// Soft pools of light and drifting fog motes.
for(let i=0;i<34;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.04,6,5),new THREE.MeshBasicMaterial({color:i%3?0xe2c89c:0xc0c9ed,transparent:true,opacity:.3+Math.random()*.3}));m.position.set((Math.random()-.5)*19,Math.random()*7-1,Math.random()*-11+2);m.userData={phase:Math.random()*6,speed:.3+Math.random()*.7};scene.add(m)}
function box(parent,w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function sphere(parent,r,material,x,y,z,seg=14){const o=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.max(8,seg-3)),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function makePerson(x,z,shirt,pants,skin,kind){const root=new THREE.Group();root.position.set(x,0,z);scene.add(root);const bodyMat=mat(shirt,.68),legMat=mat(pants),skinMat=mat(skin),shoeMat=mat(0x17171b,.45),jointMat=skinMat;const torso=new THREE.Group();torso.position.y=1.48;root.add(torso);const chest=box(torso,.58,.78,.34,bodyMat,0,0,0);const neck=sphere(torso,.13,skinMat,0,.48,0);const head=new THREE.Group();head.position.y=.69;torso.add(head);sphere(head,.31,skinMat,0,0,0,18);sphere(head,.34,mat(kind==='Pepe'?0x529a59:skin,.9),0,-.13,0,18).scale.set(1,.55,.96); // jaw overlay
// Hair, recognizable silhouettes, and signature costume accents.
if(kind==='Michael'){sphere(head,.34,mat(0x111117),0,.11,-.04).scale.set(1,.7,1);const hat=new THREE.Mesh(new THREE.CylinderGeometry(.23,.27,.15,18),mat(0x090a0d));hat.position.y=.31;head.add(hat);const brim=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.035,20),mat(0x090a0d));brim.position.y=.22;head.add(brim);const glove=sphere(torso,.105,mat(0xf1eee1),-.37,.1,.03);box(torso,.12,.33,.09,mat(0xf2eee4),-.31,-.12,.02).rotation.z=-.35}
if(kind==='Pepe'){sphere(head,.095,mat(0xe7d76c),-.12,.03,.245,12);sphere(head,.095,mat(0xe7d76c),.12,.03,.245,12);sphere(head,.038,mat(0x111311),-.12,.03,.319,10);sphere(head,.038,mat(0x111311),.12,.03,.319,10);const mouth=new THREE.Mesh(new THREE.TorusGeometry(.16,.025,6,20,Math.PI),mat(0x392d22));mouth.position.set(0,-.15,.29);mouth.rotation.z=Math.PI;head.add(mouth)}
if(kind==='Trump'){sphere(head,.34,mat(0xe9bb79),0,.16,-.03).scale.set(1,.42,1);const hair=sphere(head,.3,mat(0xd8a638),.04,.23,-.1);hair.scale.set(1,.28,1);box(torso,.62,.13,.35,mat(0xc92e3d),0,-.32,0);box(torso,.1,.32,.08,mat(0xb02132),.13,-.5,.19).rotation.z=-.3}
if(kind==='Elon'){sphere(head,.31,mat(0x2d2728),0,.18,-.06).scale.set(1,.33,1);box(torso,.45,.12,.37,mat(0x8f3a2c),0,-.18,.2)}
// Neck and shoulders
const shoulderL=new THREE.Group(),shoulderR=new THREE.Group();shoulderL.position.set(-.34,.3,0);shoulderR.position.set(.34,.3,0);torso.add(shoulderL,shoulderR);function limb(parent,len,r,material){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r*.78,r,len,10),material);mesh.position.y=-len/2;mesh.castShadow=true;parent.add(mesh);return mesh}limb(shoulderL,.54,.105,skinMat);limb(shoulderR,.54,.105,skinMat);const handL=sphere(shoulderL,.11,skinMat,0,-.57,0),handR=sphere(shoulderR,.11,skinMat,0,-.57,0);
const hips=new THREE.Group();hips.position.y=1.05;root.add(hips);box(hips,.43,.2,.3,legMat,0,0,0);const legs=[];for(let side of [-1,1]){const leg=new THREE.Group();leg.position.set(side*.15,-.1,0);hips.add(leg);limb(leg,.66,.11,legMat);const foot=box(leg,.18,.12,.34,shoeMat,0,-.64,.09);legs.push(leg)}const labelCanvas=document.createElement('canvas');labelCanvas.width=320;labelCanvas.height=72;const labelCtx=labelCanvas.getContext('2d');labelCtx.fillStyle='rgba(12,13,19,.72)';labelCtx.beginPath();labelCtx.roundRect(5,7,310,58,23);labelCtx.fill();labelCtx.fillStyle='#f3e5d3';labelCtx.font='500 30px ui-monospace,monospace';labelCtx.textAlign='center';labelCtx.textBaseline='middle';labelCtx.fillText(kind.toUpperCase(),160,36);const label=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(labelCanvas),transparent:true,depthWrite:false}));label.scale.set(1.22,.28,1);label.position.y=2.75;root.add(label);return{root,torso,head,shoulderL,shoulderR,hips,legs,kind,phase:Math.random()*6}}
const cast=[makePerson(-3.3,0,0x201d25,0x101116,0xb1795a,'Michael'),makePerson(-1.1,-.1,0x577f48,0x304d38,0x58a260,'Pepe'),makePerson(1.1,-.05,0x242833,0x23262c,0xe4b77c,'Trump'),makePerson(3.3,0,0x6d493f,0x23252a,0xd6a883,'Elon')];
function choreography(p,t){const beat=t*2.35+p.phase,cycle=((beat%(Math.PI*8))+Math.PI*8)%(Math.PI*8),step=Math.sin(beat),sway=Math.sin(beat*.5);p.root.position.x=[-3.3,-1.1,1.1,3.3][cast.indexOf(p)]+Math.sin(beat*.5)*.12;p.root.position.z=Math.cos(beat*.5)*.12;p.hips.rotation.y=sway*.2;p.torso.rotation.z=sway*.09;p.torso.rotation.x=Math.sin(beat*2)*.035;p.legs[0].rotation.x=step*.58;p.legs[1].rotation.x=-step*.58;p.legs[0].rotation.z=-.12-Math.max(0,step)*.17;p.legs[1].rotation.z=.12+Math.max(0,-step)*.17;p.shoulderL.rotation.x=-.65+Math.sin(beat+1)*.55;p.shoulderR.rotation.x=-.65+Math.sin(beat+Math.PI+1)*.55;p.shoulderL.rotation.z=-.18+Math.cos(beat)*.52;p.shoulderR.rotation.z=.18-Math.cos(beat)*.52;p.head.rotation.z=Math.sin(beat*.5)*.08;if(cycle<Math.PI*1.2){p.shoulderL.rotation.z=-.95;p.shoulderR.rotation.z=.95;p.torso.rotation.z=.04}else if(cycle>Math.PI*4&&cycle<Math.PI*5.1){p.torso.rotation.x=-.28;p.shoulderL.rotation.x=-1.4;p.shoulderR.rotation.x=-1.4}}
let paused=false,start=performance.now();document.querySelector('#toggle').onclick=()=>{paused=!paused;document.querySelector('#toggle').textContent=paused?'RESUME CHOREOGRAPHY':'PAUSE CHOREOGRAPHY'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))});function frame(now){requestAnimationFrame(frame);const t=(now-start)/1000;if(!paused)cast.forEach(p=>choreography(p,t));scene.children.forEach(o=>{if(o.userData.speed){o.position.y+=Math.sin(t*o.userData.speed+o.userData.phase)*.0018}});camera.position.x=Math.sin(t*.13)*.34;camera.lookAt(0,2.1,0);key.position.x=-5+Math.sin(t*.4)*1.1;red.intensity=38+Math.sin(t*2.2)*9;renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
