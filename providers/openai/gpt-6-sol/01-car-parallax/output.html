<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterglow Drive</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182635}canvas{display:block;width:100%;height:100%}.label{position:fixed;left:25px;bottom:24px;color:#fff9;font:11px/1.5 system-ui;letter-spacing:.25em;text-transform:uppercase;pointer-events:none}</style></head>
<body><canvas id="scene"></canvas><div class="label">Afterglow · a quiet drive</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W,H,D=1,last=0,t=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const lerp=(a,b,v)=>a+(b-a)*v,fract=x=>x-Math.floor(x),rand=n=>fract(Math.sin(n*127.1+78.233)*43758.5453);
function path(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function line(x,y,X,Y,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}
function mountain(offset,base,amp,step,color){ctx.beginPath();ctx.moveTo(0,H);for(let x=-step;x<W+step;x+=step){let n=(x+offset)/step;let i=Math.floor(n),f=n-i;let sm=f*f*(3-2*f);let v=lerp(rand(i+12),rand(i+13),sm);ctx.lineTo(x,base-amp*(.3+.7*v))}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#172c46');g.addColorStop(.38,'#815a70');g.addColorStop(.63,'#ef9b72');g.addColorStop(.8,'#f7c58e');g.addColorStop(1,'#735d64');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let sx=W*.76,sy=H*.39,r=H*.17;let glow=ctx.createRadialGradient(sx,sy,0,sx,sy,r*2.8);glow.addColorStop(0,'#ffe6a081');glow.addColorStop(.35,'#ffbc7a38');glow.addColorStop(1,'#ffbc7a00');ctx.fillStyle=glow;ctx.fillRect(sx-r*3,sy-r*3,r*6,r*6);ellipse(sx,sy,r*.37,r*.37,'#ffe5ac');for(let j=0;j<3;j++){let y=H*(.14+j*.11);ctx.fillStyle='#f5c6ad0e';ctx.beginPath();ctx.ellipse(W*(.16+j*.34),y,W*.22,H*.024,0,0,Math.PI*2);ctx.fill()}}
function pine(x,y,s,h,c){ctx.fillStyle=c;ctx.fillRect(x-s*.055,y-h*.19,s*.11,h*.28);for(let i=0;i<3;i++){let yy=y-h*(.24+i*.23),w=s*(.45-i*.09);path([[x,yy-h*.42],[x-w,yy+h*.07],[x+w,yy+h*.07]],c)}}
function scenery(){const hy=H*.62;mountain(t*2,hy+H*.075,H*.17,Math.max(120,W/5),'#6f697b');mountain(t*5,hy+H*.11,H*.13,Math.max(75,W/9),'#485d6c');let farX=-((t*11)%140);for(let x=farX-140,i=0;x<W+140;x+=140,i++)pine(x,hy+H*.06,65+rand(i+Math.floor(t*11/140))*35,H*(.09+rand(i+2)*.07),'#314d55');ctx.fillStyle='#344c50';ctx.fillRect(0,hy+H*.03,W,H*.19);let nearBase=H*.79;let d=120,ofs=(t*47)%d;for(let x=-ofs-d,i=0;x<W+d;x+=d,i++){let k=Math.floor(t*47/d)+i;if(rand(k+7)>.27)pine(x,nearBase+10,65+rand(k+4)*40,H*(.12+rand(k+6)*.1),'#203c43');if(rand(k+21)>.62){line(x+40,nearBase+8,x+40,nearBase-H*.19,'#263c42',4);line(x+40,nearBase-H*.17,x+67,nearBase-H*.14,'#263c42',2);ellipse(x+67,nearBase-H*.14,4,4,'#ffe2a6')}}let grad=ctx.createLinearGradient(0,nearBase,0,H);grad.addColorStop(0,'#293e45');grad.addColorStop(1,'#111e2b');ctx.fillStyle=grad;ctx.fillRect(0,nearBase,W,H-nearBase);ctx.fillStyle='#e1a778';ctx.fillRect(0,nearBase+5,W,2);let marks=150,off=(t*170)%marks;for(let x=-off-marks;x<W+marks;x+=marks){path([[x,H*.92],[x+65,H*.92],[x+58,H*.925],[x-7,H*.925]],'#e9bd8588')}let fg=(t*260)%180;for(let x=-fg-180,i=0;x<W+180;x+=180,i++){let y=H*.99;ellipse(x,y,90,2,'#a17b5c12')}}
function wheel(x,y,r,angle){ellipse(x+5,y+5,r*1.17,r*.43,'#070d17a0');ellipse(x,y,r+3,r+3,'#0a111b');ellipse(x,y,r*.77,r*.77,'#111b26');ellipse(x,y,r*.6,r*.6,'#a5a8a6');ellipse(x,y,r*.48,r*.48,'#3e5661');ctx.save();ctx.translate(x,y);ctx.rotate(angle);for(let a=0;a<5;a++){ctx.rotate(Math.PI*2/5);path([[-3,-r*.12],[3,-r*.12],[5,-r*.48],[-5,-r*.48]],'#c9c9ba')}ctx.restore();ellipse(x,y,r*.14,r*.14,'#d5d1bf');ctx.strokeStyle='#e3dfcf60';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,r*.78,0,Math.PI*2);ctx.stroke()}
function car(){let s=Math.min(W/900,H/570,1.35),cx=W*.48,cy=H*.78-34*s+Math.sin(t*6)*1.5*s;ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);const front=210,rear=-178,wy=21,r=34;ellipse(7,49,215,20,'#08101888');let body=ctx.createLinearGradient(0,-83,0,48);body.addColorStop(0,'#e6b5a1');body.addColorStop(.28,'#b94f53');body.addColorStop(.6,'#802e3f');body.addColorStop(1,'#2b2436');path([[-219,-18],[-200,-38],[-123,-49],[-78,-100],[-45,-115],[91,-115],[127,-98],[161,-52],[206,-41],[224,-19],[226,18],[210,30],[180,32],[153,11],[-136,11],[-163,31],[-206,30],[-224,13]],body,'#f0b89b',2);path([[-73,-98],[-40,-109],[86,-109],[119,-91],[143,-54],[-115,-54]],'#1d3546','#d49b8d',2);path([[-69,-98],[-115,-55],[-8,-55],[-8,-109]],'#334c5b');path([[1,-109],[86,-109],[119,-91],[140,-55],[1,-55]],'#233d4c');path([[75,-107],[114,-85],[135,-60],[80,-60]],'#b6d3ce26');line(-5,-110,-5,-54,'#bd817a',4);path([[-214,-19],[220,-19],[220,9],[-214,9]],'#9e4050aa');line(-208,-17,212,-17,'#f4bdab88',2);path([[-206,10],[214,10],[210,25],[-205,25]],'#2a2935');path([[201,-41],[223,-34],[224,-21],[201,-23]],'#ffe4aa');path([[-218,-30],[-195,-33],[-194,-18],[-221,-18]],'#ed7066');ellipse(222,-30,7,5,'#fff2c2');ellipse(205,17,10,3,'#cfa8a1');path([[-65,-50],[-20,-50],[-15,-45],[-67,-45]],'#f8c4a8');path([[13,-50],[58,-50],[63,-45],[12,-45]],'#f8c4a8');path([[-123,-57],[-135,-54],[-143,-44],[-125,-42]],'#272b37');wheel(rear,wy,r,t*5.6);wheel(front,wy,r,t*5.6);ctx.restore()}
function frame(ms){let dt=Math.min((ms-last)/1000||0,.05);last=ms;t+=dt;ctx.clearRect(0,0,W,H);sky();scenery();car();let vignette=ctx.createRadialGradient(W*.52,H*.45,H*.18,W*.52,H*.45,Math.max(W,H)*.78);vignette.addColorStop(0,'#0000');vignette.addColorStop(1,'#07152591');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
