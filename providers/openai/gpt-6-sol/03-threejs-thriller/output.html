<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thriller · Moonlight Revue</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c17;font-family:system-ui}canvas{display:block}.title{position:fixed;left:32px;top:25px;color:#e9e7dd;pointer-events:none;text-shadow:0 2px 12px #000}.eyebrow{font-size:10px;letter-spacing:.45em;color:#eab780}.title h1{font:normal clamp(28px,4vw,53px) Georgia,serif;letter-spacing:.12em;margin:6px 0}.title p{font-size:11px;letter-spacing:.18em;color:#c9c6c7}.footer{position:fixed;right:25px;bottom:24px;color:#d4c7b5a9;font-size:10px;letter-spacing:.19em;text-transform:uppercase}.controls{position:fixed;left:32px;bottom:25px;display:flex;gap:8px}button{background:#111f2bbd;border:1px solid #bd9a6b;color:#eadbc4;padding:8px 12px;border-radius:5px;cursor:pointer;letter-spacing:.1em}button:hover{background:#284257}@media(max-width:600px){.title{left:15px;top:15px}.controls{left:15px;bottom:15px}.footer{display:none}}</style></head><body><div class="title"><div class="eyebrow">A moonlit stage fantasy</div><h1>THRILLER</h1><p>FOUR ICONS · ONE UNDEAD GROOVE</p></div><div class="controls"><button id="play">Pause</button><button id="camera">Camera: cinema</button></div><div class="footer">Drag to orbit · Scroll to zoom</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x09121d);scene.fog=new THREE.FogExp2(0x101822,.018);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,250);camera.position.set(0,6.6,23);camera.lookAt(0,2,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const mat=(color,roughness=.68,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});const black=mat(0x10151e),seam=mat(0x06090d),cream=mat(0xf1dfc5),bone=mat(0xddd7c2),red=mat(0x971f2b,.48),brightRed=mat(0xd53a42,.4),gold=mat(0xd7ab61,.32,.7),silver=mat(0xb9c6c9,.25,.8),glass=mat(0x142736,.1,.4),green=mat(0x65a151),darkGreen=mat(0x356c46),suit=mat(0x202b39),orange=mat(0xdb8548),blue=mat(0x455d78);function mesh(parent,geometry,material,x=0,y=0,z=0){let m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}function box(p,w,h,d,m,x,y,z){return mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z)}function sphere(p,r,m,x,y,z,sx=1,sy=1,sz=1){let o=mesh(p,new THREE.SphereGeometry(r,20,14),m,x,y,z);o.scale.set(sx,sy,sz);return o}function cyl(p,rt,rb,h,m,x,y,z){return mesh(p,new THREE.CylinderGeometry(rt,rb,h,16),m,x,y,z)}function rod(p,a,b,r,m){const d=new THREE.Vector3().subVectors(b,a),o=mesh(p,new THREE.CylinderGeometry(r,r,d.length(),8),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}
scene.add(new THREE.HemisphereLight(0x839fc1,0x24241d,1.05));let moonLight=new THREE.DirectionalLight(0xb3d7ff,2.8);moonLight.position.set(-9,16,-15);moonLight.castShadow=true;moonLight.shadow.mapSize.set(2048,2048);moonLight.shadow.camera.left=-25;moonLight.shadow.camera.right=25;moonLight.shadow.camera.top=25;moonLight.shadow.camera.bottom=-25;moonLight.shadow.bias=-.0003;scene.add(moonLight);function spot(color,power,x,y,z,target){let l=new THREE.SpotLight(color,power,33,Math.PI/7,.55,1.1);l.position.set(x,y,z);l.target.position.set(...target);l.castShadow=true;l.shadow.mapSize.set(1024,1024);scene.add(l,l.target);return l}const spots=[spot(0xff6158,145,-12,15,4,[-4,0,0]),spot(0x4ac8e5,135,12,15,2,[4,0,0]),spot(0xe3a85c,110,1,16,-12,[0,0,1])];const ambientDisc=new THREE.PointLight(0xadc5fb,40,55);ambientDisc.position.set(0,13,-18);scene.add(ambientDisc);
const floor=mesh(scene,new THREE.PlaneGeometry(140,140),mat(0x233538,.9));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;for(let i=-18;i<=18;i++){let o=box(scene,.035,.008,47,mat(i%3===0?0x56716a:0x3b5552),i,0,-3);o.receiveShadow=true}for(let i=-20;i<=8;i+=2){let o=box(scene,40,.008,.025,mat(0x49615d),0,.004,i);o.receiveShadow=true}const stage=box(scene,18,.4,8,mat(0x151d25,.5),0,.1,-.3);stage.receiveShadow=true;for(let i=0;i<30;i++){let x=-8.5+i*.59;box(scene,.015,.015,7.5,mat(0x394e58,.4),x,.31,-.3)}box(scene,18,.13,.15,gold,0,.31,3.68);
const moon=mesh(scene,new THREE.SphereGeometry(3.1,36,24),new THREE.MeshBasicMaterial({color:0xffecc4}),-13,15,-37);let halo=mesh(scene,new THREE.SphereGeometry(4.7,32,20),new THREE.MeshBasicMaterial({color:0x9ca9c2,transparent:true,opacity:.07,depthWrite:false}),-13,15,-37);const stars=[];for(let i=0;i<140;i++){let x=(Math.random()-.5)*85,y=7+Math.random()*37,z=-42-Math.random()*35;let st=sphere(scene,.025+Math.random()*.035,new THREE.MeshBasicMaterial({color:i%4?0xe9ebef:0xc8dfff}),x,y,z);st.castShadow=false;stars.push(st)}
function grave(x,z,height=1){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let stone=mat(0x3b464d,.95);box(g,.65,height,.18,stone,0,height/2,0);sphere(g,.325,stone,0,height,0,1,.66,.3);box(g,.47,.03,.015,mat(0x83908a),0,height*.55,.105);return g}for(let i=0;i<28;i++){let x=(i%2?-1:1)*(11+Math.random()*25),z=-4-Math.random()*36;grave(x,z,.6+Math.random()*.8)}for(let i=0;i<22;i++){let x=(i%2?-1:1)*(13+Math.random()*25),z=-6-Math.random()*25;let trunk=cyl(scene,.13,.23,2.5,mat(0x171e22),x,1.25,z);trunk.rotation.z=(Math.random()-.5)*.35;for(let j=0;j<3;j++)rod(scene,new THREE.Vector3(x,2,z),new THREE.Vector3(x+(Math.random()-.5)*2,3+Math.random()*1.5,z+(Math.random()-.5)*1.5),.065,black)}
function label(text){let can=document.createElement('canvas');can.width=512;can.height=96;let q=can.getContext('2d');q.font='bold 40px Georgia';q.textAlign='center';q.fillStyle='#f2ddbb';q.shadowColor='#000';q.shadowBlur=16;q.fillText(text,256,58);let tx=new THREE.CanvasTexture(can);tx.colorSpace=THREE.SRGBColorSpace;let o=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false}));o.scale.set(2.8,.53,1);o.position.y=4.7;return o}
function character(kind,x,z){let root=new THREE.Group();root.position.set(x,.42,z);scene.add(root);let body=new THREE.Group();root.add(body);let skin=kind==='pepe'?green:kind==='michael'?mat(0x9e6a4f):kind==='trump'?mat(0xe5b58a):mat(0xc99373);let outfit=kind==='michael'?red:kind==='pepe'?blue:kind==='trump'?suit:black;let chest=box(body,1.05,1.22,.45,outfit,0,2.02,0);let waist=box(body,.8,.38,.4,kind==='michael'?black:outfit,0,1.25,0);if(kind==='michael'){for(let j=0;j<4;j++){box(body,.85,.035,.02,black,0,1.76+j*.22,.235);box(body,.15,.1,.04,gold,0,1.8+j*.22,.26)}box(body,.18,.68,.02,silver,-.34,2.05,.245);box(body,.18,.68,.02,silver,.34,2.05,.245)}else if(kind==='trump'){box(body,.24,.85,.04,cream,0,2.13,.245);let tie=box(body,.1,.67,.06,brightRed,0,2.1,.285);tie.rotation.z=.05}else if(kind==='elon'){box(body,.24,.8,.04,mat(0x303d4d),0,2.15,.25);box(body,.1,.65,.06,blue,0,2.12,.29)}else{box(body,.27,.7,.04,orange,0,2.04,.255)}
let neck=cyl(body,.17,.18,.24,skin,0,2.75,0);let head=sphere(body,kind==='pepe'?.51:.41,skin,0,3.19,0,kind==='pepe'?1.1:1,kind==='pepe'?.88:1.18,.85);let eyeM=kind==='pepe'?mat(0xf1efdc):cream;for(let side of [-1,1]){sphere(body,kind==='pepe'?.16:.065,eyeM,side*(kind==='pepe'?.25:.15),3.31,.34,1,1,kind==='pepe'?1:.5);sphere(body,.045,black,side*(kind==='pepe'?.25:.15),3.31,.475);if(kind==='pepe')sphere(body,.07,darkGreen,side*.25,3.45,.32)}if(kind==='pepe'){let mouth=mesh(body,new THREE.TorusGeometry(.21,.025,5,22,Math.PI),darkGreen,0,2.96,.43);mouth.rotation.z=Math.PI;mouth.scale.y=.45}else{sphere(body,.07,mat(0x8f5348),0,3.04,.37,1,.35,.35)}
if(kind==='michael'){let hair=sphere(body,.44,black,0,3.47,-.045,1.12,.6,1);for(let i=0;i<5;i++)sphere(body,.11,black,-.31+i*.15,3.52+Math.sin(i*2)*.07,.22);let brim=cyl(body,.53,.53,.035,black,0,3.72,0);let crown=cyl(body,.32,.38,.32,black,0,3.89,0);box(body,.76,.055,.04,gold,0,3.78,.33)}if(kind==='trump'){let hair=sphere(body,.43,mat(0xe7c75f),0,3.55,-.02,1.05,.36,1);let sweep=box(body,.47,.12,.25,mat(0xe7c75f),.16,3.51,.23);sweep.rotation.z=-.2}if(kind==='elon'){sphere(body,.42,mat(0x3a2926),0,3.55,-.08,1,.4,1);sphere(body,.13,mat(0x3a2926),-.28,3.49,.22)}
let arms=[],legs=[];for(let side of [-1,1]){let shoulder=new THREE.Group();shoulder.position.set(side*.64,2.47,0);body.add(shoulder);cyl(shoulder,.15,.12,.78,outfit,0,-.4,0).rotation.z=side*.08;sphere(shoulder,.13,skin,0,-.83,0);let hand=sphere(shoulder,.15,kind==='michael'&&side===1?cream:skin,0,-.94,0,1,1.3,.8);arms.push(shoulder);let hip=new THREE.Group();hip.position.set(side*.28,1.1,0);body.add(hip);cyl(hip,.19,.15,.92,kind==='pepe'?blue:black,0,-.48,0);box(hip,.37,.19,.58,kind==='michael'?silver:black,0,-1.02,.12);legs.push(hip)}let name=kind==='michael'?'MICHAEL JACKSON':kind==='pepe'?'PEPE THE FROG':kind==='trump'?'DONALD TRUMP':'ELON MUSK';body.add(label(name));return{root,body,arms,legs,kind,x,z}}
const dancers=[character('michael',-3.9,1),character('pepe',-1.3,.25),character('trump',1.4,.25),character('elon',4,1)];for(let i=0;i<15;i++){let x=-7.5+i*1.04;const lamp=new THREE.PointLight(i%2?0xe68757:0x76c6ce,2,4);lamp.position.set(x,.43,3.4);scene.add(lamp);sphere(scene,.045,new THREE.MeshBasicMaterial({color:i%2?0xe68757:0x76c6ce}),x,.43,3.4)}
let playing=true,cinema=true,drag=false,px=0,az=0,el=0,zoom=23,clock=new THREE.Clock(),song=0;document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#camera').onclick=()=>{cinema=!cinema;document.querySelector('#camera').textContent='Camera: '+(cinema?'cinema':'orbit')};renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);cinema=false;document.querySelector('#camera').textContent='Camera: orbit'});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;az+=(e.clientX-px)*.005;px=e.clientX});renderer.domElement.addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+Math.sign(e.deltaY)*1.4,12,40)},{passive:true});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(playing)song+=dt;let beat=song*2.17;for(let i=0;i<dancers.length;i++){let d=dancers[i],p=beat+i*.12,section=Math.floor(beat/8)%4,move=Math.sin(p*Math.PI),hit=Math.max(0,Math.sin(p*Math.PI));d.body.position.y=hit*.11;d.body.rotation.y=Math.sin(p*.52)*.18;d.body.rotation.z=(section===2?Math.sin(p*.5)*.14:Math.sin(p*Math.PI)*.035);d.root.position.x=d.x+Math.sin(p*.5)*.24;d.root.position.z=d.z+Math.cos(p*.5)*.16;d.arms[0].rotation.z=section===0?.95+move*.45:section===1?-.35+move*.5:section===2?1.2+move*.22:.3+move*.7;d.arms[1].rotation.z=section===0?-.95-move*.45:section===1?.35-move*.5:section===2?-1.2-move*.22:-.3-move*.7;d.arms[0].rotation.x=section===2?-1.3:-.2+hit*.35;d.arms[1].rotation.x=section===2?-1.3:.2-hit*.35;d.legs[0].rotation.x=Math.sin(p*Math.PI)*.23;d.legs[1].rotation.x=-Math.sin(p*Math.PI)*.23;d.legs[0].rotation.z=section===1?.16:0;d.legs[1].rotation.z=section===1?-.16:0;if(d.kind==='michael'&&section===3){d.body.rotation.z=-.22;d.body.rotation.y=-.25}}for(let i=0;i<spots.length;i++){spots[i].position.x=(i-1)*11+Math.sin(song*.7+i*2)*3;spots[i].target.position.x=Math.sin(song*.43+i*2)*4}halo.scale.setScalar(1+Math.sin(song*.42)*.03);if(cinema){let a=Math.sin(song*.12)*.16;camera.position.set(Math.sin(a)*zoom,6.4+Math.sin(song*.21)*.45,Math.cos(a)*zoom);camera.lookAt(0,2.1,0)}else{camera.position.set(Math.sin(az)*zoom,6.4+el,Math.cos(az)*zoom);camera.lookAt(0,2.1,0)}renderer.render(scene,camera)}animate();
</script></body></html>
