<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden Guard · Nightfall</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff5d8;background:#111c20}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -30%,#52736a,#142324 58%,#0c161b);display:grid;place-items:center}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1100px,100vw);padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-family:Georgia,serif;font-size:clamp(25px,4vw,42px);font-weight:900;color:#ffe3a4;text-shadow:0 3px #553e34}.tag{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#accbc0}.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pill,.btn{background:#243c3e;border:1px solid #668a7b;color:#fff2ce;border-radius:12px;padding:10px 14px;box-shadow:0 4px 0 #102528}.pill b{color:#ffdb75}.btn:hover,.card:hover{filter:brightness(1.15)}.btn:active,.card:active{transform:translateY(3px);box-shadow:none}.gold{background:#c08342;color:#201d1c;border-color:#f4c36d;box-shadow:0 4px 0 #754822;font-weight:800}.stage{position:relative;margin-top:14px;border:8px solid #294542;border-radius:18px;box-shadow:0 18px 45px #0008, inset 0 0 0 2px #8baa86;overflow:hidden;background:#34584a}canvas{display:block;width:100%;aspect-ratio:1000/590;touch-action:none}.toolbar{display:flex;gap:9px;align-items:stretch;margin:12px 0;flex-wrap:wrap}.card{width:104px;min-height:79px;border:2px solid #689178;border-radius:13px;color:#ffedc0;background:linear-gradient(#425d4a,#213c35);box-shadow:0 4px #142825;display:grid;justify-items:center;padding:5px;position:relative}.card.selected{border-color:#ffd364;box-shadow:0 0 0 3px #ffd36450,0 4px #463320}.card.disabled{opacity:.48}.card .icon{font-size:28px}.card small{font-weight:700}.cost{color:#ffdb70;font-size:12px}.cool{position:absolute;inset:0;background:#0d1a1baa;transform-origin:top;pointer-events:none;border-radius:10px}.hint{margin-left:auto;align-self:center;color:#bed1bf;font-size:12px}.overlay{position:absolute;inset:0;background:#0b161ac9;display:grid;place-items:center;padding:20px;z-index:2;backdrop-filter:blur(5px)}.panel{width:min(560px,100%);padding:28px;background:linear-gradient(145deg,#34564c,#182f30);border:2px solid #9dba92;border-radius:22px;box-shadow:0 20px 60px #0009;text-align:center}.panel h1{font:900 clamp(32px,6vw,56px) Georgia,serif;line-height:.99;color:#ffe3a4;margin:0 0 12px}.panel h2{color:#ffe3a4;margin:0 0 12px}.panel p{line-height:1.55;color:#d1dfc8}.menu-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}.leader{padding:0;list-style:none;text-align:left;max-height:210px;overflow:auto}.leader li{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #ffffff26}.name{background:#162a2b;color:white;padding:10px;border:1px solid #82a48d;border-radius:8px;max-width:180px}.muted{color:#a9c4ad;font-size:12px}.hidden{display:none!important}@media(max-width:650px){.shell{padding:8px}.top{align-items:start}.hud{justify-content:end}.stage{border-width:4px}.card{width:72px;min-height:67px}.card .icon{font-size:23px}.hint{display:none}}
</style></head><body><main class="shell"><header class="top"><div><div class="tag">a tiny survival garden</div><div class="brand">Garden Guard <span style="color:#a9d3ad">✦</span> Nightfall</div></div><div class="hud"><div class="pill">☀ <b id="sun">150</b></div><div class="pill">Wave <b id="wave">1</b> · Score <b id="score">0</b></div><button id="pause" class="btn" aria-label="Pause game">Ⅱ</button></div></header><section class="stage"><canvas id="game" width="1000" height="590" aria-label="Garden Guard game board"></canvas><div id="overlay" class="overlay"><div class="panel" id="panel"></div></div></section><div class="toolbar" id="cards"></div><div class="muted">Select a seed, then plant on a lawn tile. Click falling suns to collect. Keys 1–4 select plants · Space pauses.</div></main><script>
/* Plan: build a five-lane survival board; give each seed a clear economy/cooldown; escalate waves; persist scores locally; provide menu, pause, help, and game-over flows. */
const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s),cards=$('#cards'),overlay=$('#overlay'),panel=$('#panel');const seeds=[{name:'Sunflower',icon:'🌻',cost:50,cd:5,hp:75},{name:'Peashooter',icon:'🌱',cost:100,cd:4,hp:90},{name:'Wallnut',icon:'🥥',cost:75,cd:9,hp:400},{name:'Snowpea',icon:'❄️',cost:175,cd:9,hp:85}];let mode='menu',sun=150,score=0,wave=1,time=0,spawn=0,sunSpawn=0,chosen=1,last=0,plants=[],zombies=[],shots=[],suns=[],particles=[],cool=[0,0,0,0],hover=null,shake=0,levelTime=0;const L=5,C=9,X=140,Y=90,CW=88,RH=90,store='garden-guard-scores-v1';
function leader(){try{return JSON.parse(localStorage.getItem(store)||'[]')}catch{return []}}function save(name){let a=leader();a.push({name:(name||'Gardener').slice(0,16),score,wave,date:new Date().toLocaleDateString()});a.sort((a,b)=>b.score-a.score);localStorage.setItem(store,JSON.stringify(a.slice(0,8)))}
function menu(){mode='menu';overlay.classList.remove('hidden');panel.innerHTML='<div class="tag">welcome to the lawn</div><h1>Garden Guard<br>Nightfall</h1><p>Keep the shambling crowd from reaching your porch. Grow sunshine, place defenders, and survive as long as you can.</p><div class="menu-actions"><button class="btn gold" id="start">Start defending</button><button class="btn" id="scores">Leaderboard</button><button class="btn" id="help">How to play</button></div><div class="muted">A cozy, endless five-lane defense game</div>';$('#start').onclick=start;$('#scores').onclick=scores;$('#help').onclick=help}
function scores(){panel.innerHTML='<h2>🏆 Garden legends</h2><ol class="leader">'+(leader().map((x,i)=>`<li><span>${i+1}. ${escapeHtml(x.name)} <small>· wave ${x.wave}</small></span><b>${x.score}</b></li>`).join('')||'<li>No scores yet. Your garden awaits.</li>')+'</ol><button class="btn" id="back">Back</button>';$('#back').onclick=menu}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function help(){panel.innerHTML='<h2>How to play</h2><p><b>Sunflowers</b> grow sun. <b>Peashooters</b> fire down a row. <b>Wallnuts</b> absorb attacks. <b>Snowpeas</b> slow zombies. Collect suns, buy seeds, and click an empty tile. Losing one lane ends the run.</p><p>Seeds have cooldowns. Each wave brings more zombies. Pause with Space or the button above.</p><button class="btn gold" id="back">Got it</button>';$('#back').onclick=menu}
function start(){sun=150;score=0;wave=1;time=0;levelTime=0;spawn=3;sunSpawn=3;plants=[];zombies=[];shots=[];suns=[];particles=[];cool=[0,0,0,0];chosen=1;mode='play';overlay.classList.add('hidden');updateUI()}
function pause(){if(mode==='play'){mode='paused';overlay.classList.remove('hidden');panel.innerHTML='<h1>Paused</h1><p>The garden can wait.</p><div class="menu-actions"><button class="btn gold" id="resume">Resume</button><button class="btn" id="quit">Main menu</button></div>';$('#resume').onclick=pause;$('#quit').onclick=menu}else if(mode==='paused'){mode='play';overlay.classList.add('hidden')}}
function end(){if(mode!=='play')return;mode='over';overlay.classList.remove('hidden');panel.innerHTML=`<h1>Garden overrun</h1><p>You reached wave <b>${wave}</b> and earned <b>${score}</b> points.</p><p>Write your name in the garden records.</p><input class="name" id="name" maxlength="16" placeholder="Your name" value="Gardener"><div class="menu-actions"><button class="btn gold" id="record">Save score</button><button class="btn" id="again">Try again</button></div>`;$('#record').onclick=()=>{save($('#name').value);scores()};$('#again').onclick=start}
$('#pause').onclick=pause;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause()}if(/^[1-4]$/.test(e.key)){chosen=+e.key-1;updateUI()}});
function updateUI(){$('#sun').textContent=Math.floor(sun);$('#score').textContent=score;$('#wave').textContent=wave;cards.innerHTML=seeds.map((s,i)=>`<button class="card ${i===chosen?'selected':''} ${sun<s.cost||cool[i]>0?'disabled':''}" data-i="${i}"><span class="icon">${s.icon}</span><small>${s.name}</small><span class="cost">☀ ${s.cost}</span>${cool[i]>0?`<span class="cool" style="height:${Math.min(100,cool[i]/s.cd*100)}%"></span>`:''}</button>`).join('')+'<span class="hint">← Collect sun · click a tile to plant →</span>';cards.querySelectorAll('.card').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;updateUI()})}
function coord(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*590/r.height}}c.onpointermove=e=>{hover=coord(e)};c.onpointerleave=()=>hover=null;c.onpointerdown=e=>{if(mode!=='play')return;let{x,y}=coord(e);for(let i=suns.length-1;i>=0;i--){let a=suns[i];if(Math.hypot(x-a.x,y-a.y)<30){sun+=25;burst(a.x,a.y,'#ffe387');suns.splice(i,1);updateUI();return}}let col=Math.floor((x-X)/CW),row=Math.floor((y-Y)/RH);if(col<0||col>=C||row<0||row>=L)return;let s=seeds[chosen];if(sun<s.cost||cool[chosen]>0||plants.some(p=>p.row===row&&p.col===col))return;plants.push({row,col,type:chosen,hp:s.hp,timer:chosen===0?5:1.2,wig:Math.random()*6});sun-=s.cost;cool[chosen]=s.cd;burst(X+col*CW+CW/2,Y+row*RH+RH/2,'#abeb89');updateUI()};
function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*110,vy:(Math.random()-.5)*110,life:.6,color})}
function step(dt){time+=dt;levelTime+=dt;spawn-=dt;sunSpawn-=dt;cool=cool.map(v=>Math.max(0,v-dt));if(levelTime>23){wave++;levelTime=0;spawn=.4;burst(500,80,'#ffe2a0')}if(spawn<=0){let row=Math.floor(Math.random()*L),tough=Math.random()<Math.min(.48,wave*.05),cone=Math.random()<Math.min(.4,wave*.045);zombies.push({x:1020+Math.random()*50,row,hp:tough?260:cone?190:105,max:tough?260:cone?190:105,speed:(tough?13:cone?17:20)+wave*.75,attack:0,slow:0,tough,cone,phase:Math.random()*6});spawn=Math.max(.8,4.2-wave*.28)+Math.random()*1.6}if(sunSpawn<=0){suns.push({x:180+Math.random()*760,y:-25,target:110+Math.random()*390,life:10});sunSpawn=5+Math.random()*2}
for(let i=suns.length-1;i>=0;i--){let a=suns[i];a.y=Math.min(a.target,a.y+90*dt);a.life-=dt;if(a.life<0)suns.splice(i,1)}for(let p of plants){p.timer-=dt;p.wig+=dt;if(p.type===0&&p.timer<=0){suns.push({x:X+p.col*CW+44,y:Y+p.row*RH+14,target:Y+p.row*RH+18,life:9});p.timer=7}if((p.type===1||p.type===3)&&p.timer<=0&&zombies.some(z=>z.row===p.row&&z.x>X+p.col*CW)){shots.push({x:X+p.col*CW+70,y:Y+p.row*RH+44,row:p.row,slow:p.type===3});p.timer=p.type===3?1.55:1.35}}
for(let i=shots.length-1;i>=0;i--){let b=shots[i];b.x+=330*dt;let z=zombies.find(z=>z.row===b.row&&Math.abs(z.x-b.x)<24);if(z){z.hp-=b.slow?27:30;if(b.slow)z.slow=2.8;burst(b.x,b.y,b.slow?'#a8edff':'#bee786');shots.splice(i,1)}else if(b.x>1040)shots.splice(i,1)}
for(let i=zombies.length-1;i>=0;i--){let z=zombies[i];z.slow=Math.max(0,z.slow-dt);let p=plants.find(p=>p.row===z.row&&Math.abs((X+p.col*CW+42)-z.x)<38);if(p){z.attack+=dt;if(z.attack>.7){p.hp-=32;z.attack=0;burst(z.x-16,Y+z.row*RH+44,'#8d734e')}}else z.x-=z.speed*(z.slow?0.45:1)*dt;if(z.hp<=0){score+=z.tough?35:z.cone?25:15;burst(z.x,Y+z.row*RH+48,'#c3da99');zombies.splice(i,1)}else if(z.x<110){end();break}}plants=plants.filter(p=>p.hp>0);for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=110*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt*3);updateUI()}
function draw(){let sky=g.createLinearGradient(0,0,0,590);sky.addColorStop(0,'#354b61');sky.addColorStop(.22,'#b88276');sky.addColorStop(1,'#2f5847');g.fillStyle=sky;g.fillRect(0,0,1000,590);g.fillStyle='#f6cf9270';g.beginPath();g.arc(820,79,36,0,7);g.fill();for(let i=0;i<17;i++){let x=i*71+(i%3)*19;g.fillStyle=i%2?'#1e3544':'#233a43';g.fillRect(x,90-(i%4)*12,54,88+(i%4)*12);for(let j=0;j<3;j++){g.fillStyle='#eec08a88';g.fillRect(x+8+j*14,100+(i%2)*7,5,9)}}g.fillStyle='#263d40';g.fillRect(0,170,1000,420);g.fillStyle='#614f3a';g.fillRect(0,170,125,420);g.fillStyle='#3f7251';g.fillRect(X,Y,C*CW,L*RH);for(let r=0;r<L;r++)for(let col=0;col<C;col++){g.fillStyle=(r+col)%2?'#57915a':'#609c61';g.fillRect(X+col*CW,Y+r*RH,CW,RH);g.fillStyle='#d4eabb13';g.fillRect(X+col*CW+6,Y+r*RH+7,CW-12,RH-14);g.fillStyle='#285b3c33';for(let k=0;k<4;k++){let tx=X+col*CW+12+k*18,ty=Y+r*RH+28+((col+k)%3)*17;g.fillRect(tx,ty,2,7)}}g.fillStyle='#223a35';g.fillRect(120,90,20,450);for(let r=0;r<L;r++){g.fillStyle='#c9c99d';g.fillRect(91,Y+r*RH+24,32,38);g.fillStyle='#e2e4af';g.beginPath();g.arc(108,Y+r*RH+34,18,Math.PI,0);g.fill()}
if(hover&&mode==='play'){let col=Math.floor((hover.x-X)/CW),row=Math.floor((hover.y-Y)/RH);if(col>=0&&col<C&&row>=0&&row<L){g.fillStyle='#fff4b544';g.fillRect(X+col*CW,Y+row*RH,CW,RH)}}
for(let p of plants){let x=X+p.col*CW+44,y=Y+p.row*RH+55,w=Math.sin(time*2+p.wig)*2;g.fillStyle='#203e3190';g.beginPath();g.ellipse(x,y+25,29,8,0,0,7);g.fill();g.strokeStyle='#347441';g.lineWidth=7;g.beginPath();g.moveTo(x,y+17);g.quadraticCurveTo(x-7+w,y,x+w,y-20);g.stroke();g.fillStyle='#4b9a50';g.beginPath();g.ellipse(x-16,y+6,17,8,-.4,0,7);g.ellipse(x+15,y+12,14,7,.5,0,7);g.fill();if(p.type===0){g.fillStyle='#e0a943';for(let a=0;a<10;a++){let ang=a*6.28/10;g.beginPath();g.ellipse(x+w+Math.cos(ang)*19,y-19+Math.sin(ang)*19,8,13,ang,0,7);g.fill()}g.fillStyle='#593a27';g.beginPath();g.arc(x+w,y-19,17,0,7);g.fill();g.fillStyle='#ffe1a0';g.fillRect(x-7+w,y-22,4,4);g.fillRect(x+5+w,y-22,4,4)}else if(p.type===2){g.fillStyle='#9d693f';g.beginPath();g.ellipse(x,y-15,28,34,0,0,7);g.fill();g.strokeStyle='#603f2c';g.lineWidth=2;g.beginPath();g.arc(x,y-15,25,-1,2);g.stroke();g.fillStyle='#322c25';g.fillRect(x-10,y-23,4,5);g.fillRect(x+9,y-23,4,5)}else{g.fillStyle=p.type===3?'#9bd4cf':'#62b94f';g.beginPath();g.arc(x+w,y-20,23,0,7);g.fill();g.beginPath();g.ellipse(x+19+w,y-13,17,12,0,0,7);g.fill();g.fillStyle='#243a34';g.beginPath();g.arc(x-6+w,y-23,3,0,7);g.fill();g.fillStyle='#326852';g.beginPath();g.arc(x+31+w,y-13,4,0,7);g.fill()}}
for(let z of zombies){let y=Y+z.row*RH+61,bob=Math.sin(time*5+z.phase)*2;g.fillStyle='#182b2999';g.beginPath();g.ellipse(z.x,y+18,24,7,0,0,7);g.fill();g.strokeStyle='#263342';g.lineWidth=10;g.beginPath();g.moveTo(z.x-7,y-6);g.lineTo(z.x-12,y+17);g.moveTo(z.x+10,y-6);g.lineTo(z.x+13,y+16);g.stroke();g.fillStyle=z.tough?'#735d4e':'#655366';g.fillRect(z.x-18,y-53+bob,34,48);g.strokeStyle='#7e9b83';g.lineWidth=7;g.beginPath();g.moveTo(z.x-17,y-41+bob);g.lineTo(z.x-34,y-31+bob);g.moveTo(z.x+16,y-39+bob);g.lineTo(z.x+29,y-30+bob);g.stroke();g.fillStyle='#9aab8b';g.beginPath();g.ellipse(z.x,y-64+bob,18,22,-.15,0,7);g.fill();g.fillStyle='#fff7d2';g.fillRect(z.x-14,y-70+bob,7,8);g.fillRect(z.x-2,y-70+bob,7,8);g.fillStyle='#322e31';g.fillRect(z.x-11,y-69+bob,3,4);g.fillRect(z.x,y-69+bob,3,4);if(z.cone||z.tough){g.fillStyle=z.tough?'#9b9b9a':'#ca834c';g.beginPath();g.moveTo(z.x-20,y-82+bob);g.lineTo(z.x,y-(z.tough?103:119)+bob);g.lineTo(z.x+21,y-82+bob);g.fill()}g.fillStyle='#19251e';g.fillRect(z.x-19,y-90+bob,38,4);g.fillStyle='#c44d4b';g.fillRect(z.x-19,y-90+bob,38*Math.max(0,z.hp/z.max),4)}
for(let b of shots){g.fillStyle=b.slow?'#adf5ff':'#b2f380';g.beginPath();g.arc(b.x,b.y,8,0,7);g.fill()}for(let a of suns){let scale=1+Math.sin(time*5+a.x)*.09;g.shadowColor='#ffe788';g.shadowBlur=23;g.fillStyle='#ffe387';g.beginPath();g.arc(a.x,a.y,18*scale,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#fff5bc';g.beginPath();g.arc(a.x-5,a.y-5,5,0,7);g.fill()}for(let q of particles){g.globalAlpha=q.life/.6;g.fillStyle=q.color;g.fillRect(q.x,q.y,5,5)}g.globalAlpha=1;g.fillStyle='#10282499';g.fillRect(0,0,1000,66);g.fillStyle='#fff0c5';g.font='bold 20px system-ui';g.fillText(mode==='play'?`WAVE ${wave}  ·  KEEP THEM OFF YOUR PORCH`:mode==='paused'?'PAUSED':'GARDEN GUARD',22,40);if(mode==='play'){g.fillStyle='#b7dca1';g.fillRect(690,29,280,9);g.fillStyle='#ffe195';g.fillRect(690,29,280*Math.min(1,levelTime/23),9)}}
function loop(ts){let dt=Math.min((ts-last)/1000||0,.05);last=ts;if(mode==='play')step(dt);draw();requestAnimationFrame(loop)}menu();updateUI();requestAnimationFrame(loop);
</script></body></html>
