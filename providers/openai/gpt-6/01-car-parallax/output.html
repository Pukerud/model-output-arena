<!DOCTYPE html>
<html lang="en">
<head>

<title>Afterglow — A coastal drive</title>
<style>
  *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#485458}
  body{font-family:Arial,Helvetica,sans-serif;color:#fff5df}canvas{display:block;width:100%;height:100%}

  @media(max-width:600px){.masthead{top:8%}.caption{font-size:10px}.route{font-size:8px;letter-spacing:.13em;gap:8px}.footer{bottom:4%}.route:before{width:14px}button{padding:12px;letter-spacing:.1em}}

<body>
<canvas id="scene" aria-label="A silver green grand touring car driving beside a lake at sunset. Its wheels turn as layered mountains, trees, telephone poles and roadside grasses pass behind it."></canvas>
<div class="masthead"><div class="eyebrow">A F T E R G L O W</div><h1>Nowhere to hurry.</h1><div class="caption">The coast road. The last of the light.</div></div>
<div class="footer"><div class="route">WESTBOUND &nbsp; / &nbsp; AN ENDLESS EVENING</div><button id="pause" type="button" aria-label="Pause animation" data-paused="false"><span class="icon" aria-hidden="true"></span><span id="button-label">PAUSE</span></button></div>
<script>
(() => {
  'use strict';
  const canvas=document.getElementById('scene'),c=canvas.getContext('2d',{alpha:false});
  const button=document.getElementById('pause'),buttonLabel=document.getElementById('button-label');
  const TAU=Math.PI*2;
  let W=0,H=0,DPR=1,scale=1,carScale=1,time=0,last=0,dirty=true;
  let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mod=(n,m)=>((n%m)+m)%m;
  const rand=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453123;return x-Math.floor(x)};
  function gradient(x0,y0,x1,y1,stops){const g=c.createLinearGradient(x0,y0,x1,y1);for(const [p,col] of stops)g.addColorStop(p,col);return g}
  function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fill()}
  function line(x1,y1,x2,y2,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
  function path(d,fill,stroke,width=1){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}return p}
  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
    scale=Math.max(.6,H/850);carScale=Math.min(W*.72/650,H*.27/220);
    c.setTransform(DPR,0,0,DPR,0,0);dirty=true;
  }
  const grain=document.createElement('canvas');grain.width=grain.height=180;
  const gc=grain.getContext('2d'),pixels=gc.createImageData(180,180);
  for(let i=0;i<pixels.data.length;i+=4){const n=rand(i)*255;pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=n;pixels.data[i+3]=255}gc.putImageData(pixels,0,0);
  const grainPattern=c.createPattern(grain,'repeat');

  function mountain(distance,base,amplitude,color,frequency,seed){
    c.fillStyle=color;c.beginPath();c.moveTo(-12,H);
    for(let x=-12;x<=W+12;x+=8){const z=(x+distance)/frequency;
      const y=base-amplitude*(.46+.25*Math.sin(z+seed)+.16*Math.sin(z*2.19+seed*3)+.1*Math.sin(z*4.83+1.3)+.035*Math.sin(z*11.7));

  function tree(x,base,height,seed,color,lit=false){

      c.beginPath();c.moveTo(cx,top-height*.12);c.lineTo(cx+width*.4,top-height*.015);c.lineTo(cx+width*.75,top+height*.045);c.lineTo(cx+width,top+height*.09);c.lineTo(cx+width*.2,top+height*.075);c.lineTo(cx-width*.94,top+height*.12);c.lineTo(cx-width*.65,top+height*.025);c.closePath();c.fill();

  function forest(distance,spacing,base,minHeight,maxHeight,color,seed,lit=false){

  function sky(distance){

  function poles(distance){

    const base=H*.765,top=H*.37;

  function road(distance){

    }
    for(let i=0;i<105;i++){
      const y=top+rand(i+320)*(H-top),depth=(y-top)/(H-top),x=mod(rand(i+690)*W-distance*(.83+depth*.3),W);

      const x=i*markers-dm+73*scale;c.fillStyle='#d2c9a9';c.fillRect(x,top-23*scale,4*scale,26*scale);c.fillStyle='#5a5c4c';c.fillRect(x,top-20*scale,4*scale,7*scale);c.fillStyle='#e4b274';c.fillRect(x+.7*scale,top-19*scale,2.6*scale,3.5*scale);
    }
  }
  function wheel(x,angle){

    c.strokeStyle='#050c0e';c.lineWidth=2;c.beginPath();c.arc(0,0,38.5,0,TAU);c.stroke();
    const rim=c.createRadialGradient(-12,-15,0,0,0,35);rim.addColorStop(0,'#9daba7');rim.addColorStop(.65,'#566165');rim.addColorStop(.89,'#d5d8c9');rim.addColorStop(1,'#6a7776');ellipse(0,0,35,35,rim);

    c.restore();

    for(let i=0;i<5;i++){const a=i*TAU/5;ellipse(Math.cos(a)*7,Math.sin(a)*7,1.1,1.1,'#263b40')}
    c.restore();
    c.strokeStyle='#e4d5b77a';c.lineWidth=1.5;c.beginPath();c.arc(0,0,33,3.6,5.8);c.stroke();
    c.strokeStyle='#dcc8a325';c.lineWidth=1.3;c.beginPath();c.arc(0,0,45,3.6,5.9);c.stroke();
    c.restore();
  }
  const bodyPath='M -320 -63 Q -319 -86 -292 -94 L -242 -100 Q -206 -118 -151 -153 Q -131 -169 -93 -173 L 24 -173 Q 47 -171 68 -154 L 130 -107 Q 227 -101 291 -81 Q 317 -73 323 -54 L 329 -21 Q 327 -8 308 -6 L 269 -3 C 268 -37 253 -62 215 -63 C 180 -64 158 -37 157 1 L -136 1 C -137 -35 -155 -63 -194 -63 C -231 -63 -252 -36 -251 -1 L -301 -7 Q -319 -10 -322 -24 Z';
  function car(distance){
    const x=W*.485,y=H*.825,s=carScale;
    c.save();c.translate(x,y);c.scale(s,s);
    const shadow=c.createRadialGradient(0,0,30,0,0,350);shadow.addColorStop(0,'#08151bdd');shadow.addColorStop(.72,'#0b181b89');shadow.addColorStop(1,'#0b181b00');
    c.save();c.scale(1,.073);ellipse(0,0,354,354,shadow);c.restore();
    ellipse(-193,0,47,5,'#0d171bd9');ellipse(214,0,47,5,'#0d171bd9');
    c.translate(0,-39);
    c.fillStyle='#101b1e';c.fillRect(-285,-21,576,24);

    c.save();c.translate(0,Math.sin(time*6.2)*.65+Math.sin(time*13.7)*.23);c.rotate(Math.sin(time*4.1)*.00115);

    path('M -329 -42 Q -101 -27 152 -34 Q 277 -38 339 -30 L 340 -15 Q 110 -6 -329 -25 Z','#183c451e');

    c.save();c.clip(frontWindow);
    path('M -81 -142 L 104 -132 L 113 -111 L -83 -120 Z','#dbb69416');

    path('M -10 -111 Q -9 -129 1 -127 Q 10 -129 16 -119 L 37 -115 L 35 -110 Z','#152a32cc');
    c.strokeStyle='#162c32';c.lineWidth=2.5;c.beginPath();c.ellipse(46,-115,5,12,-.45,0,TAU);c.stroke();

    path('M -149 -154 Q -126 -174 -91 -173 L 23 -173 Q 41 -172 59 -160',null,'#eee0bb9c',1.7);

    path('M -297 -29 L -264 -26',null,'#ede0bb9c',3);

  function foreground(distance){

  function draw(){
    const distance=time*190*carScale;
    sky(distance);poles(distance);road(distance);car(distance);foreground(distance);
    const haze=c.createRadialGradient(W*.755,H*.39,H*.03,W*.755,H*.39,H*.7);haze.addColorStop(0,'#ffe0a31b');haze.addColorStop(.6,'#dcb18303');haze.addColorStop(1,'#0c242a13');c.fillStyle=haze;c.fillRect(0,0,W,H);
    const vignette=c.createRadialGradient(W*.51,H*.48,Math.min(W,H)*.25,W*.5,H*.5,Math.max(W,H)*.75);vignette.addColorStop(0,'#122b3500');vignette.addColorStop(1,'#10262d75');c.fillStyle=vignette;c.fillRect(0,0,W,H);
    c.save();c.globalAlpha=.035;c.fillStyle=grainPattern;c.fillRect(0,0,W,H);c.restore();
  }
  function syncButton(){button.dataset.paused=String(paused);button.setAttribute('aria-label',paused?'Resume animation':'Pause animation');buttonLabel.textContent=paused?'RESUME':'PAUSE'}
  function toggle(){paused=!paused;last=0;dirty=true;syncButton()}
  button.addEventListener('click',toggle);
  addEventListener('keydown',e=>{if(e.code==='Space'&&e.target!==button){e.preventDefault();toggle()}});
  addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{last=0});
  function frame(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!document.hidden){time+=dt;draw();dirty=false}else if(dirty){draw();dirty=false}requestAnimationFrame(frame)}
  resize();syncButton();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
