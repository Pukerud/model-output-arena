 g.save();g.translate(250,-53);g.scale(1,.32);oval(0,0,24,24,glow(0,0,24,[[0,'#ffdeb67d'],[.42,'#ffbd7544'],[1,'#ff986000']]));g.restore();
 g.save();g.translate(-244,-40);g.scale(1,.48);oval(0,0,19,19,glow(0,0,19,[[0,'#f8715b55'],[1,'#f8715b00']]));g.restore();g.restore();g.restore();
}
function legend(){
 const left=clamp(W*.048,24,74),top=clamp(H*.093,49,83),small=W<680;
 g.fillStyle='#f5d7b1';g.font='500 11px ui-monospace, Consolas, monospace';g.letterSpacing='3px';g.fillText('COASTAL STUDIES / 01',left,top);
 g.letterSpacing='0px';g.fillStyle='#fff0d6';g.font=`italic ${small?42:62}px Georgia, serif`;g.fillText('Westbound',left-2,top+(small?48:64));
 g.letterSpacing='2px';g.fillStyle='#f3d5b6bb';g.font='10px ui-monospace, Consolas, monospace';g.fillText('THE LAST LIGHT ON THE PACIFIC',left,top+(small?73:94));
 const y=H-36;line(left,y-15,left+40,y-15,'#e6c6a489');g.fillText('35° 59′ N   /   PACIFIC COAST',left,y+5);g.letterSpacing='0px';
}
function resize(){
 const w=canvas.clientWidth,h=canvas.clientHeight;D=Math.min(2,devicePixelRatio||1);S=h/900||1; W=w/S;H=h/S;
 // Let tall screens keep enough width for a complete silhouette without shrinking the sky vertically.
 if(W<580){S=w/580;W=580;H=h/S;}
 canvas.width=Math.round(w*D);canvas.height=Math.round(h*D);g.setTransform(D*S,0,0,D*S,0,0);
 ground=H*.762;shore=ground-Math.min(151,H*.178);
 sky=vertical(0,shore+8,[[0,'#202b47'],[.22,'#494660'],[.51,'#9b6878'],[.76,'#e89a83'],[1,'#f5bb92']]);
 vignette=glow(W*.53,H*.47,Math.hypot(W,H)*.65,[[0,'#19162c00'],[.52,'#1d183000'],[1,'#1315229e']]);
}
function frame(now){if(!paused&&previous)t+=Math.min(.067,(now-previous)/1000);previous=now;
 if(!paused||dirty){backdrop();driving();rect(0,0,W,H,vignette);g.fillStyle=g.createPattern(grain,'repeat');g.fillRect(0,0,W,H);legend();dirty=false;}
 requestAnimationFrame(frame);
}
function sync(){button.textContent=paused?'▶':'Ⅱ';button.setAttribute('aria-label',paused?'Play animation':'Pause animation');}
function toggle(){paused=!paused;sync();}
let dirty=true;addEventListener('resize',()=>{resize();dirty=true;});button.addEventListener('click',toggle);
addEventListener('keydown',e=>{if(e.code==='Space'&&e.target!==button){e.preventDefault();toggle();}});
resize();sync();requestAnimationFrame(frame);
</script>
