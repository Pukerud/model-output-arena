function sweeper(r,state){if(state.used&&!state.go)return;g.save();g.translate(state.x,feet(r));ellipse(0,0,19,5,'#1e3426a0');path('M-15-5L-13-19L10-19L19-6Z','#e6a85a','#614d37',2);path('M-13-15L-20-28L-25-28',null,'#4a513f',3);rect(-5,-24,10,7,'#72564c');ellipse(-9,-4,5,5,'#3a3e3b');ellipse(12,-4,5,5,'#3a3e3b');g.restore();}
function burst(x,y,col,count=12){for(let i=0;i<count;i++){const a=Math.random()*TAU,z=25+Math.random()*100;parts.push({x,y,vx:Math.cos(a)*z,vy:Math.sin(a)*z-20,left:.35+Math.random()*.46,col,size:1.2+Math.random()*3});}}
function popup(x,y,word,col='#fff0a0'){floaters.push({x,y,word,col,left:1.14});}
function announce(text,seconds=2.1){notice.textContent=text;notice.classList.add('on');toast=seconds;}
function createSun(x,y,fromSky=false){const el=document.createElement('button');el.className='orb';el.type='button';el.textContent='✦';el.setAttribute('aria-label','Collect 25 sun');const sun={el,x,y,h:fromSky?y-112:y-20,left:fromSky?11:9,life:0};el.onclick=()=>collect(sun);sunLayer.append(el);suns.push(sun);placeSun(sun);}
function placeSun(s){s.el.style.left=(100*s.x/W)+'%';s.el.style.top=(100*s.h/H)+'%';s.el.style.opacity=Math.min(1,s.left*1.7);}
function collect(s){if(mode!=='play'||!suns.includes(s))return;suns.splice(suns.indexOf(s),1);s.el.remove();energy+=25;popup(s.x,s.h-10,'+25');burst(s.x,s.h,'#f8d765',9);hud();}
function clearBoard(){board=Array.from({length:ROWS},()=>Array(COLS).fill(null));enemies=[];shots=[];suns=[];sunLayer.replaceChildren();sweepers=Array.from({length:ROWS},()=>({used:false,go:false,x:104}));parts=[];floaters=[];energy=ranks[level].start;score=0;wave=0;spawn=0;next=12;sky=2;clock=0;cool=0;selected=1;toast=0;notice.classList.remove('on');result=null;}
function start(){clearBoard();setMode('play');select(1);hud();announce('Plant now · first wave incoming',3.8);grid.firstElementChild.focus({preventScroll:true});}
function select(k){selected=k;for(let i=0;i<tools.length;i++)tools[i].setAttribute('aria-pressed',String(i===k));$('#hint').textContent=k===5?'Trowel: select a plant to dig it up (no refund).':seeds[k].role;}
function hud(){const w=$('#wave');w.textContent=mode==='menu'?'— / 4':`${wave+1} / ${cohorts.length}`;$('#progress').style.width=(100*Math.min(1,(cohorts.slice(0,wave).reduce((a,b)=>a+b.length,0)+spawn)/37))+'%';$('#energy').textContent=energy;$('#score').textContent=score.toLocaleString();for(let i=0;i<seeds.length;i++)tools[i].dataset.low=energy<seeds[i].cost;}
function cell(r,c){if(mode!=='play')return;const p=board[r][c],x=cx(c),y=feet(r);if(selected===5){if(p){board[r][c]=null;burst(x,y,'#d6bc83');}return;}if(p){announce('That plot is planted',1.4);return;}
 const seed=seeds[selected];if(energy<seed.cost){announce(`Need ${seed.cost-energy} more sun`,1.5);return;}if(enemies.some(e=>e.r===r&&Math.abs(e.x-x)<34)){announce('Zombies in that plot',1.4);return;}
 energy-=seed.cost;board[r][c]={k:selected,hp:seed.hp,timer:selected===0?5.3:selected===4?1.15:.18,flash:0};burst(x,y-6,'#c0d889');hud();}
function spawnEnemy(r,k){const type=strains[k],hp=Math.round(type.hp*ranks[level].hp);enemies.push({r,k,x:962,hp,max:hp,step:0,bite:false,slow:0,hit:0});}
function kill(e){energy+=e.k===4?20:0;score+=Math.round(strains[e.k].val*ranks[level].bonus);burst(e.x,feet(e.r)-36,'#c5d088');popup(e.x,feet(e.r)-83,'+'+Math.round(strains[e.k].val*ranks[level].bonus));}
function finish(win){if(mode!=='play')return;if(win)score+=Math.round((500+100*sweepers.filter(m=>!m.used).length)*ranks[level].bonus);result={win,score,saved:false};hud();show('result');}
function update(dt){clock+=dt;toast-=dt;if(toast<=0)notice.classList.remove('on');sky-=dt;if(sky<=0){createSun(190+Math.random()*612,160+Math.random()*278,true);sky=6.7;}
 for(const s of [...suns]){s.left-=dt;s.life+=dt;s.h+=(s.y+2*Math.sin(s.life*3)-s.h)*Math.min(1,3.9*dt);if(s.left<=0){s.el.remove();suns.splice(suns.indexOf(s),1);}else placeSun(s);}
 next-=dt;const list=cohorts[wave];if(spawn<list.length&&next<=0){if(spawn===0)announce(wave===3?'Final wave · the big bulbs':'Wave '+(wave+1)+' incoming');spawnEnemy(...list[spawn++]);next=(4.8-wave*.99)*ranks[level].gap;hud();}
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(!p)continue;const x=cx(c),y=feet(r),v=seeds[p.k];p.timer-=dt;p.flash=Math.max(0,p.flash-3.9*dt);
  if(p.k===0&&p.timer<=0){if(!suns.some(s=>Math.abs(s.x-x)<10&&Math.abs(s.y-y+32)<8))createSun(x,y-32);p.timer+=v.rate;}
  if((p.k===1||p.k===3)&&p.timer<=0&&enemies.some(e=>e.hp>0&&e.r===r&&e.x>x+12)){shots.push({r,x:x+25,k:p.k,speed:p.k===1?328:285});p.flash=1;p.timer=v.rate;}
  if(p.k===4&&p.timer<=0){for(const e of enemies)if(Math.abs(e.r-r)<=1&&Math.abs(e.x-x)<141){e.hp-=420;e.hit=1;}burst(x,y-35,'#ffd575',42);burst(x,y-30,'#e8794e',32);popup(x,y-73,'POP!');board[r][c]=null;}
 }
 for(const s of shots){const old=s.x;s.x+=s.speed*dt;const hits=enemies.filter(e=>e.hp>0&&e.r===s.r&&e.x>=old-10&&e.x<=s.x+18).sort((a,b)=>a.x-b.x);if(hits.length){const e=hits[0];e.hp-=s.k===1?26:23;e.hit=1;if(s.k===3)e.slow=2.65;s.dead=true;burst(s.x,feet(s.r)-40,s.k===1?'#cde68d':'#a1e1ed',4);}}
 shots=shots.filter(s=>!s.dead&&s.x<W+5);
 for(const e of enemies){if(e.hp<=0)continue;e.slow=Math.max(0,e.slow-dt);e.hit=Math.max(0,e.hit-dt*6);e.bite=false;const m=sweepers[e.r];if(e.x<104&&!m.used){m.used=m.go=true;announce('Row '+(e.r+1)+' sweeper fired');}
  if(e.x<38){finish(false);return;}
  for(let c=COLS-1;c>=0;c--){const p=board[e.r][c];if(p&&e.x-cx(c)>=-6&&e.x-cx(c)<=32){p.hp-=dt*(e.k===4?40:29)*(e.slow>0?.68:1);e.bite=true;if(p.hp<=0){board[e.r][c]=null;burst(cx(c),feet(e.r)-9,'#b4a37a');}break;}}
  if(!e.bite){const speed=strains[e.k].spd*ranks[level].speed*(e.slow>0?.53:1);e.x-=speed*dt;e.step+=speed*dt*.22;}}
 for(let r=0;r<ROWS;r++){const m=sweepers[r];if(m.go){const ax=m.x;m.x+=438*dt;for(const e of enemies)if(e.r===r&&e.x>=ax-27&&e.x<=m.x+27)e.hp=0;if(m.x>W+36)m.go=false;}}
 for(const e of enemies)if(e.hp<=0)kill(e);enemies=enemies.filter(e=>e.hp>0);hud();
 if(spawn===list.length&&!enemies.length){cool+=dt;if(cool>2){if(wave===cohorts.length-1){finish(true);return;}wave++;spawn=0;next=7.5;cool=0;energy+=50;announce('Wave cleared · +50 sun',3.3);hud();}}else cool=0;
 for(const p of parts){p.left-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;}parts=parts.filter(p=>p.left>0);for(const p of floaters){p.left-=dt;p.y-=27*dt;}floaters=floaters.filter(p=>p.left>0);
}
function size(){const d=Math.min(2,devicePixelRatio||1),r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);}
function draw(){g.drawImage(bg,0,0);for(let r=0;r<ROWS;r++){
 sweeper(r,sweepers[r]);for(let c=0;c<COLS;c++){const p=board[r][c];if(p)plant(p.k,cx(c),feet(r),1,(reduced?0:clock*3.4+c*.9+r),1-p.hp/seeds[p.k].hp,p.flash*.82);}
 for(const s of shots)if(s.r===r){const y=feet(r)-43;ellipse(s.x-8,y,15,3,s.k===1?'#cde8885f':'#b4eafd70');ellipse(s.x,y,6,5,s.k===1?'#c6f47d':'#b4ebf5',0,s.k===1?'#587047':'#598fa1');}
 enemies.filter(e=>e.r===r).sort((a,b)=>b.x-a.x).forEach(e=>zombie(e,clock));}
 for(const p of parts){g.globalAlpha=Math.min(1,p.left*2);ellipse(p.x,p.y,p.size,p.size*.75,p.col);}for(const p of floaters){g.globalAlpha=Math.min(1,p.left*3);g.textAlign='center';g.font='800 17px system-ui';g.lineWidth=3;g.strokeStyle='#273629';g.strokeText(p.word,p.x,p.y);g.fillStyle=p.col;g.fillText(p.word,p.x,p.y);}g.globalAlpha=1;
 if(mode==='menu'&&!enemies.length){plant(0,cx(1),feet(1),1.08,now);plant(1,cx(3),feet(2),1.05,now+.5);plant(3,cx(2),feet(4),1.05,now+2);zombie({r:1,x:817,k:2,step:Math.sin(now*2),hp:100,max:100,slow:0,hit:0},now);zombie({r:3,x:867,k:3,step:Math.sin(now*2+2),hp:100,max:100,slow:0,hit:0},now);}}
function frame(ms){const dt=Math.min(.05,(ms-(frameTime||ms))/1000);frameTime=ms;now=ms/1000;if(mode==='play')update(dt);draw();requestAnimationFrame(frame);}
const tools=[];for(let i=0;i<6;i++){const b=document.createElement('button');b.type='button';b.className='slot'+(i===5?' tool':'');b.setAttribute('aria-pressed','false');b.onclick=()=>select(i);if(i===5){b.textContent='♤';b.title='Trowel (X): remove a plant';b.setAttribute('aria-label',b.title);}else{const v=seeds[i];b.title=v.role;b.innerHTML=`<canvas width="80" height="87" aria-hidden="true"></canvas><span><b>${v.name}</b><small>☀ ${v.cost}</small></span><i class="kbd">${i+1}</i>`;g=b.firstElementChild.getContext('2d');plant(i,40,76,1.01);g=ctx;}$('#tools').append(b);tools.push(b);}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',`Planting plot, row ${r+1}, column ${c+1}`);b.tabIndex=r||c?-1:0;b.onclick=()=>cell(r,c);b.onfocus=()=>{const active=grid.querySelector('[tabindex="0"]');if(active&&active!==b)active.tabIndex=-1;b.tabIndex=0;};b.onkeydown=e=>{const d={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]}[e.key];if(d){e.preventDefault();grid.children[vmax(r+d[0],0,4)*8+vmax(c+d[1],0,7)].focus();}};grid.append(b);}
function setMode(m){mode=m;const active=m==='play';overlay.hidden=active;shell.inert=!active;$('#pause').textContent='Pause';}
function resume(){setMode('play');(focusBack&&shell.contains(focusBack)?focusBack:grid.querySelector('[tabindex="0"]')).focus({preventScroll:true});}
const banner='<div class="kicker">The neighborhood defense league</div>';
function show(view){if(mode==='play')focusBack=document.activeElement;setMode(view);let content=banner;const back=origin==='pause'?'pause':'menu';
 if(view==='menu'){content+='<canvas width="170" height="143" class="illustration" aria-hidden="true"></canvas><h1 id="heading" class="title">Last Lawn<br><em>Club.</em></h1><p>Keep the undead off the porch.<br>Five lanes. Four waves. One very determined garden.</p><div class="actions"><button class="primary" data-act="play">Start shift →</button><button class="soft" data-act="help">How to play</button><button class="soft" data-act="scores">Leaderboard</button></div><div class="settings"><label class="label" for="difficulty">Difficulty</label><select id="difficulty"><option value="cozy">Cozy</option><option value="club">Club</option><option value="wild">Wild</option></select></div>';}
 if(view==='help'){content+='<h2 id="heading">Gardener’s handbook</h2><ol class="rules"><li><b>Collect sun:</b> tap the golden stars as they fall, or press <b>F</b> to collect the oldest. Sunbuds make more.</li><li><b>Plant:</b> choose a seed with <b>1–5</b>, then click a plot; arrow keys and Enter work too. <b>X</b> selects the trowel.</li><li><b>Defend:</b> Peashoots cover a lane, Frostmints slow enemies, Barkblocks buy time and Pepperpops clear the nearby area.</li><li><b>Hold the porch:</b> each sweeper saves its lane once. After that, one escaped zombie ends the run.</li></ol><div class="actions"><button class="primary" data-act="'+back+'">Back</button></div>';}
 if(view==='pause'){content+='<h2 id="heading">Taking a breather.</h2><p>The lawn is frozen until you resume.</p><div class="actions"><button class="primary" data-act="resume">Resume shift</button><button class="soft" data-act="help">How to play</button><button class="soft" data-act="quit">End shift</button></div>';}
 if(view==='result'){content+=`<h2 id="heading">${result.win?'The lawn lives.':'They got to the porch.'}</h2><p>${result.score.toLocaleString()} points · Wave ${wave+1}/4 · ${ranks[level].label}</p><form id="scoreform"><label class="label" for="alias">Garden name</label> <input id="alias" maxlength="16" placeholder="Gardener" autocomplete="off"><div class="actions"><button class="primary" type="submit">Save to leaderboard</button><button type="button" class="soft" data-act="play">Play again</button><button type="button" class="soft" data-act="menu">Main menu</button></div></form>`;}
 if(view==='scores'){content+='<h2 id="heading">Club leaderboard</h2><p>Top 10 scores saved in this browser.</p><div class="scores"><ol id="ranking"></ol></div><div class="actions"><button class="primary" data-act="menu">Main menu</button><button class="soft" data-act="play">New shift</button></div>';}
 panel.innerHTML=content;
 if(view==='menu'){const v=$('#difficulty');v.value=level;v.onchange=()=>{level=v.value;energy=ranks[level].start;hud();};g=panel.querySelector('canvas').getContext('2d');plant(0,79,130,1.64,.3);g=ctx;}
 if(view==='scores'){const rows=readScores(),list=$('#ranking');if(!rows.length){const li=document.createElement('li');li.style.display='block';li.textContent='No shifts logged yet.';list.append(li);}rows.forEach((v,i)=>{const li=document.createElement('li');for(const [tag,text] of [['b',String(i+1).padStart(2,'0')],['span',`${v.name} · ${ranks[v.level].label}${v.win?' · Cleared':''}`],['span',v.points.toLocaleString()]]){const el=document.createElement(tag);el.textContent=text;li.append(el);}list.append(li);});}
 if(view==='result')$('#scoreform').onsubmit=e=>{e.preventDefault();saveScore($('#alias').value);};
 panel.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='play')start();else if(a==='resume')resume();else if(a==='menu'){clearBoard();origin='menu';show('menu');hud();}else if(a==='quit')show('menu-confirm');else{if(a==='help')origin=view;show(a);}});
 if(view==='menu-confirm'){panel.innerHTML=banner+'<h2 id="heading">Leave this shift?</h2><p>This run will not go on the leaderboard.</p><div class="actions"><button class="primary" id="stay">Keep playing</button><button class="soft" id="leave">Leave shift</button></div>';$('#stay').onclick=resume;$('#leave').onclick=()=>{clearBoard();origin='menu';show('menu');hud();};}
 (panel.querySelector('.primary')||panel.querySelector('button')).focus({preventScroll:true});}
$('#pause').onclick=()=>show('pause');$('#help').onclick=()=>{origin='pause';show('help');};
addEventListener('keydown',e=>{if(e.key==='Tab'&&mode!=='play'){const f=[...panel.querySelectorAll('button,input,select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}}
 if(e.key==='Escape'){if(mode==='play')show('pause');else if(mode==='pause'||mode==='menu-confirm')resume();else if(mode==='help')show(origin==='pause'?'pause':'menu');return;}if(mode!=='play'||e.altKey||e.ctrlKey||e.metaKey)return;
 if(/^[1-5]$/.test(e.key))select(+e.key-1);else if(e.key.toLowerCase()==='x')select(5);else if(e.key.toLowerCase()==='f'){e.preventDefault();if(suns.length)collect(suns[0]);}});
addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')show('pause');});clearBoard();select(1);show('menu');hud();size();requestAnimationFrame(frame);
