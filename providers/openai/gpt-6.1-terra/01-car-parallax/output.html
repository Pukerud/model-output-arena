<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last light — a quiet drive</title>
<style>
  *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#19242e}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="scene" aria-label="A car driving along a road at sunset"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene'), ctx = canvas.getContext('2d');
  let width, height, pixelRatio, time = 0, last = 0, distance = 0;
  const TAU = Math.PI * 2;
  const fract = n => n - Math.floor(n);
  const random = n => fract(Math.sin(n * 127.1 + 318.7) * 43758.5453);
  const mod = (a,b) => ((a%b)+b)%b;

  function resize() {
    pixelRatio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * pixelRatio);
    canvas.height = Math.round(innerHeight * pixelRatio);
    height = 900; width = height * innerWidth / innerHeight;
    ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
  }
  addEventListener('resize', resize); resize();
  function fillGradient(x0,y0,x1,y1,stops) {
    const g = ctx.createLinearGradient(x0,y0,x1,y1);
    for(const [p,c] of stops) g.addColorStop(p,c);
    return g;
  }
  function ellipse(x,y,rx,ry,fill) {
    ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();
  }
  function path(points, fill) {
    ctx.beginPath(); ctx.moveTo(points[0][0],points[0][1]);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0],points[i][1]);
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  }
  function mountain(base, amplitude, color, speed, seed) {
    const step = 24, offset = distance*speed;
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-step,height);
    for(let x=-step;x<=width+step;x+=step) {
      const wx=x+offset;
      const y=base - amplitude*(0.47 + 0.25*Math.sin(wx/230+seed) + 0.16*Math.sin(wx/107+seed*2.2) + 0.09*Math.sin(wx/49+seed));
      ctx.lineTo(x,y);
    }
    ctx.lineTo(width+step,height);ctx.closePath();ctx.fill();
  }
  function cloud(x,y,s,alpha) {
    ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#f8d9b3';
    ellipse(x,y,90*s,10*s,'#f8d9b3');ellipse(x-38*s,y-8*s,45*s,12*s,'#f8d9b3');
    ellipse(x+28*s,y-10*s,55*s,13*s,'#f8d9b3');ctx.restore();
  }
  function indexed(spacing, speed, margin, fn) {
    const offset=distance*speed, first=Math.floor((offset-margin)/spacing), lastIndex=Math.ceil((offset+width+margin)/spacing);
    for(let i=first;i<=lastIndex;i++) fn(i,i*spacing-offset);
  }
  function pine(x,y,h,color,seed) {
    const w=h*(.24+random(seed+21)*.09);
    ctx.fillStyle=color; ctx.fillRect(x-w*.055,y-h*.42,w*.11,h*.42);
    ctx.beginPath();ctx.moveTo(x,y-h);
    ctx.lineTo(x-w*.48,y-h*.40);ctx.lineTo(x-w*.25,y-h*.45);
    ctx.lineTo(x-w*.65,y-h*.20);ctx.lineTo(x-w*.32,y-h*.25);
    ctx.lineTo(x-w*.78,y);ctx.lineTo(x+w*.78,y);
    ctx.lineTo(x+w*.32,y-h*.25);ctx.lineTo(x+w*.65,y-h*.20);
    ctx.lineTo(x+w*.25,y-h*.45);ctx.lineTo(x+w*.48,y-h*.40);ctx.closePath();ctx.fill();
  }
  function drawWheel(x, y, radius, angle) {
    ctx.save();ctx.translate(x,y);
    ellipse(0,3,radius+7,radius+7,'#10151a');
    const tire=ctx.createRadialGradient(-radius*.22,-radius*.25,radius*.1,0,0,radius);
    tire.addColorStop(0,'#52565a');tire.addColorStop(.69,'#25292c');tire.addColorStop(.83,'#111519');tire.addColorStop(1,'#34383a');
    ellipse(0,0,radius,radius,tire);
    ctx.strokeStyle='#596066';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,radius*.75,0,TAU);ctx.stroke();
    ctx.rotate(angle);
    const rim=ctx.createRadialGradient(-10,-10,2,0,0,radius*.65);
    rim.addColorStop(0,'#d5d7d3');rim.addColorStop(.45,'#7b8589');rim.addColorStop(1,'#262e33');
    ellipse(0,0,radius*.66,radius*.66,rim);
    for(let i=0;i<10;i++) {
      ctx.rotate(TAU/10);ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(-7,-radius*.58);ctx.lineTo(1,-radius*.61);ctx.lineTo(7,-12);ctx.closePath();ctx.fillStyle=i%2?'#9da7a9':'#d4d9d5';ctx.fill();
    }
    ellipse(0,0,radius*.17,radius*.17,'#2d3438');ellipse(-2,-2,radius*.08,radius*.08,'#d6d8d2');
    ctx.restore();
  }
  function car(x,ground,scale) {
    ctx.save();ctx.translate(x,ground + Math.sin(time*3.3)*1.1 + Math.sin(time*7.8)*.35);ctx.scale(scale,scale);
    const body = fillGradient(0,-240,0,-8,[[0,'#eec59d'],[.13,'#b97558'],[.42,'#8d443b'],[.69,'#6e3333'],[1,'#3d292b']]);
    ellipse(4,5,438,22,'rgba(12,16,19,.24)');ellipse(0,6,350,10,'rgba(10,12,14,.3)');
    // A little light passes under the chassis.
    ctx.fillStyle='#292b2c';ctx.fillRect(-330,-57,670,49);
    ctx.beginPath();ctx.moveTo(-402,-112);ctx.bezierCurveTo(-398,-145,-380,-153,-330,-160);
    ctx.lineTo(-223,-174);ctx.bezierCurveTo(-172,-230,-118,-252,-53,-255);
    ctx.lineTo(83,-254);ctx.bezierCurveTo(153,-253,202,-224,258,-179);
    ctx.lineTo(350,-162);ctx.bezierCurveTo(386,-157,404,-142,410,-119);
    ctx.lineTo(415,-68);ctx.quadraticCurveTo(414,-49,398,-45);ctx.lineTo(359,-43);
    ctx.bezierCurveTo(350,-99,326,-119,286,-119);ctx.bezierCurveTo(240,-119,218,-91,211,-45);
    ctx.lineTo(-205,-45);ctx.bezierCurveTo(-212,-91,-235,-119,-280,-119);
    ctx.bezierCurveTo(-326,-119,-348,-91,-354,-45);ctx.lineTo(-393,-49);
    ctx.quadraticCurveTo(-407,-54,-407,-70);ctx.closePath();ctx.fillStyle=body;ctx.fill();
    ctx.strokeStyle='#332a2b';ctx.lineWidth=4;ctx.stroke();
    // Glazing and roof: light on glass, darker at its bottom.
    const glass=fillGradient(0,-250,0,-170,[[0,'#9fb0ae'],[.48,'#586f78'],[1,'#283e4a']]);
    ctx.beginPath();ctx.moveTo(-203,-176);ctx.bezierCurveTo(-157,-221,-116,-241,-57,-242);
    ctx.lineTo(-19,-242);ctx.lineTo(-23,-178);ctx.closePath();ctx.fillStyle=glass;ctx.fill();
    ctx.beginPath();ctx.moveTo(-8,-242);ctx.lineTo(80,-241);ctx.bezierCurveTo(135,-239,177,-218,224,-178);
    ctx.lineTo(-10,-178);ctx.closePath();ctx.fillStyle=glass;ctx.fill();
    ctx.strokeStyle='rgba(235,218,199,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-192,-183);ctx.quadraticCurveTo(-135,-234,-68,-235);ctx.moveTo(5,-236);ctx.lineTo(78,-235);ctx.stroke();
    ctx.strokeStyle='rgba(29,30,30,.65)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-16,-246);ctx.lineTo(-18,-177);ctx.lineTo(-30,-57);ctx.moveTo(219,-174);ctx.lineTo(205,-57);ctx.moveTo(-199,-174);ctx.lineTo(-184,-58);ctx.stroke();
    // Metallic edge, subtle panel reflections and trim.
    ctx.strokeStyle='rgba(255,223,186,.55)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-381,-152);ctx.bezierCurveTo(-250,-167,-219,-171,-207,-174);ctx.lineTo(234,-174);ctx.quadraticCurveTo(328,-163,389,-145);ctx.stroke();
    ctx.strokeStyle='rgba(251,194,155,.24)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-369,-125);ctx.bezierCurveTo(-210,-134,-60,-135,74,-132);ctx.bezierCurveTo(194,-130,302,-127,384,-112);ctx.stroke();
    ctx.fillStyle='#342d2e';ctx.fillRect(-89,-154,36,6);ctx.fillRect(145,-153,35,6);
    ctx.fillStyle='rgba(235,213,186,.6)';ctx.fillRect(-89,-155,30,2);ctx.fillRect(145,-154,29,2);
    path([[195,-177],[209,-184],[224,-183],[231,-175],[224,-168],[203,-169]],'#342d2d');
    ctx.fillStyle='rgba(255,236,200,.72)';ctx.fillRect(205,-180,16,2);
    path([[382,-143],[407,-137],[412,-124],[387,-123]],'#fbe5bc');
    path([[-403,-131],[-384,-137],[-380,-117],[-405,-116]],'#dd5747');
    ctx.fillStyle='#25292b';ctx.fillRect(-401,-61,40,8);ctx.fillRect(359,-59,47,8);
    ctx.strokeStyle='rgba(255,220,188,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-204,-50);ctx.lineTo(209,-50);ctx.stroke();
    drawWheel(-280,-49,65,distance/(65*scale));drawWheel(286,-49,65,distance/(65*scale));
    ctx.restore();
  }
  function render() {
    ctx.clearRect(0,0,width,height);
    ctx.fillStyle=fillGradient(0,0,0,720,[[0,'#283f55'],[.34,'#7b7782'],[.65,'#dfa787'],[1,'#f2c198']]);ctx.fillRect(0,0,width,height);
    const sx=width*.73, sy=365, glow=ctx.createRadialGradient(sx,sy,15,sx,sy,270);
    glow.addColorStop(0,'rgba(255,226,177,.75)');glow.addColorStop(.25,'rgba(255,202,159,.25)');glow.addColorStop(1,'rgba(255,201,160,0)');ctx.fillStyle=glow;ctx.fillRect(sx-270,sy-270,540,540);
    ellipse(sx,sy,34,34,'rgba(255,229,183,.87)');
    indexed(440,.055,500,(i,x)=>cloud(x+random(i+9)*120,170+random(i+13)*125,.5+random(i+3)*.7,.1+random(i+7)*.12));
    mountain(626,205,'#9b8790',.075,1.2);mountain(658,170,'#777a80',.13,3.1);mountain(695,136,'#596e72',.23,6.6);
    indexed(83,.32,160,(i,x)=>pine(x,661+random(i+2)*18,48+random(i+11)*74,'#56696a',i));
    ctx.fillStyle=fillGradient(0,660,0,800,[[0,'#777d69'],[1,'#47564d']]);ctx.fillRect(0,678,width,122);
    indexed(155,.62,180,(i,x)=>{
      const h=110+random(i+4)*100;pine(x,728+random(i+2)*10,h,'#394f4a',i);
      if(random(i+1)>.43) pine(x+48,737,h*.62,'#45594e',i+100);
    });
    // Utility poles and wires make the speed of the middle distance legible.
    ctx.strokeStyle='rgba(48,55,52,.55)';ctx.lineWidth=2;ctx.beginPath();
    indexed(410,.76,420,(i,x)=>{if(i===Math.floor((distance*.76-420)/410))ctx.moveTo(x,482);else ctx.lineTo(x,482);});ctx.stroke();
    indexed(410,.76,40,(i,x)=>{
      ctx.fillStyle='#4c4c43';ctx.fillRect(x-3,480,6,238);ctx.fillRect(x-30,488,60,5);
      ctx.fillStyle='#292f2c';ctx.fillRect(x-24,480,4,8);ctx.fillRect(x+20,480,4,8);
    });
    ctx.fillStyle='#879077';ctx.fillRect(0,733,width,24);
    ctx.fillStyle=fillGradient(0,755,0,900,[[0,'#5e625b'],[.08,'#444c4b'],[1,'#252e32']]);ctx.fillRect(0,755,width,145);
    ctx.fillStyle='rgba(224,200,167,.45)';ctx.fillRect(0,757,width,4);
    ctx.fillStyle='rgba(226,213,187,.45)';indexed(260,1,260,(i,x)=>ctx.fillRect(x,865,150,4));
    indexed(165,1.05,180,(i,x)=>{ctx.fillStyle='rgba(204,185,151,.4)';ctx.fillRect(x,746,2,10);ctx.fillStyle='rgba(50,58,52,.5)';ctx.fillRect(x+2,749,12,2);});
    const carScale=Math.min(1,Math.max(.32,width/1040));car(width*.48,761,carScale);
    const vignette=ctx.createRadialGradient(width*.5,420,180,width*.5,450,Math.max(width*.7,750));vignette.addColorStop(0,'rgba(16,22,32,0)');vignette.addColorStop(1,'rgba(16,22,32,.34)');ctx.fillStyle=vignette;ctx.fillRect(0,0,width,height);
    ctx.fillStyle='rgba(255,239,221,.7)';ctx.font='500 14px system-ui, sans-serif';ctx.letterSpacing='3px';ctx.fillText('EASTBOUND  /  LAST LIGHT',Math.max(30,width*.04),60);
  }
  function tick(ms) {
    const dt=last ? Math.min((ms-last)/1000,.05) : 0;last=ms;time+=dt;distance+=dt*155;
    render();requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
