<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden After Dark</title>
<style>
  :root{color-scheme:dark;--ink:#eaf6df;--muted:#9db5a0;--gold:#f7cf67;--green:#8ddd88;--panel:#172c29}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 48% -10%,#335b4c 0,#192d2b 40%,#101d20 100%);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
  button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:3px solid #ffda76;outline-offset:3px}
  .shell{max-width:1280px;margin:auto;padding:20px 24px 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:11px}.brandmark{width:38px;height:38px;display:grid;place-items:center;background:#a6e48a;border-radius:12px;box-shadow:0 6px 20px #0003;color:#173d30;font-size:22px;font-weight:900}
  .brand strong{display:block;font-size:15px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .top-actions{display:flex;gap:8px}.icon-btn,.ghost{border:1px solid #68887870;background:#ffffff0b;border-radius:10px;padding:9px 13px;font-weight:700}.icon-btn:hover,.ghost:hover{background:#ffffff18}
  .play-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
  .game-card,.side{background:#102421;border:1px solid #8bb39a35;border-radius:18px;box-shadow:0 20px 60px #0004;overflow:hidden}
  .hud{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#203b33;border-bottom:1px solid #ffffff12;min-height:63px}
  .sunbank{display:flex;align-items:center;gap:7px;border-radius:10px;background:#f6ce6324;color:#ffdb73;padding:7px 11px;font-weight:900;min-width:90px}.sun-icon{font-size:21px;line-height:1}
  .progress{flex:1;min-width:60px}.progress-label{display:flex;justify-content:space-between;color:#c4d5c1;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.track{height:7px;background:#0e2420;border-radius:8px;overflow:hidden}.track i{display:block;width:0;height:100%;background:linear-gradient(90deg,#78cf86,#e5d76c);border-radius:inherit;transition:width .25s}
  .score{font-size:12px;color:#c4d5c1;white-space:nowrap}.score b{display:block;color:white;font-size:16px;text-align:right}
  .stage{position:relative;background:#1b3a2a;line-height:0}canvas{display:block;width:100%;height:auto;aspect-ratio:960/600;touch-action:manipulation}
  .hint{padding:10px 16px;color:#a9bca9;font-size:12px;display:flex;justify-content:space-between;gap:10px;line-height:1.35}.hint b{color:#e1edd9}.hint .keys{white-space:nowrap}
  .side{padding:15px}.side h2{margin:0 0 3px;font-size:14px}.side .subtitle{font-size:11px;color:var(--muted);margin-bottom:12px}.seed-list{display:grid;gap:8px}
  .seed{position:relative;display:grid;grid-template-columns:39px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:8px;border:1px solid #ffffff18;border-radius:11px;background:#29453a;overflow:hidden}.seed:hover{border-color:#bedda6}.seed.selected{border-color:#c6f797;box-shadow:0 0 0 2px #a3e88b50;background:#355843}.seed.unavailable{opacity:.57}.seed .art{font-size:25px;text-align:center}.seed strong{font-size:12px;display:block}.seed small{font-size:10px;color:#b9ccba}.seed .cost{font-weight:800;color:#ffdb73;font-size:11px;align-self:start}.seed .cool{position:absolute;inset:0;background:#09120d99;pointer-events:none;transform-origin:bottom;transform:scaleY(0)}
  .shovel{width:100%;margin-top:10px;border:1px solid #78988963;background:#162e28;border-radius:10px;padding:9px}.shovel.selected{border-color:#f3d576;color:#f7d779}.side-note{margin:14px 1px 0;font-size:11px;line-height:1.5;color:#9db5a0}.side-note strong{color:#d4e4ce}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#102923e8,#0c1d20e8);line-height:1.4;overflow:auto}.overlay[hidden]{display:none}
  .dialog{width:min(520px,100%);max-height:100%;overflow:auto;text-align:center;padding:26px 28px;border:1px solid #b7d2b444;border-radius:18px;background:linear-gradient(160deg,#2a4c3d,#19342f);box-shadow:0 20px 60px #0008}.eyebrow{color:#c0e79c;text-transform:uppercase;font-size:10px;letter-spacing:.24em;font-weight:900}.dialog h1,.dialog h2{font-family:Georgia,serif;letter-spacing:-.035em;line-height:1.02;margin:9px 0 10px;font-size:clamp(28px,4vw,48px)}.dialog h2{font-size:32px}.dialog p{color:#c0d2bf;margin:0 auto 16px;max-width:390px;font-size:13px}.dialog .sunflower{font-size:42px;line-height:1}.dialog label{display:block;text-align:left;margin:10px auto 7px;max-width:320px;color:#b7ccba;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  .dialog input{display:block;width:100%;max-width:320px;margin:auto;background:#102a24;color:#fff;border:1px solid #93b29b66;border-radius:9px;padding:10px 12px}.dialog-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.primary{background:#b8e991;color:#173926;border:0;border-radius:10px;padding:11px 20px;font-weight:900;box-shadow:0 4px 0 #78af70}.primary:hover{background:#d0f7ae}.secondary{border:1px solid #94b99b79;background:#ffffff0a;border-radius:10px;padding:10px 15px;font-weight:700}.secondary:hover{background:#ffffff18}
  .instructions{text-align:left;max-width:390px;margin:0 auto;color:#d3e2ce;font-size:13px}.instructions li{margin:7px 0}.board{max-width:390px;margin:14px auto;text-align:left}.board-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 4px;border-bottom:1px solid #ffffff16;font-size:13px}.board-row b{color:#f9da77}.empty{padding:14px;color:#b8cabb;font-size:13px}
  @media(max-width:850px){.shell{padding:12px}.play-layout{grid-template-columns:1fr}.side{padding:12px}.side .subtitle,.side-note{display:none}.seed-list{grid-template-columns:repeat(4,minmax(0,1fr))}.seed{grid-template-columns:30px 1fr;gap:5px}.seed .cost{grid-column:2}.shovel{margin-top:8px}.hint .keys{display:none}}
  @media(max-width:500px){.top{margin-bottom:9px}.brand small{display:none}.shell{padding:8px}.top-actions button{padding:8px}.hud{padding:8px;gap:7px}.sunbank{min-width:70px;padding:5px 8px}.score{font-size:10px}.score b{font-size:13px}.seed-list{gap:4px}.seed{padding:6px 4px;display:flex;flex-direction:column;gap:1px;text-align:center}.seed .art{font-size:19px}.seed strong{font-size:10px}.seed small{display:none}.seed .cost{align-self:center}.dialog{padding:15px}.dialog h1{font-size:28px}.dialog p{font-size:12px;margin-bottom:8px}.dialog .sunflower{font-size:26px}.dialog-actions{margin-top:8px}.hint{font-size:10px;padding:7px}}
  @media(max-width:500px){.overlay{position:fixed;inset:0;z-index:20}.dialog{max-height:calc(100dvh - 36px)}}
</style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand"><div class="brandmark">✿</div><div><strong>GARDEN AFTER DARK</strong><small>A little lawn defense game</small></div></div><div class="top-actions"><button class="icon-btn" id="sound" aria-label="Toggle sound">Sound off</button><button class="icon-btn" id="pause">Pause</button></div></header>
  <div class="play-layout">
    <section class="game-card" aria-label="Game board">
      <div class="hud"><div class="sunbank"><span class="sun-icon">☼</span><span id="sun">175</span></div><div class="progress"><div class="progress-label"><span id="wave">The calm before</span><span id="time">0:00 / 1:35</span></div><div class="track"><i id="progress"></i></div></div><div class="score">SCORE<b id="score">0</b></div></div>
      <div class="stage"><canvas id="lawn" width="960" height="600" tabindex="0" aria-label="Five lane garden. Click a tile to plant and click glowing suns to collect them."></canvas><div id="overlay" class="overlay"></div></div>
      <div class="hint"><span><b>How to play:</b> Pick a seed, plant on a tile, and collect glowing suns.</span><span class="keys">1–4 select · Space pauses · Esc cancels</span></div>
    </section>
    <aside class="side"><h2>Seed tray</h2><div class="subtitle">Choose your garden defenders</div><div class="seed-list" id="seeds"></div><button id="shovel" class="shovel">♧ &nbsp; Shovel · remove a plant</button><p class="side-note"><strong>One mower per lane.</strong> It saves you once. Defend until dawn to win.</p></aside>
  </div>
</main>
<script>
/* Plan: 1. Build a five-lane lawn and seed economy. 2. Add timed waves, combat and one-use lane saves.
   3. Add menus, pause, local leaderboard and feedback. 4. Keep the whole game self-contained. */
(() => {
  'use strict';
  const canvas=document.querySelector('#lawn'), ctx=canvas.getContext('2d');
  const $=s=>document.querySelector(s), overlay=$('#overlay'), sunEl=$('#sun'), scoreEl=$('#score'), waveEl=$('#wave'), timeEl=$('#time'), progressEl=$('#progress');
  const W=960,H=600, GX=162,GY=94,CW=83,CH=86,ROWS=5,COLS=9,DURATION=95;
  const specs=[
    {id:'sunflower',name:'Sunbloom',desc:'Makes sunshine',icon:'🌻',cost:50,cool:5,hp:80},
    {id:'pea',name:'Peashooter',desc:'Shoots peas',icon:'🌱',cost:100,cool:4,hp:85},
    {id:'wall',name:'Wallnut',desc:'Sturdy shield',icon:'🥜',cost:50,cool:9,hp:290},
    {id:'frost',name:'Frost pea',desc:'Slows zombies',icon:'❄️',cost:150,cool:7,hp:85}
  ];
  const state={mode:'menu',sun:175,score:0,elapsed:0,selected:'pea',shovel:false,plants:[],zombies:[],bullets:[],suns:[],particles:[],mowers:[true,true,true,true,true],cool:{},spawn:8,sunTimer:5,warning:'',warningFor:0,player:'Gardener',sound:false};
  let prev=0,audio=null,boardReturn='menu',endTitle='';
  const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(key,fallback){try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
  function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
  state.player=load('garden-player','Gardener');
  function beep(f=500,kind='sine',duration=.09){if(!state.sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.value=f;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
  function makeSeeds(){const wrap=$('#seeds');wrap.innerHTML='';specs.forEach((s,i)=>{const b=document.createElement('button');b.className='seed';b.dataset.id=s.id;b.innerHTML=`<span class="art">${s.icon}</span><span><strong>${s.name}</strong><small>${i+1} · ${s.desc}</small></span><span class="cost">☼ ${s.cost}</span><span class="cool"></span>`;b.addEventListener('click',()=>select(s.id));wrap.appendChild(b)});updateHUD()}
  function select(id){state.selected=id;state.shovel=false;updateHUD();beep(560)}
  function updateHUD(){sunEl.textContent=Math.floor(state.sun);scoreEl.textContent=state.score.toLocaleString();const sec=Math.floor(state.elapsed);timeEl.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / 1:35`;progressEl.style.width=`${Math.min(100,state.elapsed/DURATION*100)}%`;waveEl.textContent=state.elapsed<8?'The calm before':state.elapsed<30?'Wave 1 · gathering':state.elapsed<60?'Wave 2 · growing':state.elapsed<DURATION?'Final wave · hold on':'Clear the lawn';document.querySelectorAll('.seed').forEach(b=>{const s=specs.find(x=>x.id===b.dataset.id),remaining=Math.max(0,(state.cool[s.id]||0)-state.elapsed);b.classList.toggle('selected',state.selected===s.id&&!state.shovel);b.classList.toggle('unavailable',state.sun<s.cost||remaining>0);b.querySelector('.cool').style.transform=`scaleY(${remaining/s.cool})`;b.title=remaining>0?`${s.name} ready in ${Math.ceil(remaining)}s`:`${s.name}: ${s.cost} sun`});$('#shovel').classList.toggle('selected',state.shovel);$('#pause').textContent=state.mode==='paused'?'Resume':'Pause'}
  function show(html){overlay.innerHTML=html;overlay.hidden=false}
  function button(id,fn){const el=document.getElementById(id);if(el)el.addEventListener('click',fn)}
  function menu(){state.mode='menu';show(`<div class="dialog"><div class="sunflower">🌻</div><div class="eyebrow">A little lawn defense game</div><h1>Garden<br>After Dark</h1><p>Night is falling, and the neighbors are getting hungry. Grow a tiny army and protect your lawn until dawn.</p><label for="name">Gardener's name</label><input id="name" maxlength="18" autocomplete="nickname" value="${escapeText(state.player)}"><div class="dialog-actions"><button id="start" class="primary">Start a run →</button><button id="how" class="secondary">How to play</button><button id="leaders" class="secondary">Leaderboard</button></div></div>`);button('start',()=>{state.player=($('#name').value.trim()||'Gardener').slice(0,18);save('garden-player',state.player);start()});button('how',how);button('leaders',()=>leaderboard('menu'));updateHUD()}
  function how(){show(`<div class="dialog"><div class="eyebrow">Field guide</div><h2>Grow. Gather. Guard.</h2><ul class="instructions"><li>Choose a seed, then click an empty square to plant it.</li><li>Click glowing suns to collect them. Sunblooms grow more.</li><li>Peashooters attack in their lane; frost peas also slow.</li><li>Wallnuts buy time. Use the shovel to clear a square.</li><li>Each mower saves its lane once. Survive until dawn!</li></ul><div class="dialog-actions"><button id="back" class="primary">Got it</button></div></div>`);button('back',menu)}
  function leaderboard(from){boardReturn=from;const entries=load('garden-scores',[]);const rows=Array.isArray(entries)?entries.slice(0,8):[];show(`<div class="dialog"><div class="eyebrow">Local garden records</div><h2>Leaderboard</h2><p>Saved on this device. Every lawn has a story.</p><div class="board">${rows.length?rows.map((r,i)=>`<div class="board-row"><span>${i+1}.</span><span>${escapeText(r.name)} <small>· ${r.won?'dawn':'fallen'}</small></span><b>${Number(r.score||0).toLocaleString()}</b></div>`).join(''):'<div class="empty">No runs yet. Your first garden awaits.</div>'}</div><div class="dialog-actions"><button id="back" class="primary">Back</button></div></div>`);button('back',()=>boardReturn==='end'?endScreen():menu())}
  function start(){Object.assign(state,{mode:'playing',sun:175,score:0,elapsed:0,selected:'pea',shovel:false,plants:[],zombies:[],bullets:[],suns:[],particles:[],mowers:[true,true,true,true,true],cool:{},spawn:8,sunTimer:4,warning:'',warningFor:0});overlay.hidden=true;prev=0;updateHUD();beep(720)}
  function pause(){if(state.mode==='playing'){state.mode='paused';show(`<div class="dialog"><div class="eyebrow">Take a breath</div><h2>Garden paused</h2><p>Your plants will wait right here.</p><div class="dialog-actions"><button id="resume" class="primary">Resume</button><button id="quit" class="secondary">Return to menu</button></div></div>`);button('resume',pause);button('quit',menu)}else if(state.mode==='paused'){state.mode='playing';overlay.hidden=true;prev=0}updateHUD()}
  function finish(won){if(state.mode!=='playing')return;state.mode='end';endTitle=won?'Dawn at last':'The garden fell';const final=Math.round(state.score+state.elapsed*2+(won?500:0));state.score=final;const entries=load('garden-scores',[]);const arr=Array.isArray(entries)?entries:[];arr.push({name:state.player,score:final,won,date:new Date().toISOString()});arr.sort((a,b)=>b.score-a.score);save('garden-scores',arr.slice(0,20));updateHUD();beep(won?740:210,'sine',.3);endScreen()}
  function endScreen(){show(`<div class="dialog"><div class="sunflower">${endTitle==='Dawn at last'?'🌅':'🌱'}</div><div class="eyebrow">${endTitle==='Dawn at last'?'You made it':'Good fight, gardener'}</div><h2>${endTitle}</h2><p>${escapeText(state.player)}, you earned <strong>${state.score.toLocaleString()} points</strong> and held the lawn for ${Math.floor(state.elapsed)} seconds.</p><div class="dialog-actions"><button id="again" class="primary">Play again</button><button id="leaders" class="secondary">Leaderboard</button><button id="menu" class="secondary">Menu</button></div></div>`);button('again',start);button('leaders',()=>leaderboard('end'));button('menu',menu)}
  function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  function burst(x,y,color,n=8){for(let i=0;i<n;i++)state.particles.push({x,y,vx:rand(-45,45),vy:rand(-85,-25),life:rand(.4,.9),color})}
  function click(e){if(state.mode!=='playing')return;const {x,y}=point(e);for(let i=state.suns.length-1;i>=0;i--){const s=state.suns[i];if(Math.hypot(x-s.x,y-s.y)<28){state.suns.splice(i,1);state.sun+=25;burst(s.x,s.y,'#ffe48b');beep(860);updateHUD();return}}
    const col=Math.floor((x-GX)/CW),row=Math.floor((y-GY)/CH);if(col<0||col>=COLS||row<0||row>=ROWS)return;const existing=state.plants.find(p=>p.row===row&&p.col===col);
    if(state.shovel){if(existing){state.plants.splice(state.plants.indexOf(existing),1);burst(x,y,'#bbd89c');beep(300)}state.shovel=false;updateHUD();return}
    const s=specs.find(s=>s.id===state.selected);if(existing){message('That tile is already planted');return}if(state.sun<s.cost){message('Collect more sunshine');return}if((state.cool[s.id]||0)>state.elapsed){message('That seed is still recharging');return}
    state.sun-=s.cost;state.cool[s.id]=state.elapsed+s.cool;state.plants.push({type:s.id,row,col,hp:s.hp,max:s.hp,fire:rand(.3,1),produce:8+rand(0,2),phase:rand(0,6)});burst(GX+(col+.5)*CW,GY+(row+.78)*CH,'#a8dc86');beep(610);updateHUD()
  }
  function message(s){state.warning=s;state.warningFor=2;beep(180,'triangle')}
  function spawnZombie(){const row=Math.floor(rand(0,ROWS)),t=state.elapsed;const tough=t>28&&Math.random()<.24;state.zombies.push({row,x:W+22,hp:tough?14:8,max:tough?14:8,speed:rand(13,19)+(t>55?3:0),slow:0,bite:0,phase:rand(0,6),tough});}
  function defeat(z){if(z.dead)return;z.dead=true;state.score+=z.tough?125:75;burst(z.x,GY+(z.row+.58)*CH,'#c4d9a5',8);beep(245,'triangle',.05)}
  function update(dt){state.elapsed+=dt;state.warningFor=Math.max(0,state.warningFor-dt);state.sunTimer-=dt;if(state.sunTimer<=0){state.suns.push({x:rand(GX+35,GX+COLS*CW-35),y:38,target:rand(GY+24,GY+CH*4.8),life:11,fall:true,phase:rand(0,6)});state.sunTimer=7.5}
    if(state.elapsed<DURATION){state.spawn-=dt;if(state.spawn<=0){spawnZombie();if(state.elapsed>65&&Math.random()<.3)spawnZombie();state.spawn=Math.max(3.7,8-state.elapsed*.045)+rand(-.5,.5)}}
    for(const p of state.plants){if(p.type==='sunflower'){p.produce-=dt;if(p.produce<=0){state.suns.push({x:GX+(p.col+.5)*CW+rand(-16,16),y:GY+(p.row+.34)*CH,target:0,life:11,fall:false,phase:rand(0,6)});p.produce=11}}else if(p.type==='pea'||p.type==='frost'){p.fire-=dt;if(p.fire<=0&&state.zombies.some(z=>z.row===p.row&&z.x>GX+(p.col+.5)*CW)){state.bullets.push({row:p.row,x:GX+(p.col+.7)*CW,y:GY+p.row*CH+31,type:p.type});p.fire=p.type==='frost'?1.25:1.05;beep(420,'sine',.03)}}}
    for(const b of state.bullets){b.x+=dt*280;const z=state.zombies.find(z=>z.row===b.row&&Math.abs(z.x-b.x)<25&&z.hp>0);if(z){z.hp-=1;if(b.type==='frost')z.slow=3;burst(b.x,b.y,b.type==='frost'?'#8ce4ec':'#c5ed92',3);b.dead=true}if(b.x>W+30)b.dead=true}state.bullets=state.bullets.filter(b=>!b.dead);
    for(const z of state.zombies){if(z.hp<=0){defeat(z);continue}z.slow=Math.max(0,z.slow-dt);const p=state.plants.find(p=>p.row===z.row&&!p.dead&&Math.abs(z.x-(GX+(p.col+.55)*CW))<30);if(p){p.hp-=dt*25;z.bite+=dt;if(p.hp<=0){burst(GX+(p.col+.5)*CW,GY+(p.row+.6)*CH,'#9ad183');p.dead=true}}else z.x-=z.speed*(z.slow>0?.55:1)*dt;
      if(z.x<GX-30){if(state.mowers[z.row]){state.mowers[z.row]=false;for(const other of state.zombies)if(other.row===z.row)other.hp=0;message('Mower saved lane '+(z.row+1));burst(GX-20,GY+(z.row+.7)*CH,'#f3cd68',18)}else{finish(false);return}}
      if(z.hp<=0)defeat(z)}
    state.plants=state.plants.filter(p=>!p.dead);state.zombies=state.zombies.filter(z=>!z.dead);for(const s of state.suns){s.life-=dt;if(s.fall&&s.y<s.target)s.y=Math.min(s.target,s.y+dt*45)}state.suns=state.suns.filter(s=>s.life>0);for(const p of state.particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=110*dt}state.particles=state.particles.filter(p=>p.life>0);if(state.elapsed>=DURATION&&state.zombies.length===0)finish(true);updateHUD()}
  function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
  function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
  function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
  function leaf(x,y,rotation,color){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ellipse(0,0,15,6,color);ctx.restore()}
  function drawPlant(p){const x=GX+(p.col+.5)*CW,y=GY+(p.row+.77)*CH;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(state.elapsed*2+p.phase)*.025);ellipse(0,4,27,7,'#183c2988');if(p.type==='wall'){round(-23,-57,46,60,19,'#9d6540');round(-19,-54,38,51,16,'#bd8755');ellipse(-8,-31,3,5,'#342b28');ellipse(8,-31,3,5,'#342b28');ctx.strokeStyle='#8f613e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,-48);ctx.lineTo(-7,-40);ctx.lineTo(-13,-36);ctx.moveTo(12,-18);ctx.lineTo(5,-12);ctx.stroke()}else{round(-4,-43,8,42,4,'#477f38');leaf(-13,-7,-.4,'#65a44b');leaf(13,-12,.4,'#79bc56');if(p.type==='sunflower'){for(let i=0;i<10;i++){const a=i*Math.PI/5;ellipse(Math.cos(a)*22,-55+Math.sin(a)*22,7,11,'#f5c95b')}circle(0,-55,18,'#a36e3c');circle(-6,-58,2.5,'#2d2924');circle(6,-58,2.5,'#2d2924');ctx.strokeStyle='#463525';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-55,7,.2,Math.PI-.2);ctx.stroke()}else{const frost=p.type==='frost';ellipse(-2,-49,23,20,frost?'#83dbe1':'#78c76a');ellipse(17,-48,17,11,frost?'#65c7d3':'#59ad50');ellipse(26,-48,8,8,frost?'#317e89':'#317b3c');circle(-6,-55,3,'#163b34');circle(-5,-56,1,'#fff');leaf(-12,-65,-.5,frost?'#afeff0':'#9be186')}}if(p.hp<p.max*.75){round(-25,-77,50,4,2,'#223f2f');round(-25,-77,50*clamp(p.hp/p.max,0,1),4,2,'#c9e885')}ctx.restore()}
  function drawZombie(z){const y=GY+(z.row+.72)*CH;ctx.save();ctx.translate(z.x,y);const wobble=Math.sin(state.elapsed*6+z.phase)*3;ellipse(0,10,27,7,'#17292075');ctx.strokeStyle='#4a4f49';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(-10+wobble,9);ctx.moveTo(7,-4);ctx.lineTo(12-wobble,9);ctx.stroke();round(-17,-49,33,47,9,z.slow>0?'#566e72':'#74655d');ctx.fillStyle='#ddd4bb';ctx.fillRect(-3,-48,5,33);ctx.fillStyle='#ac5f4b';ctx.fillRect(-4,-41,7,13);ctx.strokeStyle='#8a9a75';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-12,-37);ctx.lineTo(-30,-29+wobble);ctx.moveTo(12,-37);ctx.lineTo(-8,-23-wobble);ctx.stroke();round(-17,-75,36,30,10,z.slow>0?'#a1c9bd':'#a8ba8e');circle(-7,-62,3,'#f1eed4');circle(7,-62,3,'#f1eed4');circle(-7,-62,1.5,'#30372e');circle(7,-62,1.5,'#30372e');ctx.strokeStyle='#4d554a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-52);ctx.lineTo(8,-52);ctx.stroke();if(z.tough){ctx.fillStyle='#db9b51';ctx.beginPath();ctx.moveTo(-19,-72);ctx.lineTo(-2,-101);ctx.lineTo(16,-72);ctx.closePath();ctx.fill();ctx.fillStyle='#f0cf88';ctx.fillRect(-15,-77,30,4)}ctx.restore()}
  function drawSun(s){const y=s.y+Math.sin(state.elapsed*3+s.phase)*3;ctx.save();ctx.translate(s.x,y);ctx.globalAlpha=clamp(s.life/1.5,0,1);const g=ctx.createRadialGradient(0,0,3,0,0,35);g.addColorStop(0,'#ffeab5aa');g.addColorStop(1,'#ffe16a00');circle(0,0,35,g);for(let i=0;i<10;i++){ctx.save();ctx.rotate(i*Math.PI/5+state.elapsed*.3);round(-3,-24,6,9,3,'#ffd871');ctx.restore()}circle(0,0,15,'#ffcf58');circle(-5,-2,2,'#90612a');circle(5,-2,2,'#90612a');ctx.restore()}
  function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#b3d6b8');sky.addColorStop(.2,'#6fae89');sky.addColorStop(1,'#387348');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#7fae8a';ctx.fillRect(0,76,W,18);ctx.fillStyle='#426c4e';ctx.fillRect(0,535,W,65);
    // garden edges and five alternating, gently textured lanes
    round(150,82,764,454,12,'#426746');for(let r=0;r<ROWS;r++){for(let c=0;c<COLS;c++){const x=GX+c*CW,y=GY+r*CH;ctx.fillStyle=(r+c)%2?'#7ca75d':'#88b568';ctx.fillRect(x,y,CW-2,CH-2);ctx.fillStyle='#d1e7a514';for(let j=0;j<3;j++)ctx.fillRect(x+13+j*21,y+16+(j*19+r*7+c*3)%54,3,5)}}
    ctx.fillStyle='#c2a47d';ctx.fillRect(0,GY,148,CH*5);ctx.fillStyle='#a88866';for(let y=GY;y<GY+CH*5;y+=43)ctx.fillRect(0,y,148,2);ctx.fillStyle='#667958';ctx.fillRect(910,GY,50,CH*5);
    for(let r=0;r<ROWS;r++){const y=GY+(r+.72)*CH;if(state.mowers[r]){round(105,y-16,39,20,5,'#dc8352');circle(112,y+5,7,'#313d35');circle(136,y+5,7,'#313d35');ctx.strokeStyle='#d6d8ba';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(109,y-14);ctx.lineTo(96,y-30);ctx.stroke()}}
    for(let r=0;r<ROWS;r++){state.plants.filter(p=>p.row===r).forEach(drawPlant);state.zombies.filter(z=>z.row===r).forEach(drawZombie);state.bullets.filter(b=>b.row===r).forEach(b=>{circle(b.x,b.y,7,b.type==='frost'?'#a5ecf2':'#b4eb7e');circle(b.x-2,b.y-2,2,'#fff9')})}state.suns.forEach(drawSun);state.particles.forEach(p=>{ctx.globalAlpha=clamp(p.life,0,1);circle(p.x,p.y,3,p.color)});ctx.globalAlpha=1;
    ctx.fillStyle='#f0e8c9aa';ctx.font='bold 12px system-ui';ctx.fillText('HOME',39,70);ctx.textAlign='right';ctx.fillText('THE WOODS',920,70);ctx.textAlign='left';if(state.warningFor>0){ctx.font='bold 15px system-ui';const w=ctx.measureText(state.warning).width+32;round(W/2-w/2,20,w,34,10,'#18372eea');ctx.fillStyle='#fff3cf';ctx.textAlign='center';ctx.fillText(state.warning,W/2,42);ctx.textAlign='left'}}
  function frame(ms){const dt=prev?Math.min((ms-prev)/1000,.05):0;prev=ms;if(state.mode==='playing')update(dt);draw();requestAnimationFrame(frame)}
  canvas.addEventListener('pointerdown',click);$('#pause').addEventListener('click',pause);$('#shovel').addEventListener('click',()=>{state.shovel=!state.shovel;updateHUD()});$('#sound').addEventListener('click',()=>{state.sound=!state.sound;$('#sound').textContent=state.sound?'Sound on':'Sound off';beep(600)});
  document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(e.code==='Space'){e.preventDefault();pause()}else if(e.key>='1'&&e.key<='4')select(specs[Number(e.key)-1].id);else if(e.key==='Escape'){state.shovel=false;updateHUD()}});
  makeSeeds();menu();requestAnimationFrame(frame);
})();
</script>
</body>
