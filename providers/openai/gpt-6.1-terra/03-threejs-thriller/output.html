<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight in the Graveyard</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b17;color:#eee9df;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 53%,transparent 26%,#07081144 70%,#05060dd9 115%),linear-gradient(180deg,#05071291,transparent 22%,transparent 68%,#050711c9)}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:clamp(20px,3vw,42px);pointer-events:none}.kicker{font-size:10px;font-weight:800;letter-spacing:.3em;color:#e8c99e;text-transform:uppercase}.title{margin:8px 0 0;font:400 clamp(28px,4vw,56px)/.94 Georgia,serif;letter-spacing:-.04em;text-shadow:0 3px 18px #000}.title em{font-weight:400;color:#d8aa81}.top-right{font-size:10px;letter-spacing:.18em;color:#d9d7d0;text-align:right;line-height:1.7;text-transform:uppercase}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:20px clamp(20px,3vw,42px) clamp(20px,3vw,38px);display:flex;align-items:end;justify-content:space-between;gap:20px}.cast{font-size:10px;line-height:1.8;letter-spacing:.15em;text-transform:uppercase;color:#d9d7ce}.cast b{display:block;color:#edc59f;font-size:9px;letter-spacing:.25em}.controls{display:flex;align-items:center;gap:8px}button{border:1px solid #ddd3bd66;color:#f7f2e9;background:#111523a8;padding:11px 15px;border-radius:30px;font:700 11px system-ui;letter-spacing:.05em;cursor:pointer;backdrop-filter:blur(10px)}button:hover{background:#d7b99d;color:#17151a}button:focus-visible{outline:2px solid white;outline-offset:3px}.play{background:#e3c09c;color:#19151b;border-color:#e3c09c;min-width:105px}.status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:500px;text-align:center;line-height:1.5;color:#f6d9b7}.status:empty{display:none}.timeline{position:absolute;bottom:0;left:0;right:0;height:3px;background:#ffffff20}.timeline i{display:block;width:0;height:100%;background:#e5bd93}.hint{position:absolute;right:42px;bottom:98px;color:#ffffff80;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  @media(max-width:650px){.top{padding:20px}.top-right{display:none}.bottom{padding:16px 20px 22px;display:block}.cast{font-size:9px;max-width:90%;margin-bottom:12px}.controls{gap:6px}button{padding:9px 12px}.hint{display:none}}
</style>
</head>
<body>
<div id="view"></div><div class="vignette"></div>
<header class="top"><div><div class="kicker">A moonlit dance film</div><h1 class="title">Midnight<br><em>in the graveyard.</em></h1></div><div class="top-right">An ensemble in motion<br>16-second choreography loop</div></header>
<div class="status" id="status" role="status"></div>
<footer class="bottom"><div class="cast"><b>Starring</b>Michael Jackson &nbsp;·&nbsp; Pepe the Frog<br>Donald Trump &nbsp;·&nbsp; Elon Musk</div><div class="controls"><button class="play" id="play">Ⅱ &nbsp; Pause</button><button id="camera">Camera: cinema</button><button id="sound">Sound: off</button></div></footer><div class="hint">Space to pause &nbsp; · &nbsp; C to change camera</div><div class="timeline"><i id="progress"></i></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  const status=document.getElementById('status');
  if(typeof THREE==='undefined'){status.textContent='The scene needs an internet connection to load Three.js. Please reconnect and refresh.';return}
  const mount=document.getElementById('view');
  let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'})}catch(e){status.textContent='This browser could not start WebGL. Please enable hardware acceleration and reload.';return}
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color('#101728');scene.fog=new THREE.FogExp2('#121b2b',.026);
  const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,150);
  function fitDistance(){return Math.max(15.3,5.1/(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect))}
  camera.position.set(0,3.5,fitDistance());
  const hemi=new THREE.HemisphereLight('#b7d3ee','#342334',1.25);scene.add(hemi);
  const moonlight=new THREE.DirectionalLight('#c6d9ff',2.25);moonlight.position.set(-5,10,5);moonlight.castShadow=true;moonlight.shadow.mapSize.set(2048,2048);moonlight.shadow.camera.left=-12;moonlight.shadow.camera.right=12;moonlight.shadow.camera.top=12;moonlight.shadow.camera.bottom=-12;moonlight.shadow.camera.near=.5;moonlight.shadow.camera.far=35;moonlight.shadow.bias=-.0003;scene.add(moonlight);
  const warm=new THREE.SpotLight('#e5a774',110,32,Math.PI/4,.7,1.5);warm.position.set(2,7,6);warm.target.position.set(0,1,0);scene.add(warm,warm.target);
  const rim=new THREE.DirectionalLight('#718fcf',2.3);rim.position.set(2,5,-8);scene.add(rim);
  const mat=(color,roughness=.75,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
  const materials={earth:mat('#3b423b'),stone:mat('#5b6260'),stoneLight:mat('#767c77'),black:mat('#171b20'),hair:mat('#181716'),white:mat('#e8e1d0'),eye:mat('#111619',.35),shoe:mat('#1a1b1d',.35),gold:mat('#c5ae7e',.4,.45),branch:mat('#252c2a')};
  function mesh(geometry,material,parent,x=0,y=0,z=0){const o=new THREE.Mesh(geometry,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
  function box(parent,w,h,d,material,x=0,y=0,z=0){return mesh(new THREE.BoxGeometry(w,h,d),material,parent,x,y,z)}
  function ball(parent,rx,ry,rz,material,x=0,y=0,z=0){const o=mesh(new THREE.SphereGeometry(1,20,14),material,parent,x,y,z);o.scale.set(rx,ry,rz);return o}
  function cylinder(parent,rt,rb,h,material,x=0,y=0,z=0){return mesh(new THREE.CylinderGeometry(rt,rb,h,12),material,parent,x,y,z)}
  function lineTube(parent,points,r,material){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return mesh(new THREE.TubeGeometry(curve,20,r,6,false),material,parent)}
  function glowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const q=c.getContext('2d'),g=q.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,246,218,.75)');g.addColorStop(.22,'rgba(211,226,255,.28)');g.addColorStop(1,'rgba(190,212,255,0)');q.fillStyle=g;q.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
  const glow=glowTexture();
  function sprite(parent,color,x,y,z,s,opacity){const o=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color,transparent:true,opacity,depthWrite:false,blending:THREE.AdditiveBlending}));o.position.set(x,y,z);o.scale.set(s,s,1);parent.add(o);return o}
  // Moon, stars and the irregular silhouette of an old cemetery.
  const moon=mesh(new THREE.CircleGeometry(1.08,64),new THREE.MeshBasicMaterial({color:'#dfebf1'}),scene,-7.8,7.3,-29);moon.castShadow=false;moon.receiveShadow=false;sprite(scene,'#b5cdff',-7.8,7.3,-29,8,.4);
  const starPositions=[];for(let i=0;i<240;i++)starPositions.push((Math.random()-.5)*90,5+Math.random()*23,-36-Math.random()*16);const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:'#b8c8df',size:.045,transparent:true,opacity:.55})));
  const ground=mesh(new THREE.PlaneGeometry(100,100),materials.earth,scene,0,-.025,0);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.castShadow=false;
  const stage=mesh(new THREE.CircleGeometry(6.7,64),mat('#596155'),scene,0,-.012,0);stage.rotation.x=-Math.PI/2;stage.castShadow=false;
  const ring=mesh(new THREE.RingGeometry(6.45,6.53,80),mat('#8b8c74'),scene,0,-.006,0);ring.rotation.x=-Math.PI/2;ring.castShadow=false;
  function grave(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=(Math.random()-.5)*.35;g.scale.setScalar(s);scene.add(g);box(g,.68,.88,.23,materials.stone,0,.49,0);ball(g,.34,.21,.12,materials.stone,0,.94,0);box(g,.73,.12,.31,materials.stoneLight,0,.06,0);box(g,.055,.25,.018,materials.stoneLight,0,.66,.125);box(g,.18,.055,.018,materials.stoneLight,0,.69,.125);return g}
  [[-9,-4,1.2],[-7,-6,.8],[-5.8,-8,1.05],[-3.8,-8.7,.7],[-1.5,-10,.9],[1,-9.3,.8],[3,-8.5,1],[5.3,-7.6,.75],[7.5,-6,1.2],[9,-3.5,.95],[-10,1,.8],[10,1,.8],[-8,4,.65],[8,4,.7]].forEach(a=>grave(...a));
  function tree(x,z,s){const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);scene.add(t);const trunk=cylinder(t,.13,.24,3.3,materials.branch,0,1.65,0);trunk.rotation.z=.08;for(const [dx,dy,len,angle] of [[-.4,2.6,1.4,-.7],[.42,2.55,1.6,.75],[-.2,3.25,1.25,-.35],[.55,3.3,1.1,1.05],[-.55,3.45,.9,-1.1]]){const b=cylinder(t,.025,.075,len,materials.branch,dx,dy,0);b.rotation.z=angle}return t}
  tree(-11,-7,1.6);tree(11,-8,1.7);tree(-14,-15,1.5);tree(14,-16,1.6);tree(-7,-16,1.1);tree(5,-17,1.4);
  for(let i=-12;i<=12;i++){const x=i*1.15;const post=cylinder(scene,.055,.055,1.4,materials.black,x,.7,-13);post.castShadow=false;const tip=mesh(new THREE.ConeGeometry(.11,.24,6),materials.black,scene,x,1.52,-13);tip.castShadow=false}box(scene,28,.07,.07,materials.black,0,.45,-13);box(scene,28,.07,.07,materials.black,0,1.15,-13);
  for(let i=0;i<80;i++){const x=(Math.random()-.5)*30,z=(Math.random()-.5)*22;if(Math.hypot(x,z)<6.7)continue;const blade=mesh(new THREE.ConeGeometry(.08,.23,4),mat(i%2?'#56634d':'#47584a'),scene,x,.1,z);blade.rotation.z=(Math.random()-.5)*.5}
  const fog=[];for(let i=0;i<14;i++){const f=sprite(scene,'#879dbd',(Math.random()-.5)*19,.25+Math.random()*.75,-3-Math.random()*9,3+Math.random()*3,.05);f.scale.y*=.22;fog.push({sprite:f,speed:.08+Math.random()*.09})}
  // A compact articulated cast, built from geometry so the whole scene is self-contained.
  function character(type,x){
    const root=new THREE.Group();root.position.set(x,0,0);scene.add(root);const body=new THREE.Group();body.position.y=.93;root.add(body);
    const isMJ=type==='michael',isPepe=type==='pepe',isTrump=type==='trump';
    const skin=mat(isPepe?'#6fa94f':isMJ?'#ba9077':isTrump?'#dba27d':'#d0ac94');
    const outfit=mat(isMJ?'#b3292b':isPepe?'#7291ab':isTrump?'#243248':'#252a32');
    const pants=mat(isMJ?'#1c1d21':isPepe?'#565e62':isTrump?'#222c3b':'#222329');
    const torso=cylinder(body,.36,.28,.75,outfit,0,.39,0);torso.scale.z=.68;
    if(!isPepe){box(body,.30,.57,.025,materials.white,0,.40,.225);if(isTrump){const tie=box(body,.085,.40,.03,mat('#aa2b33'),0,.38,.246);tie.rotation.z=.025}else if(isMJ){const v1=box(body,.11,.58,.03,materials.black,-.20,.47,.23);v1.rotation.z=-.52;const v2=box(body,.11,.58,.03,materials.black,.20,.47,.23);v2.rotation.z=.52}else{box(body,.22,.53,.03,mat('#30383c'),0,.40,.244)}}
    else{box(body,.42,.30,.025,mat('#d4d7c3'),0,.43,.23)}
    cylinder(body,.11,.11,.20,skin,0,.84,0);
    const head=new THREE.Group();head.position.set(0,1.12,0);body.add(head);
    if(isPepe){ball(head,.35,.29,.26,skin,0,0,0);ball(head,.13,.14,.12,skin,-.22,.20,.035);ball(head,.13,.14,.12,skin,.22,.20,.035);ball(head,.087,.09,.06,materials.white,-.22,.22,.13);ball(head,.087,.09,.06,materials.white,.22,.22,.13);ball(head,.035,.046,.025,materials.eye,-.22,.22,.19);ball(head,.035,.046,.025,materials.eye,.22,.22,.19);ball(head,.26,.11,.08,mat('#91bf69'),0,-.12,.22);lineTube(head,[[-.23,-.10,.283],[-.11,-.15,.30],[0,-.17,.31],[.11,-.15,.30],[.23,-.10,.283]],.012,mat('#4a583e'))}
    else{
      ball(head,.245,.31,.22,skin,0,0,0);ball(head,.07,.09,.055,skin,-.25,-.01,0);ball(head,.07,.09,.055,skin,.25,-.01,0);
      ball(head,.072,.039,.025,materials.white,-.10,.045,.198);ball(head,.072,.039,.025,materials.white,.10,.045,.198);ball(head,.027,.028,.022,materials.eye,-.10,.045,.224);ball(head,.027,.028,.022,materials.eye,.10,.045,.224);ball(head,.045,.075,.045,skin,0,-.035,.23);lineTube(head,[[-.085,-.15,.205],[0,-.17,.22],[.085,-.15,.205]],.01,mat(isMJ?'#704a42':'#795347'));
      const brow=mat(isTrump?'#a68352':'#3a2a26');box(head,.13,.025,.025,brow,-.1,.105,.205);box(head,.13,.025,.025,brow,.1,.105,.205);
      if(isMJ){for(let i=0;i<12;i++){const a=i*Math.PI*2/12;ball(head,.085,.13,.09,materials.hair,Math.cos(a)*.23,.11+Math.sin(a)*.09,Math.sin(a)*.15-.04)}cylinder(head,.27,.27,.12,materials.black,0,.34,0);const brim=cylinder(head,.39,.39,.035,materials.black,0,.29,0);brim.scale.z=.8;box(head,.52,.045,.03,mat('#9f7773'),0,.30,.245)}
      else if(isTrump){const blond=mat('#c6a16a');ball(head,.25,.12,.22,blond,0,.27,-.01);const fringe=ball(head,.24,.075,.10,blond,-.035,.23,.17);fringe.rotation.z=.18;ball(head,.08,.14,.10,blond,.21,.14,-.02)}
      else{const brown=mat('#544334');ball(head,.24,.12,.21,brown,0,.26,-.02);ball(head,.19,.09,.09,brown,-.06,.22,.15);ball(head,.065,.14,.09,brown,.20,.12,-.04)}
    }
    function arm(side){const shoulder=new THREE.Group();shoulder.position.set(side*.35,.69,0);body.add(shoulder);const upper=cylinder(shoulder,.105,.09,.36,outfit,0,-.18,0);upper.scale.z=.85;const elbow=new THREE.Group();elbow.position.y=-.36;shoulder.add(elbow);const fore=cylinder(elbow,.09,.07,.30,outfit,0,-.15,0);fore.scale.z=.85;const hand=new THREE.Group();hand.position.y=-.32;elbow.add(hand);ball(hand,.085,.075,.055,skin,0,0,0);for(let i=0;i<4;i++){const finger=cylinder(hand,.015,.018,.13,skin,(i-1.5)*.036,-.105,.015);finger.rotation.x=-.35}const thumb=cylinder(hand,.02,.02,.1,skin,side*.09,-.025,.02);thumb.rotation.z=side*.8;return{shoulder,elbow,hand}}
    function leg(side){const hip=new THREE.Group();hip.position.set(side*.17,.03,0);body.add(hip);const thigh=cylinder(hip,.125,.10,.47,pants,0,-.235,0);thigh.scale.z=.85;const knee=new THREE.Group();knee.position.y=-.47;hip.add(knee);const calf=cylinder(knee,.10,.08,.43,pants,0,-.215,0);calf.scale.z=.9;box(knee,.21,.12,.34,materials.shoe,0,-.43,.08);return{hip,knee}}
    return{root,body,head,left:arm(-1),right:arm(1),legL:leg(-1),legR:leg(1),base:x,type};
  }
  const cast=[character('pepe',-4.05),character('michael',-1.35),character('trump',1.35),character('elon',4.05)];
  // Each two-second pose flows into the next: stalk, reach, claw, lean, step, and reset.
  // [lean, left arm forward, left arm out, right arm forward, right arm out, left step, right step]
  const poses=[[-.08,-1.15,-.30,-1.15,.30,.20,-.18],[.08,-1.35,-.55,-1.30,.55,-.22,.25],[.15,-.55,-1.1,-1.2,.35,.25,-.18],[-.12,-1.38,-.2,-.7,1.05,-.16,.27],[-.18,-1.4,-.35,-1.4,.35,.20,-.22],[.18,-1.4,-.3,-1.4,.3,-.2,.22],[.08,-.4,-1.25,-.55,1.25,.26,-.23],[-.06,-1.2,-.35,-1.2,.35,-.20,.20]];
  const smooth=t=>t*t*(3-2*t),mix=(a,b,t)=>a+(b-a)*t;
  function dance(t){const p=(t%16)/2,i=Math.floor(p),f=smooth(p-i),a=poses[i],b=poses[(i+1)%poses.length],v=a.map((n,j)=>mix(n,b[j],f)),beat=Math.sin(t*Math.PI*2*1.84);
    cast.forEach((c,k)=>{const sway=Math.sin(t*1.84*Math.PI+k*.08);c.root.position.x=c.base+Math.sin(t*Math.PI*.5)*.18;c.root.position.y=Math.abs(beat)*.035;c.body.rotation.z=v[0]+sway*.035;c.body.rotation.x=.06+Math.abs(beat)*.035;c.body.rotation.y=Math.sin(t*Math.PI*.5)*.12;c.head.rotation.z=-v[0]*.65+Math.sin(t*1.7+k*.2)*.035;c.head.rotation.y=Math.sin(t*.8)*.09;c.left.shoulder.rotation.set(v[1],0,v[2]);c.right.shoulder.rotation.set(v[3],0,v[4]);c.left.elbow.rotation.x=-.42+beat*.10;c.right.elbow.rotation.x=-.42-beat*.10;c.left.hand.rotation.x=-.40;c.right.hand.rotation.x=-.40;c.legL.hip.rotation.x=v[5]+beat*.06;c.legR.hip.rotation.x=v[6]-beat*.06;c.legL.knee.rotation.x=Math.max(0,-v[5])*.65;c.legR.knee.rotation.x=Math.max(0,-v[6])*.65})}
  let playing=true,cinema=true,sound=false,elapsed=0,last=0,audio,beatTimer=0;
  function percussion(){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(90,now);osc.frequency.exponentialRampToValueAtTime(42,now+.09);gain.gain.setValueAtTime(.055,now);gain.gain.exponentialRampToValueAtTime(.0001,now+.15);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+.16)}catch{}}
  function togglePlay(){playing=!playing;document.getElementById('play').innerHTML=playing?'Ⅱ &nbsp; Pause':'▶ &nbsp; Play';last=0}
  function toggleCamera(){cinema=!cinema;document.getElementById('camera').textContent='Camera: '+(cinema?'cinema':'wide')}
  document.getElementById('play').addEventListener('click',togglePlay);document.getElementById('camera').addEventListener('click',toggleCamera);document.getElementById('sound').addEventListener('click',()=>{sound=!sound;document.getElementById('sound').textContent='Sound: '+(sound?'on':'off');if(sound)percussion()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key.toLowerCase()==='c')toggleCamera()});
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.position.z=Math.max(camera.position.z,fitDistance());renderer.setSize(innerWidth,innerHeight)});
  function frame(ms){const dt=last?Math.min((ms-last)/1000,.05):0;last=ms;if(playing){elapsed+=dt;beatTimer-=dt;if(beatTimer<=0){percussion();beatTimer=.54}dance(elapsed);fog.forEach(f=>{f.sprite.position.x+=f.speed*dt;if(f.sprite.position.x>11)f.sprite.position.x=-11});document.getElementById('progress').style.width=((elapsed%16)/16*100)+'%'}
    const dist=fitDistance();const desiredX=cinema?Math.sin(elapsed*.18)*1.3:0;const desiredY=cinema?3.35+Math.sin(elapsed*.13)*.22:3.55;camera.position.lerp(new THREE.Vector3(desiredX,desiredY,dist+(cinema?Math.sin(elapsed*.11)*.55:1)),.025);camera.lookAt(0,1.25,-.4);renderer.render(scene,camera);requestAnimationFrame(frame)}
  dance(0);requestAnimationFrame(frame);
})();
</script>
