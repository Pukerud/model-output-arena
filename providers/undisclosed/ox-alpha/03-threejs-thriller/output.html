function glowTexture() {

  grad.addColorStop(0.25, "rgba(220,225,255,.55)");
  grad.addColorStop(1, "rgba(180,190,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);

}

  g.add(slab, top);
  g.traverse(o => { o.castShadow = true; o.receiveShadow = true; });
  g.position.set(x, 0, z);
  g.rotation.y = ry;
  g.scale.setScalar(s);
  g.rotation.z = (Math.sin(x * 12.9) + Math.cos(z * 7.7)) * 0.06;

}

function limb(len, thick, mat, footMat) {
  const pivot = new THREE.Group();
  const seg = new THREE.Mesh(new THREE.CapsuleGeometry(thick, len, 6, 12), mat);
  seg.position.y = -len / 2;
  seg.castShadow = true;
  pivot.add(seg);
  if (footMat) {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(thick * 2.6, thick * 0.9, thick * 4), footMat);
    foot.position.set(0, -len - thick * 0.4, thick * 1.1);
    foot.castShadow = true;
    pivot.add(foot);
  }
  return pivot;
}

function makeDancer(build) {
  const root = new THREE.Group();
  const body = new THREE.Group();
  body.position.y = 1.62;
  root.add(body);

  const parts = build(body);

  const armL = limb(0.62, 0.085, parts.armMat, parts.handMat);
  armL.position.set(0.36, 0.42, 0);
  const armR = limb(0.62, 0.085, parts.armMat, parts.handMat);
  armR.position.set(-0.36, 0.42, 0);
  const legL = limb(0.78, 0.105, parts.legMat, parts.shoeMat);
  legL.position.set(0.16, 0, 0);
  const legR = limb(0.78, 0.105, parts.legMat, parts.shoeMat);
  legR.position.set(-0.16, 0, 0);
  body.add(armL, armR, legL, legR);

  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  return {
    root, body, head: parts.head, jaw: parts.jaw || null,
    armL, armR, legL, legR,
    hat: parts.hat || null, tie: parts.tie || null, ears: parts.ears || null,
    seed: Math.random() * Math.PI * 2,
  };
}

/* ---------------- audio ---------------- */

let audioCtx = null, beatOn = false, nextNoteTime = 0, beatCount = 0;
const BPM = 118, SPB = 60 / BPM;

document.getElementById("soundBtn").addEventListener("click", (e) => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  beatOn = !beatOn;
  e.target.textContent = beatOn ? "♪ STOP BEAT" : "♪ PLAY BEAT";
  if (beatOn) nextNoteTime = audioCtx.currentTime + 0.06;
});

function scheduleBeat() {
  if (!audioCtx || !beatOn) return;
  while (nextNoteTime < audioCtx.currentTime + 0.12) {
    playBeat(nextNoteTime, beatCount);
    nextNoteTime += SPB / 2;
    beatCount++;
  }
}
function playBeat(t, count) {
  const eighth = count % 2 === 0;
  if (eighth) {
    kick(t);
    if ((count / 2) % 2 === 1) snareClap(t);
  } else if (count % 4 === 3) {
    hatTick(t);
  }
  if (count % 16 === 0) bassNote(t, count % 32 === 0 ? 41.2 : 49.0);
}
function kick(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.11);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.18);
}
function snareClap(t) {
  const buf = audioCtx.createBuffer(1, 4410, 44100);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = 0.9;
  const g = audioCtx.createGain(); g.gain.value = 0.28;
  src.connect(f).connect(g).connect(audioCtx.destination);
  src.start(t);
}
function hatTick(t) {
  const buf = audioCtx.createBuffer(1, 1470, 44100);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7500;
  const g = audioCtx.createGain(); g.gain.value = 0.1;
  src.connect(f).connect(g).connect(audioCtx.destination);
  src.start(t);
}
function bassNote(t, freq) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sawtooth";
  o.frequency.value = freq;
  const f = audioCtx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 220;
  g.gain.setValueAtTime(0.001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t + SPB * 1.6);
  o.connect(f).connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + SPB * 1.7);
}

  { name: "MOON STOMP",    dur: 8 },
];

function poseClaw(d, p, t) {
  const sw = Math.sin(p * TAU);
  const liftL = Math.max(0, Math.sin(p * TAU)), liftR = Math.max(0, Math.sin(p * TAU + Math.PI));
  d.armL.rotation.set(-2.2 + sw * 0.15, 0, 0.45 - liftL * 0.2);
  d.armR.rotation.set(-2.2 - sw * 0.15, 0, -0.45 + liftR * 0.2);
  d.armL.children[0].rotation.x = 0.9 + Math.sin(p * TAU * 2) * 0.1;
  d.armR.children[0].rotation.x = 0.9 - Math.sin(p * TAU * 2) * 0.1;
  d.legL.rotation.set(liftL * -0.9, 0, 0);
  d.legR.rotation.set(liftR * -0.9, 0, 0);
  d.body.position.y = 1.62 + Math.abs(sw) * 0.06;
  d.head.rotation.z = sw * 0.22;
  d.head.rotation.x = 0.15 + Math.sin(p * TAU * 2) * 0.06;
  d.root.rotation.y += (Math.sin(p * TAU + d.seed) * 0.12 - d.root.rotation.y) * 0.1;
  d.root.rotation.x = 0;
}

function poseShuffle(d, p, t) {
  const sw = Math.sin(p * TAU * 2);
  const pop = Math.sin(p * TAU * 4);
  d.armL.rotation.set(-0.5, 0.2, 0.9 + pop * 0.25);
  d.armR.rotation.set(-0.5, -0.2, -0.9 - pop * 0.25);
  d.armL.children[0].rotation.x = -1.1;
  d.armR.children[0].rotation.x = -1.1;
  const step = Math.sign(Math.sin(p * TAU)) ;
  d.legL.rotation.set(step > 0 ? -0.35 * npos((p * 2) % 1) : 0, 0, 0.12);
  d.legR.rotation.set(step < 0 ? -0.35 * npos((p * 2) % 1) : 0, 0, -0.12);
  d.body.position.y = 1.58 + Math.abs(sw) * 0.05;
  d.head.rotation.z = -sw * 0.14;
  d.head.rotation.x = 0.08;
  d.root.position.x = formation[dancers.indexOf(d)].x + Math.sin(p * TAU) * 0.35;
  d.root.rotation.x = 0;
}

function poseReach(d, p, t) {
  const envl = npos((p * 2) % 1), envr = npos(((p * 2) + 0.5) % 1);
  const which = Math.floor(p * 2) % 2 === 0;
  d.armL.rotation.set(which ? (-1.7 * envl) : (-0.3), 0, 0.3 + 0.5 * envl);
  d.armR.rotation.set(which ? (-0.3) : (-1.7 * envr), 0, -(0.3 + 0.5 * envr));
  d.armL.children[0].rotation.x = -0.4;
  d.armR.children[0].rotation.x = -0.4;
  d.legL.rotation.x = 0; d.legR.rotation.x = 0;
  d.legL.rotation.z = 0.1; d.legR.rotation.z = -0.1;
  d.body.position.y = 1.62;
  d.head.rotation.z = (which ? 1 : -1) * 0.25 * (which ? envl : envr);
  d.head.rotation.x = 0.1;
  d.body.rotation.y = (which ? 1 : -1) * 0.3 * (which ? envl : envr);
}

function poseHip(d, p, t) {
  const sw = Math.sin(p * TAU * 2);
  d.armL.rotation.set(-1.1, 0, 0.55);
  d.armR.rotation.set(-1.1, 0, -0.55);
  d.armL.children[0].rotation.x = -1.5;
  d.armR.children[0].rotation.x = -1.5;
  d.legL.rotation.set(0, 0, 0.14 + sw * 0.06);
  d.legR.rotation.set(0, 0, -0.14 + sw * 0.06);
  d.body.position.y = 1.6 + Math.abs(sw) * 0.04;
  d.body.rotation.z = sw * 0.1;
  d.body.rotation.y = Math.sin(p * TAU) * 0.25;
  d.head.rotation.z = -sw * 0.12;
  d.head.rotation.x = 0.05 + Math.sin(p * TAU * 2) * 0.08;
  if (d.tie) d.tie.rotation.z = sw * 0.35;
  d.root.rotation.x = 0;
}

function poseLean(d, p, t) {
  const leanEnv = npos(Math.min(p * 1.6, 1)) * (p > 0.75 ? npos((p - 0.75) * 4) : 1);
  d.root.rotation.x = -leanEnv * 0.72;
  d.armL.rotation.set(-0.35, 0, 0.25);
  d.armR.rotation.set(-0.35, 0, -0.25);
  d.armL.children[0].rotation.x = -0.2;
  d.armR.children[0].rotation.x = -0.2;
  d.legL.rotation.set(0.15, 0, 0.06);
  d.legR.rotation.set(0.15, 0, -0.06);
  d.body.position.y = 1.62;
  d.head.rotation.x = leanEnv * 0.5;
  d.head.rotation.z = 0;
  d.body.rotation.y = 0;
  if (d.hat) d.hat.rotation.z = 0.12 + leanEnv * 0.3;
}

function poseStomp(d, p, t) {
  const st = Math.abs(Math.sin(p * TAU * 4));
  const alt = Math.floor(p * 4) % 2 === 0 ? 1 : -1;
  d.armL.rotation.set(-1.4 - st * 0.5 * (alt > 0 ? 1 : 0), 0, 0.5);
  d.armR.rotation.set(-1.4 - st * 0.5 * (alt < 0 ? 1 : 0), 0, -0.5);
  d.armL.children[0].rotation.x = -0.9;
  d.armR.children[0].rotation.x = -0.9;
  d.legL.rotation.set(alt > 0 ? -st * 0.8 : 0, 0, 0);
  d.legR.rotation.set(alt < 0 ? -st * 0.8 : 0, 0, 0);
  d.body.position.y = 1.62 + st * 0.07;
  d.head.rotation.x = -0.12 - st * 0.1;
  d.head.rotation.z = Math.sin(p * TAU * 2) * 0.1;
  d.root.rotation.x = 0;
}

const POSES = [poseClaw, poseShuffle, poseReach, poseHip, poseLean, poseStomp];

function neutralize(d) {
  d.body.rotation.set(0, 0, 0);
  d.root.rotation.y *= 0.9;
  d.root.position.x += (formation[dancers.indexOf(d)].x - d.root.position.x) * 0.1;
  if (d.tie) d.tie.rotation.z *= 0.9;
  if (d.hat) d.hat.rotation.z = 0.12;
}

/* ---------------- camera ---------------- */

const SHOTS = [
  { name: "WIDE ORBIT",   fn: (t, c) => { const a = t * 0.12; c.pos.set(Math.sin(a) * 11, 2.6 + Math.sin(t * 0.31) * 0.5, Math.cos(a) * 11 + 2); c.look.set(0, 1.5, 0); } },
  { name: "LOW HERO",     fn: (t, c) => { const a = 0.35 + Math.sin(t * 0.1) * 0.25; c.pos.set(Math.sin(a) * 7, 0.9, Math.cos(a) * 7 + 1); c.look.set(0, 2.1, 0); } },
  { name: "FRONT DOLLY",  fn: (t, c) => { c.pos.set(Math.sin(t * 0.18) * 2.2, 1.7, 9.5 - Math.sin(t * 0.09) * 1.5); c.look.set(0, 1.6, 0); } },
  { name: "CLOSE-UP MJ",  fn: (t, c) => { const tgt = mj.root.position; c.pos.set(tgt.x + 1.4 + Math.sin(t * 0.4) * 0.3, 2.2, tgt.z + 2.6); c.look.set(tgt.x, 2.1, tgt.z); } },
  { name: "CRANE RISE",   fn: (t, c) => { const k = (t * 0.14) % 1; c.pos.set(Math.sin(k * Math.PI) * 6, 1.2 + k * 6.5, 10 - k * 4); c.look.set(0, 1.4, 0); } },
  { name: "PEPE & TRUMP", fn: (t, c) => { const a = pepe.root.position, b = trump.root.position; const mx = (a.x + b.x) / 2; c.pos.set(mx + 2.2, 1.9, 4.6 + Math.sin(t * 0.3) * 0.5); c.look.set(mx, 1.8, 0); } },
];
let shotIdx = 0, shotTimer = 0;
const SHOT_LEN = 8;
const camPos = new THREE.Vector3(0, 3, 12);
const camLook = new THREE.Vector3(0, 1.5, 0);

/* ---------------- main loop ---------------- */

const clock = new THREE.Clock();
let songTime = 0;
let lightning = 0, nextBolt = 6 + Math.random() * 8;
const titleEl = document.getElementById("title");
setTimeout(() => { titleEl.style.opacity = 0; }, 5200);
const camLabel = document.getElementById("camName");

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  songTime += dt;

  scheduleBeat();

  const totalBeats = MOVES.reduce((s, m) => s + m.dur, 0);
  let beatPos = (songTime / SPB) % totalBeats;
  let mi = 0;
  for (const m of MOVES) {
    if (beatPos < m.dur) break;
    beatPos -= m.dur; mi++;
  }
  const move = MOVES[mi];
  const p = beatPos / move.dur;

  dancers.forEach((d, i) => {
    POSES[mi](d, p, songTime + d.seed);
    if (POSES[mi] !== poseLean && POSES[mi] !== poseShuffle) {
      d.root.position.x += (formation[i].x - d.root.position.x) * dt * 3;
    } else if (POSES[mi] !== poseShuffle) {
      d.root.position.x += (formation[i].x - d.root.position.x) * dt * 3;
    }
    const breathe = Math.sin(songTime * 2.4 + d.seed) * 0.012;
    d.head.scale.setScalar(1 + breathe);
  });

  spotA.position.x = Math.sin(songTime * 0.5) * 9;
  spotA.target.position.x = Math.sin(songTime * 0.5 + 1.2) * 2.5;
  spotA.target.position.z = Math.cos(songTime * 0.4) * 1.5;
  spotB.position.x = Math.sin(songTime * 0.42 + Math.PI) * 9;
  spotB.target.position.x = Math.sin(songTime * 0.47 + 3) * 2.5;
  spotC.intensity = 260 + Math.sin(songTime * 2.2) * 120;
  spotC.target.position.x = Math.sin(songTime * 0.8) * 3;
  spotA.lookAt(spotA.target.position);
  spotB.lookAt(spotB.target.position);
  spotC.lookAt(spotC.target.position);
  spotA.target.updateMatrixWorld();
  spotB.target.updateMatrixWorld();
  spotC.target.updateMatrixWorld();

  mists.forEach(m => {
    m.userData.drift += dt * 0.1;
    m.material.opacity = 0.12 + Math.sin(m.userData.drift) * 0.05;
  });

  lightning -= dt;
  nextBolt -= dt;
  if (nextBolt <= 0) { lightning = 0.5; nextBolt = 9 + Math.random() * 12; }
  if (lightning > 0) {
    strobe.intensity = Math.max(0, Math.sin(lightning * 24)) * 60;
    moonLight.intensity = 1.1 + Math.max(0, Math.sin(lightning * 24)) * 1.4;
  } else {
    strobe.intensity = 0;
    moonLight.intensity = 1.1;
  }

  shotTimer += dt;
  if (shotTimer >= SHOT_LEN) {
    shotTimer = 0;
    shotIdx = (shotIdx + 1) % SHOTS.length;
    camLabel.textContent = `SHOT ${shotIdx + 1} — ${SHOTS[shotIdx].name}`;
  }
  const shot = SHOTS[shotIdx];
  shot.fn(songTime, { pos: camPos, look: camLook });
  camera.position.lerp(camPos, 1 - Math.pow(0.002, dt));
  camera.lookAt(camLook);

  renderer.render(scene, camera);
}
animate();
</script>
